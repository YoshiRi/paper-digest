name: update-digest

# 新着論文の収集と HTML 再生成だけを自動化する。
# 日本語要約は API キーが要るのでローカルで `paper-digest summarize` を回す運用。
on:
  schedule:
    - cron: "0 0 * * 1"   # 毎週月曜 00:00 UTC (= 09:00 JST)
  workflow_dispatch:
    inputs:
      query:
        description: "追加サーベイ query。カンマ区切り可。空なら既存設定/既定テーマを使う"
        required: false
        type: string
      since:
        description: "対象年の下限。空なら既存設定/既定値を使う"
        required: false
        type: string
      sources:
        description: "検索ソース"
        required: false
        default: "arxiv,cvf"
        type: choice
        options:
          - arxiv,cvf
          - arxiv
          - cvf
          - arxiv,cvf,semanticscholar
      venues:
        description: "CVF / Semantic Scholar の対象会議"
        required: false
        default: "CVPR,ICCV,ECCV"
        type: string
      limit:
        description: "1ソースあたりの取得上限"
        required: false
        default: "150"
        type: string
      min_score:
        description: "キーワード一次フィルタ閾値。空なら既存設定/既定値を使う"
        required: false
        type: string
      cvf_detail_limit:
        description: "CVF で abstract を取りに行く最大件数 / 会議・年"
        required: false
        default: "30"
        type: string

permissions:
  contents: write

concurrency:
  group: update-digest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 差分検出用に現状を退避
        run: jq -S '.papers' papers.json > /tmp/before.json

      - name: 新着論文を収集して出力を再生成
        env:
          SURVEY_QUERY: ${{ inputs.query || '' }}
          SURVEY_SINCE: ${{ inputs.since || '' }}
          SURVEY_SOURCES: ${{ inputs.sources || '' }}
          SURVEY_VENUES: ${{ inputs.venues || '' }}
          SURVEY_LIMIT: ${{ inputs.limit || '150' }}
          SURVEY_MIN_SCORE: ${{ inputs.min_score || '' }}
          SURVEY_CVF_DETAIL_LIMIT: ${{ inputs.cvf_detail_limit || '30' }}
        run: |
          jq '.config // {}' papers.json > /tmp/before-config.json

          cmd=(uv run paper-digest update --no-llm \
            --data papers.json \
            --output papers.md \
            --output docs/index.html \
            --limit "${SURVEY_LIMIT}" \
            --cvf-detail-limit "${SURVEY_CVF_DETAIL_LIMIT}")

          if [ -n "${SURVEY_QUERY}" ]; then
            cmd+=(--query "${SURVEY_QUERY}")
          fi
          if [ -n "${SURVEY_SINCE}" ]; then
            cmd+=(--since "${SURVEY_SINCE}")
          fi
          if [ -n "${SURVEY_SOURCES}" ]; then
            cmd+=(--sources "${SURVEY_SOURCES}")
          fi
          if [ -n "${SURVEY_VENUES}" ]; then
            cmd+=(--venues "${SURVEY_VENUES}")
          fi
          if [ -n "${SURVEY_MIN_SCORE}" ]; then
            cmd+=(--min-score "${SURVEY_MIN_SCORE}")
          fi

          "${cmd[@]}"
          jq --slurpfile config /tmp/before-config.json '.config = $config[0]' papers.json > /tmp/papers.json
          mv /tmp/papers.json papers.json
          uv run paper-digest render --data papers.json --output papers.md --output docs/index.html

      - name: 新着があればコミットする
        run: |
          jq -S '.papers' papers.json > /tmp/after.json
          if diff -q /tmp/before.json /tmp/after.json > /dev/null; then
            echo "新着なし (生成時刻だけの差分は捨てる)"
            git checkout -- .
            exit 0
          fi
          added=$(( $(jq 'length' /tmp/after.json) - $(jq 'length' /tmp/before.json) ))
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers.json papers.md docs/index.html
          git commit -m "chore: 新着論文を追加 (+${added}件, $(date -u +%Y-%m-%d))"
          git push

      - name: 未要約の件数を表示
        run: |
          pending=$(jq '[.papers[] | select(.summary_ja == "" and .llm_relevant != false)] | length' papers.json)
          echo "::notice::日本語要約が未生成の論文: ${pending} 件 (ローカルで \`uv run paper-digest summarize\` を実行してください)"
