[project]
name = "paper-digest"
version = "0.1.0"
description = "地図生成・自動運転の環境認識まわりの最新論文を集めて日本語で要約するCLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# ANTHROPIC_API_KEY / ant auth profile がある環境向け。
# 無い場合は claude CLI backend が使われるので不要。
api = ["anthropic>=0.69"]

[project.scripts]
paper-digest = "paper_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_digest"]
