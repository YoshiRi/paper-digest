集約を組み合わせ、局所・大域の文脈を効率的に同時学習する。encoder-decoder構造でUniMambaブロックを積み重ね、マルチスケール学習を行う。", "novelty_ja": "3D convolutionとState Space Model(Mamba)を統一し、チャネルグループ化とZ-orderシリアライズにより局所・大域の空間依存性を単一ブロックで扱う点がTransformer系やシングルスケールSSM手法との違い。", "why_read_ja": "点群のシリアライズ手法とSSMベースの効率的な大域文脈モデリングは、LiDAR 3D検出の受容野・計算効率トレードオフを改善する動向として地図生成・認識研究にも波及しうる。", "paper_url": "https://arxiv.org/abs/2503.12009", "code_url": "", "published": "", "relevance": 16.0}, {"key": "arxiv:2507.00603", "title": "World4Drive: End-to-End Autonomous Driving via Intention-aware Physical Latent World Model", "venue": "ICCV 2025", "year": 2025, "topic": "World Model", "topics": ["World Model", "AD Perception", "3D Detection"], "abstract": "End-to-end autonomous driving directly generates planning trajectories from raw sensor data, yet it typically relies on costly perception supervision to extract scene information. A critical research challenge arises: constructing an informative driving world model to enable perception annotation-free, end-to-end planning via self-supervised learning. In this paper, we present World4Drive, an end-to-end autonomous driving framework that employs vision foundation models to build latent world models for generating and evaluating multi-modal planning trajectories. Specifically, World4Drive first extracts scene features, including driving intention and world latent representations enriched with spatial-semantic priors provided by vision foundation models. It then generates multi-modal planning trajectories based on current scene features and driving intentions and predicts multiple intention-driven future states within the latent space. Finally, it introduces a world model selector module to evaluate and select the best trajectory. We achieve perception annotation-free, end-to-end planning through self-supervised alignment between actual future observations and predicted observations reconstructed from the latent space. World4Drive achieves state-of-the-art performance without manual perception annotations on both the open-loop nuScenes and closed-loop NavSim benchmarks, demonstrating an 18.0% relative reduction in L2 error, 46.7% lower collision rate, and 3.75 faster training convergence. Codes will be accessed at https://github.com/ucaszyp/World4Drive.", "summary_ja": "本研究は、コストの高い知覚アノテーションに依存しないend-to-end自動運転を目指し、視覚基盤モデルから得たシーン特徴と運転意図を用いてlatent world modelを構築する。現在のシーン特徴と意図に基づき複数の候補軌道と将来のlatent状態を予測し、実際の将来観測との自己教師あり整合によって知覚ラベルなしで学習する。生成した複数軌道はworld model selectorモジュールで評価・選択される。", "novelty_ja": "従来のend-to-end手法が手作業の知覚アノテーションに強く依存するのに対し、視覚基盤モデルの空間・意味的事前情報を用いたlatent world modelと自己教師あり将来予測により、アノテーションフリーで軌道生成・評価を行う点が異なる。", "why_read_ja": "知覚アノテーションへの依存を減らしつつ計画性能を高めるworld model駆動のend-to-end設計は、occupancy/BEV系の知覚から計画までを繋ぐ潮流の代表例であり、World Modelとplanningの統合動向を追う上で参考になる。", "paper_url": "https://arxiv.org/abs/2507.00603", "code_url": "https://github.com/ucaszyp/World4Drive", "published": "", "relevance": 16.0}, {"key": "openaccess.thecvf.com/content/cvpr2025/html/kalble_evocc_accurate_semantic_occupancy_for_automated_driving_using_evidence_theory_cvpr_2025_paper.html", "title": "EvOcc: Accurate Semantic Occupancy for Automated Driving Using Evidence Theory", "venue": "CVPR 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "AD Perception"], "abstract": "We present EvOcc, a novel evidential semantic occupancy mapping framework. It consists of two parts: (1) an evidential approach for calculating the ground-truth 3D semantic occupancy maps from noisy LiDAR measurements, and (2) a method for training image-based occupancy estimation models through a new loss formulation. In contrast to state-of-the-art semantic occupancy maps, our approach explicitly models the uncertainty introduced by unobserved spaces or contradicting measurements and we show that using it results in significantly stronger models. Evaluated as ray-based mIoU, our evidential semantic occupancy mapping approach improves over the baselines by at least 15.8\\% for the ground truth and 5.5\\% for the trained model. Overall, we make a significant contribution towards more detailed and uncertainty-aware 3D environment understanding and safe operation in autonomous driving.", "summary_ja": "LiDAR点群のノイズや未観測領域による不確実性を明示的にモデル化するevidential theoryベースの手法で、正解となる3D semantic occupancyマップの生成と、画像ベースoccupancy推定モデルの学習用損失関数を提案する。", "novelty_ja": "従来のsemantic occupancyマップが不確実性を扱わないのに対し、evidence theoryにより矛盾する観測や未観測空間の不確実性を明示的に表現する点が異なる。", "why_read_ja": "occupancy推定の精度向上に加え、不確実性を考慮した安全な環境認識という観点で今後のoccupancy研究の方向性を示す論文である。", "paper_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Kalble_EvOcc_Accurate_Semantic_Occupancy_for_Automated_Driving_Using_Evidence_Theory_CVPR_2025_paper.html", "code_url": "", "published": "", "relevance": 15.5}, {"key": "openaccess.thecvf.com/content/cvpr2025/html/xue_corrbev_multi-view_3d_object_detection_by_correlation_learning_with_multi-modal_cvpr_2025_paper.html", "title": "CorrBEV: Multi-View 3D Object Detection by Correlation Learning with Multi-modal Prototypes", "venue": "CVPR 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "HD Map", "AD Perception"], "abstract": "Camera-only multi-view 3D object detection in autonomous driving has witnessed encouraging developments in recent years, largely attributed to the revolution of fundamental architectures in modeling bird's eye view (BEV). Despite the growing overall average performance, we contend that the exploration of more specific and challenging corner cases hasn't received adequate attention. In this work, we delve into a specific yet critical issue for safe autonomous driving: occlusion. To alleviate this challenge, we draw inspiration from the human amodal perception system, which is proven to have the capacity for mentally reconstructing the complete semantic concept of occluded objects with prior knowledge. More specifically, we introduce auxiliary visual and language prototypes, akin to human prior knowledge, to enhance the diminished object features caused by occlusion. Inspired by Siamese object tracking, we fuse the information from these prototypes with the baseline model through an efficient depth-wise correlation, thereby enhancing the quality of object-related features and guiding the learning of 3D object queries, especially for partially occluded ones. Furthermore, we propose the random pixel drop to mimic occlusion and the multi-modal contrastive loss to align visual features of different occlusion levels to a unified space during training. Our inspiration originates from addressing occlusion, however, we are surprised to find that the proposed framework also enhances robustness in various challenging scenarios that diminish object representation, such as inclement weather conditions. By applying our model to different baselines, i.e., BEVFormer and SparseBEV, we demonstrate consistent improvements.", "summary_ja": "マルチビューカメラのみによる3D物体検出において、遮蔽(occlusion)により物体特徴が劣化する問題を扱う。人間のamodal知覚に着想を得て、視覚・言語の補助プロトタイプを導入し、Siamese物体追跡的な深さ方向correlationでベースラインの特徴と融合することで、遮蔽物体のクエリ学習を強化する。学習時にはランダム画素ドロップで遮蔽を模擬し、異なる遮蔽度合いの特徴を揃えるマルチモーダル対照損失を用いる。", "novelty_ja": "遮蔽対策として外部の視覚・言語プロトタイプ知識をSiamese追跡由来のcorrelation学習で融合する点が新規で、従来のBEV検出改善が主に構造改良に留まっていたのに対し人間の補完的知覚メカニズムを模した設計になっている。", "why_read_ja": "遮蔽という3D検出の中核課題に対する解法であり、BEVFormerやSparseBEVなど既存手法へ適用可能な汎用モジュールとして悪天候等の頑健性向上にも波及する点で、自動運転認識の性能改善動向を追う上で参考になる。", "paper_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Xue_CorrBEV_Multi-View_3D_Object_Detection_by_Correlation_Learning_with_Multi-modal_CVPR_2025_paper.html", "code_url": "", "published": "", "relevance": 15.5}, {"key": "arxiv:2503.11122", "title": "DriveGEN: Generalized and Robust 3D Detection in Driving via Controllable Text-to-Image Diffusion Generation", "venue": "CVPR 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "Open-world", "World Model", "AD Perception"], "abstract": "In autonomous driving, vision-centric 3D detection aims to identify 3D objects from images. However, high data collection costs and diverse real-world scenarios limit the scale of training data. Once distribution shifts occur between training and test data, existing methods often suffer from performance degradation, known as Out-of-Distribution (OOD) problems. To address this, controllable Text-to-Image (T2I) diffusion offers a potential solution for training data enhancement, which is required to generate diverse OOD scenarios with precise 3D object geometry. Nevertheless, existing controllable T2I approaches are restricted by the limited scale of training data or struggle to preserve all annotated 3D objects. In this paper, we present DriveGEN, a method designed to improve the robustness of 3D detectors in Driving via Training-Free Controllable Text-to-Image Diffusion Generation. Without extra diffusion model training, DriveGEN consistently preserves objects with precise 3D geometry across diverse OOD generations, consisting of 2 stages: 1) Self-Prototype Extraction: We empirically find that self-attention features are semantic-aware but require accurate region selection for 3D objects. Thus, we extract precise object features via layouts to capture 3D object geometry, termed self-prototypes. 2) Prototype-Guided Diffusion: To preserve objects across various OOD scenarios, we perform semantic-aware feature alignment and shallow feature alignment during denoising. Extensive experiments demonstrate the effectiveness of DriveGEN in improving 3D detection. The code is available at github.com/Hongbin98/DriveGEN.", "summary_ja": "自動運転の視覚ベース3D検出は学習データの収集コストが高く、分布外(OOD)シーンで性能が劣化しやすい。DriveGENは追加学習なしのテキスト画像拡散モデルを用い、レイアウトから抽出した自己プロトタイプで3D物体の幾何情報を保持しつつ、多様なOODシーン画像を生成して学習データを拡張する手法を提案している。", "novelty_ja": "既存の制御可能なT2I手法は学習データ規模に制約されるか全ての注釈付き3D物体を保持できないのに対し、DriveGENは拡散モデルを追加学習せず、自己注意特徴からのプロトタイプ抽出とプロトタイプ誘導型のデノイジングにより3D物体の幾何を各生成で維持する。", "why_read_ja": "分布外データへの頑健性はAD知覚全般の実運用課題であり、拡散生成によるデータ拡張は環境認識モデルの評価・学習パイプライン設計を検討する上で参考になる。", "paper_url": "https://arxiv.org/abs/2503.11122", "code_url": "", "published": "", "relevance": 14.0}, {"key": "arxiv:2411.07725", "title": "ALOcc: Adaptive Lifting-Based 3D Semantic Occupancy and Cost Volume-Based Flow Predictions", "venue": "ICCV 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "HD Map"], "abstract": "3D semantic occupancy and flow prediction are fundamental to spatiotemporal scene understanding. This paper proposes a vision-based framework with three targeted improvements. First, we introduce an occlusion-aware adaptive lifting mechanism incorporating depth denoising. This enhances the robustness of 2D-to-3D feature transformation while mitigating reliance on depth priors. Second, we enforce 3D-2D semantic consistency via jointly optimized prototypes, using confidence- and category-aware sampling to address the long-tail classes problem. Third, to streamline joint prediction, we devise a BEV-centric cost volume to explicitly correlate semantic and flow features, supervised by a hybrid classification-regression scheme that handles diverse motion scales. Our purely convolutional architecture establishes new SOTA performance on multiple benchmarks for both semantic occupancy and joint occupancy semantic-flow prediction. We also present a family of models offering a spectrum of efficiency-performance trade-offs. Our real-time version exceeds all existing real-time methods in speed and accuracy, ensuring its practical viability.", "summary_ja": "ALOccは画像入力から3Dセマンティックオキュパンシーと物体のフロー(動き)を同時に予測する手法。2D特徴を3Dに持ち上げる際の遮蔽対応・深度ノイズ除去、3D-2D間の意味的整合性を取るプロトタイプ学習、BEV上でのコストボリュームによるセマンティクスとフローの明示的な相関付けという3つの改善を導入している。", "novelty_ja": "深度事前分布への依存を抑えた遮蔽考慮型のadaptive lifting、long-tailクラス対策の信頼度・カテゴリ考慮サンプリング、分類と回帰を組み合わせたコストボリュームによる多様な運動スケールへの対応が特徴で、純畳み込みアーキテクチャで実時間性と精度を両立させている。", "why_read_ja": "occupancyとflowの同時予測は動的シーン理解の中核課題であり、実時間動作可能なSOTA手法として今後のベースライン比較に有用。", "paper_url": "https://arxiv.org/abs/2411.07725", "code_url": "", "published": "", "relevance": 14.0}, {"key": "openaccess.thecvf.com/content/cvpr2025/html/malic_gblobs_explicit_local_structure_via_gaussian_blobs_for_improved_cross-domain_cvpr_2025_paper.html", "title": "GBlobs: Explicit Local Structure via Gaussian Blobs for Improved Cross-Domain LiDAR-based 3D Object Detection", "venue": "CVPR 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception"], "abstract": "LiDAR-based 3D detectors need large datasets for training, yet they struggle to generalize to novel domains. Domain Generalization (DG) aims to mitigate this by training detectors that are invariant to such domain shifts. Current DG approaches exclusively rely on global geometric features (point cloud Cartesian coordinates) as input features. Over-reliance on these global geometric features can, however, cause 3D detectors to prioritize object location and absolute position, resulting in poor cross-domain performance. To mitigate this, we propose to exploit explicit local point cloud structure for DG, in particular by encoding point cloud neighborhoods with Gaussian blobs, GBlobs. Our proposed formulation is highly efficient and requires no additional parameters. Without any bells and whistles, simply by integrating GBlobs in existing detectors, we beat the current state-of-the-art in challenging single-source DG benchmarks by over 21 mAP (Waymo->KITTI), 13 mAP (KITTI->Waymo), and 12 mAP (nuScenes->KITTI), without sacrificing in-domain performance. Additionally, GBlobs demonstrate exceptional performance in multi-source DG, surpassing the current state-of-the-art by 17, 12, and 5 mAP on Waymo, KITTI, and ONCE, respectively.", "summary_ja": "LiDARベースの3D物体検出器はドメインシフトに弱く、既存のドメイン汎化手法は点群のグローバルな座標情報のみを入力特徴として使うため、物体の絶対位置に過度に依存し汎化性能が低下する問題がある。本研究は各点の近傍局所構造をガウス分布(GBlobs)として明示的にエンコードすることでこれを解決する。追加パラメータなしで既存検出器に組み込むだけで、Waymo→KITTIなど複数のシングルソース・マルチソースのドメイン汎化ベンチマークで大幅な性能向上を達成した。", "novelty_ja": "従来のグローバルな点群座標特徴に頼る手法と異なり、点近傍の局所幾何構造をガウスブロブとして明示的に表現することでドメイン不変性を高めている点が新しい。", "why_read_ja": "実運用では取得LiDARやシーンが変わるたびに検出精度が落ちる問題が常につきまとうため、パラメータ追加なしで既存検出器のクロスドメイン性能を底上げできる本手法は実装コストが低く注目に値する。", "paper_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Malic_GBlobs_Explicit_Local_Structure_via_Gaussian_Blobs_for_Improved_Cross-Domain_CVPR_2025_paper.html", "code_url": "", "published": "", "relevance": 14.0}, {"key": "arxiv:2410.23780", "title": "Driving by the Rules: A Benchmark for Integrating Traffic Sign Regulations into Vectorized HD Map", "venue": "CVPR 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "Topology", "AD Perception"], "abstract": "Ensuring adherence to traffic sign regulations is essential for both human and autonomous vehicle navigation. While current online mapping solutions often prioritize the construction of the geometric and connectivity layers of HD maps, overlooking the construction of the traffic regulation layer within HD maps. Addressing this gap, we introduce MapDR, a novel dataset designed for the extraction of Driving Rules from traffic signs and their association with vectorized, locally perceived HD Maps. MapDR features over 10,000 annotated video clips that capture the intricate correlation between traffic sign regulations and lanes. Built upon this benchmark and the newly defined task of integrating traffic regulations into online HD maps, we provide modular and end-to-end solutions: VLE-MEE and RuleVLM, offering a strong baseline for advancing autonomous driving technology. It fills a critical gap in the integration of traffic sign rules, contributing to the development of reliable autonomous driving systems.", "summary_ja": "オンラインHDマップ構築が幾何・接続性層に偏り、交通標識由来の走行規則層を欠いている課題に対し、標識から抽出した規則をローカルなベクトルHDマップの車線と対応付けるデータセットMapDR(10,000本以上の動画クリップ)を構築した論文。あわせて規則統合タスクを新たに定義し、モジュール型のVLE-MEEとエンドツーエンドのRuleVLMという2種のベースライン手法を提示している。", "novelty_ja": "従来の走行規則抽出研究が標識単体の認識に留まるのに対し、標識規則を車線単位のベクトルHDマップ要素に紐付けるタスク・データセットとして定式化した点が新しい。", "why_read_ja": "幾何・トポロジ中心だったオンラインHDマップ研究に交通規則層という新たな次元を加える提案であり、地図生成の実用性・法規遵守を議論する上で参照価値が高い。", "paper_url": "https://arxiv.org/abs/2410.23780", "code_url": "", "published": "", "relevance": 14.0}, {"key": "arxiv:2503.17752", "title": "HiLoTs: High-Low Temporal Sensitive Representation Learning for Semi-Supervised LiDAR Segmentation in Autonomous Driving", "venue": "CVPR 2025", "year": 2025, "topic": "Scene Understanding", "topics": ["Scene Understanding", "3D Detection", "AD Perception"], "abstract": "LiDAR point cloud semantic segmentation plays a crucial role in autonomous driving. In recent years, semi-supervised methods have gained popularity due to their significant reduction in annotation labor and time costs. Current semi-supervised methods typically focus on point cloud spatial distribution or consider short-term temporal representations, e.g., only two adjacent frames, often overlooking the rich long-term temporal properties inherent in autonomous driving scenarios. In driving experience, we observe that nearby objects, such as roads and vehicles, remain stable while driving, whereas distant objects exhibit greater variability in category and shape. This natural phenomenon is also captured by LiDAR, which reflects lower temporal sensitivity for nearby objects and higher sensitivity for distant ones. To leverage these characteristics, we propose HiLoTs, which learns high-temporal sensitivity and low-temporal sensitivity representations from continuous LiDAR frames. These representations are further enhanced and fused using a cross-attention mechanism. Additionally, we employ a teacher-student framework to align the representations learned by the labeled and unlabeled branches, effectively utilizing the large amounts of unlabeled data. Experimental results on the SemanticKITTI and nuScenes datasets demonstrate that our proposed HiLoTs outperforms state-of-the-art semi-supervised methods, and achieves performance close to LiDAR+Camera multimodal approaches.", "summary_ja": "自動運転向けLiDAR点群セマンティックセグメンテーションにおいて、アノテーションコストを抑えるための半教師あり学習手法を提案。近い物体は時間的に安定し遠い物体は変化しやすいという観察から、連続フレームから高時間感度・低時間感度の2種の表現を学習し、cross-attentionで融合する。さらにteacher-studentフレームワークでラベルあり/なしブランチの表現を揃え、大量の未ラベルデータを活用する。", "novelty_ja": "隣接2フレームなど短期的な時間情報のみを使う従来手法と異なり、距離に応じた時間感度の違いに着目した長期的な時間表現を明示的に分離・融合する点が新しい。", "why_read_ja": "LiDARベースのシーン理解において時間的文脈をどう設計に組み込むかは、Occupancy予測やマップ更新など他の時系列タスクにも応用可能な視点を提供する。", "paper_url": "https://arxiv.org/abs/2503.17752", "code_url": "", "published": "", "relevance": 13.0}, {"key": "arxiv:2507.04123", "title": "Towards Accurate and Efficient 3D Object Detection for Autonomous Driving: A Mixture of Experts Computing System on Edge", "venue": "ICCV 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception"], "abstract": "This paper presents Edge-based Mixture of Experts (MoE) Collaborative Computing (EMC2), an optimal computing system designed for autonomous vehicles (AVs) that simultaneously achieves low-latency and high-accuracy 3D object detection. Unlike existing works, the EMC2 introduces a novel scenario-aware MoE architecture optimized for fusing complementary sparse 3D point clouds and dense 2D images to achieve robust multimodal representations for detection. Furthermore, EMC2 integrates an adaptive multimodal data bridge with multi-scale region proposing and scenario-aware routing, dynamically dispatching features to complementary experts based on object visibility and distance. In addition, EMC2 integrates joint hardware-software optimizations, including hardware resource utilization optimization and computational graph simplification, to ensure efficient and real-time inference on resource-constrained edge devices. Experiments on open-source benchmarks clearly show the EMC2 advancements as an end-to-end system. On the KITTI dataset, it achieves an average accuracy improvement of 3.58% and a 159.06% inference speedup compared to 15 baseline methods on Jetson platforms, with similar performance gains on the nuScenes dataset, highlighting its capability to advance reliable, real-time 3D object detection tasks for AVs.", "summary_ja": "自動運転車のエッジデバイス上でLiDAR点群とカメラ画像を融合し、低遅延かつ高精度な3D物体検出を実現するMoEベースの計算システムEMC2を提案する研究。物体の可視性や距離に応じて特徴量を適切なエキスパートに動的にルーティングするシナリオ認識型アーキテクチャと、Jetson等の資源制約デバイス向けのハードウェア・ソフトウェア協調最適化を組み合わせている。", "novelty_ja": "従来のマルチモーダル融合手法と異なり、シーンごとの物体可視性・距離に応じてスパースな点群とデンスな画像特徴を切り替えるscenario-aware MoEルーティングを導入し、計算グラフ簡略化などのハードウェア最適化までエンドツーエンドで統合している点が新しい。", "why_read_ja": "エッジ実装での実時間性と精度のトレードオフをMoEアーキテクチャで解く事例として、車載向け3D検出システムの設計動向を追う上で参考になる。", "paper_url": "https://arxiv.org/abs/2507.04123", "code_url": "", "published": "", "relevance": 13.0}, {"key": "arxiv:2503.08422", "title": "JiSAM: Alleviate Labeling Burden and Corner Case Problems in Autonomous Driving via Minimal Real-World Data", "venue": "CVPR 2025", "year": 2025, "topic": "3D Detection", "topics": ["Open-world", "AD Perception", "3D Detection"], "abstract": "Deep-learning-based autonomous driving (AD) perception introduces a promising picture for safe and environment-friendly transportation. However, the over-reliance on real labeled data in LiDAR perception limits the scale of on-road attempts. 3D real world data is notoriously time-and-energy-consuming to annotate and lacks corner cases like rare traffic participants. On the contrary, in simulators like CARLA, generating labeled LiDAR point clouds with corner cases is a piece of cake. However, introducing synthetic point clouds to improve real perception is non-trivial. This stems from two challenges: 1) sample efficiency of simulation datasets 2) simulation-to-real gaps. To overcome both challenges, we propose a plug-and-play method called JiSAM, shorthand for Jittering augmentation, domain-aware backbone and memory-based Sectorized AlignMent. In extensive experiments conducted on the famous AD dataset NuScenes, we demonstrate that, with SOTA 3D object detector, JiSAM is able to utilize the simulation data and only labels on 2.5% available real data to achieve comparable performance to models trained on all real data. Additionally, JiSAM achieves more than 15 mAPs on the objects not labeled in the real training set. We will release models and codes.", "summary_ja": "LiDARベースの自動運転認識は実データのラベル付けコストが高く、レアなコーナーケースが不足しがちである。本研究はCARLA等のシミュレータで生成した合成点群を活用し、jitter augmentation、domain-aware backbone、memory-based Sectorized AlignMentの3手法(JiSAM)を組み合わせることで、この課題に取り組む。NuScenesでの実験では、実データの2.5%のラベルのみで全実データ学習に匹敵する性能を達成している。", "novelty_ja": "単純なsim-to-real転移ではなく、augmentation・ドメイン適応backbone・sector単位のアライメントを組み合わせたplug-and-play手法により、サンプル効率とsim-real gapの両課題を同時に解決している点が従来と異なる。", "why_read_ja": "実データ依存を大幅に減らしつつコーナーケース性能を向上させるアプローチであり、アノテーションコストが課題となる3D検出研究の効率化動向を把握する上で参考になる。", "paper_url": "https://arxiv.org/abs/2503.08422", "code_url": "", "published": "", "relevance": 12.0}, {"key": "arxiv:2507.23006", "title": "Robust and Efficient 3D Gaussian Splatting for Urban Scene Reconstruction", "venue": "ICCV 2025", "year": 2025, "topic": "Gaussian Splatting", "topics": ["Gaussian Splatting", "Reconstruction"], "abstract": "We present a framework that enables fast reconstruction and real-time rendering of urban-scale scenes while maintaining robustness against appearance variations across multi-view captures. Our approach begins with scene partitioning for parallel training, employing a visibility-based image selection strategy to optimize training efficiency. A controllable level-of-detail (LOD) strategy explicitly regulates Gaussian density under a user-defined budget, enabling efficient training and rendering while maintaining high visual fidelity. The appearance transformation module mitigates the negative effects of appearance inconsistencies across images while enabling flexible adjustments. Additionally, we utilize enhancement modules, such as depth regularization, scale regularization, and antialiasing, to improve reconstruction fidelity. Experimental results demonstrate that our method effectively reconstructs urban-scale scenes and outperforms previous approaches in both efficiency and quality. The source code is available at: https://yzslab.github.io/REUrbanGS.", "summary_ja": "都市スケールのシーンを対象に、高速な再構成とリアルタイムレンダリングを実現する3D Gaussian Splattingフレームワークを提案している。シーン分割による並列学習、可視性ベースの画像選択、密度を予算制御するLOD戦略、マルチビュー間の見た目のばらつきを補正する外観変換モジュールを組み合わせている。さらに深度・スケール正則化やアンチエイリアシングで再構成品質を高めている。", "novelty_ja": "従来手法に対し、Gaussian密度をユーザー指定予算で明示的に制御できるLOD機構と、多視点間の外観不整合を吸収する変換モジュールを統合した点が特徴。", "why_read_ja": "都市規模の大規模シーンを効率的かつ頑健に再構成する手法であり、自動運転向けの3Dシーン表現やマップ生成技術の動向として参照価値が高い。", "paper_url": "https://arxiv.org/abs/2507.23006", "code_url": "", "published": "", "relevance": 12.0}, {"key": "arxiv:2506.24113", "title": "Epona: Autoregressive Diffusion World Model for Autonomous Driving", "venue": "ICCV 2025", "year": 2025, "topic": "World Model", "topics": ["World Model", "AD Perception"], "abstract": "Diffusion models have demonstrated exceptional visual quality in video generation, making them promising for autonomous driving world modeling. However, existing video diffusion-based world models struggle with flexible-length, long-horizon predictions and integrating trajectory planning. This is because conventional video diffusion models rely on global joint distribution modeling of fixed-length frame sequences rather than sequentially constructing localized distributions at each timestep. In this work, we propose Epona, an autoregressive diffusion world model that enables localized spatiotemporal distribution modeling through two key innovations: 1) Decoupled spatiotemporal factorization that separates temporal dynamics modeling from fine-grained future world generation, and 2) Modular trajectory and video prediction that seamlessly integrate motion planning with visual modeling in an end-to-end framework. Our architecture enables high-resolution, long-duration generation while introducing a novel chain-of-forward training strategy to address error accumulation in autoregressive loops. Experimental results demonstrate state-of-the-art performance with 7.4% FVD improvement and minutes-longer prediction duration compared to prior works. The learned world model further serves as a real-time motion planner, outperforming strong end-to-end planners on NAVSIM benchmarks.", "summary_ja": "動画拡散モデルは固定長フレーム列の同時分布を学習するため可変長・長時間の未来予測や経路計画との統合が難しい。Eponaは時空間を分離し自己回帰的に局所分布を逐次生成することで、高解像度かつ長時間の未来映像生成と軌道予測を単一のエンドツーエンド枠組みで実現する。自己回帰ループ特有の誤差蓄積を抑えるchain-of-forward学習も導入している。", "novelty_ja": "時間方向のダイナミクスと空間的な将来生成を切り離すdecoupled spatiotemporal factorizationと、軌道予測と映像予測をモジュール化して統合した点が既存のグローバル同時分布モデリング型video diffusion world modelとの違い。", "why_read_ja": "映像生成ベースのworld modelを実時間の経路計画器として使う設計であり、occupancyやBEV予測とは異なるアプローチでのAD向けworld model研究の方向性を把握する上で参考になる。", "paper_url": "https://arxiv.org/abs/2506.24113", "code_url": "", "published": "", "relevance": 11.5}, {"key": "openaccess.thecvf.com/content/iccv2025/html/xu_ad-gs_object-aware_b-spline_gaussian_splatting_for_self-supervised_autonomous_driving_iccv_2025_paper.html", "title": "AD-GS: Object-Aware B-Spline Gaussian Splatting for Self-Supervised Autonomous Driving", "venue": "ICCV 2025", "year": 2025, "topic": "Gaussian Splatting", "topics": ["Gaussian Splatting", "AD Perception"], "abstract": "Modeling and rendering dynamic urban driving scenes is crucial for self-driving simulation. Current high-quality methods typically rely on costly manual object tracklet annotations, while self-supervised approaches fail to capture dynamic object motions accurately and decompose scenes properly, resulting in rendering artifacts. We introduce AD-GS, a novel self-supervised framework for high-quality free-viewpoint rendering of driving scenes from a single log. At its core is a novel learnable motion model that integrates locality-aware B-spline curves with global-aware trigonometric functions, enabling flexible yet precise dynamic object modeling. Rather than requiring comprehensive semantic labeling, AD-GS automatically segments scenes into objects and background with the simplified pseudo 2D segmentation, representing objects using dynamic Gaussians and bidirectional temporal visibility masks. Further, our model incorporates visibility reasoning and physically rigid regularization to enhance robustness. Extensive evaluations demonstrate that our annotation-free model significantly outperforms current state-of-the-art annotation-free methods and is competitive with annotation-dependent approaches.", "summary_ja": "自動運転シミュレーション向けに、単一ログから動的都市シーンを高品質にフリービューポイントレンダリングする自己教師あり手法AD-GSを提案。手動の物体トラックレットアノテーションに頼らず、擬似2Dセグメンテーションでシーンを物体と背景に自動分解し、各物体を動的Gaussianと双方向時間可視性マスクで表現する。", "novelty_ja": "局所的なB-splineカーブと大域的な三角関数を組み合わせた学習可能なモーションモデルにより、アノテーションなしで柔軟かつ精密な動的物体モデリングを実現し、可視性推論と物理的剛性正則化でロバスト性を高めている点が従来のアノテーション依存手法と異なる。", "why_read_ja": "アノテーションコストを排した動的シーンのGaussian Splatting再構成は、自動運転シミュレーション・データ生成の効率化に直結する重要な技術動向である。", "paper_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Xu_AD-GS_Object-Aware_B-Spline_Gaussian_Splatting_for_Self-Supervised_Autonomous_Driving_ICCV_2025_paper.html", "code_url": "", "published": "", "relevance": 11.0}, {"key": "openaccess.thecvf.com/content/cvpr2025/html/huang_v2x-r_cooperative_lidar-4d_radar_fusion_with_denoising_diffusion_for_3d_cvpr_2025_paper.html", "title": "V2X-R: Cooperative LiDAR-4D Radar Fusion with Denoising Diffusion for 3D Object Detection", "venue": "CVPR 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "World Model"], "abstract": "Current Vehicle-to-Everything (V2X) systems have significantly enhanced 3D object detection using LiDAR and camera data. However, they face performance degradation in adverse weather. Weather-robust 4D radar, with Doppler velocity and additional geometric information, offers a promising solution to this challenge. To this end, we present V2X-R, the first simulated V2X dataset incorporating LiDAR, camera, and 4D radar modalities. V2X-R contains 12,079 scenarios with 37,727 frames of LiDAR and 4D radar point clouds, 150,908 images, and 170,859 annotated 3D vehicle bounding boxes. Subsequently, we propose a novel cooperative LiDAR-4D radar fusion pipeline for 3D object detection and implement it with multiple fusion strategies. To achieve weather-robust detection, we additionally propose a Multi-modal Denoising Diffusion (MDD) module in our fusion pipeline. MDD utilizes weather-robust 4D radar feature as a condition to guide the diffusion model in denoising noisy LiDAR features.Experiments show that our LiDAR-4D radar fusion pipeline demonstrates superior performance in the V2X-R dataset. Over and above this, our MDD module further improved the foggy/snowy performance of the basic fusion model by up to 5.73%/6.70% and barely disrupting normal performance. The dataset and code will be publicly available.", "summary_ja": "悪天候下でV2X協調型3D物体検出の性能が低下する課題に対し、LiDAR・カメラ・4Dレーダーを含む初のシミュレーションV2Xデータセット「V2X-R」を構築し、4DレーダーとLiDARを融合する検出パイプラインを提案している。さらに4Dレーダー特徴を条件としてLiDAR特徴のノイズを除去するMulti-modal Denoising Diffusion(MDD)モジュールを導入し、悪天候時の頑健性を高めている。", "novelty_ja": "従来のLiDAR・カメラ中心のV2X検出と異なり、Doppler速度情報を持つ耐候性の高い4Dレーダーを協調融合に組み込み、拡散モデルによるマルチモーダルデノイジングで悪天候ノイズに対処する点が新しい。", "why_read_ja": "V2X協調認識と悪天候ロバスト性という自動運転認識の重要課題に対し、新規マルチモーダルデータセットと融合・デノイジング手法を同時に提示しており、センサー融合ベースの3D検出動向を追ううえで参考になる。", "paper_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Huang_V2X-R_Cooperative_LiDAR-4D_Radar_Fusion_with_Denoising_Diffusion_for_3D_CVPR_2025_paper.html", "code_url": "", "published": "", "relevance": 10.0}, {"key": "openaccess.thecvf.com/content/cvpr2025/html/zhao_d3ctta_domain-dependent_decorrelation_for_continual_test-time_adaption_of_3d_lidar_cvpr_2025_paper.html", "title": "D^3CTTA: Domain-Dependent Decorrelation for Continual Test-Time Adaption of 3D LiDAR Segmentation", "venue": "CVPR 2025", "year": 2025, "topic": "Scene Understanding", "topics": ["Scene Understanding", "AD Perception"], "abstract": "Adapting pre-trained LiDAR segmentation models to dynamic domain shifts during testing is of paramount importance for the safety of autonomous driving. Most existing methods neglect the influence of domain changes and point density in continual test-time adaption (CTTA), relying on backpropagation and large batch sizes for stability. We approach this problem with three insights: 1) Point clouds at different distances usually have different densities resulting in distribution disparities; 2) The feature distribution of different domains varies, and domain-aware parameters can alleviate domain gaps; 3) Features are highly correlated and make segmentation of different labels confusing. To this end, this work presents D^3CTTA, an online backpropagation-free framework for 3D continual test-time adaption for LiDAR segmentation. D^3CTTA consists of a distance-aware prototype learning module to integrate LiDAR-based geometry prior and a domain-dependent decorrelation module to reduce feature correlations among different domains and different categories. Extensive experiments on three benchmarks showcase that our method achieves a state-of-the-art performance compared to both backpropagation-based methods and backpropagation-free methods.", "summary_ja": "走行中に観測ドメインが変化し続ける状況で、事前学習済みLiDARセグメンテーションモデルをオンラインかつバックプロパゲーションなしで適応させる手法を提案している。点群の距離依存的な密度差とドメイン間の特徴分布差、特徴間の高い相関がセグメンテーション精度を下げる要因であるとし、それぞれに対応するモジュールを設計している。", "novelty_ja": "距離に応じたプロトタイプ学習でLiDAR特有の幾何的事前分布を取り込み、ドメイン依存のデコリレーションでドメイン間・カテゴリ間の特徴相関を低減する点が、逆伝播や大バッチに依存する既存のcontinual test-time adaptation手法との違いである。", "why_read_ja": "実運用で避けられないドメインシフト下でのLiDARセグメンテーションの頑健性は自動運転の認識信頼性に直結するため、CTTA手法の動向を把握する上で参考になる。", "paper_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Zhao_D3CTTA_Domain-Dependent_Decorrelation_for_Continual_Test-Time_Adaption_of_3D_LiDAR_CVPR_2025_paper.html", "code_url": "", "published": "", "relevance": 10.0}, {"key": "arxiv:2408.00415", "title": "DriveArena: A Closed-loop Generative Simulation Platform for Autonomous Driving", "venue": "ICCV 2025", "year": 2025, "topic": "World Model", "topics": ["World Model", "AD Perception"], "abstract": "This paper introduces DriveArena, the first high-fidelity closed-loop simulation system designed for driving agents navigating real-world scenarios. DriveArena comprises two core components: Traffic Manager, a traffic simulator capable of generating realistic traffic flow on any global street map, and World Dreamer, a high-fidelity conditional generative model with infinite auto-regression. DriveArena supports closed-loop simulation using road networks from cities worldwide, enabling the generation of diverse traffic scenarios with varying styles. This powerful synergy empowers any driving agent capable of processing real-world images to navigate in DriveArena 's simulated environment. Furthermore, DriveArena features a flexible, modular architecture, allowing for multiple implementations of its core components and driving agents. Serving as a highly realistic arena for these players, our work provides a valuable platform for developing and evaluating driving agents across diverse and challenging scenarios. DriveArena takes a significant leap forward in leveraging generative models for driving simulation platforms, opening new avenues for closed-loop evaluation of autonomous driving systems.", "summary_ja": "実世界の道路網上で走行エージェントを評価するためのクローズドループシミュレータDriveArenaを提案。任意の都市の道路地図から現実的な交通流を生成するTraffic Managerと、無限に自己回帰生成できる条件付き生成モデルWorld Dreamerの2要素で構成される。実画像を処理できる任意の運転エージェントがこの中で走行・評価できるモジュール構成を持つ。", "novelty_ja": "従来のルールベース・記録再生型シミュレータと異なり、生成モデルによる無限自己回帰で多様な交通シナリオ画像をクローズドループに生成し、世界中の道路網を条件として使える点が特徴。", "why_read_ja": "生成モデルベースのクローズドループ評価基盤は、World Model系研究や自動運転エージェントのベンチマーク動向を追う上で重要な参照点となる。", "paper_url": "https://arxiv.org/abs/2408.00415", "code_url": "", "published": "", "relevance": 10.0}, {"key": "arxiv:2412.03515", "title": "Distilling Diffusion Models to Efficient 3D LiDAR Scene Completion", "venue": "ICCV 2025", "year": 2025, "topic": "Scene Understanding", "topics": ["Occupancy", "Scene Understanding", "World Model"], "abstract": "Diffusion models have been applied to 3D LiDAR scene completion due to their strong training stability and high completion quality. However, the slow sampling speed limits the practical application of diffusion-based scene completion models since autonomous vehicles require an efficient perception of surrounding environments. This paper proposes a novel distillation method tailored for 3D Li- DAR scene completion models, dubbed ScoreLiDAR, which achieves efficient yet high-quality scene completion. Score- LiDAR enables the distilled model to sample in significantly fewer steps after distillation. To improve completion quality, we also introduce a novel Structural Loss, which encourages the distilled model to capture the geometric structure of the 3D LiDAR scene. The loss contains a scene-wise term constraining the holistic structure and a point-wise term constraining the key landmark points and their relative configuration. Extensive experiments demonstrate that ScoreLiDAR significantly accelerates the completion time from 30.55 to 5.37 seconds per frame (>5x) on SemanticKITTI and achieves superior performance compared to state-of-the-art 3D LiDAR scene completion models. Our model and code are publicly available on https://github.com/happyw1nd/ScoreLiDAR.", "summary_ja": "拡散モデルベースの3D LiDARシーン補完は品質が高い一方サンプリングが遅く、自動運転の実時間認識に不向きという課題がある。本論文はScoreLiDARという蒸留手法を提案し、拡散モデルを少ないステップで動作する軽量モデルに変換する。さらに幾何構造を保持するためのStructural Loss(シーン全体項と点単位項)を導入し補完品質を維持する。", "novelty_ja": "既存の拡散モデルによるLiDARシーン補完がステップ数に依存して低速だったのに対し、蒸留により推論ステップ数を削減しつつ、構造保持のための専用損失で品質劣化を抑える点が新しい。", "why_read_ja": "LiDARシーン補完はOccupancy予測やマップ生成の前段処理として重要であり、推論速度と品質のトレードオフ改善は実車搭載を見据えた認識パイプライン設計の参考になる。", "paper_url": "https://arxiv.org/abs/2412.03515", "code_url": "https://github.com/happyw1nd/ScoreLiDAR", "published": "", "relevance": 9.5}]</script>
<script>
const PAPERS = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATE_KEY = "paper-digest-reader-state-v1";
const SURVEY_KEY = "paper-digest-survey-requests-v1";
const STATE_LABELS = { later:"あとで読む", reading:"読んでる", read:"読んだ", skip:"見送り" };
let paperState = loadJson(STATE_KEY, {});
let surveyRequests = loadJson(SURVEY_KEY, []);
let currentRows = [];

function loadJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function saveJson(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

function paperKey(p) { return p.key || p.paper_url || p.title; }
function getState(key) { return paperState[key] || {}; }
function hasSavedState(s) { return !!(s.favorite || s.status || s.memo || s.questions); }
function savePaperState() { saveJson(STATE_KEY, paperState); updateStateSummary(); }

function setPaperState(key, patch, rerender = true) {
  const next = { ...getState(key), ...patch };
  Object.keys(next).forEach(k => {
    if (next[k] === "" || next[k] === false || next[k] == null) delete next[k];
  });
  if (hasSavedState(next)) paperState[key] = next;
  else delete paperState[key];
  savePaperState();
  if (rerender) render();
}

function downloadJson(name, value) {
  const blob = new Blob([JSON.stringify(value, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

async function copyText(text) {
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const tmp = document.createElement("textarea");
    tmp.value = text; document.body.appendChild(tmp); tmp.select();
    document.execCommand("copy"); tmp.remove();
  }
}

function fillSelect(el, label, values) {
  el.innerHTML = `<option value="">${label} (すべて)</option>` +
    values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
}
const uniq = (key) => [...new Set(PAPERS.map(p => p[key]).filter(Boolean))].sort();
fillSelect($("venue"), "発表先", uniq("venue"));
fillSelect($("topic"), "トピック", uniq("topic"));

function sortKey(p) { return p.published || (p.year ? String(p.year) : ""); }

function filteredRows() {
  const q = $("q").value.trim().toLowerCase();
  const venue = $("venue").value, topic = $("topic").value;
  const state = $("state").value;
  return PAPERS.filter(p => {
    const saved = getState(paperKey(p));
    if (venue && p.venue !== venue) return false;
    if (topic && p.topic !== topic) return false;
    if (state === "favorite" && !saved.favorite) return false;
    if (state && state !== "favorite" && saved.status !== state) return false;
    if (!q) return true;
    return (p.title + " " + p.summary_ja + " " + p.novelty_ja + " " + p.why_read_ja +
            " " + p.abstract + " " + (p.topics || []).join(" ") + " " +
            (saved.memo || "") + " " + (saved.questions || "")
           ).toLowerCase().includes(q);
  });
}

function render() {
  const sort = $("sort").value;
  let rows = filteredRows();
  rows.sort((a, b) => {
    if (sort === "title") return a.title.localeCompare(b.title);
    if (sort === "rel") return (b.relevance || 0) - (a.relevance || 0);
    if (sort === "marked") {
      const sa = getState(paperKey(a)), sb = getState(paperKey(b));
      const wa = (sa.favorite ? 8 : 0) + (sa.status ? 4 : 0) + (sa.memo ? 2 : 0) + (sa.questions ? 1 : 0);
      const wb = (sb.favorite ? 8 : 0) + (sb.status ? 4 : 0) + (sb.memo ? 2 : 0) + (sb.questions ? 1 : 0);
      if (wa !== wb) return wb - wa;
    }
    const c = sortKey(a) < sortKey(b) ? -1 : sortKey(a) > sortKey(b) ? 1 : 0;
    return sort === "old" ? c : -c;
  });
  currentRows = rows;
  $("count").textContent = `${rows.length} / ${PAPERS.length} 件`;
  $("list").innerHTML = rows.length ? rows.map(card).join("") :
    '<div class="empty">該当する論文がありません</div>';
  hydrateTextareas();
  updateStateSummary();
}

function card(p) {
  const key = paperKey(p);
  const saved = getState(key);
  const sec = (label, text) => text ? `<div class="sec"><b>${label}</b>${esc(text)}</div>` : "";
  const stateChip = saved.status ? `<span class="chip state">${esc(STATE_LABELS[saved.status])}</span>` : "";
  const chips = [
    p.venue ? `<span class="chip venue">${esc(p.venue)}</span>` : "",
    p.topic ? `<span class="chip">${esc(p.topic)}</span>` : "",
    stateChip,
    ...(p.topics || []).filter(t => t !== p.topic).map(t => `<span class="chip">${esc(t)}</span>`),
  ].join("");
  const links = [
    p.paper_url ? `<a href="${esc(p.paper_url)}" target="_blank" rel="noopener">Paper</a>` : "",
    p.code_url ? `<a href="${esc(p.code_url)}" target="_blank" rel="noopener">Code</a>` : "",
  ].filter(Boolean).join("");
  const abs = p.abstract
    ? `<details class="abs"><summary>Abstract (原文)</summary>${esc(p.abstract)}</details>` : "";
  const title = p.paper_url
    ? `<a href="${esc(p.paper_url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`
    : esc(p.title);
  const body = p.summary_ja
    ? sec("概要", p.summary_ja) + sec("新規性", p.novelty_ja) + sec("読む理由", p.why_read_ja)
    : `<div class="sec"><b>概要</b>(日本語要約は未生成)</div>`;
  return `<article data-key="${esc(key)}"><h2>${title}</h2><div class="chips">${chips}</div>
    <div class="quick">
      <button data-action="favorite" data-key="${esc(key)}" class="${saved.favorite ? "active" : ""}" title="お気に入り">★</button>
      <button data-status="later" data-key="${esc(key)}" class="${saved.status === "later" ? "active warn" : ""}">あとで読む</button>
      <button data-status="reading" data-key="${esc(key)}" class="${saved.status === "reading" ? "active" : ""}">読んでる</button>
      <button data-status="read" data-key="${esc(key)}" class="${saved.status === "read" ? "active good" : ""}">読んだ</button>
      <button data-status="skip" data-key="${esc(key)}" class="${saved.status === "skip" ? "active danger" : ""}">見送り</button>
    </div>
    ${body}
    <div class="links">${links}</div>${abs}
    <div class="reader-notes">
      <label>Memo<textarea data-field="memo" data-key="${esc(key)}"></textarea></label>
      <label>Questions<textarea data-field="questions" data-key="${esc(key)}"></textarea></label>
    </div>
  </article>`;
}

function hydrateTextareas() {
  document.querySelectorAll("textarea[data-field]").forEach(el => {
    el.value = getState(el.dataset.key)[el.dataset.field] || "";
  });
}

function updateStateSummary() {
  const values = Object.values(paperState);
  const saved = values.filter(hasSavedState).length;
  const fav = values.filter(v => v.favorite).length;
  const later = values.filter(v => v.status === "later").length;
  const read = values.filter(v => v.status === "read").length;
  $("savedCount").textContent = `保存 ${saved} / fav ${fav} / later ${later} / read ${read}`;
}

function paperBrief(p) {
  const s = getState(paperKey(p));
  const notes = [
    s.favorite ? "favorite: true" : "",
    s.status ? `status: ${STATE_LABELS[s.status]}` : "",
    s.memo ? `memo: ${s.memo}` : "",
    s.questions ? `questions: ${s.questions}` : "",
  ].filter(Boolean).join("\n  ");
  return [
    `- title: ${p.title}`,
    `  venue: ${p.venue || ""}`,
    `  topic: ${p.topic || ""}`,
    `  paper: ${p.paper_url || ""}`,
    `  summary: ${p.summary_ja || "(日本語要約なし)"}`,
    `  novelty: ${p.novelty_ja || ""}`,
    `  why_read: ${p.why_read_ja || ""}`,
    notes ? `  local_notes:\n  ${notes}` : "",
    `  abstract: ${p.abstract || ""}`,
  ].filter(Boolean).join("\n");
}

function buildAskPrompt() {
  const question = $("askInput").value.trim() || "この論文群の位置づけを整理して";
  const limit = Number($("askLimit").value || 8);
  const rows = currentRows.slice(0, limit);
  return [
    "あなたは自動運転の環境認識・地図生成分野のリサーチアシスタントです。",
    "以下の論文一覧と自分の読書メモを根拠に、質問へ日本語で答えてください。",
    "abstractに書かれていない事実は推測として明示してください。",
    "",
    `質問: ${question}`,
    "",
    `対象論文: ${rows.length}件（現在の検索・フィルタ結果の先頭）`,
    rows.map(paperBrief).join("\n\n"),
  ].join("\n");
}

function renderSurveys() {
  $("surveyList").innerHTML = surveyRequests.slice(0, 8).map((r, i) => `
    <div class="survey-item">
      <b>${esc(r.query)}</b>
      <span>since ${esc(String(r.since))} / ${esc(r.sources)} / ${esc(r.venues || "CVPR,ICCV,ECCV")} / limit ${esc(String(r.limit))} / ${esc(r.created_at)}</span>
      <div class="panel-actions"><button data-survey-copy="${i}">Copy JSON</button></div>
    </div>
  `).join("");
}

function saveSurvey() {
  const query = $("surveyQuery").value.trim();
  if (!query) return;
  surveyRequests.unshift({
    query,
    since: Number($("surveySince").value || 2025),
    limit: Number($("surveyLimit").value || 150),
    sources: $("surveySources").value,
    venues: $("surveyVenues").value.trim() || "CVPR,ICCV,ECCV",
    created_at: new Date().toISOString(),
    status: "queued",
  });
  saveJson(SURVEY_KEY, surveyRequests);
  $("surveyQuery").value = "";
  renderSurveys();
}

["q", "venue", "topic", "state", "sort"].forEach(id => {
  $(id).addEventListener(id === "q" ? "input" : "change", render);
});
$("list").addEventListener("click", (ev) => {
  const status = ev.target.closest("button[data-status]");
  if (status) {
    const cur = getState(status.dataset.key).status;
    setPaperState(status.dataset.key, { status: cur === status.dataset.status ? "" : status.dataset.status });
    return;
  }
  const action = ev.target.closest("button[data-action='favorite']");
  if (action) {
    setPaperState(action.dataset.key, { favorite: !getState(action.dataset.key).favorite });
  }
});
$("list").addEventListener("input", (ev) => {
  const field = ev.target.closest("textarea[data-field]");
  if (!field) return;
  setPaperState(field.dataset.key, { [field.dataset.field]: field.value }, false);
});
$("exportState").addEventListener("click", () => {
  downloadJson("paper-digest-reader-state.json", {
    version: 1,
    exported_at: new Date().toISOString(),
    state: paperState,
    surveys: surveyRequests,
  });
});
$("importState").addEventListener("change", async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const payload = JSON.parse(await file.text());
  paperState = { ...paperState, ...(payload.state || {}) };
  surveyRequests = [...(payload.surveys || []), ...surveyRequests];
  savePaperState(); saveJson(SURVEY_KEY, surveyRequests);
  renderSurveys(); render();
  ev.target.value = "";
});
$("buildAsk").addEventListener("click", () => { $("askOutput").value = buildAskPrompt(); });
$("copyAsk").addEventListener("click", () => {
  if (!$("askOutput").value) $("askOutput").value = buildAskPrompt();
  copyText($("askOutput").value);
});
$("saveSurvey").addEventListener("click", saveSurvey);
$("exportSurveys").addEventListener("click", () => {
  downloadJson("paper-digest-survey-requests.json", {
    version: 1,
    exported_at: new Date().toISOString(),
    surveys: surveyRequests,
  });
});
$("surveyList").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-survey-copy]");
  if (!btn) return;
  copyText(JSON.stringify(surveyRequests[Number(btn.dataset.surveyCopy)], null, 2));
});
renderSurveys();
render();
</script>
</body>
</html>
