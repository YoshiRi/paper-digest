cities with irregular street layouts and mixed traffic modes, our dataset complements existing datasets by broadening the available geographic diversity. We also introduce four benchmarks, each advancing spatial learning for embodied AI: online HD map construction, long-range depth estimation, novel view synthesis, and end-to-end driving. Project page: https://kitscenes.com/", "summary_ja": "既存の自動運転データセットがセンサ精度・地図完全性・地理的多様性のいずれかで不足している課題に対し、KITScenes Multimodalという欧州都市で収録した高精度センサ・地図データセットを提示している。高解像度グローバルシャッターカメラ、400m超のロングレンジLiDAR、4Dイメージングレーダー、冗長GNSS/INSを同期させ、交通信号などの交通要素を3Dで再投影精度かつトポロジー接続情報付きで地図化した点が特徴。online HD map construction、長距離深度推定、novel view synthesis、end-to-end drivingの4つのベンチマークを新設している。", "novelty_ja": "従来データセットに比べ地図の完全性とトポロジー情報の精度が高く、不規則な street layoutを持つ欧州都市を対象とすることで地理的多様性を拡張している点が新規性。", "why_read_ja": "online HD map constructionとGaussian Splattingベースのnovel view synthesisを同一データセットでベンチマーク化しており、地図生成・環境認識分野の評価基盤として動向を追う上で参照価値が高い。", "paper_url": "https://arxiv.org/abs/2606.02956", "code_url": "", "published": "2026-06-01T23:23:14Z", "relevance": 20.5}, {"key": "arxiv:2606.02924", "title": "ATLAS: A Large-Scale Evaluation Benchmark for Adversarial LiDAR Perception", "venue": "arXiv 2026", "year": 2026, "topic": "AD Perception", "topics": ["AD Perception"], "abstract": "Autonomous driving perception is typically evaluated on clean benchmark data, yet real-world deployment requires robustness to rare, structured, and potentially adversarial sensor anomalies. This gap is especially critical for LiDAR, where external actors can physically manipulate the sensing process to induce black-box perception failures without accessing the model. Existing LiDAR benchmarks provide little visibility into this failure mode. Prior adversarial LiDAR studies have largely centered on attack hardware, geometric and algorithmic defenses, and early-generation detectors, leaving the robustness of modern perception systems unexplored. To address this evaluation gap, we introduce ATLAS (Adversarial Temporal LiDAR Attack Suite), the first large-scale, physically grounded evaluation benchmark for LiDAR perception models under black-box sensor attacks, simulating the two primary attack modes -- point injection and point removal -- across real driving sequences. Evaluating a broad cross-section of current state-of-the-art LiDAR perception models, ATLAS reveals a surprising robustness asymmetry: models with stronger performance on standard benchmarks tend to better withstand removal attacks, yet are actually more vulnerable to injection attacks than weaker models. We trace this vulnerability to standard object database sampling augmentations, revealing how current training practices can induce architecture-agnostic robustness failures, and study initial directions for mitigating both attack modes. We release the ATLAS generation code to support extensible, reproducible evaluations as attack capabilities evolve, helping make black-box sensor robustness an explicit consideration in future LiDAR perception development.", "summary_ja": "自動運転向けLiDAR知覚モデルが、点の注入や除去といった物理的に模擬可能なブラックボックス攻撃に対してどれだけ脆弱かを大規模かつ体系的に評価するベンチマークATLASを提案する。実際の走行シーケンスを用い、注入・除去という2種類の主要な攻撃モードをシミュレートして、現行の最先端LiDAR検出モデル群を横断的に評価している。", "novelty_ja": "従来の敵対的LiDAR研究が攻撃ハードウェアや初期世代の検出器、幾何的・アルゴリズム的防御に留まっていたのに対し、本研究は現代の知覚モデルを対象に物理的根拠のある大規模評価を初めて行い、標準ベンチマークでの性能が高いモデルほど点除去には強いが点注入には弱いという非対称な脆弱性を発見した点が新しい。", "why_read_ja": "クリーンなベンチマーク評価だけでは見えないLiDAR知覚モデルの実運用時のロバスト性リスクを可視化しており、データベースサンプリング拡張という一般的な学習慣行が引き起こすアーキテクチャ非依存の脆弱性を指摘している点で、3D検出・知覚モデルの評価設計を考える上で参考になる。", "paper_url": "https://arxiv.org/abs/2606.02924", "code_url": "", "published": "2026-06-01T21:56:57Z", "relevance": 8.5}, {"key": "arxiv:2605.20390", "title": "STELLAR: Scaling 3D Perception Large Models for Autonomous Driving", "venue": "arXiv 2026", "year": 2026, "topic": "3D Detection", "topics": ["AD Perception", "3D Detection"], "abstract": "Model scaling has demonstrated remarkable success through large-scale training on diverse datasets. It remains an open question whether the same paradigm would apply to autonomous driving perception systems due to unique challenges, such as fusing heterogeneous sensor data and the need for sophisticated 3D spatial understanding. To bridge this gap, we present a comprehensive study on systematically analyzing the impact of scale on these systems. We develop our STELLAR model based on Sparse Window Transformer, by extending the input modalities to include LiDAR, radar, camera, and map prior. We train the model on a large-scale dataset of 50 million driving examples with up to 500 million parameters. Our large-scale experiments reveal empirical scaling trends that connect model performance to model size, data, and compute. The resulting model establishes a new state-of-the-art on the Waymo Open Dataset challenge, outperforming prior arts by a large margin. Our work demonstrates that large-scale training is a highly promising path for advancing the capabilities of perception models for autonomous driving.", "summary_ja": "自動運転の知覚モデルにモデルスケーリングが有効かを検証した研究。Sparse Window Transformerを基盤にLiDAR・radar・camera・map priorを入力に統合したSTELLARモデルを構築し、5000万件の走行データと最大5億パラメータで学習してモデルサイズ・データ量・計算量と性能の関係を分析している。", "novelty_ja": "異種センサ融合と3D空間理解という自動運転特有の課題下でスケーリング則を実証的に検証した点が新規で、Waymo Open Datasetで従来手法を大きく上回る性能を達成した。", "why_read_ja": "LLM分野で確立されたスケーリング則が自動運転知覚にも適用可能かを示す実証研究であり、大規模データ・モデルによる知覚性能向上の今後の方向性を把握するうえで重要。", "paper_url": "https://arxiv.org/abs/2605.20390", "code_url": "", "published": "2026-05-19T18:40:20Z", "relevance": 9.5}, {"key": "arxiv:2605.16911", "title": "VGGT-Occ: Geometry-Grounded and Density-Aware Gated Fusion for 3D Occupancy Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "3D semantic occupancy prediction requires accurate 2D-to-3D feature lifting, yet current methods restrict camera geometry to initial projections. Subsequent operations like offset learning, attention weighting, and cross-camera aggregation remain geometry-agnostic, ignoring essential physical constraints. We propose VGGT-Occ, a framework that embeds geometric tokens throughout the entire pipeline. We introduce Projection-Aware Deformable Attention (PA-DA) to inject geometry into all attention stages. PA-DA projects 3D offsets back to image planes and leverages the projection Jacobian as an additive bias to suppress unreliable observations. Features are then integrated through a view-quality semantic gate for cross-view consistency. To optimize both efficiency and performance, we employ a sequential coarse-to-fine decoder with gated fusion, where low-resolution features are refined into higher resolutions, allocating computation by information density while substantially reducing decoder cost. Extensive evaluations demonstrate the effectiveness and accuracy of our approach. On SurroundOcc-nuScenes, VGGT-Occ achieves 33.00\\% IoU and 21.08\\% mIoU ($T{=}1$), and 33.64\\% IoU and 21.43\\% mIoU with $T{=}2$ inference, outperforming existing methods, with only ${\\sim}41$M trainable parameters in the occupancy head. Code will be released publicly.", "summary_ja": "カメラ画像からの3D semantic occupancy予測において、2Dから3Dへの特徴射影(lifting)以降の処理(offset学習・attention・cross-camera統合)が幾何情報を無視している問題に着目。VGGT-Occは幾何トークンをパイプライン全体に埋め込み、Projection-Aware Deformable Attention(PA-DA)で3DオフセットをImage平面へ再射影し、射影ヤコビアンをバイアスとして不確かな観測を抑制する。さらにview-quality semantic gateでcross-view統合を行い、coarse-to-fineのデコーダで解像度ごとに計算量を配分する。", "novelty_ja": "従来手法が初期射影のみに幾何拘束を用いるのに対し、attentionやcross-view統合など後段の処理にも射影ヤコビアンによる幾何情報を継続的に注入する点が異なる。", "why_read_ja": "occupancy予測における2D-3D lifting後の幾何情報活用という設計上の盲点を扱っており、cameraベースoccupancyモデルの精度・効率改善の方向性として参考になる。", "paper_url": "https://arxiv.org/abs/2605.16911", "code_url": "", "published": "2026-05-16T09:51:04Z", "relevance": 19.5}, {"key": "arxiv:2605.16127", "title": "WeatherOcc3D: VLM-Assisted Adverse Weather Aware 3D Semantic Occupancy Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "Open-world", "AD Perception"], "abstract": "While multi-modal 3D semantic occupancy prediction typically enhances robustness by fusing camera and LiDAR inputs, its effectiveness is fundamentally constrained by environmental variability. Specifically, camera sensors suffer from severe low-light degradation, while LiDAR sensors encounter significant backscatter noise during heavy precipitation. These adverse conditions create a modality trust problem, as static fusion strategies fail to adaptively re-weight inputs when a specific sensor becomes unreliable. To address this, we propose a VLM-assisted framework leveraging the pre-trained CLIP latent space to guide multi-sensor integration via linguistic environmental cues. We utilize a parameter-efficient adapter to align weather-specific text embeddings with sensor features, coupled with a gating strategy that decomposes environmental uncertainty into two factors: visibility and illumination. This enables the model to dynamically modulate the fusion ratio - prioritizing semantic camera features in clear daylight and shifting to geometric LiDAR priors during rainy nights. Evaluations on the nuScenes dataset demonstrate the versatility of our approach, as implementing our proposed framework on the OccMamba and M-CONet architectures achieves mIoU scores of 26.3 and 21.1, respectively, significantly outperforming their traditional baselines.", "summary_ja": "悪天候下でカメラとLiDARの信頼性が変動する問題に対し、CLIPの潜在空間を用いてテキスト由来の環境情報でセンサ融合比率を動的に制御する3D semantic occupancy予測手法を提案している。視界と照度という2軸で環境不確実性を分解し、アダプタとゲーティング機構でセンサ特徴とテキスト埋め込みを整合させる。", "novelty_ja": "従来の静的な融合戦略と異なり、VLM(CLIP)由来の言語的な天候・照度キューを用いて、昼夜・降雨などの条件に応じカメラとLiDARの寄与度を適応的に切り替える点が新しい。", "why_read_ja": "悪天候・低照度といった実運用上の課題に対するセンサ融合のロバスト化手法であり、occupancy predictionの実用化に向けた知見として参考になる。", "paper_url": "https://arxiv.org/abs/2605.16127", "code_url": "", "published": "2026-05-15T16:12:50Z", "relevance": 22.0}, {"key": "arxiv:2605.16087", "title": "Towards Trustworthy and Explainable AI for Perception Models: From Concept to Prototype Vehicle Deployment", "venue": "arXiv 2026", "year": 2026, "topic": "AD Perception", "topics": ["AD Perception", "Scene Understanding"], "abstract": "Deep Neural Networks have become the dominant solution for Autonomous Driving perception, but their opacity conflicts with emerging Trustworthy AI guidelines and complicates safety assurance, debugging, and human oversight. While theoretical frameworks for safe and Explainable AI (XAI) exist, concrete implementations of Trustworthy AI for 3D scene understanding remain scarce. We address this gap by proposing a Trustworthy AI perception module that is remarkably robust, integrates faithful explainability, and calibrated uncertainty estimates. Building on a transformer-based detector, we derive explanation from the attention mechanism at inference time and validate their faithfulness using perturbation-based consistency tests. We further integrate an uncertainty estimation and calibration module, and apply robustness-enhancing training methods. Experiments show faithful saliency behavior, improved robustness, and well-calibrated uncertainty estimates. Finally, we deploy these Trustworthy AI elements in a prototype vehicle and provide an XAI Interface that visualizes documentation artifacts, model uncertainty state, and saliency maps, demonstrating the feasibility of trustworthy perception monitoring in real time. Supplementary materials are available at https://tillbeemelmanns.github.io/trustworthy_ai/ .", "summary_ja": "自動運転の3Dシーン理解に使われるTransformerベース検出器を対象に、注意機構から忠実な説明(saliency)を導出し、摂動ベースの一貫性テストで検証する。さらに不確実性の推定・較正モジュールと頑健性向上の学習手法を統合し、実車プロトタイプに実装してリアルタイムで可視化するXAIインターフェースまで構築している。", "novelty_ja": "理論的なXAI/Trustworthy AIの枠組みにとどまらず、説明性・較正済み不確実性・頑健性を単一の知覚モジュールに統合し、実車搭載まで実証した点が従来研究との違い。", "why_read_ja": "知覚モデルの信頼性・説明可能性の実装例は少なく、実車デプロイまで踏み込んだ事例として安全性保証やHMI設計の参考になる。", "paper_url": "https://arxiv.org/abs/2605.16087", "code_url": "", "published": "2026-05-15T15:47:01Z", "relevance": 11.5}, {"key": "arxiv:2605.14396", "title": "Systematic Discovery of Semantic Attacks in Online Map Construction through Conditional Diffusion", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "Topology", "AD Perception", "3D Detection", "World Model"], "abstract": "Autonomous vehicles depend on online HD map construction to perceive lane boundaries, dividers, and pedestrian crossings -- safety-critical road elements that directly govern motion planning. While existing pixel perturbation attacks can disrupt the mapping, they can be neutralized by standard adversarial defenses. We present MIRAGE, a framework for systematic discovery of semantic attacks that bypass adversarial defenses and degrade mapping predictions by finding plausible environmental variation (e.g. shadows, wet roads). MIRAGE exploits the latent manifold of real-world data learned by diffusion models, and searches for semantically mutated scenes neighboring the ground truth with the same road topology yet mislead the mapping predictions. We evaluate MIRAGE on nuScenes and demonstrate two attacks: (1) boundary removal, suppressing 57.7% of detections and corrupting 96% of planned trajectories; and (2) boundary injection, the only method that successfully injects fictitious boundaries, while pixel PGD and AdvPatch fail entirely. Both attacks remain potent under various adversarial defenses. We use two independent VLM judges to quantify realism, where MIRAGE passes as realistic 80--84% of the time (vs. 97--99% for clean nuScenes), while AdvPatch only 0--9%. Our findings expose a categorical gap in current adversarial defenses: semantic-level perturbations that manifest as legitimate environmental variation are substantially harder to mitigate than pixel-level perturbations.", "summary_ja": "オンラインHDマップ構築モデルに対して、拡散モデルの潜在多様体上で意味的に自然な環境変動(影、濡れた路面など)を探索し、既存の敵対的防御を回避しながら車線境界の検出を破壊または偽の境界を注入するMIRAGEという攻撃フレームワークを提案している。nuScenesでの評価により、境界除去攻撃で検出の57.7%を抑制し計画軌道の96%を破壊、境界注入攻撃ではピクセル単位の攻撃(PGD, AdvPatch)が失敗する中で唯一成功することを示した。", "novelty_ja": "従来のピクセル摂動攻撃が標準的な敵対的防御で無効化されるのに対し、拡散モデルを用いて同じ道路トポロジーを保ちながら現実的な環境変化として現れる意味レベルの攻撃を系統的に発見する点が新しい。", "why_read_ja": "オンラインHDマップ構築モデルの安全性・頑健性を評価する上で、既存防御が見落としている意味レベルの脆弱性を明らかにしており、地図生成モデルの信頼性評価の観点で参考になる。", "paper_url": "https://arxiv.org/abs/2605.14396", "code_url": "", "published": "2026-05-14T05:21:17Z", "relevance": 19.0}, {"key": "arxiv:2605.13755", "title": "Generative Texture Diversification of 3D Pedestrians for Robust Autonomous Driving Perception", "venue": "CVPR 2026", "year": 2026, "topic": "3D Detection", "topics": ["AD Perception", "3D Detection"], "abstract": "In recent years, autonomous driving has significantly in creased the demand for high-quality data to train 2D and 3D perception models for safety-critical scenarios. Real world datasets struggle to meet this demand as require ments continuously evolve and large-scale annotated data collection remains costly and time-consuming making syn thetic data a scalable, practical and controllable alterna tive. Pedestrian detection is among the most safety-critical tasks in autonomous driving. In this paper, we propose a simple yet effective method for scaling variability in 3D pedestrian assets for synthetic scene generation. Starting from a single 3D base asset, we generate multiple distinct pedestrian instances by synthesizing diverse facial textures and identity-level appearance variations using StyleGAN2 and automatically mapping them onto 3D meshes. This ap proach enables scalable appearance-level asset diversifica tion without requiring the design of new geometries for each instance. Using the assets, we construct synthetic datasets and study the impact of mixing real and synthetic data for RGB-based object detection. Through complementary ex periments, we analyze geometry-driven distribution shifts in point cloud perception for 3D object detection. Our findings demonstrate that controlled synthetic diversifica tion improves robustness in 2D detection while revealing the sensitivity of 3D perception models to geometric domain gaps. Overall, this work highlights how generative AI en ables scalable, simulation-ready pedestrian diversification through controlled facial texture synthesis, along with the benefits and limitations of cross-domain training strategies in autonomous driving pipelines.", "summary_ja": "自動運転における歩行者検出向けの学習データ不足を補うため、単一の3D歩行者アセットからStyleGAN2で顔テクスチャや外見バリエーションを生成し3Dメッシュにマッピングすることで、低コストに多様な合成歩行者インスタンスを量産する手法を提案している。生成したアセットで合成データセットを構築し、実データと合成データを混合した際のRGBベース物体検出への影響、および点群ベース3D検出における幾何学的ドメインギャップの感度を分析している。", "novelty_ja": "新規ジオメトリを個別に設計せず、テクスチャ・外見レベルの多様化のみでアセットスケーリングを行う点が従来のアセット作成コストの高いアプローチと異なる。", "why_read_ja": "合成データによるアセット多様化がRGB検出とLiDAR/点群検出で異なる感度を示す点は、シミュレーションデータを用いた3D検出モデルの頑健性評価・学習戦略を検討する上で参考になる。", "paper_url": "https://arxiv.org/abs/2605.13755", "code_url": "", "published": "2026-05-13T16:35:50Z", "relevance": 14.0}, {"key": "arxiv:2605.12218", "title": "Learning Ego-Centric BEV Representations from a Perspective-Privileged View: Cross-View Supervision for Online HD Map Construction", "venue": "ECCV 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "3D Detection", "AD Perception"], "abstract": "Bird's-eye-view (BEV) representations derived from multi-camera input have become a central interface for online high-definition (HD) map construction. However, most approaches rely solely on ego-centric supervision, requiring large-scale scene structure to be inferred from incomplete observations, occlusions, and diminishing information density at long range, where perspective effects and spatial sparsity hinder consistent structural reasoning. We introduce Cross-View Supervision (CVS), a representation learning paradigm that transfers geometric and topological priors from an ego-aligned overhead perspective into camera-based BEV encoders. Rather than adding auxiliary semantic losses, CVS aligns representations in a shared BEV feature space and distills globally consistent structural knowledge from a perspective-privileged teacher into the ego-centric backbone. This supervision enhances structural coherence without modifying the inference architecture or requiring overhead input at test time. Experiments on nuScenes using ego-aligned aerial imagery from the AID4AD cross-view extension demonstrate consistent improvements over StreamMapNet while maintaining identical camera-only inference. CVS yields +3.9mAP in the standard $60\\times30\\,\\mathrm{m}$ region and +9.9mAP in the extended $100\\times50\\,\\mathrm{m}$ setting, corresponding to a 44% relative gain at long range. These results highlight perspective-privileged structural supervision as a promising training principle for improving BEV representation learning in HD map construction.", "summary_ja": "マルチカメラ入力からのオンラインHDマップ構築において、自車視点のみの教師信号では遠方や遮蔽領域で構造推論が不安定になる課題に対し、俯瞰(overhead)画像から幾何・トポロジ的な事前知識をBEVエンコーダに転移するCross-View Supervision (CVS)を提案する。推論時はカメラ画像のみを使用し、俯瞰入力は学習時のみ利用する。", "novelty_ja": "補助的な意味論的損失を追加するのではなく、BEV特徴空間上で自車視点モデルと俯瞰視点の教師モデルの表現を直接整合させる蒸留的アプローチをとる点が既存手法と異なる。", "why_read_ja": "推論アーキテクチャや入力を変えずに遠方領域のHDマップ精度を大きく改善する学習パラダイムであり、BEV表現学習・地図構築の性能向上手法として動向把握に有用。", "paper_url": "https://arxiv.org/abs/2605.12218", "code_url": "", "published": "2026-05-12T14:55:32Z", "relevance": 17.5}, {"key": "arxiv:2605.08293", "title": "Distill, Diffuse, Segment: Unsupervised 3D Semantic Segmentation for Autonomous Driving Based on Multi-Level Distillation and Graph Diffusion", "venue": "arXiv 2026", "year": 2026, "topic": "Scene Understanding", "topics": ["Scene Understanding", "World Model", "AD Perception"], "abstract": "LiDAR-based semantic segmentation is essential for autonomous-driving perception, yet dense point-wise annotations are costly, and long-tailed outdoor scenes make small safety-critical objects difficult to discover without supervision. Existing unsupervised methods face three key challenges: they struggle to preserve small and sparsely observed objects under substantial scale variation, have difficulty enforcing intra-region consistency and inter-region discrimination during cross-modal transfer, and lack an efficient feature-preserving mechanism for contextual propagation over superpoint graphs. We therefore propose DDS, an unsupervised 3D semantic segmentation framework. First, a coarse-to-fine multi-granularity mask cascade provides complementary 3D region cues for objects across different scales, improving the preservation of small and sparsely observed objects. Second, region-guided multi-level distillation transfers self-supervised visual knowledge through point-level alignment, mask-level prototype alignment, and prototype-level contrastive learning, enhancing intra-region consistency and inter-region discrimination. Third, restart-based graph diffusion efficiently propagates contextual information among superpoints while anchoring the refined representation to the initial distilled features and avoiding explicit graph eigendecomposition. Experiments on real-world driving datasets show that DDS outperforms representative unsupervised baselines, improving oAcc, mAcc, and mIoU by up to 2.9%, 9.7%, and 4.1%, respectively. These results demonstrate the effectiveness and transferability of DDS for unsupervised 3D scene understanding in autonomous-driving scenarios.", "summary_ja": "点群の密なアノテーションコストとロングテール環境下での小物体検出困難という課題に対し、教師なし3Dセマンティックセグメンテーション手法DDSを提案。粗density→細粒度のマスクカスケードで多様なスケールの物体を捉え、リージョン単位の多段蒸留で自己教師あり視覚知識を点/マスク/プロトタイプの各レベルで転移し、リスタート型グラフ拡散でsuperpoint間の文脈情報を効率的に伝播する。", "novelty_ja": "既存手法が抱えるスケール変動への弱さ・領域内一貫性/領域間識別性の欠如・グラフ固有値分解を要する非効率な伝播という3課題を、マルチ粒度マスク・多段蒸留・restartベース拡散でそれぞれ個別に解決している点が新しい。", "why_read_ja": "アノテーション不要で3Dシーン理解を進める手法は地図生成・環境認識のデータ効率化に直結し、実路データでの性能改善が報告されている点でトレンド把握に有用。", "paper_url": "https://arxiv.org/abs/2605.08293", "code_url": "", "published": "2026-05-08T09:39:59Z", "relevance": 14.0}, {"key": "arxiv:2605.01081", "title": "WILD SAM: A Simulated-and-Real Data Augmentation for Autonomous Driving Perception under Challenging Weather", "venue": "arXiv 2026", "year": 2026, "topic": "AD Perception", "topics": ["AD Perception"], "abstract": "The performance of state-of-the-art object detectors degrades significantly under adverse weather, causing a safety-critical domain shift problem for autonomous vehicles. Recent efforts address this problem by relying on synthetic data to train the object detectors, which limits their real-world applicability. Meanwhile, pseudo-labeling is widely used for cross-dataset domain adaptation problems. However, these methods have not been exploited by weather-based domain adaptation approaches due to the noisy nature of such labels generated under harsh weather conditions. In this paper, we propose two new approaches to mitigate this weather-induced domain shift. First, we propose a Weather-Induced pseudo Label Denoising (WILD) framework that filters noisy pseudo labels generated by real data captured under adverse weather conditions. Second, we develop a novel hybrid training methodology, WILD SAM, that exploits both pseudo-label denoising and simulation-based training solutions while using real-data from the target harsh-weather domain. We validate both proposed approaches, WILD and WILD SAM, on the recently released Four Seasons dataset across rainy and snowy scenarios. Experiments show that the proposed frameworks improve Average Precision (AP) up to 13\\% and significantly reduce the weather-induced performance gap relative to the baseline. The code is available at: https://github.com/Kh-Hamed/WILD-SAM", "summary_ja": "悪天候による自動運転向け物体検出器の性能劣化に対し、実データから生成した疑似ラベルのノイズをフィルタするWILDフレームワークと、それをシミュレーションデータ学習と組み合わせるWILD SAMを提案。Four Seasonsデータセットの雨・雪シーンで検証している。", "novelty_ja": "従来の合成データ依存型手法と異なり、悪天候下の実データから得た疑似ラベルのノイズを除去する仕組みを導入し、シミュレーションと実データ双方を活用するハイブリッド学習を実現した点が新しい。", "why_read_ja": "天候変動によるドメインシフト対策は自動運転認識の頑健性向上に直結するテーマであり、疑似ラベル denoising という具体的アプローチは他の認識・地図生成タスクへの応用も見込める。", "paper_url": "https://arxiv.org/abs/2605.01081", "code_url": "https://github.com/Kh-Hamed/WILD-SAM", "published": "2026-05-01T20:24:51Z", "relevance": 8.5}, {"key": "arxiv:2604.07980", "title": "Object-Centric Stereo Ranging for Autonomous Driving: From Dense Disparity to Census-Based Template Matching", "venue": "arXiv 2026", "year": 2026, "topic": "AD Perception", "topics": ["AD Perception", "Reconstruction"], "abstract": "Accurate depth estimation is critical for autonomous driving perception systems, particularly for long range vehicle detection on highways. Traditional dense stereo matching methods such as Block Matching (BM) and Semi Global Matching (SGM) produce per pixel disparity maps but suffer from high computational cost, sensitivity to radiometric differences between stereo cameras, and poor accuracy at long range where disparity values are small. In this report, we present a comprehensive stereo ranging system that integrates three complementary depth estimation approaches: dense BM/SGM disparity, object centric Census based template matching, and monocular geometric priors, within a unified detection ranging tracking pipeline. Our key contribution is a novel object centric Census based template matching algorithm that performs GPU accelerated sparse stereo matching directly within detected bounding boxes, employing a far close divide and conquer strategy, forward backward verification, occlusion aware sampling, and robust multi block aggregation. We further describe an online calibration refinement framework that combines auto rectification offset search, radar stereo voting based disparity correction, and object level radar stereo association for continuous extrinsic drift compensation. The complete system achieves real time performance through asynchronous GPU pipeline design and delivers robust ranging across diverse driving conditions including nighttime, rain, and varying illumination.", "summary_ja": "自動運転における長距離車両検知向けの奥行き推定を扱う論文。従来の密なブロックマッチング/SGMは計算コストが高く遠距離で視差が小さいため精度が低下する課題に対し、密ステレオ視差・物体中心のCensusベーステンプレートマッチング・単眼幾何プライアを統合した検知-測距-追跡パイプラインを提案している。", "novelty_ja": "検出されたバウンディングボックス内でGPU上の疎なステレオマッチングを行う物体中心Censusテンプレートマッチング(遠近分割統治、前後方検証、遮蔽考慮サンプリング、頑健なマルチブロック集約を含む)と、レーダー・ステレオ連携によるオンライン外部パラメータ較正補正を組み合わせている点が従来の密ステレオ手法と異なる。", "why_read_ja": "カメラ単体に頼らないステレオ+レーダー融合による実用的な測距システムの設計例であり、実車搭載の認識パイプラインにおける精度とリアルタイム性の両立の工夫を学べる。", "paper_url": "https://arxiv.org/abs/2604.07980", "code_url": "", "published": "2026-04-09T08:51:42Z", "relevance": 9.5}, {"key": "arxiv:2604.02930", "title": "BEVPredFormer: Spatio-temporal Attention for BEV Instance Prediction in Autonomous Driving", "venue": "arXiv 2026", "year": 2026, "topic": "AD Perception", "topics": ["AD Perception", "HD Map", "3D Detection"], "abstract": "A robust awareness of how dynamic scenes evolve is essential for Autonomous Driving systems, as they must accurately detect, track, and predict the behaviour of surrounding obstacles. Traditional perception pipelines that rely on modular architectures tend to suffer from cumulative errors and latency. Instance Prediction models provide a unified solution, performing Bird's-Eye-View segmentation and motion estimation across current and future frames using information directly obtained from different sensors. However, a key challenge in these models lies in the effective processing of the dense spatial and temporal information inherent in dynamic driving environments. This level of complexity demands architectures capable of capturing fine-grained motion patterns and long-range dependencies without compromising real-time performance. We introduce BEVPredFormer, a novel camera-only architecture for BEV instance prediction that uses attention-based temporal processing to improve temporal and spatial comprehension of the scene and relies on an attention-based 3D projection of the camera information. BEVPredFormer employs a recurrent-free design that incorporates gated transformer layers, divided spatio-temporal attention mechanisms, and multi-scale head tasks. Additionally, we incorporate a difference-guided feature extraction module that enhances temporal representations. Extensive ablation studies validate the effectiveness of each architectural component. When evaluated on the nuScenes dataset, BEVPredFormer was on par or surpassed State-Of-The-Art methods, highlighting its potential for robust and efficient Autonomous Driving perception.", "summary_ja": "自動運転における動的物体のBEVセグメンテーションと将来動作予測を、モジュール型パイプラインの誤差蓄積・遅延を避けて単一モデルで行う手法を提案。カメラ入力のみから3D空間への注意機構ベース投影と、時空間attentionによる特徴処理でシーンの時間発展を捉える。差分ガイド付き特徴抽出モジュールで時間方向の表現も強化している。", "novelty_ja": "再帰(RNN)構造を使わず、gated transformer層と時空間分離attentionによりBEVインスタンス予測を行う点が従来の再帰的時系列処理と異なる。", "why_read_ja": "BEVベースの統合認識・予測アーキテクチャの最新設計パターンとして、地図生成や占有予測系研究のバックボーン選定の参考になる。", "paper_url": "https://arxiv.org/abs/2604.02930", "code_url": "", "published": "2026-04-03T09:58:42Z", "relevance": 12.5}, {"key": "arxiv:2604.01081", "title": "ProOOD: Prototype-Guided Out-of-Distribution 3D Occupancy Prediction", "venue": "CVPR 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Open-world", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "3D semantic occupancy prediction is central to autonomous driving, yet current methods are vulnerable to long-tailed class bias and out-of-distribution (OOD) inputs, often overconfidently assigning anomalies to rare classes. We present ProOOD, a lightweight, plug-and-play method that couples prototype-guided refinement with training-free OOD scoring. ProOOD comprises (i) prototype-guided semantic imputation that fills occluded regions with class-consistent features, (ii) prototype-guided tail mining that strengthens rare-class representations to curb OOD absorption, and (iii) EchoOOD, which fuses local logit coherence with local and global prototype matching to produce reliable voxel-level OOD scores. Extensive experiments on five datasets demonstrate that ProOOD achieves state-of-the-art performance on both in-distribution 3D occupancy prediction and OOD detection. On SemanticKITTI, it surpasses baselines by +3.57% mIoU overall and +24.80% tail-class mIoU; on VAA-KITTI, it improves AuPRCr by +19.34 points, with consistent gains across benchmarks. These improvements yield more calibrated occupancy estimates and more reliable OOD detection in safety-critical urban driving. The source code is publicly available at https://github.com/7uHeng/ProOOD.", "summary_ja": "自動運転の3D semantic occupancy predictionにおいて、long-tailなクラス分布とOOD入力への脆弱性を課題として扱っている。既存手法は未知物体を稀少クラスに過信して割り当ててしまうため、本論文はプロトタイプを用いた特徴の補完・稀少クラス表現の強化と、学習不要のOODスコアリングを組み合わせたProOODを提案する。遮蔽領域をクラス一貫性のある特徴で埋めるsemantic imputation、tail miningによる稀少クラス強化、局所logitの整合性とプロトタイプ照合を融合したEchoOODの3要素からなる。5つのデータセットでin-distributionのoccupancy予測とOOD検出の双方を評価している。", "novelty_ja": "occupancy予測の精度向上とOOD検出を別々に扱うのではなく、プロトタイプによる稀少クラス表現の強化がOODの誤吸収を抑えるという観点で両者を結び付けた点が特徴。さらにEchoOODは追加学習を必要とせず、既存モデルにplug-and-playで組み込めるvoxel単位のOODスコアを与える。", "why_read_ja": "occupancy予測を安全性の観点から評価する流れ(未知物体の扱い、予測の校正)は今後の環境認識研究で重要度が増しており、その具体的なアプローチとベンチマーク設定を把握できる。plug-and-play設計のため既存のoccupancyパイプラインへの適用可能性という点でも参考になる。", "paper_url": "https://arxiv.org/abs/2604.01081", "code_url": "https://github.com/7uHeng/ProOOD", "published": "2026-04-01T16:11:59Z", "relevance": 24.5}, {"key": "arxiv:2603.27818", "title": "Benchmarking Multi-View BEV Object Detection with Mixed Pinhole and Fisheye Cameras", "venue": "ICRA 2026", "year": 2026, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception", "HD Map"], "abstract": "Modern autonomous driving systems increasingly rely on mixed camera configurations with pinhole and fisheye cameras for full view perception. However, Bird's-Eye View (BEV) 3D object detection models are predominantly designed for pinhole cameras, leading to performance degradation under fisheye distortion. To bridge this gap, we introduce a multi-view BEV detection benchmark with mixed cameras by converting KITTI-360 into nuScenes format. Our study encompasses three adaptations: rectification for zero-shot evaluation and fine-tuning of nuScenes-trained models, distortion-aware view transformation modules (VTMs) via the MEI camera model, and polar coordinate representations to better align with radial distortion. We systematically evaluate three representative BEV architectures, BEVFormer, BEVDet and PETR, across these strategies. We demonstrate that projection-free architectures are inherently more robust and effective against fisheye distortion than other VTMs. This work establishes the first real-data 3D detection benchmark with fisheye and pinhole images and provides systematic adaptation and practical guidelines for designing robust and cost-effective 3D perception systems. The code is available at https://github.com/CesarLiu/FishBEVOD.git.", "summary_ja": "自動運転で普及しつつあるpinhole+fisheye混在カメラ構成において、既存のBEV 3D物体検出モデルが魚眼歪みで性能劣化する問題を扱う。KITTI-360をnuScenes形式に変換した実データベンチマークを構築し、rectification、MEIカメラモデルに基づく歪み対応View Transformation Module、極座標表現という3種類の適応手法をBEVFormer・BEVDet・PETRの3アーキテクチャに適用して系統的に評価する。", "novelty_ja": "従来はpinhole前提のBEV検出モデルを合成データや個別工夫で魚眼に適用する例はあったが、本研究は実データによる魚眼+pinhole混在の3D検出ベンチマークを初めて整備し、複数の適応戦略とアーキテクチャを横断的に比較している。", "why_read_ja": "マルチカメラ構成が多様化する中で、fisheye歪みに対するBEV検出手法のロバスト性と設計指針を把握できる点で、実運用を見据えた3D検出・AD知覚の研究動向として参考になる。", "paper_url": "https://arxiv.org/abs/2603.27818", "code_url": "https://github.com/CesarLiu/FishBEVOD.git", "published": "2026-03-29T19:10:34Z", "relevance": 18.5}, {"key": "arxiv:2603.22852", "title": "Gau-Occ: Geometry-Completed Gaussians for Multi-Modal 3D Occupancy Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "Gaussian Splatting", "HD Map", "3D Detection", "AD Perception"], "abstract": "3D semantic occupancy prediction is crucial for autonomous driving. While multi-modal fusion improves accuracy over vision-only methods, it typically relies on computationally expensive dense voxel or BEV tensors. We present Gau-Occ, a multi-modal framework that bypasses dense volumetric processing by modeling the scene as a compact collection of semantic 3D Gaussians. To ensure geometric completeness, we propose a LiDAR Completion Diffuser (LCD) that recovers missing structures from sparse LiDAR to initialize robust Gaussian anchors. Furthermore, we introduce Gaussian Anchor Fusion (GAF), which efficiently integrates multi-view image semantics via geometry-aligned 2D sampling and cross-modal alignment. By refining these compact Gaussian descriptors, Gau-Occ captures both spatial consistency and semantic discriminability. Extensive experiments across challenging benchmarks demonstrate that Gau-Occ achieves state-of-the-art performance with significant computational efficiency.", "summary_ja": "3D semantic occupancy predictionを、高コストな稠密voxel/BEVテンソルではなくコンパクトな3D Gaussian集合としてモデル化するマルチモーダル手法Gau-Occを提案。LiDAR Completion Diffuserでスパースな点群から欠損構造を補完しGaussian anchorを初期化し、Gaussian Anchor Fusionで多視点画像の意味情報を幾何整合的にサンプリングして統合する。", "novelty_ja": "稠密な3D/BEVボクセル表現に依存せず、幾何補完済みの疎なGaussian表現で計算コストを抑えつつマルチモーダル融合を実現する点が従来手法との違い。", "why_read_ja": "occupancy predictionにおけるGaussian Splatting的表現とマルチモーダル融合設計の最新動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2603.22852", "code_url": "", "published": "2026-03-24T06:44:46Z", "relevance": 23.0}, {"key": "arxiv:2603.20076", "title": "Uncertainty Matters: Structured Probabilistic Online Mapping for Motion Prediction in Autonomous Driving", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["AD Perception", "HD Map", "3D Detection"], "abstract": "Online map generation and trajectory prediction are critical components of the autonomous driving perception-prediction-planning pipeline. While modern vectorized mapping models achieve high geometric accuracy, they typically treat map estimation as a deterministic task, discarding structural uncertainty. Existing probabilistic approaches often rely on diagonal covariance matrices, which assume independence between points and fail to capture the strong spatial correlations inherent in road geometry. To address this, we propose a structured probabilistic formulation for online map generation. Our method explicitly models intra-element dependencies by predicting a dense covariance matrix, parameterized via a Low-Rank plus Diagonal (LRPD) covariance decomposition. This formulation represents uncertainty as a combination of a low-rank component, which captures global spatial structure, and a diagonal component representing independent local noise, thereby capturing geometric correlations without the prohibitive computational cost of full covariance matrices. Evaluations on the nuScenes dataset demonstrate that our uncertainty-aware framework yields consistent improvements in online map generation quality compared to deterministic baselines. Furthermore, our approach establishes new state-of-the-art performance for map-based motion prediction, highlighting the critical role of uncertainty in planning tasks. Code is published under link-available-soon.", "summary_ja": "オンラインでベクトルマップを推定するモデルは通常決定論的に点座標を出力し、構造的な不確実性を捨てている。本研究は各マップ要素内の点間の空間相関を捉えるため、低ランク成分と対角成分からなる共分散(LRPD)で不確実性を明示的にモデル化する確率的マッピング手法を提案する。nuScenesでの評価により、決定論的手法よりマップ生成品質が向上し、マップベースの軌道予測でも最先端性能を達成したことを示している。", "novelty_ja": "従来の確率的マッピングが点間独立を仮定する対角共分散に限られていたのに対し、低ランク+対角分解によって計算コストを抑えつつ点間の空間相関を表現できる点が新しい。", "why_read_ja": "地図生成における不確実性推定は下流の予測・計画タスクの信頼性に直結するため、オンラインマッピング研究の実用化に向けた重要な方向性を示している。", "paper_url": "https://arxiv.org/abs/2603.20076", "code_url": "", "published": "2026-03-20T15:56:48Z", "relevance": 16.0}, {"key": "arxiv:2603.19219", "title": "DriveTok: 3D Driving Scene Tokenization for Unified Multi-View Reconstruction and Understanding", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "AD Perception", "3D Detection", "Open-world"], "abstract": "With the growing adoption of vision-language-action models and world models in autonomous driving systems, scalable image tokenization becomes crucial as the interface for the visual modality. However, most existing tokenizers are designed for monocular and 2D scenes, leading to inefficiency and inter-view inconsistency when applied to high-resolution multi-view driving scenes. To address this, we propose DriveTok, an efficient 3D driving scene tokenizer for unified multi-view reconstruction and understanding. DriveTok first obtains semantically rich visual features from vision foundation models and then transforms them into the scene tokens with 3D deformable cross-attention. For decoding, we employ a multi-view transformer to reconstruct multi-view features from the scene tokens and use multiple heads to obtain RGB, depth, and semantic reconstructions. We also add a 3D head directly on the scene tokens for 3D semantic occupancy prediction for better spatial awareness. With the multiple training objectives, DriveTok learns unified scene tokens that integrate semantic, geometric, and textural information for efficient multi-view tokenization. Extensive experiments on the widely used nuScenes dataset demonstrate that the scene tokens from DriveTok perform well on image reconstruction, semantic segmentation, depth prediction, and 3D occupancy prediction tasks.", "summary_ja": "自動運転のマルチビュー高解像度画像に対応するシーントークナイザDriveTokを提案。視覚基盤モデルの特徴を3D deformable cross-attentionでシーントークンに変換し、マルチビュートランスフォーマーでRGB・深度・セマンティクスを再構成しつつ、3D占有予測ヘッドも備える。単視点向けトークナイザではマルチビュー間の非効率・不整合が生じる課題に対応する。", "novelty_ja": "既存の2D/単眼向けトークナイザと異なり、3D空間上のシーントークンを介してマルチビュー一貫性を確保し、再構成と3D占有予測を同一トークン表現で統一的に学習する点が特徴。", "why_read_ja": "world model・VLA向けの視覚トークナイザ設計は今後のBEV/occupancy研究の基盤要素になりうるため、マルチビュー統一表現の設計動向として参照価値が高い。", "paper_url": "https://arxiv.org/abs/2603.19219", "code_url": "https://github.com/paryi555/DriveTok", "published": "2026-03-19T17:58:22Z", "relevance": 18.5}, {"key": "arxiv:2603.10688", "title": "MapGCLR: Geospatial Contrastive Learning of Representations for Online Vectorized HD Map Construction", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map"], "abstract": "Autonomous vehicles rely on map information to understand the world around them. However, the creation and maintenance of offline high-definition (HD) maps remains costly. A more scalable alternative lies in online HD map construction, which only requires map annotations at training time. To further reduce the need for annotating vast training labels, self-supervised training provides an alternative. This work focuses on improving the latent birds-eye-view (BEV) feature grid representation within a vectorized online HD map construction model by enforcing geospatial consistency between overlapping BEV feature grids as part of a contrastive loss function. To ensure geospatial overlap for contrastive pairs, we introduce an approach to analyze the overlap between traversals within a given dataset and generate subsidiary dataset splits following adjustable multi-traversal requirements. We train the same model supervised using a reduced set of single-traversal labeled data and self-supervised on a broader unlabeled set of data following our multi-traversal requirements, effectively implementing a semi-supervised approach. Our approach outperforms the supervised baseline across the board, both quantitatively in terms of the downstream tasks vectorized map perception performance and qualitatively in terms of segmentation in the principal component analysis (PCA) visualization of the BEV feature space.", "summary_ja": "オフラインHDマップの作成・維持コストを削減するため、オンラインでベクトル化HDマップを構築するモデルを対象に、BEV特徴グリッド間の地理的一貫性をcontrastive lossとして課すことで表現学習を改善する研究。同一エリアを複数回走行(multi-traversal)したデータのオーバーラップを解析し、対応するデータセット分割を自動生成する手法も提案している。少量のラベル付き単一走行データで教師あり学習しつつ、広範な未ラベルの複数走行データで自己教師あり学習を組み合わせる半教師ありアプローチを構築している。", "novelty_ja": "地図アノテーションのある単一走行データのみに頼らず、走行間の地理的重なりを明示的に検出してcontrastive pairを作る点が従来の教師ありオンラインHDマップ構築と異なる。", "why_read_ja": "アノテーションコストを抑えつつオンラインHDマップ構築の性能を上げる半教師あり手法として、地図生成分野の自己教師あり学習トレンドを把握する上で参考になる。", "paper_url": "https://arxiv.org/abs/2603.10688", "code_url": "", "published": "2026-03-11T11:58:23Z", "relevance": 17.0}, {"key": "arxiv:2603.09737", "title": "$M^2$-Occ: Resilient 3D Semantic Occupancy Prediction for Autonomous Driving with Incomplete Camera Inputs", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "Semantic occupancy prediction enables dense 3D geometric and semantic understanding for autonomous driving. However, existing camera-based approaches implicitly assume complete surround-view observations, an assumption that rarely holds in real-world deployment due to occlusion, hardware malfunction, or communication failures. We study semantic occupancy prediction under incomplete multi-camera inputs and introduce $M^2$-Occ, a framework designed to preserve geometric structure and semantic coherence when views are missing. $M^2$-Occ addresses two complementary challenges. First, a Multi-view Masked Reconstruction (MMR) module leverages the spatial overlap among neighboring cameras to recover missing-view representations directly in the feature space. Second, a Feature Memory Module (FMM) introduces a learnable memory bank that stores class-level semantic prototypes. By retrieving and integrating these global priors, the FMM refines ambiguous voxel features, ensuring semantic consistency even when observational evidence is incomplete. We introduce a systematic missing-view evaluation protocol on the nuScenes-based SurroundOcc benchmark, encompassing both deterministic single-view failures and stochastic multi-view dropout scenarios. Under the safety-critical missing back-view setting, $M^2$-Occ improves the IoU by 4.93%. As the number of missing cameras increases, the robustness gap further widens; for instance, under the setting with five missing views, our method boosts the IoU by 5.01%. These gains are achieved without compromising full-view performance. The source code will be publicly released at https://github.com/qixi7up/M2-Occ.", "summary_ja": "カメラベースのsemantic occupancy predictionは、surround-viewの全カメラが正常に得られる前提で設計されているが、実運用では遮蔽やハードウェア故障、通信障害で一部の視点が欠けることがある。本論文は視点欠損下でも幾何構造と意味的整合性を保つフレームワーク$M^2$-Occを提案する。隣接カメラ間の空間的な重なりを利用して欠損視点の表現をfeature空間で復元するMulti-view Masked Reconstruction (MMR)と、クラスごとのsemantic prototypeを蓄えたmemory bankから大域的な事前情報を引き出して曖昧なvoxel特徴を補正するFeature Memory Module (FMM)の2つで構成される。nuScenesベースのSurroundOccベンチマーク上に、決定的な単一視点欠損と確率的な複数視点ドロップアウトを含む欠損視点評価プロトコルも整備している。", "novelty_ja": "従来のocc手法が暗黙に前提としていた「全周カメラが揃っている」という仮定を明示的に外し、feature空間での欠損視点復元とクラスレベルのsemantic prototype memoryを組み合わせて頑健性を確保した点が異なる。さらに欠損視点を体系的に評価するプロトコル自体を提示している。", "why_read_ja": "occupancy予測の精度競争ではなくセンサ欠損時の頑健性という実運用上の観点を扱っており、環境認識モジュールの信頼性評価の枠組みとして参考になる。欠損視点に対する評価プロトコルは他のBEV/occ手法のロバスト性検証にも流用しやすい。", "paper_url": "https://arxiv.org/abs/2603.09737", "code_url": "https://github.com/qixi7up/M2-Occ", "published": "2026-03-10T14:42:56Z", "relevance": 27.0}, {"key": "arxiv:2603.07794", "title": "4DRC-OCC: Robust Semantic Occupancy Prediction Through Fusion of 4D Radar and Camera", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "Reconstruction", "AD Perception"], "abstract": "Autonomous driving requires robust perception across diverse environmental conditions, yet 3D semantic occupancy prediction remains challenging under adverse weather and lighting. In this work, we present the first study combining 4D radar and camera data for 3D semantic occupancy prediction. Our fusion leverages the complementary strengths of both modalities: 4D radar provides reliable range, velocity, and angle measurements in challenging conditions, while cameras contribute rich semantic and texture information. We further show that integrating depth cues from camera pixels enables lifting 2D images to 3D, improving scene reconstruction accuracy. Additionally, we introduce a fully automatically labeled dataset for training semantic occupancy models, substantially reducing reliance on costly manual annotation. Experiments demonstrate the robustness of 4D radar across diverse scenarios, highlighting its potential to advance autonomous vehicle perception.", "summary_ja": "悪天候・悪照明下でも頑健な3D semantic occupancy predictionを目指し、4D radarとカメラを融合する手法を提案。radarのrange/velocity/angle情報とカメラの意味的・テクスチャ情報を組み合わせ、カメラ由来の深度手がかりで2D画像を3Dへリフトしてシーン再構成精度を高める。学習用に手動アノテーション負荷を減らす自動ラベリングデータセットも構築している。", "novelty_ja": "カメラ単体やLiDAR融合が主流だったoccupancy predictionに対し、4D radarとカメラの組み合わせを初めて適用し、悪条件下での頑健性を狙っている点が新規性。", "why_read_ja": "悪天候耐性のあるセンサ融合によるoccupancy推定は、実運用を見据えた環境認識の頑健性向上という重要な研究方向を示している。", "paper_url": "https://arxiv.org/abs/2603.07794", "code_url": "", "published": "2026-03-08T20:28:25Z", "relevance": 23.0}, {"key": "arxiv:2603.06279", "title": "Can we Trust Unreliable Voxels? Exploring 3D Semantic Occupancy Prediction under Label Noise", "venue": "IROS 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection"], "abstract": "3D semantic occupancy prediction is a cornerstone of robotic perception, yet real-world voxel annotations are inherently corrupted by structural artifacts and dynamic trailing effects. This raises a critical but underexplored question: can autonomous systems safely rely on such unreliable occupancy supervision? To systematically investigate this issue, we establish OccNL, the first benchmark dedicated to 3D occupancy under occupancy-asymmetric and dynamic trailing noise. Our analysis reveals a fundamental domain gap: state-of-the-art 2D label noise learning strategies collapse catastrophically in sparse 3D voxel spaces, exposing a critical vulnerability in existing paradigms. To address this challenge, we propose DPR-Occ, a principled label-noise-robust framework that constructs reliable supervision through dual-source partial label reasoning. By synergizing temporal model memory with representation-level structural affinity, DPR-Occ dynamically expands and prunes candidate label sets to preserve true semantics while suppressing noise propagation. Extensive experiments on SemanticKITTI demonstrate that DPR-Occ prevents geometric and semantic collapse under extreme corruption. Notably, even at 90% label noise, our method achieves significant performance gains (up to 2.57% mIoU and 13.91% IoU) over existing label noise learning baselines adapted to the 3D occupancy prediction task. By bridging label noise learning and 3D perception, OccNL and DPR-Occ provide a reliable foundation for safety-critical robotic perception in dynamic environments. The benchmark and source code will be made publicly available at https://github.com/mylwx/OccNL.", "summary_ja": "実世界の3D occupancyアノテーションには構造的アーチファクトや動的物体のトレイリングノイズが混入するため、これに頑健な学習手法を提案している。まずOccNLというラベルノイズ環境での3D occupancy評価ベンチマークを構築し、既存の2Dラベルノイズ対策が疎な3Dボクセル空間では破綻することを示した。続いてDPR-Occという、時間方向のモデル記憶と特徴表現レベルの構造的類似性を組み合わせて信頼できる候補ラベル集合を動的に拡張・剪定するフレームワークを提案している。", "novelty_ja": "2D画像向けのラベルノイズ学習手法をそのまま3D疎ボクセル空間に適用すると性能が崩壊する点を明らかにし、時間的一貫性と構造的近さの両方を使う3D特化の部分ラベル推論という新しい枠組みを導入した点が従来と異なる。", "why_read_ja": "occupancy予測の教師データ品質問題は実運用でのアノテーションコストや自動生成ラベルの誤りと直結するため、頑健な学習手法の動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2603.06279", "code_url": "https://github.com/mylwx/OccNL", "published": "2026-03-06T13:40:09Z", "relevance": 18.0}, {"key": "arxiv:2603.06210", "title": "VG3S: Visual Geometry Grounded Gaussian Splatting for Semantic Occupancy Prediction", "venue": "IROS 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Gaussian Splatting", "Scene Understanding", "AD Perception", "3D Detection"], "abstract": "3D semantic occupancy prediction has become a crucial perception task for comprehensive scene understanding in autonomous driving. While recent advances have explored 3D Gaussian splatting for occupancy modeling to substantially reduce computational overhead, the generation of high-quality 3D Gaussians relies heavily on accurate geometric cues, which are often insufficient in purely vision-centric paradigms. To bridge this gap, we advocate for injecting the strong geometric grounding capability from Vision Foundation Models (VFMs) into occupancy prediction. In this regard, we introduce Visual Geometry Grounded Gaussian Splatting (VG3S), a novel framework that empowers Gaussian-based occupancy prediction with cross-view 3D geometric grounding. Specifically, to fully exploit the rich 3D geometric priors from a frozen VFM, we propose a plug-and-play hierarchical geometric feature adapter, which can effectively transform generic VFM tokens via feature aggregation, task-specific alignment, and multi-scale restructuring. Extensive experiments on the nuScenes occupancy benchmark demonstrate that VG3S achieves remarkable improvements of 12.6% in IoU and 7.5% in mIoU over the baseline. Furthermore, we show that VG3S generalizes seamlessly across diverse VFMs, consistently enhancing occupancy prediction accuracy and firmly underscoring the immense value of integrating priors derived from powerful, pre-trained geometry-grounded VFMs.", "summary_ja": "カメラ画像のみから 3D semantic occupancy を予測するタスクを扱う論文。3D Gaussian splatting を occupancy 表現に使うと計算コストを抑えられる一方、良質な Gaussian を作るには幾何的な手がかりが必要で、vision-centric な設定ではそれが不足する点を課題としている。そこで凍結した Vision Foundation Model (VFM) が持つ 3D 幾何の事前知識を occupancy 予測側に取り込む VG3S を提案する。nuScenes の occupancy ベンチマークで baseline に対し IoU +12.6%、mIoU +7.5% の改善を報告している。", "novelty_ja": "VFM のトークンを特徴集約・タスク固有のアライメント・マルチスケール再構成の三段で変換する階層的な geometric feature adapter を plug-and-play で挿入し、cross-view の幾何 grounding を Gaussian ベース occupancy に持ち込む点が従来と異なる。特定の VFM に依存せず、複数の VFM で一貫して精度が向上することも示している。", "why_read_ja": "Gaussian splatting による効率的な occupancy 表現と、汎用 vision foundation model の幾何事前知識をどう接続するかという、近年の環境認識研究の主要な合流点を具体的に示している。adapter が plug-and-play で複数 VFM に効くという報告は、既存の occupancy パイプラインへの転用可能性を考えるうえで参考になる。", "paper_url": "https://arxiv.org/abs/2603.06210", "code_url": "", "published": "2026-03-06T12:26:47Z", "relevance": 29.5}, {"key": "arxiv:2603.03765", "title": "LiDAR Prompted Spatio-Temporal Multi-View Stereo for Autonomous Driving", "venue": "arXiv 2026", "year": 2026, "topic": "Reconstruction", "topics": ["AD Perception", "Reconstruction"], "abstract": "Accurate metric depth is critical for autonomous driving perception and simulation, yet current approaches struggle to achieve high metric accuracy, multi-view and temporal consistency, and cross-domain generalization. To address these challenges, we present DriveMVS, a novel multi-view stereo framework that reconciles these competing objectives through two key insights: (1) Sparse but metrically accurate LiDAR observations can serve as geometric prompts to anchor depth estimation in absolute scale, and (2) deep fusion of diverse cues is essential for resolving ambiguities and enhancing robustness, while a spatio-temporal decoder ensures consistency across frames. Built upon these principles, DriveMVS embeds the LiDAR prompt in two ways: as a hard geometric prior that anchors the cost volume, and as soft feature-wise guidance fused by a triple-cue combiner. Regarding temporal consistency, DriveMVS employs a spatio-temporal decoder that jointly leverages geometric cues from the MVS cost volume and temporal context from neighboring frames. Experiments show that DriveMVS achieves state-of-the-art performance on multiple benchmarks, excelling in metric accuracy, temporal stability, and zero-shot cross-domain transfer, demonstrating its practical value for scalable, reliable autonomous driving systems.", "summary_ja": "自動運転で高精度なメートル単位の深度を得るための多視点ステレオ手法DriveMVSを提案。疎なLiDAR点をコスト volumeへのハードな幾何プライアと、特徴融合によるソフトなガイダンスの両方として活用し、空間・時間方向の一貫性を持つ深度推定を実現する。空間・時間デコーダにより隣接フレーム間の整合性も確保している。", "novelty_ja": "LiDARを単純な補助入力としてではなく、コスト volume上の絶対スケール固定と特徴レベルの融合という二重の形で組み込む点、および複数手がかりを統合するtriple-cue combinerと時空間デコーダを組み合わせている点が従来のMVS手法と異なる。", "why_read_ja": "占有予測やシーン再構成の入力として使われるメトリック深度の精度・時間的一貫性・領域汎化を同時に扱っており、認識・地図生成パイプラインの前段技術として動向を追う価値がある。", "paper_url": "https://arxiv.org/abs/2603.03765", "code_url": "", "published": "2026-03-04T06:22:01Z", "relevance": 10.5}, {"key": "arxiv:2603.03452", "title": "Impact of Localization Errors on Label Quality for Online HD Map Construction", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map"], "abstract": "High-definition (HD) maps are crucial for autonomous vehicles, but their creation and maintenance is very costly. This motivates the idea of online HD map construction. To provide a continuous large-scale stream of training data, existing HD maps can be used as labels for onboard sensor data from consumer vehicle fleets. However, compared to current, well curated HD map perception datasets, this fleet data suffers from localization errors, resulting in distorted map labels. We introduce three kinds of localization errors, Ramp, Gaussian, and Perlin noise, to examine their influence on generated map labels. We train a variant of MapTRv2, a state-of-the-art online HD map construction model, on the Argoverse 2 dataset with various levels of localization errors and assess the degradation of model performance. Since localization errors affect distant labels more severely, but are also less significant to driving performance, we introduce a distance-based map construction metric. Our experiments reveal that localization noise affects the model performance significantly. We demonstrate that errors in heading angle exert a more substantial influence than position errors, as angle errors result in a greater distortion of labels as distance to the vehicle increases. Furthermore, we can demonstrate that the model benefits from non-distorted ground truth (GT) data and that the performance decreases more than linearly with the increase in noisy data. Our study additionally provides a qualitative evaluation of the extent to which localization errors influence the construction of HD maps.", "summary_ja": "実運用車両のセンサデータをオンラインHDマップ構築の教師データとして使う際、GPS等の自車位置推定誤差がマップラベルを歪める問題を扱う。Ramp・Gaussian・Perlinの3種の位置誤差を人工的に付与し、Argoverse 2上でMapTRv2を学習して性能劣化を定量評価している。遠方ラベルほど誤差の影響が大きい一方、走行への寄与は小さい点を踏まえ、距離に応じた評価指標も提案する。", "novelty_ja": "位置誤差の大きさだけでなく方位角誤差の影響を分離して評価し、角度誤差が距離とともに誤差を増幅させ位置誤差より深刻であることを示した点、ノイズ量に対する性能劣化が線形以上であることを実験的に明らかにした点が新規性。", "why_read_ja": "実車フリートデータを使ったオンラインHDマップ学習のスケール化には局所化精度が本質的制約になることを示しており、データ収集・アノテーション設計の指針として参考になる。", "paper_url": "https://arxiv.org/abs/2603.03452", "code_url": "", "published": "2026-03-03T19:08:14Z", "relevance": 13.5}, {"key": "arxiv:2603.02609", "title": "VLMFusionOcc3D: VLM Assisted Multi-Modal 3D Semantic Occupancy Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "Open-world", "AD Perception"], "abstract": "This paper introduces VLMFusionOcc3D, a robust multimodal framework for dense 3D semantic occupancy prediction in autonomous driving. Current voxel-based occupancy models often struggle with semantic ambiguity in sparse geometric grids and performance degradation under adverse weather conditions. To address these challenges, we leverage the rich linguistic priors of Vision-Language Models (VLMs) to anchor ambiguous voxel features to stable semantic concepts. Our framework initiates with a dual-branch feature extraction pipeline that projects multi-view images and LiDAR point clouds into a unified voxel space. We propose Instance-driven VLM Attention (InstVLM), which utilizes gated cross-attention and LoRA-adapted CLIP embeddings to inject high-level semantic and geographic priors directly into the 3D voxels. Furthermore, we introduce Weather-Aware Adaptive Fusion (WeathFusion), a dynamic gating mechanism that utilizes vehicle metadata and weather-conditioned prompts to re-weight sensor contributions based on real-time environmental reliability. To ensure structural consistency, a Depth-Aware Geometric Alignment (DAGA) loss is employed to align dense camera-derived geometry with sparse, spatially accurate LiDAR returns. Extensive experiments on the nuScenes and SemanticKITTI datasets demonstrate that our plug-and-play modules consistently enhance the performance of state-of-the-art voxel-based baselines. Notably, our approach achieves significant improvements in challenging weather scenarios, offering a scalable and robust solution for complex urban navigation.", "summary_ja": "カメラとLiDARを統合した3D semantic occupancy predictionにおいて、voxel特徴の意味的曖昧さと悪天候下での性能劣化を課題として扱った論文。多視点画像と点群を共通のvoxel空間に投影する二分岐パイプラインを土台に、VLM由来の言語事前知識をvoxelへ注入するInstVLM(gated cross-attentionとLoRA適応したCLIP埋め込み)を提案する。さらに、車両メタデータと天候条件のプロンプトからセンサ寄与を動的に再重み付けするWeathFusion、カメラ由来の密な幾何とLiDARの疎で正確な点を整合させるDAGA lossを導入する。nuScenesとSemanticKITTIで既存のvoxelベース手法に対する上乗せ効果を検証している。", "novelty_ja": "従来の幾何・特徴融合中心のoccupancy手法に対し、CLIP由来の言語事前知識をvoxelレベルに直接注入し、さらに天候条件に応じてセンサ融合の重みを動的に切り替える点が異なる。既存のvoxelベース手法に後付けできるplug-and-playモジュールとして設計されている点も特徴。", "why_read_ja": "occupancy predictionにVLMの意味事前知識を持ち込む流れと、悪天候などセンサ信頼度が変動する状況でのマルチモーダル融合設計の両方を押さえられる。環境認識のロバスト性向上の設計指針として参考になる。", "paper_url": "https://arxiv.org/abs/2603.02609", "code_url": "", "published": "2026-03-03T05:22:28Z", "relevance": 26.0}, {"key": "arxiv:2603.01007", "title": "Dr.Occ: Depth- and Region-Guided 3D Occupancy from Surround-View Cameras for Autonomous Driving", "venue": "CVPR 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "AD Perception", "Scene Understanding", "3D Detection", "Reconstruction"], "abstract": "3D semantic occupancy prediction is crucial for autonomous driving perception, offering comprehensive geometric scene understanding and semantic recognition. However, existing methods struggle with geometric misalignment in view transformation due to the lack of pixel-level accurate depth estimation, and severe spatial class imbalance where semantic categories exhibit strong spatial anisotropy. To address these challenges, we propose Dr. Occ, a depth- and region-guided occupancy prediction framework. Specifically, we introduce a depth-guided 2D-to-3D View Transformer (D$^2$-VFormer) that effectively leverages high-quality dense depth cues from MoGe-2 to construct reliable geometric priors, thereby enabling precise geometric alignment of voxel features. Moreover, inspired by the Mixture-of-Experts (MoE) framework, we propose a region-guided Expert Transformer (R/R$^2$-EFormer) that adaptively allocates region-specific experts to focus on different spatial regions, effectively addressing spatial semantic variations. Thus, the two components make complementary contributions: depth guidance ensures geometric alignment, while region experts enhance semantic learning. Experiments on the Occ3D--nuScenes benchmark demonstrate that Dr. Occ improves the strong baseline BEVDet4D by 7.43% mIoU and 3.09% IoU under the full vision-only setting.", "summary_ja": "サラウンドビューカメラ画像から3D semantic occupancy を予測する手法の提案。カメラのみの手法では、ピクセル単位で正確な深度が得られないために2D→3Dの view transformation で幾何的なズレが生じること、さらにセマンティッククラスが空間的に偏って分布する(spatial class imbalance / anisotropy)ことが課題だと整理している。これに対し、深度手がかりで幾何を揃える view transformer と、空間領域ごとに専門家を割り当てる Mixture-of-Experts 型の transformer を組み合わせた Dr. Occ を提案する。Occ3D-nuScenes 上でベースラインの BEVDet4D に対し mIoU +7.43%、IoU +3.09% の改善を報告している。", "novelty_ja": "MoGe-2 による高品質な dense depth を幾何プライアとして使う D²-VFormer で voxel 特徴の位置合わせ精度を高める点と、MoE に着想を得て空間領域ごとに expert を切り替える R/R²-EFormer でクラスの空間的偏りに対処する点を組み合わせたことが従来手法との違い。幾何アラインメントとセマンティック学習をそれぞれ別モジュールで補完的に扱う設計になっている。", "why_read_ja": "カメラのみの occupancy 予測において依然としてボトルネックである深度精度の問題に、外部の汎用深度モデル(MoGe-2)を持ち込むという最近の潮流を示す例として参考になる。また、occupancy タスク特有の空間的クラス不均衡を条件付き計算(MoE)で扱うアプローチは、BEV/voxel 系の環境認識モデル設計全般に転用しうる視点を与える。", "paper_url": "https://arxiv.org/abs/2603.01007", "code_url": "", "published": "2026-03-01T09:22:15Z", "relevance": 26.5}, {"key": "arxiv:2602.23894", "title": "SelfOccFlow: Towards end-to-end self-supervised 3D Occupancy Flow prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy Forecasting", "topics": ["Occupancy Forecasting", "3D Detection", "AD Perception", "Occupancy"], "abstract": "Estimating 3D occupancy and motion at the vehicle's surroundings is essential for autonomous driving, enabling situational awareness in dynamic environments. Existing approaches jointly learn geometry and motion but rely on expensive 3D occupancy and flow annotations, velocity labels from bounding boxes, or pretrained optical flow models. We propose a self-supervised method for 3D occupancy flow estimation that eliminates the need for human-produced annotations or external flow supervision. Our method disentangles the scene into separate static and dynamic signed distance fields and learns motion implicitly through temporal aggregation. Additionally, we introduce a strong self-supervised flow cue derived from features' cosine similarities. We demonstrate the efficacy of our 3D occupancy flow method on SemanticKITTI, KITTI-MOT, and nuScenes.", "summary_ja": "自動運転における3D occupancyとその動きの推定には従来occupancy/flowの人手アノテーションやbounding boxからの速度ラベル、事前学習済みoptical flowモデルが必要だった。本研究はこれらの外部教師を一切使わない自己教師あり手法を提案する。シーンを静的・動的なsigned distance fieldに分離し、時間方向の特徴集約により動きを暗黙的に学習する。加えて特徴のcosine類似度から得られる自己教師ありのflow手がかりを導入する。", "novelty_ja": "occupancy/flowアノテーション・速度ラベル・外部flowモデルのいずれにも依存せず、静的/動的SDFの分離と特徴類似度ベースのflow手がかりのみでend-to-endに学習する点が従来手法との違い。", "why_read_ja": "occupancy forecasting研究はアノテーションコストの高さが導入のボトルネックであり、完全自己教師あり化のアプローチは今後のスケーラブルな環境認識の方向性を示す好例。", "paper_url": "https://arxiv.org/abs/2602.23894", "code_url": "", "published": "2026-02-27T10:42:01Z", "relevance": 14.0}, {"key": "arxiv:2602.10660", "title": "AurigaNet: A Real-Time Multi-Task Network for Enhanced Urban Driving Perception", "venue": "arXiv 2026", "year": 2026, "topic": "AD Perception", "topics": ["AD Perception", "Topology", "Scene Understanding"], "abstract": "Self-driving cars hold significant potential to reduce traffic accidents, alleviate congestion, and enhance urban mobility. However, developing reliable AI systems for autonomous vehicles remains a substantial challenge. Over the past decade, multi-task learning has emerged as a powerful approach to address complex problems in driving perception. Multi-task networks offer several advantages, including increased computational efficiency, real-time processing capabilities, optimized resource utilization, and improved generalization. In this study, we present AurigaNet, an advanced multi-task network architecture designed to push the boundaries of autonomous driving perception. AurigaNet integrates three critical tasks: object detection, lane detection, and drivable area instance segmentation. The system is trained and evaluated using the BDD100K dataset, renowned for its diversity in driving conditions. Key innovations of AurigaNet include its end-to-end instance segmentation capability, which significantly enhances both accuracy and efficiency in path estimation for autonomous vehicles. Experimental results demonstrate that AurigaNet achieves an 85.2% IoU in drivable area segmentation, outperforming its closest competitor by 0.7%. In lane detection, AurigaNet achieves a remarkable 60.8% IoU, surpassing other models by more than 30%. Furthermore, the network achieves an mAP@0.5:0.95 of 47.6% in traffic object detection, exceeding the next leading model by 2.9%. Additionally, we validate the practical feasibility of AurigaNet by deploying it on embedded devices such as the Jetson Orin NX, where it demonstrates competitive real-time performance. These results underscore AurigaNet's potential as a robust and efficient solution for autonomous driving perception systems. The code can be found here https://github.com/KiaRational/AurigaNet.", "summary_ja": "本論文は自動運転向けのリアルタイムマルチタスク認識ネットワークAurigaNetを提案する。物体検出・車線検出・走行可能領域のインスタンスセグメンテーションを単一ネットワークで統合し、BDD100Kで学習・評価している。単一モデルで複数タスクを処理することで計算効率とリアルタイム性を両立させることを狙っている。", "novelty_ja": "走行可能領域検出をend-to-endのインスタンスセグメンテーションとして扱う点が既存のマルチタスク認識モデルとの違いであり、経路推定の精度と効率を同時に高めている。", "why_read_ja": "マルチタスク学習による認識の効率化とエッジデバイス(Jetson Orin NX)での実時間動作の両立事例として、車載認識システムの実用化動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2602.10660", "code_url": "https://github.com/KiaRational/AurigaNet", "published": "2026-02-11T09:04:29Z", "relevance": 11.5}, {"key": "arxiv:2602.06400", "title": "TFusionOcc: T-Primitive Based Object-Centric Multi-Sensor Fusion Framework for 3D Occupancy Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "The prediction of 3D semantic occupancy enables autonomous vehicles (AVs) to perceive the fine-grained geometric and semantic scene structure for safe navigation and decision-making. Existing methods mainly rely on either voxel-based representations, which incur redundant computation over empty regions, or on object-centric Gaussian primitives, which are limited in modeling complex, non-convex, and asymmetric structures. In this paper, we present TFusionOcc, a T-primitive-based object-centric multi-sensor fusion framework for 3D semantic occupancy prediction. Specifically, we introduce a family of Students t-distribution-based T-primitives, including the plain T-primitive, T-Superquadric, and deformable T-Superquadric with inverse warping, where the deformable T-Superquadric serves as the key geometry-enhancing primitive. We further develop a unified probabilistic formulation based on the Students t-distribution and the T-mixture model (TMM) to jointly model occupancy and semantics, and design a tightly coupled multi-stage fusion architecture to effectively integrate camera and LiDAR cues. Extensive experiments on nuScenes show state-of-the-art performance, while additional evaluations on nuScenes-C demonstrate strong robustness under most corruption scenarios. The code will be available at: https://github.com/DanielMing123/TFusionOcc", "summary_ja": "カメラとLiDARを融合して3D semantic occupancyを予測する手法TFusionOccを提案。ボクセル表現の空領域計算冗長性と既存のobject-centric Gaussian primitiveの表現力不足という2つの課題を、Studentのt分布に基づく新しいT-primitive（変形可能なT-Superquadricを含む）で解決する。occupancyとsemanticsを統一的に扱うT-mixture modelと、多段階のカメラ・LiDAR融合アーキテクチャを設計している。", "novelty_ja": "従来のvoxelベースやGaussian primitiveベースの表現に代えて、非凸・非対称な形状も表現できるStudent t分布ベースのT-Superquadric（変形・逆ワーピング付き)を導入し、occupancyとsemanticsを単一の確率モデルで扱う点が新しい。", "why_read_ja": "object-centricなprimitive表現によるoccupancy予測は近年のBEV/occupancy研究の主要な方向性の一つであり、nuScenes-Cでの頑健性評価も含め、マルチセンサ融合設計の参考になる。", "paper_url": "https://arxiv.org/abs/2602.06400", "code_url": "https://github.com/DanielMing123/TFusionOcc", "published": "2026-02-06T05:43:42Z", "relevance": 20.0}, {"key": "arxiv:2601.22729", "title": "GaussianOcc3D: A Gaussian-Based Adaptive Multi-modal 3D Occupancy Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "AD Perception", "Scene Understanding", "HD Map"], "abstract": "3D semantic occupancy prediction is a pivotal task in autonomous driving, providing a dense and fine-grained understanding of the surrounding environment, yet single-modality methods face trade-offs between camera semantics and LiDAR geometry. Existing multi-modal frameworks often struggle with modality heterogeneity, spatial misalignment, and the representation crisis--where voxels are computationally heavy and BEV alternatives are lossy. We present GaussianOcc3D, a multi-modal framework bridging camera and LiDAR through a memory-efficient, continuous 3D Gaussian representation. We introduce four modules: (1) LiDAR Depth Feature Aggregation (LDFA), using depth-wise deformable sampling to lift sparse signals onto Gaussian primitives; (2) Entropy-Based Feature Smoothing (EBFS) to mitigate domain noise; (3) Adaptive Camera-LiDAR Fusion (ACLF) with uncertainty-aware reweighting for sensor reliability; and (4) a Gauss-Mamba Head leveraging Selective State Space Models for global context with linear complexity. Evaluations on Occ3D, SurroundOcc, and SemanticKITTI benchmarks demonstrate state-of-the-art performance, achieving mIoU scores of 49.4%, 28.9%, and 25.2% respectively. GaussianOcc3D exhibits superior robustness across challenging rainy and nighttime conditions.", "summary_ja": "自動運転の3D semantic occupancy predictionにおいて、カメラの意味情報とLiDARの幾何情報を単一モダリティで両立できない問題と、voxel表現の計算コスト・BEV表現の情報損失という表現上のジレンマを扱っている。著者らはシーンを連続的な3D Gaussianのプリミティブで表現し、そこにカメラとLiDARの特徴を統合するマルチモーダル枠組みGaussianOcc3Dを提案する。疎なLiDAR信号をdepth-wise deformable samplingでGaussianに載せるLDFA、ドメインノイズを抑えるEBFS、センサ信頼度に応じてuncertainty-awareに重み付けするACLF、そしてSelective State Space Modelで線形計算量の大域文脈を得るGauss-Mamba Headの4モジュールから構成される。Occ3D・SurroundOcc・SemanticKITTIでmIoU 49.4%/28.9%/25.2%を報告し、雨天・夜間条件での頑健性も示している。", "novelty_ja": "voxelでもBEVでもなく連続的な3D Gaussian表現をマルチモーダル融合の共通基盤として用い、モダリティ間の空間的ズレと信頼度差をdeformable samplingと不確実性に基づく再重み付けで吸収している点が従来のocc予測手法と異なる。加えて、occupancy headにMamba系のselective SSMを導入し、線形計算量で大域文脈を扱う構成をとっている。", "why_read_ja": "3D Gaussianを認識タスク側の中間表現として使う流れと、camera-LiDAR融合occupancyの設計指針が同時に見える論文であり、環境認識のための3D表現選択の動向を追ううえで参考になる。悪天候・夜間を含む条件での評価が報告されている点も、実運用に近い頑健性の議論として押さえておく価値がある。", "paper_url": "https://arxiv.org/abs/2601.22729", "code_url": "", "published": "2026-01-30T09:05:30Z", "relevance": 27.0}, {"key": "arxiv:2601.22376", "title": "FlexMap: Robust HD Map Construction under Flexible Camera Configurations", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection", "Open-world"], "abstract": "High-definition (HD) maps provide essential semantic information about road structures for autonomous driving, but existing HD map construction methods typically require calibrated multi-camera rigs and explicit 2D-to-BEV transformations. Such pipelines degrade when camera views are missing or pose estimates are inaccurate, limiting their use across heterogeneous fleet configurations. We introduce FlexMap, a vectorized HD mapping framework that adapts to varying camera configurations without architectural changes or per-configuration retraining and does not require camera parameters as model input. FlexMap replaces explicit geometric projection with a geometry foundation model that encodes cross-view 3D structure. A spatial-temporal enhancement module then separates cross-view spatial reasoning from temporal aggregation, while a camera-aware decoder uses the token produced for each input view to adapt its attention without camera poses. Experiments on nuScenes and Argoverse 2 show that FlexMap outperforms pose-dependent baselines using estimated poses and maintains comparable accuracy across all evaluated camera configurations, including those with missing views.", "summary_ja": "既存のHD Map構築手法はキャリブレーション済みマルチカメラと明示的な2D-to-BEV変換を前提とするため、カメラ視点の欠落や姿勢推定誤差に弱く、車両ごとに異なるカメラ構成のフリートに展開しづらい。FlexMapは、カメラパラメータをモデル入力とせず、幾何学的投影の代わりにcross-view 3D構造を捉えるgeometry foundation modelを用いてこの制約を取り除くベクトル化HD Mapフレームワークを提案する。空間推論と時間集約を分離するspatial-temporal enhancementモジュールと、各視点のトークンから姿勢情報なしに注意を適応させるcamera-aware decoderを組み合わせる。", "novelty_ja": "カメラ姿勢や台数構成に依存する既存手法と異なり、幾何学基盤モデルとcamera-awareなトークン処理によって、アーキテクチャ変更や再学習なしに多様なカメラ構成・視点欠落に対応できる点が新しい。", "why_read_ja": "異種センサー構成のフリート展開という実運用上の課題に正面から取り組んでおり、HD Map生成のロバスト性・汎用性を高める方向性として注目に値する。", "paper_url": "https://arxiv.org/abs/2601.22376", "code_url": "", "published": "2026-01-29T22:41:11Z", "relevance": 18.5}, {"key": "arxiv:2601.14448", "title": "Gaussian Based Adaptive Multi-Modal 3D Semantic Occupancy Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "AD Perception"], "abstract": "The sparse object detection paradigm shift towards dense 3D semantic occupancy prediction is necessary for dealing with long-tail safety challenges for autonomous vehicles. Nonetheless, the current voxelization methods commonly suffer from excessive computation complexity demands, where the fusion process is brittle, static, and breaks down under dynamic environmental settings. To this end, this research work enhances a novel Gaussian-based adaptive camera-LiDAR multimodal 3D occupancy prediction model that seamlessly bridges the semantic strengths of camera modality with the geometric strengths of LiDAR modality through a memory-efficient 3D Gaussian model. The proposed solution has four key components: (1) LiDAR Depth Feature Aggregation (LDFA), where depth-wise deformable sampling is employed for dealing with geometric sparsity, (2) Entropy-Based Feature Smoothing, where cross-entropy is employed for handling domain-specific noise, (3) Adaptive Camera-LiDAR Fusion, where dynamic recalibration of sensor outputs is performed based on model outputs, and (4) Gauss-Mamba Head that uses Selective State Space Models for global context decoding that enjoys linear computation complexity.", "summary_ja": "自動運転における3Dセマンティックオキュパンシー予測を、カメラとLiDARのマルチモーダル入力から軽量なGaussianベース表現で行う手法を提案している。既存のvoxel化手法が計算コスト過大かつ動的環境下での融合が脆弱である点を課題とし、深度特徴集約・エントロピーによるノイズ平滑化・適応的なセンサ融合・Mamba型ヘッドによる文脈デコードの4要素で解決する。", "novelty_ja": "静的な融合に依存する従来のvoxelベース手法と異なり、3D Gaussian表現とモデル出力に基づく動的なカメラ-LiDAR再較正、線形計算量のSelective State Space Model(Gauss-Mamba)ヘッドを組み合わせている。", "why_read_ja": "occupancy予測におけるマルチモーダル融合の効率化と動的環境への頑健性という、地図生成・環境認識分野の実用上の課題に対する具体的アプローチを示している。", "paper_url": "https://arxiv.org/abs/2601.14448", "code_url": "", "published": "2026-01-20T20:11:09Z", "relevance": 20.5}, {"key": "arxiv:2601.11396", "title": "SUG-Occ: Explicit Semantics and Uncertainty Guided Sparse Learning for Efficient 3D Occupancy Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "3D semantic occupancy prediction has emerged as a critical perception task for autonomous driving due to its ability to offer voxel-level semantic and geometric understanding of the environment. However, such a refined representation for large-scale scenes incurs prohibitive computation, posing a significant challenge to practical real-time deployment. To address this, we propose SUGOcc, an explicit semantics and uncertainty guided sparse learning framework for efficient occupancy prediction, which exploits the inherent sparsity of 3D scenes to reduce redundant computation while maintaining geometric and semantic integrity. Specifically, we first utilize semantic and uncertainty priors to suppress image projections from free space while employing explicit unsigned distance encoding to enhance geometric consistency, thereby producing a structurally sparse representation. Secondly, we introduce a cascade sparse completion module to enable efficient coarse-to-fine reasoning over the sparse representation via hyper cross sparse convolution, generative upsampling and adaptive pruning. Finally, we propose an object contextual representation (OCR) based mask decoder that refines the voxel-wise predictions through lightweight query-context interactions, thereby avoiding expensive attention operations over volumetric features. Extensive experiments on SemanticKITTI and Occ3D-Nuscenes benchmark demonstrate that the proposed approach outperforms the baselines, achieving notable improvements in both accuracy and efficiency across datasets.", "summary_ja": "voxel単位で意味と幾何を表す3D semantic occupancy predictionは自動運転の認識に有用な一方、大規模シーンでは計算量が膨大でリアルタイム実装が難しい。本論文は、シーンが本質的に疎であることを利用し、semantic priorとuncertainty priorでfree spaceからの画像特徴投影を抑えつつ、unsigned distanceの明示的エンコードで幾何的整合性を保った疎な表現を構築する。その上で、hyper cross sparse convolution・generative upsampling・adaptive pruningを組み合わせたcascade sparse completionモジュールでcoarse-to-fineに補完し、最後にOCRベースのmask decoderで軽量なquery-context相互作用によりvoxel予測を精緻化する。SemanticKITTIとOcc3D-nuScenesで精度と効率の双方の改善を報告している。", "novelty_ja": "密なvolumetric特徴に対する高コストなattentionに頼らず、semanticとuncertaintyという明示的なpriorで疎化の対象を決めたうえで、cascade型のsparse completionとOCRベースのmask decoderを組み合わせた点が従来の疎化手法と異なる。", "why_read_ja": "occupancy predictionの実用化で最大の障壁である計算コストに対し、疎性の使い方を priorベースで設計する具体例として参考になる。BEV/occupancy系の効率化アーキテクチャの動向を追ううえで押さえておきたい一本。", "paper_url": "https://arxiv.org/abs/2601.11396", "code_url": "", "published": "2026-01-16T16:07:38Z", "relevance": 24.0}, {"key": "arxiv:2601.10512", "title": "SatMap: Revisiting Satellite Maps as Prior for Online HD Map Construction", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "Online high-definition (HD) map construction is an essential part of a safe and robust end-to-end autonomous driving (AD) pipeline. Onboard camera-based approaches suffer from limited depth perception and degraded accuracy due to occlusion. In this work, we propose SatMap, an online vectorized HD map estimation method that integrates satellite maps with multi-view camera observations and directly predicts a vectorized HD map for downstream prediction and planning modules. Our method leverages lane-level semantics and texture from satellite imagery captured from a Bird's Eye View (BEV) perspective as a global prior, effectively mitigating depth ambiguity and occlusion. In our experiments on the nuScenes dataset, SatMap achieves 34.8% mAP performance improvement over the camera-only baseline and 8.5% mAP improvement over the camera-LiDAR fusion baseline. Moreover, we evaluate our model in long-range and adverse weather conditions to demonstrate the advantages of using a satellite prior map. Source code will be available at https://iv.ee.hm.edu/satmap/.", "summary_ja": "オンボードカメラのみでは深度推定が曖昇で遮蔽の影響も受けやすく、オンラインHDマップ推定の精度が低下する。SatMapは事前に取得した衛星画像（BEV視点のレーン級のセマンティクスとテクスチャ）をグローバルプライアとして多視点カメラ観測と統合し、ベクトル化HDマップを直接予測する手法を提案する。", "novelty_ja": "カメラ単体やカメラ・LiDAR融合とは異なり、地上走行時には利用できない広域一貫性を持つ衛星マップを外部プライアとして導入し、深度曖昧性と遮蔽問題を緩和する点が従来手法との違い。", "why_read_ja": "地図生成におけるオンボードセンサ以外の情報源（衛星画像）の活用例として、長距離・悪天候時のロバスト性向上のアプローチを把握するうえで参考になる。", "paper_url": "https://arxiv.org/abs/2601.10512", "code_url": "", "published": "2026-01-15T15:39:27Z", "relevance": 21.5}, {"key": "arxiv:2601.02102", "title": "360-GeoGS: Geometrically Consistent Feed-Forward 3D Gaussian Splatting Reconstruction for 360 Images", "venue": "arXiv 2026", "year": 2026, "topic": "Gaussian Splatting", "topics": ["Gaussian Splatting", "Reconstruction", "3D Detection
