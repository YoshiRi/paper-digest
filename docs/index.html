"], "abstract": "3D scene reconstruction is fundamental for spatial intelligence applications such as AR, robotics, and digital twins. Traditional multi-view stereo struggles with sparse viewpoints or low-texture regions, while neural rendering approaches, though capable of producing high-quality results, require per-scene optimization and lack real-time efficiency. Explicit 3D Gaussian Splatting (3DGS) enables efficient rendering, but most feed-forward variants focus on visual quality rather than geometric consistency, limiting accurate surface reconstruction and overall reliability in spatial perception tasks. This paper presents a novel feed-forward 3DGS framework for 360 images, capable of generating geometrically consistent Gaussian primitives while maintaining high rendering quality. A Depth-Normal geometric regularization is introduced to couple rendered depth gradients with normal information, supervising Gaussian rotation, scale, and position to improve point cloud and surface accuracy. Experimental results show that the proposed method maintains high rendering quality while significantly improving geometric consistency, providing an effective solution for 3D reconstruction in spatial perception tasks.", "summary_ja": "360度画像から幾何的に一貫した3D Gaussian Splattingをfeed-forward方式で生成する手法を提案。従来のfeed-forward 3DGSは見た目の品質を重視し幾何的整合性が犠牲になっていた課題に対し、Depth-Normal幾何正則化によりレンダリング深度勾配と法線情報を結びつけ、Gaussianの回転・スケール・位置を教師信号として補正する。これにより点雲・表面再構成の精度向上を図る。", "novelty_ja": "レンダリング品質重視だった既存のfeed-forward 3DGSに対し、深度勾配と法線を連動させるDepth-Normal正則化でGaussianパラメータを直接教師付けし、幾何的一貫性を明示的に強化した点が新規性。", "why_read_ja": "feed-forward型3DGSの幾何精度向上手法は、大規模屋外シーンの高速3D/4D再構成やマップ生成への応用可能性があり、地図生成・環境認識の技術動向として参考になる。", "paper_url": "https://arxiv.org/abs/2601.02102", "code_url": "", "published": "2026-01-05T13:28:28Z", "relevance": 18.5}, {"key": "arxiv:2601.01528", "title": "DrivingGen: A Comprehensive Benchmark for Generative Video World Models in Autonomous Driving", "venue": "ICLR 2026", "year": 2026, "topic": "World Model", "topics": ["World Model", "AD Perception"], "abstract": "Video generation models, as one form of world models, have emerged as one of the most exciting frontiers in AI, promising agents the ability to imagine the future by modeling the temporal evolution of complex scenes. In autonomous driving, this vision gives rise to driving world models: generative simulators that imagine ego and agent futures, enabling scalable simulation, safe testing of corner cases, and rich synthetic data generation. Yet, despite fast-growing research activity, the field lacks a rigorous benchmark to measure progress and guide priorities. Existing evaluations remain limited: generic video metrics overlook safety-critical imaging factors; trajectory plausibility is rarely quantified; temporal and agent-level consistency is neglected; and controllability with respect to ego conditioning is ignored. Moreover, current datasets fail to cover the diversity of conditions required for real-world deployment. To address these gaps, we present DrivingGen, the first comprehensive benchmark for generative driving world models. DrivingGen combines a diverse evaluation dataset curated from both driving datasets and internet-scale video sources, spanning varied weather, time of day, geographic regions, and complex maneuvers, with a suite of new metrics that jointly assess visual realism, trajectory plausibility, temporal coherence, and controllability. Benchmarking 14 state-of-the-art models reveals clear trade-offs: general models look better but break physics, while driving-specific ones capture motion realistically but lag in visual quality. DrivingGen offers a unified evaluation framework to foster reliable, controllable, and deployable driving world models, enabling scalable simulation, planning, and data-driven decision-making.", "summary_ja": "自動運転向け動画生成world modelを評価する統一ベンチマークDrivingGenを提案。既存評価は視覚品質偏重で安全上重要な軌道妥当性・時間的一貫性・ego条件制御性を欠いており、多様な気象・地域・運転行動を含むデータセットと新指標群でこれらを同時評価する。14種のSOTAモデルを比較し、汎用モデルは見た目が良いが物理法則を破り、運転特化モデルは動きは自然だが視覚品質で劣るというトレードオフを明らかにした。", "novelty_ja": "汎用動画品質指標に加え、軌道妥当性・エージェント一貫性・ego条件への制御性を統合的に測る点、および多様な収集源からの評価データセットを新規構築した点が従来のベンチマークと異なる。", "why_read_ja": "driving world modelの評価軸が乱立する中で標準化されたベンチマークを提示しており、今後この分野の研究比較や進捗判断の基準として参照される可能性が高い。", "paper_url": "https://arxiv.org/abs/2601.01528", "code_url": "", "published": "2026-01-04T13:36:21Z", "relevance": 5.0}, {"key": "arxiv:2512.19150", "title": "AMap: Distilling Future Priors for Ahead-Aware Online HD Map Construction", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "Map Update", "AD Perception", "3D Detection"], "abstract": "Online High-Definition (HD) map construction is pivotal for autonomous driving. While recent approaches leverage historical temporal fusion to improve performance, we identify a critical safety flaw in this paradigm: it is inherently ``spatially backward-looking.\" These methods predominantly enhance map reconstruction in traversed areas, offering minimal improvement for the unseen road ahead. Crucially, our analysis of downstream planning tasks reveals a severe asymmetry: while rearward perception errors are often tolerable, inaccuracies in the forward region directly precipitate hazardous driving maneuvers. To bridge this safety gap, we propose AMap, a novel framework for Ahead-aware online HD Mapping. We pioneer a ``distill-from-future\" paradigm, where a teacher model with privileged access to future temporal contexts guides a lightweight student model restricted to the current frame. This process implicitly compresses prospective knowledge into the student model, endowing it with ``look-ahead\" capabilities at zero inference-time cost. Technically, we introduce a Multi-Level BEV Distillation strategy with spatial masking and an Asymmetric Query Adaptation module to effectively transfer future-aware representations to the student's static queries. Extensive experiments on the nuScenes and Argoverse 2 benchmark demonstrate that AMap significantly enhances current-frame perception. Most notably, it outperforms state-of-the-art temporal models in critical forward regions while maintaining the efficiency of single current frame inference.", "summary_ja": "オンラインHDマップ構築において、既存の時間的融合手法が「空間的に後ろ向き」であり、走行済み領域の精度は向上させるが未走行の前方領域の改善に乏しいという安全上の課題を指摘。前方領域の誤差は危険な運転挙動に直結するため、AMapは未来フレームにアクセスできる教師モデルから現在フレームのみを扱う軽量な生徒モデルへ知識蒸留する「distill-from-future」パラダイムを提案する。", "novelty_ja": "Multi-Level BEV Distillationによる空間マスキングとAsymmetric Query Adaptationモジュールにより、推論時コストをかけずに未来情報を静的クエリへ圧縮転写する点が従来の時間的融合手法と異なる。", "why_read_ja": "時間的融合の恩恵が前方領域に及ばないという盲点を指摘し、推論効率を保ったまま前方認識精度を上げる設計は、実運用でのHDマップ構築手法の評価軸を見直す上で参考になる。", "paper_url": "https://arxiv.org/abs/2512.19150", "code_url": "", "published": "2025-12-22T08:46:59Z", "relevance": 21.5}, {"key": "arxiv:2512.17620", "title": "StereoMV2D: A Sparse Temporal Stereo-Enhanced Framework for Robust Multi-View 3D Object Detection", "venue": "arXiv 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception"], "abstract": "Multi-view 3D object detection is a fundamental task in autonomous driving perception, where achieving a balance between detection accuracy and computational efficiency remains crucial. Sparse query-based 3D detectors efficiently aggregate object-relevant features from multi-view images through a set of learnable queries, offering a concise and end-to-end detection paradigm. Building on this foundation, MV2D leverages 2D detection results to provide high-quality object priors for query initialization, enabling higher precision and recall. However, the inherent depth ambiguity in single-frame 2D detections still limits the accuracy of 3D query generation. To address this issue, we propose StereoMV2D, a unified framework that integrates temporal stereo modeling into the 2D detection-guided multi-view 3D detector. By exploiting cross-temporal disparities of the same object across adjacent frames, StereoMV2D enhances depth perception and refines the query priors, while performing all computations efficiently within 2D regions of interest (RoIs). Furthermore, a dynamic confidence gating mechanism adaptively evaluates the reliability of temporal stereo cues through learning statistical patterns derived from the inter-frame matching matrix together with appearance consistency, ensuring robust detection under object appearance and occlusion. Extensive experiments on the nuScenes and Argoverse 2 datasets demonstrate that StereoMV2D achieves superior detection performance without incurring significant computational overhead. Code will be available at https://github.com/Uddd821/StereoMV2D.", "summary_ja": "MV2Dの2D検出結果を用いたクエリ初期化手法をベースに、単一フレームの2D検出では深度が曖昧になる問題を解決する。隣接フレーム間の時間的ステレオ視差を利用してクエリの深度精度を高める枠組みStereoMV2Dを提案する。2D RoI内で計算を行うことで効率を保ちつつ、動的信頼度ゲーティング機構でフレーム間マッチングと見た目の一致度から時間的ステレオ手がかりの信頼性を評価する。", "novelty_ja": "単一フレーム2D検出の深度曖昧性を、時間的ステレオ視差と動的信頼度ゲーティングにより2D RoI内で効率的に補正する点が従来のクエリベース検出器との違い。", "why_read_ja": "スパースクエリ型マルチビュー3D検出における深度推定精度と計算効率のトレードオフ改善の一事例として、AD Perception領域の手法動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2512.17620", "code_url": "https://github.com/Uddd821/StereoMV2D", "published": "2025-12-19T14:25:46Z", "relevance": 19.5}, {"key": "arxiv:2512.11319", "title": "SATMapTR: Satellite Image Enhanced Online HD Map Construction", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "High-definition (HD) maps are evolving from pre-annotated to real-time construction to better support autonomous driving in diverse scenarios. However, this process is hindered by low-quality input data caused by onboard sensors limited capability and frequent occlusions, leading to incomplete, noisy, or missing data, and thus reduced mapping accuracy and robustness. Recent efforts have introduced satellite images as auxiliary input, offering a stable, wide-area view to complement the limited ego perspective. However, satellite images in Bird's Eye View are often degraded by shadows and occlusions from vegetation and buildings. Prior methods using basic feature extraction and fusion remain ineffective. To address these challenges, we propose SATMapTR, a novel online map construction model that effectively fuses satellite image through two key components: (1) a gated feature refinement module that adaptively filters satellite image features by integrating high-level semantics with low-level structural cues to extract high signal-to-noise ratio map-relevant representations; and (2) a geometry-aware fusion module that consistently fuse satellite and BEV features at a grid-to-grid level, minimizing interference from irrelevant regions and low-quality inputs. Experimental results on the nuScenes dataset show that SATMapTR achieves the highest mean average precision (mAP) of 73.8, outperforming state-of-the-art satellite-enhanced models by up to 14.2 mAP. It also shows lower mAP degradation under adverse weather and sensor failures, and achieves nearly 3 times higher mAP at extended perception ranges.", "summary_ja": "オンボードセンサのみに依存するHDマップ構築は、遮蔽や視野限界により入力品質が低く精度が低下する問題がある。本論文は衛星画像を補助入力として活用し、ゲート付き特徴refinementモジュールで影・遮蔽ノイズを抑えつつ地図関連特徴を抽出し、geometry-aware fusionモジュールで衛星特徴とBEV特徴をグリッド単位で整合的に融合するSATMapTRを提案する。nuScenesで既存の衛星画像併用手法を大きく上回るmAPを達成した。", "novelty_ja": "従来の衛星画像併用手法が単純な特徴抽出・融合に留まっていたのに対し、低品質な衛星画像の雑音を適応的に除去するゲート機構と、grid-to-grid単位で位置整合を取るfusion機構を導入した点が新規性。", "why_read_ja": "車載視点のみでは遮蔽や範囲限界に弱いオンラインHDマップ構築を、広域かつ安定な衛星画像でどう補完・融合するかという、地図生成研究の重要な方向性を示す一例。", "paper_url": "https://arxiv.org/abs/2512.11319", "code_url": "", "published": "2025-12-12T06:37:20Z", "relevance": 17.5}, {"key": "arxiv:2512.03317", "title": "NavMapFusion: Diffusion-based Fusion of Navigation Maps for Online Vectorized HD Map Construction", "venue": "WACV 2026", "year": 2025, "topic": "Map Update", "topics": ["HD Map", "Map Update", "AD Perception", "3D Detection", "World Model"], "abstract": "Accurate environmental representations are essential for autonomous driving, providing the foundation for safe and efficient navigation. Traditionally, high-definition (HD) maps are providing this representation of the static road infrastructure to the autonomous system a priori. However, because the real world is constantly changing, such maps must be constructed online from on-board sensor data. Navigation-grade standard-definition (SD) maps are widely available, but their resolution is insufficient for direct deployment. Instead, they can be used as coarse prior to guide the online map construction process. We propose NavMapFusion, a diffusion-based framework that performs iterative denoising conditioned on high-fidelity sensor data and on low-fidelity navigation maps. This paper strives to answer: (1) How can coarse, potentially outdated navigation maps guide online map construction? (2) What advantages do diffusion models offer for map fusion? We demonstrate that diffusion-based map construction provides a robust framework for map fusion. Our key insight is that discrepancies between the prior map and online perception naturally correspond to noise within the diffusion process; consistent regions reinforce the map construction, whereas outdated segments are suppressed. On the nuScenes benchmark, NavMapFusion conditioned on coarse road lines from OpenStreetMap data reaches a 21.4% relative improvement on 100 m, and even stronger improvements on larger perception ranges, while maintaining real-time capabilities. By fusing low-fidelity priors with high-fidelity sensor data, the proposed method generates accurate and up-to-date environment representations, guiding towards safer and more reliable autonomous driving. The code is available at https://github.com/tmonnin/navmapfusion", "summary_ja": "オンラインでベクトル化HDマップを構築する際、車載センサからの高精度だが局所的な情報と、OpenStreetMapのような粗い/古いおそれのあるナビゲーション用SDマップを融合する課題を扱う。提案手法NavMapFusionは拡散モデルを用い、SDマップとセンサ由来の推定結果の食い違いをノイズとみなして段階的にデノイズすることで、両者を統合したマップ表現を生成する。", "novelty_ja": "SDマップとセンサ観測の不整合を拡散過程のノイズとして扱う点が新しく、整合する領域を強化し古くなった/誤った区間を抑制する仕組みをdiffusionのフレームワークに組み込んでいる。", "why_read_ja": "SDマップなどの低精度事前情報を高精度センサ情報と融合してオンラインHDマップ構築の精度・範囲を伸ばすアプローチであり、地図生成分野でのprior活用手法の動向として参考になる。", "paper_url": "https://arxiv.org/abs/2512.03317", "code_url": "https://github.com/tmonnin/navmapfusion", "published": "2025-12-03T00:10:47Z", "relevance": 20.5}, {"key": "arxiv:2511.19527", "title": "MapRF: Weakly Supervised Online HD Map Construction via NeRF-Guided Self-Training", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection", "Gaussian Splatting", "Reconstruction"], "abstract": "Autonomous driving systems benefit from high-definition (HD) maps that provide critical information about road infrastructure. The online construction of HD maps offers a scalable approach to generate local maps from on-board sensors. However, existing methods typically rely on costly 3D map annotations for training, which limits their generalization and scalability across diverse driving environments. In this work, we propose MapRF, a weakly supervised framework that learns to construct 3D maps using only 2D image labels. To generate high-quality pseudo labels, we introduce a novel Neural Radiance Fields (NeRF) module conditioned on map predictions, which reconstructs view-consistent 3D geometry and semantics. These pseudo labels are then iteratively used to refine the map network in a self-training manner, enabling progressive improvement without additional supervision. Furthermore, to mitigate error accumulation during self-training, we propose a Map-to-Ray Matching strategy that aligns map predictions with camera rays derived from 2D labels. Extensive experiments on the Argoverse 2 and nuScenes datasets demonstrate that MapRF achieves performance comparable to fully supervised methods, attaining around 75% of the baseline while surpassing several approaches using only 2D labels. This highlights the potential of MapRF to enable scalable and cost-effective online HD map construction for autonomous driving.", "summary_ja": "オンラインHD地図構築は従来3Dアノテーションのコストが汎化性・拡張性を妨げてきた。MapRFは2D画像ラベルのみで学習する弱教師あり手法で、地図予測条件付きのNeRFモジュールで視点整合的な3D幾何・意味の疑似ラベルを生成し、自己学習でマップネットワークを反復的に改善する。誤差蓄積を抑えるMap-to-Ray Matchingにより2Dラベル由来のカメラ光線と地図予測を整合させる。", "novelty_ja": "3D地図アノテーションを一切使わず、NeRFで生成した疑似ラベルによる自己学習とレイマッチングで誤差蓄積を抑える点が既存の完全教師あり/弱教師あり手法との違い。", "why_read_ja": "HD地図構築のアノテーションコスト削減という実運用上の重要課題に対し、NeRF由来の疑似ラベル生成という具体的解法を示しており、地図生成のスケーラビリティ動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2511.19527", "code_url": "", "published": "2025-11-24T07:23:10Z", "relevance": 18.5}, {"key": "arxiv:2511.10035", "title": "DGFusion: Dual-guided Fusion for Robust Multi-Modal 3D Object Detection", "venue": "arXiv 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception"], "abstract": "As a critical task in autonomous driving perception systems, 3D object detection is used to identify and track key objects, such as vehicles and pedestrians. However, detecting distant, small, or occluded objects (hard instances) remains a challenge, which directly compromises the safety of autonomous driving systems. We observe that existing multi-modal 3D object detection methods often follow a single-guided paradigm, failing to account for the differences in information density of hard instances between modalities. In this work, we propose DGFusion, based on the Dual-guided paradigm, which fully inherits the advantages of the Point-guide-Image paradigm and integrates the Image-guide-Point paradigm to address the limitations of the single paradigms. The core of DGFusion, the Difficulty-aware Instance Pair Matcher (DIPM), performs instance-level feature matching based on difficulty to generate easy and hard instance pairs, while the Dual-guided Modules exploit the advantages of both pair types to enable effective multi-modal feature fusion. Experimental results demonstrate that our DGFusion outperforms the baseline methods, with respective improvements of +1.0\\% mAP, +0.8\\% NDS, and +1.3\\% average recall on nuScenes. Extensive experiments demonstrate consistent robustness gains for hard instance detection across ego-distance, size, visibility, and small-scale training scenarios.", "summary_ja": "自動運転の3D物体検出において、遠方・小型・遮蔽物体などhard instanceの検出精度が課題であることを指摘し、既存のマルチモーダル融合手法が単一方向(Point-guide-ImageまたはImage-guide-Point)のガイドしか使わずモダリティ間の情報密度差に対応できていない点を問題視する。DGFusionでは両方向のガイドを組み合わせたDual-guidedパラダイムを提案し、Difficulty-aware Instance Pair Matcher(DIPM)でインスタンスを難易度別にペアリングした上で、それぞれに適したDual-guided Moduleで融合する。", "novelty_ja": "単一方向ガイドに依存していた従来のPoint-guide-ImageまたはImage-guide-Point手法を統合し、インスタンスの難易度(easy/hard)に応じて異なる融合戦略を適用する点が新しい。", "why_read_ja": "hard instance(遠方・小型・遮蔽物体)への対応は自動運転認識の安全性に直結する重要課題であり、マルチモーダル融合の設計指針として参考になる。", "paper_url": "https://arxiv.org/abs/2511.10035", "code_url": "", "published": "2025-11-13T07:18:58Z", "relevance": 15.0}, {"key": "arxiv:2510.10203", "title": "A Style-Based Profiling Framework for Quantifying the Synthetic-to-Real Gap in Autonomous Driving Datasets", "venue": "arXiv 2025", "year": 2025, "topic": "AD Perception", "topics": ["AD Perception"], "abstract": "Ensuring the reliability of autonomous driving perception systems requires extensive environment-based testing, yet real-world execution is often impractical. Synthetic datasets have therefore emerged as a promising alternative, offering advantages such as cost-effectiveness, bias free labeling, and controllable scenarios. However, the domain gap between synthetic and real-world datasets remains a major obstacle to model generalization. To address this challenge from a data-centric perspective, this paper introduces a profile extraction and discovery framework for characterizing the style profiles underlying both synthetic and real image datasets. We propose Style Embedding Distribution Discrepancy (SEDD) as a novel evaluation metric. Our framework combines Gram matrix-based style extraction with metric learning optimized for intra-class compactness and inter-class separation to extract style embeddings. Furthermore, we establish a benchmark using publicly available datasets. Experiments are conducted on a variety of datasets and sim-to-real methods, and the results show that our method is capable of quantifying the synthetic-to-real gap. This work provides a standardized profiling-based quality control paradigm that enables systematic diagnosis and targeted enhancement of synthetic datasets, advancing future development of data-driven autonomous driving systems.", "summary_ja": "自動運転の知覚モデル評価には環境試験が必要だが実車走行によるテストは困難なため、合成データセットの活用が進んでいる。しかし合成データと実データの間にはスタイル面でのドメインギャップがあり、モデル汎化性能を損なう要因となる。本研究はGram行列ベースのスタイル抽出とmetric learningを組み合わせ、両ドメインの画像からスタイル埋め込みを取得し、その分布差を定量化するフレームワークを提案する。", "novelty_ja": "従来のsim-to-real評価が主にタスク性能(検出精度等)で間接的にギャップを測るのに対し、本研究はStyle Embedding Distribution Discrepancy (SEDD)という新指標を導入し、画像スタイルそのものの分布差を直接定量化する点が異なる。", "why_read_ja": "合成データを用いた自動運転データセット拡充が今後も進む中、データの質を体系的に診断・改善するための標準的な評価軸を提供しており、データセット設計や評価基盤の研究動向として押さえておく価値がある。", "paper_url": "https://arxiv.org/abs/2510.10203", "code_url": "", "published": "2025-10-11T13:09:41Z", "relevance": 7.0}, {"key": "arxiv:2510.06969", "title": "Learning Global Representation from Queries for Vectorized HD Map Construction", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "The online construction of vectorized high-definition (HD) maps is a cornerstone of modern autonomous driving systems. State-of-the-art approaches, particularly those based on the DETR framework, formulate this as an instance detection problem. However, their reliance on independent, learnable object queries results in a predominantly local query perspective, neglecting the inherent global representation within HD maps. In this work, we propose \\textbf{MapGR} (\\textbf{G}lobal \\textbf{R}epresentation learning for HD \\textbf{Map} construction), an architecture designed to learn and utilize a global representations from queries. Our method introduces two synergistic modules: a Global Representation Learning (GRL) module, which encourages the distribution of all queries to better align with the global map through a carefully designed holistic segmentation task, and a Global Representation Guidance (GRG) module, which endows each individual query with explicit, global-level contextual information to facilitate its optimization. Evaluations on the nuScenes and Argoverse2 datasets validate the efficacy of our approach, demonstrating substantial improvements in mean Average Precision (mAP) compared to leading baselines.", "summary_ja": "DETRベースのオンラインHDマップ構築手法は各クエリが独立学習されるため局所視点に偏り、マップ全体の大域的構造を捉えにくいという課題がある。本研究はMapGRを提案し、全クエリの分布を地図全体のsegmentationタスクと整合させるGlobal Representation Learning(GRL)モジュールと、各クエリに大域的な文脈情報を明示的に与えるGlobal Representation Guidance(GRG)モジュールを組み合わせて解決する。", "novelty_ja": "個々のクエリの独立最適化に頼る従来のDETR系手法と異なり、holistic segmentationを介してクエリ集合全体を大域マップ表現に整合させ、その情報を個々のクエリの最適化に還元する点が新しい。", "why_read_ja": "クエリベースのベクトルHDマップ構築におけるクエリ間の大域的整合性という共通課題への対処法として、他の同系統手法にも応用可能な知見を提供する。", "paper_url": "https://arxiv.org/abs/2510.06969", "code_url": "", "published": "2025-10-08T12:56:08Z", "relevance": 16.5}, {"key": "arxiv:2510.03906", "title": "From Filters to VLMs: Benchmarking Defogging Methods through Object Detection and Segmentation Performance", "venue": "WACV 2026", "year": 2025, "topic": "AD Perception", "topics": ["AD Perception"], "abstract": "Autonomous driving perception systems are particularly vulnerable in foggy conditions, where light scattering reduces contrast and obscures fine details critical for safe operation. While numerous defogging methods exist, from handcrafted filters to learned restoration models, improvements in image fidelity do not consistently translate into better downstream detection and segmentation. Moreover, prior evaluations often rely on synthetic data, raising concerns about real-world transferability. We present a structured empirical study that benchmarks a comprehensive set of defogging pipelines, including classical dehazing filters, modern defogging networks, chained variants combining filters and models, and prompt-driven visual language image editing models applied directly to foggy images. To bridge the gap between simulated and physical environments, we evaluate these pipelines on both the synthetic Foggy Cityscapes dataset and the real-world Adverse Conditions Dataset with Correspondences (ACDC). We examine generalization by evaluating performance on synthetic fog and real-world conditions, assessing both image quality and downstream perception in terms of object detection mean average precision and segmentation panoptic quality. Our analysis identifies when defogging is effective, the impact of combining models, and how visual language models compare to traditional approaches. We additionally report qualitative rubric-based evaluations from both human and visual language model judges and analyze their alignment with downstream task metrics. Together, these results establish a transparent, task-oriented benchmark for defogging methods and identify the conditions under which pre-processing meaningfully improves autonomous perception in adverse weather. Project page: https://aradfir.github.io/filters-to-vlms-defogging-page/", "summary_ja": "濃霧環境下での自動運転知覚性能低下に対し、古典的フィルタから学習型デフォギングネットワーク、それらの連結、さらにVLMベースの画像編集まで幅広いデフォギング手法を比較したベンチマーク研究。合成データ(Foggy Cityscapes)と実データ(ACDC)の両方で評価し、画像復元品質と下流タスク(検出mAP・パノプティックセグメンテーション品質)の相関を検証している。", "novelty_ja": "画像品質の改善が必ずしも下流の検出・セグメンテーション性能向上につながらない点を実証的に示し、さらに人間およびVLM判定によるルーブリック評価と下流タスク指標との整合性まで分析している点が従来のデフォギング評価と異なる。", "why_read_ja": "悪天候下での知覚頑健性は自動運転知覚の前提条件であり、前処理としてのデフォギングがいつ有効かを整理した知見は実運用のパイプライン設計判断に直結する。", "paper_url": "https://arxiv.org/abs/2510.03906", "code_url": "", "published": "2025-10-04T19:05:04Z", "relevance": 7.0}, {"key": "arxiv:2509.16552", "title": "ST-GS: Vision-Based 3D Semantic Occupancy Prediction with Spatial-Temporal Gaussian Splatting", "venue": "ICRA 2026", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "Gaussian Splatting", "AD Perception", "3D Detection"], "abstract": "3D occupancy prediction is critical for comprehensive scene understanding in vision-centric autonomous driving. Recent advances have explored utilizing 3D semantic Gaussians to model occupancy while reducing computational overhead, but they remain constrained by insufficient multi-view spatial interaction and limited multi-frame temporal consistency. To overcome these issues, in this paper, we propose a novel Spatial-Temporal Gaussian Splatting (ST-GS) framework to enhance both spatial and temporal modeling in existing Gaussian-based pipelines. Specifically, we develop a guidance-informed spatial aggregation strategy within a dual-mode attention mechanism to strengthen spatial interaction in Gaussian representations. Furthermore, we introduce a geometry-aware temporal fusion scheme that effectively leverages historical context to improve temporal continuity in scene completion. Extensive experiments on the large-scale nuScenes occupancy prediction benchmark showcase that our proposed approach not only achieves state-of-the-art performance but also delivers markedly better temporal consistency compared to existing Gaussian-based methods.", "summary_ja": "カメラ画像のみから3D semantic occupancyを推定する研究。3D semantic Gaussianで占有を表現する近年の手法は計算量を抑えられる一方、multi-view間の空間的な相互作用が不十分で、複数フレームにわたる時間的一貫性も弱いという課題があった。本論文はこの2点を補う ST-GS というフレームワークを提案し、Gaussianベースのパイプラインに空間・時間方向のモデリングを組み込む。nuScenesのoccupancy predictionベンチマークで評価している。", "novelty_ja": "dual-mode attention の中に guidance-informed な空間集約を設けてGaussian表現間の空間的相互作用を強め、さらに geometry-aware な時間融合により過去フレームの文脈をscene completionに活かす点が、既存のGaussianベースoccupancy手法との違い。", "why_read_ja": "occupancy predictionの表現としてGaussian Splattingを使う流れの最新例であり、空間集約と時間融合という改良の方向性が把握できる。特に時間的一貫性の改善を明示的に扱っている点は、動的な屋外シーンの認識・地図生成を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2509.16552", "code_url": "", "published": "2025-09-20T06:36:30Z", "relevance": 30.5}, {"key": "arxiv:2509.14151", "title": "BEVUDA++: Geometric-aware Unsupervised Domain Adaptation for Multi-View 3D Object Detection", "venue": "arXiv 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception", "HD Map", "Occupancy"], "abstract": "Vision-centric Bird's Eye View (BEV) perception holds considerable promise for autonomous driving. Recent studies have prioritized efficiency or accuracy enhancements, yet the issue of domain shift has been overlooked, leading to substantial performance degradation upon transfer. We identify major domain gaps in real-world cross-domain scenarios and initiate the first effort to address the Domain Adaptation (DA) challenge in multi-view 3D object detection for BEV perception. Given the complexity of BEV perception approaches with their multiple components, domain shift accumulation across multi-geometric spaces (e.g., 2D, 3D Voxel, BEV) poses a significant challenge for BEV domain adaptation. In this paper, we introduce an innovative geometric-aware teacher-student framework, BEVUDA++, to diminish this issue, comprising a Reliable Depth Teacher (RDT) and a Geometric Consistent Student (GCS) model. Specifically, RDT effectively blends target LiDAR with dependable depth predictions to generate depth-aware information based on uncertainty estimation, enhancing the extraction of Voxel and BEV features that are essential for understanding the target domain. To collaboratively reduce the domain shift, GCS maps features from multiple spaces into a unified geometric embedding space, thereby narrowing the gap in data distribution between the two domains. Additionally, we introduce a novel Uncertainty-guided Exponential Moving Average (UEMA) to further reduce error accumulation due to domain shifts informed by previously obtained uncertainty guidance. To demonstrate the superiority of our proposed method, we execute comprehensive experiments in four cross-domain scenarios, securing state-of-the-art performance in BEV 3D object detection tasks, e.g., 12.9\\% NDS and 9.5\\% mAP enhancement on Day-Night adaptation.", "summary_ja": "視点ベースのBEV 3D物体検出はドメインシフトにより性能が大きく劣化する問題を扱い、複数の幾何空間(2D/Voxel/BEV)でシフトが蓄積することに着目してドメイン適応を試みた研究。信頼できる深度予測とターゲットLiDARを組み合わせるReliable Depth Teacherと、複数空間の特徴を統一埋め込み空間に写像するGeometric Consistent Studentからなるteacher-studentフレームワークBEVUDA++を提案している。", "novelty_ja": "単一空間での適応にとどまらず、2D・Voxel・BEVという複数の幾何空間にまたがるドメインシフトを統一的に縮小する点、および不確実性に基づくExponential Moving Average(UEMA)で誤差蓄積を抑える点が従来手法と異なる。", "why_read_ja": "BEV 3D検出の実運用では天候・昼夜・地域差によるドメインシフトが避けられず、Day-Night適応でNDS/mAPを大きく改善した本手法は環境認識のロバスト性向上の観点で参考になる。", "paper_url": "https://arxiv.org/abs/2509.14151", "code_url": "", "published": "2025-09-17T16:31:40Z", "relevance": 20.5}, {"key": "arxiv:2509.11772", "title": "Seg2Track-SAM2: SAM2-based Multi-object Tracking and Segmentation", "venue": "arXiv 2025", "year": 2025, "topic": "AD Perception", "topics": ["AD Perception", "3D Detection"], "abstract": "Autonomous-driving perception systems require robust Multi-Object Tracking (MOT) to operate reliably in dynamic environments. MOT maintains consistent object identities across frames while preserving spatial accuracy. Recent foundation models, such as SAM2, provide promptable video segmentation without task-specific fine-tuning. However, their direct application to Multi-Object Tracking and Segmentation (MOTS) remains limited by the absence of explicit identity management mechanisms and by growing memory requirements during tracking. This work introduces Seg2Track-SAM2, a framework that integrates pretrained object detectors with SAM2 and a dedicated Seg2Track module to support track initialization, data association, and track refinement. The method operates without dataset-specific fine-tuning and remains detector-agnostic. Experimental evaluation on the KITTI MOTS and MOTS Challenge benchmarks shows that Seg2Track-SAM2 ranks fourth overall in both datasets while achieving the highest association accuracy (AssA) among compared methods. In addition, a sliding-window memory strategy reduces memory usage by up to 75% with minimal impact on tracking performance, enabling deployment under resource constraints. Together, these results indicate that Seg2Track-SAM2 improves identity consistency and memory efficiency in MOTS without requiring dataset-specific training. The code is available at https://github.com/hcmr-lab/Seg2Track-SAM2.", "summary_ja": "自動運転における物体追跡(MOT/MOTS)を、SAM2のようなプロンプト可能な動画セグメンテーション基盤モデル上に構築しようとする研究。SAM2単体ではID管理機構がなく、追跡が長くなるほどメモリ消費が増える課題があるため、既存の物体検出器とSAM2を組み合わせ、Seg2Trackモジュールでトラックの初期化・データアソシエーション・トラック修正を担わせるフレームワークSeg2Track-SAM2を提案している。", "novelty_ja": "データセット固有のfine-tuningを行わず検出器非依存という条件を保ったまま、SAM2にID管理機構を追加し、さらにスライディングウィンドウ方式のメモリ管理でメモリ使用量を最大75%削減している点が従来のSAM2応用と異なる。", "why_read_ja": "基盤セグメンテーションモデルを追跡タスクに転用する際のID管理・メモリ効率という実装上の課題への対処例として、動的シーン認識全般の設計に参考になる。", "paper_url": "https://arxiv.org/abs/2509.11772", "code_url": "https://github.com/hcmr-lab/Seg2Track-SAM2", "published": "2025-09-15T10:52:27Z", "relevance": 4.0}, {"key": "arxiv:2509.08388", "title": "Semantic Causality-Aware Vision-Based 3D Occupancy Prediction", "venue": "ICCV 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "Reconstruction", "3D Detection"], "abstract": "Vision-based 3D semantic occupancy prediction is a critical task in 3D vision that integrates volumetric 3D reconstruction with semantic understanding. Existing methods, however, often rely on modular pipelines. These modules are typically optimized independently or use pre-configured inputs, leading to cascading errors. In this paper, we address this limitation by designing a novel causal loss that enables holistic, end-to-end supervision of the modular 2D-to-3D transformation pipeline. Grounded in the principle of 2D-to-3D semantic causality, this loss regulates the gradient flow from 3D voxel representations back to the 2D features. Consequently, it renders the entire pipeline differentiable, unifying the learning process and making previously non-trainable components fully learnable. Building on this principle, we propose the Semantic Causality-Aware 2D-to-3D Transformation, which comprises three components guided by our causal loss: Channel-Grouped Lifting for adaptive semantic mapping, Learnable Camera Offsets for enhanced robustness against camera perturbations, and Normalized Convolution for effective feature propagation. Extensive experiments demonstrate that our method achieves state-of-the-art performance on the Occ3D benchmark, demonstrating significant robustness to camera perturbations and improved 2D-to-3D semantic consistency.", "summary_ja": "既存のvision-based 3D occupancy predictionはモジュール構成で個別最適化されるため誤差が伝播しやすい。本研究は2D-to-3Dのgradient伝播を規定するcausal lossを導入し、パイプライン全体をエンドツーエンドで微分可能にする。これに基づきChannel-Grouped Lifting、Learnable Camera Offsets、Normalized Convolutionから成る変換手法を提案する。", "novelty_ja": "モジュール個別最適化ではなく、2D-to-3D semantic causalityの原理に基づくcausal lossで全体を統一的に学習可能にした点が従来手法と異なる。", "why_read_ja": "occupancy予測におけるカメラ外乱へのロバスト性と2D-3D間の意味的整合性を扱っており、モジュール型パイプラインの誤差伝播問題への対処法として参考になる。", "paper_url": "https://arxiv.org/abs/2509.08388", "code_url": "", "published": "2025-09-10T08:29:22Z", "relevance": 21.0}, {"key": "arxiv:2509.08302", "title": "Foundation Models for Autonomous Driving Perception: A Survey Through Core Capabilities", "venue": "arXiv 2025", "year": 2025, "topic": "AD Perception", "topics": ["AD Perception", "Open-world"], "abstract": "Foundation models are revolutionizing autonomous driving perception, transitioning the field from narrow, task-specific deep learning models to versatile, general-purpose architectures trained on vast, diverse datasets. This survey examines how these models address critical challenges in autonomous perception, including limitations in generalization, scalability, and robustness to distributional shifts. The survey introduces a novel taxonomy structured around four essential capabilities for robust performance in dynamic driving environments: generalized knowledge, spatial understanding, multi-sensor robustness, and temporal reasoning. For each capability, the survey elucidates its significance and comprehensively reviews cutting-edge approaches. Diverging from traditional method-centric surveys, our unique framework prioritizes conceptual design principles, providing a capability-driven guide for model development and clearer insights into foundational aspects. We conclude by discussing key challenges, particularly those associated with the integration of these capabilities into real-time, scalable systems, and broader deployment challenges related to computational demands and ensuring model reliability against issues like hallucinations and out-of-distribution failures. The survey also outlines crucial future research directions to enable the safe and effective deployment of foundation models in autonomous driving systems.", "summary_ja": "自動運転の知覚タスクを、個別タスクごとの深層学習モデルから汎用的な基盤モデルへ移行させる動きを整理したサーベイ。汎化性・スケーラビリティ・分布シフトへの頑健性という課題に対し、基盤モデルがどう対応するかを論じている。generalized knowledge、spatial understanding、multi-sensor robustness、temporal reasoningという4つの能力軸で手法を分類し、各能力の重要性と代表的アプローチを整理している。", "novelty_ja": "手法名やアーキテクチャで分類する従来型サーベイと異なり、動的運転環境で求められる能力を起点とした分類軸を導入し、モデル設計の指針となる視点を提供している。", "why_read_ja": "Open-world知覚や基盤モデル活用が地図生成・環境認識分野でも重要になりつつあり、能力軸での整理は今後の技術動向を俯瞰する上で参考になる。", "paper_url": "https://arxiv.org/abs/2509.08302", "code_url": "", "published": "2025-09-10T05:45:49Z", "relevance": 11.5}, {"key": "arxiv:2509.03999", "title": "SliceSemOcc: Vertical Slice Based Multimodal 3D Semantic Occupancy Representation", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "HD Map", "3D Detection", "AD Perception"], "abstract": "Driven by autonomous driving's demands for precise 3D perception, 3D semantic occupancy prediction has become a pivotal research topic. Unlike bird's-eye-view (BEV) methods, which restrict scene representation to a 2D plane, occupancy prediction leverages a complete 3D voxel grid to model spatial structures in all dimensions, thereby capturing semantic variations along the vertical axis. However, most existing approaches overlook height-axis information when processing voxel features. And conventional SENet-style channel attention assigns uniform weight across all height layers, limiting their ability to emphasize features at different heights. To address these limitations, we propose SliceSemOcc, a novel vertical slice based multimodal framework for 3D semantic occupancy representation. Specifically, we extract voxel features along the height-axis using both global and local vertical slices. Then, a global local fusion module adaptively reconciles fine-grained spatial details with holistic contextual information. Furthermore, we propose the SEAttention3D module, which preserves height-wise resolution through average pooling and assigns dynamic channel attention weights to each height layer. Extensive experiments on nuScenes-SurroundOcc and nuScenes-OpenOccupancy datasets verify that our method significantly enhances mean IoU, achieving especially pronounced gains on most small-object categories. Detailed ablation studies further validate the effectiveness of the proposed SliceSemOcc framework.", "summary_ja": "自動運転の3D semantic occupancy predictionにおいて、voxel特徴の高さ方向(height-axis)の情報が十分に活用されていない点を課題とした研究。従来のSENet系channel attentionが全ての高さ層に一様な重みを与えてしまう問題に対し、高さ方向のスライスに基づくマルチモーダルな表現手法SliceSemOccを提案する。global/localの垂直スライスからvoxel特徴を抽出し、global-local fusionモジュールで細かい空間的ディテールと大域的な文脈を統合する。nuScenes-SurroundOccとnuScenes-OpenOccupancyでmIoUの向上、特に小物体カテゴリでの改善を報告している。", "novelty_ja": "voxel特徴を垂直スライス単位で扱い、global/localスライスの融合によって高さ方向の意味変化を明示的に捉える点が新しい。さらにaverage poolingで高さ方向の解像度を保持しつつ各高さ層ごとに動的なchannel attention重みを割り当てるSEAttention3Dを導入し、従来の高さ方向に一様なattentionとの差別化を図っている。", "why_read_ja": "occupancy表現において高さ方向の扱いがどこまで性能に効くのかを、attention設計の観点から具体的に検証した事例として参考になる。BEVでは落ちてしまう垂直方向の情報をどう設計に組み込むかは、occupancyベースの環境認識を追ううえで押さえておきたい論点である。", "paper_url": "https://arxiv.org/abs/2509.03999", "code_url": "", "published": "2025-09-04T08:27:54Z", "relevance": 27.5}, {"key": "arxiv:2508.21689", "title": "Mapping like a Skeptic: Probabilistic BEV Projection for Online HD Mapping", "venue": "BMVC 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "3D Detection", "AD Perception"], "abstract": "Constructing high-definition (HD) maps from sensory input requires accurately mapping the road elements in image space to the Bird's Eye View (BEV) space. The precision of this mapping directly impacts the quality of the final vectorized HD map. Existing HD mapping approaches outsource the projection to standard mapping techniques, such as attention-based ones. However, these methods struggle with accuracy due to generalization problems, often hallucinating non-existent road elements. Our key idea is to start with a geometric mapping based on camera parameters and adapt it to the scene to extract relevant map information from camera images. To implement this, we propose a novel probabilistic projection mechanism with confidence scores to (i) refine the mapping to better align with the scene and (ii) filter out irrelevant elements that should not influence HD map generation. In addition, we improve temporal processing by using confidence scores to selectively accumulate reliable information over time. Experiments on new splits of the nuScenes and Argoverse2 datasets demonstrate improved performance over state-of-the-art approaches, indicating better generalization. The improvements are particularly pronounced on nuScenes and in the challenging long perception range. Our code and model checkpoints are available at https://github.com/Fatih-Erdogan/mapping-like-skeptic .", "summary_ja": "カメラ画像からBEV空間へ道路要素を射影する際の誤差がベクトルHDマップの品質を左右するという課題に対し、カメラパラメータに基づく幾何的射影を出発点として、確信度スコア付きの確率的射影機構でシーンに適応的に補正し、無関係な要素を除去する手法を提案している。さらに確信度スコアを用いて時系列情報を選択的に蓄積することで時間方向の処理も改善している。", "novelty_ja": "既存手法がAttentionベースの学習的射影に全面依存し汎化性能が低くハルシネーションを起こしやすいのに対し、本手法はカメラ幾何に基づく射影を起点として確信度で補正・フィルタする点が異なる。", "why_read_ja": "nuScenes・Argoverse2での長距離知覚における汎化性能向上を示しており、オンラインHDマップ構築の射影手法設計における参考になる。", "paper_url": "https://arxiv.org/abs/2508.21689", "code_url": "https://github.com/Fatih-Erdogan/mapping-like-skeptic", "published": "2025-08-29T14:55:33Z", "relevance": 10.5}, {"key": "arxiv:2508.15653", "title": "MapKD: Unlocking Prior Knowledge with Cross-Modal Distillation for Efficient Online HD Map Construction", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "Online HD map construction is a fundamental task in autonomous driving systems, aiming to acquire semantic information of map elements around the ego vehicle based on real-time sensor inputs. Recently, several approaches have achieved promising results by incorporating offline priors such as SD maps and HD maps or by fusing multi-modal data. However, these methods depend on stale offline maps and multi-modal sensor suites, resulting in avoidable computational overhead at inference. To address these limitations, we employ a knowledge distillation strategy to transfer knowledge from multimodal models with prior knowledge to an efficient, low-cost, and vision-centric student model. Specifically, we propose MapKD, a novel multi-level cross-modal knowledge distillation framework with an innovative Teacher-Coach-Student (TCS) paradigm. This framework consists of: (1) a camera-LiDAR fusion model with SD/HD map priors serving as the teacher; (2) a vision-centric coach model with prior knowledge and simulated LiDAR to bridge the cross-modal knowledge transfer gap; and (3) a lightweight vision-based student model. Additionally, we introduce two targeted knowledge distillation strategies: Token-Guided 2D Patch Distillation (TGPD) for bird's eye view feature alignment and Masked Semantic Response Distillation (MSRD) for semantic learning guidance. Extensive experiments on the challenging nuScenes dataset demonstrate that MapKD improves the student model by +6.68 mIoU and +10.94 mAP while simultaneously accelerating inference speed. The code is available at:https://github.com/2004yan/MapKD2026.", "summary_ja": "オンラインHDマップ構築において、SD/HDマップ事前知識やLiDARなどのマルチモーダル情報を推論時に使わずに済ませたいという課題に対し、Teacher-Coach-Studentという3段階の知識蒸留フレームワークMapKDを提案している。カメラ+LiDAR+地図事前知識を持つteacherから、地図事前知識と疑似LiDARを持つcoachを経て、視覚のみの軽量studentモデルへ知識を伝達する。", "novelty_ja": "単純な2段階蒸留ではなくcoachモデルを挟むことでモーダル間のギャップを埋め、さらにBEV特徴用のToken-Guided 2D Patch DistillationとセマンティクスガイダンスのMasked Semantic Response Distillationという2種類の蒸留手法を導入している点が新しい。", "why_read_ja": "オフライン地図やマルチモーダルセンサ依存を減らしつつ性能を落とさない設計は、低コストなオンラインHDマップ構築の実運用に向けた重要な方向性であり、蒸留戦略の設計は他タスクにも応用が利く。", "paper_url": "https://arxiv.org/abs/2508.15653", "code_url": "https://github.com/2004yan/MapKD2026", "published": "2025-08-21T15:37:18Z", "relevance": 20.5}, {"key": "arxiv:2508.12520", "title": "An Initial Study of Bird's-Eye View Generation for Autonomous Vehicles using Cross-View Transformers", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map"], "abstract": "Bird's-Eye View (BEV) maps provide a structured, top-down abstraction that is crucial for autonomous-driving perception. In this work, we employ Cross-View Transformers (CVT) for learning to map camera images to three BEV's channels - road, lane markings, and planned trajectory - using a realistic simulator for urban driving. Our study examines generalization to unseen towns, the effect of different camera layouts, and two loss formulations (focal and L1). Using training data from only a town, a four-camera CVT trained with the L1 loss delivers the most robust test performance, evaluated in a new town. Overall, our results underscore CVT's promise for mapping camera inputs to reasonably accurate BEV maps.", "summary_ja": "自動運転シミュレータ上で、複数カメラ画像からCross-View Transformer (CVT)を用いて道路・車線区画・計画軌道の3チャンネルからなるBEVマップを推定する手法を検討している。未知の街への汎化性、カメラ配置の違い、focal損失とL1損失の比較を実験的に評価した。単一の街のデータのみで学習しても、4カメラ構成かつL1損失を用いたCVTが未知の街で最も頑健な性能を示したと報告している。", "novelty_ja": "新規アーキテクチャの提案ではなく、既存のCVTをBEVマップ生成タスクに適用した上で、カメラ台数構成や損失関数の選択が汎化性能に与える影響を初期的に検証した点が特徴。", "why_read_ja": "Online HD Map生成におけるカメラ配置・損失設計といった実装選択の効果に関する初期的な知見が得られ、BEVマップ推定の基礎検討として参考になる。", "paper_url": "https://arxiv.org/abs/2508.12520", "code_url": "", "published": "2025-08-17T23:05:00Z", "relevance": 5.5}, {"key": "arxiv:2508.10936", "title": "Vision-Only Gaussian Splatting for Collaborative Semantic Occupancy Prediction", "venue": "AAAI 2026", "year": 2025, "topic": "Gaussian Splatting", "topics": ["Occupancy", "Scene Understanding", "Gaussian Splatting", "Reconstruction"], "abstract": "Collaborative perception enables connected vehicles to share information, overcoming occlusions and extending the limited sensing range inherent in single-agent (non-collaborative) systems. Existing vision-only methods for 3D semantic occupancy prediction commonly rely on dense 3D voxels, which incur high communication costs, or 2D planar features, which require accurate depth estimation or additional supervision, limiting their applicability to collaborative scenarios. To address these challenges, we propose the first approach leveraging sparse 3D semantic Gaussian splatting for collaborative 3D semantic occupancy prediction. By sharing and fusing intermediate Gaussian primitives, our method provides three benefits: a neighborhood-based cross-agent fusion that removes duplicates and suppresses noisy or inconsistent Gaussians; a joint encoding of geometry and semantics in each primitive, which reduces reliance on depth supervision and allows simple rigid alignment; and sparse, object-centric messages that preserve structural information while reducing communication volume. Extensive experiments demonstrate that our approach outperforms single-agent perception and baseline collaborative methods by +8.42 and +3.28 points in mIoU, and +5.11 and +22.41 points in IoU, respectively. When further reducing the number of transmitted Gaussians, our method still achieves a +1.9 improvement in mIoU, using only 34.6% communication volume, highlighting robust performance under limited communication budgets.", "summary_ja": "複数の連結車両が情報を共有して遮蔽や単一車両のセンシング範囲の限界を克服する協調認識において、既存の視覚のみによる3D semantic occupancy予測手法は高通信コストな密な3Dボクセルか、深度推定精度に依存する2D平面特徴に頼らざるを得ない課題があった。本研究はスパースな3D semantic Gaussian splattingを中間表現として車両間で共有・融合する初の手法を提案し、近傍ベースのクロスエージェント融合で重複除去とノイズ抑制を行い、幾何と意味を同一プリミティブに統合することで深度教師信号への依存を減らし剛体アライメントを可能にしている。", "novelty_ja": "密なボクセルや2D平面特徴に依存する従来の協調occupancy予測と異なり、スパースでオブジェクト中心のGaussianプリミティブを共有メッセージとして用いることで通信量を抑えつつ構造情報を保持する点が新しい。", "why_read_ja": "Gaussian Splattingを協調的な3D occupancy予測へ応用した事例であり、通信効率と精度の両立という自動運転マルチエージェント認識の実用課題に直結するため参考になる。", "paper_url": "https://arxiv.org/abs/2508.10936", "code_url": "", "published": "2025-08-12T19:50:34Z", "relevance": 21.5}, {"key": "arxiv:2508.07552", "title": "Decoupled Functional Evaluation of Autonomous Driving Models via Feature Map Quality Scoring", "venue": "arXiv 2025", "year": 2025, "topic": "3D Detection", "topics": ["AD Perception", "3D Detection", "Open-world"], "abstract": "End-to-end models are emerging as the mainstream in autonomous driving perception and planning. However, the lack of explicit supervision signals for intermediate functional modules leads to opaque operational mechanisms and limited interpretability, making it challenging for traditional methods to independently evaluate and train these modules. Pioneering in the issue, this study builds upon the feature map-truth representation similarity-based evaluation framework and proposes an independent evaluation method based on Feature Map Convergence Score (FMCS). A Dual-Granularity Dynamic Weighted Scoring System (DG-DWSS) is constructed, formulating a unified quantitative metric - Feature Map Quality Score - to enable comprehensive evaluation of the quality of feature maps generated by functional modules. A CLIP-based Feature Map Quality Evaluation Network (CLIP-FMQE-Net) is further developed, combining feature-truth encoders and quality score prediction heads to enable real-time quality analysis of feature maps generated by functional modules. Experimental results on the NuScenes dataset demonstrate that integrating our evaluation module into the training improves 3D object detection performance, achieving a 3.89 percent gain in NDS. These results verify the effectiveness of our method in enhancing feature representation quality and overall model performance.", "summary_ja": "End-to-endの自動運転モデルでは中間の機能モジュール(特徴マップ)に対する明示的な教師信号がなく、動作が不透明で個別評価・学習が難しいという課題がある。本研究はGT表現との類似度に基づくFeature Map Convergence Score(FMCS)と、Dual-Granularity Dynamic Weighted Scoring Systemによる統合指標Feature Map Quality Scoreを提案し、CLIPベースのネットワークで特徴マップ品質をリアルタイムに予測・評価する。NuScenesでの実験では、この評価モジュールを学習に組み込むことで3D物体検出のNDSが3.89ポイント向上した。", "novelty_ja": "最終出力の精度指標だけでなく、中間特徴マップ自体の品質をGTとの表現類似度で定量化し、それを学習にフィードバックする点が従来のend-to-end評価と異なる。", "why_read_ja": "end-to-end知覚モデルの中間表現を可視化・評価する仕組みは、モデルの解釈性向上や学習効率化につながる知見として地図生成・知覚研究全体に応用が期待できる。", "paper_url": "https://arxiv.org/abs/2508.07552", "code_url": "", "published": "2025-08-11T02:24:08Z", "relevance": 15.5}, {"key": "arxiv:2508.01583", "title": "Adverse Weather-Independent Framework Towards Autonomous Driving Perception through Temporal Correlation and Unfolded Regularization", "venue": "arXiv 2025", "year": 2025, "topic": "AD Perception", "topics": ["AD Perception"], "abstract": "Various adverse weather conditions such as fog and rain pose a significant challenge to autonomous driving (AD) perception tasks like semantic segmentation, object detection, etc. The common domain adaption strategy is to minimize the disparity between images captured in clear and adverse weather conditions. However, domain adaption faces two challenges: (I) it typically relies on utilizing clear image as a reference, which is challenging to obtain in practice; (II) it generally targets single adverse weather condition and performs poorly when confronting the mixture of multiple adverse weather conditions. To address these issues, we introduce a reference-free and Adverse weather condition-independent (Advent) framework (rather than a specific model architecture) that can be implemented by various backbones and heads. This is achieved by leveraging the homogeneity over short durations, getting rid of clear reference and being generalizable to arbitrary weather condition. Specifically, Advent includes three integral components: (I) Locally Sequential Mechanism (LSM) leverages temporal correlations between adjacent frames to achieve the weather-condition-agnostic effect thanks to the homogeneity behind arbitrary weather condition; (II) Globally Shuffled Mechanism (GSM) is proposed to shuffle segments processed by LSM from different positions of input sequence to prevent the overfitting to LSM-induced temporal patterns; (III) Unfolded Regularizers (URs) are the deep unfolding implementation of two proposed regularizers to penalize the model complexity to enhance across-weather generalization. We take the semantic segmentation task as an example to assess the proposed Advent framework. Extensive experiments demonstrate that the proposed Advent outperforms existing state-of-the-art baselines with large margins.", "summary_ja": "霧や雨などの複合的な悪天候下で自動運転認識タスク(意味セグメンテーション等)の性能が劣化する問題に対し、晴天画像を参照とせず、単一の天候条件にも限定されない汎用フレームワークAdventを提案している。時系列的に隣接するフレーム間の均質性を利用し、天候条件に依存しない特徴抽出を実現する。", "novelty_ja": "従来のdomain adaptationが晴天画像を参照として要求し単一天候にしか対応できなかったのに対し、Locally Sequential MechanismとGlobally Shuffled Mechanism、Unfolded Regularizersにより参照フリーかつ任意の悪天候条件に汎化できる点が異なる。", "why_read_ja": "悪天候下での認識性能劣化は自動運転パーセプションの実運用における重要課題であり、参照画像不要かつマルチ天候対応という設計思想は環境認識のロバスト性研究の動向として注目に値する。", "paper_url": "https://arxiv.org/abs/2508.01583", "code_url": "", "published": "2025-08-03T04:30:58Z", "relevance": 8.5}, {"key": "arxiv:2507.23331", "title": "Contrastive Learning-Driven Traffic Sign Perception: Multi-Modal Fusion of Text and Vision", "venue": "arXiv 2025", "year": 2025, "topic": "Open-world", "topics": ["Open-world", "AD Perception"], "abstract": "Traffic sign recognition, as a core component of autonomous driving perception systems, directly influences vehicle environmental awareness and driving safety. Current technologies face two significant challenges: first, the traffic sign dataset exhibits a pronounced long-tail distribution, resulting in a substantial decline in recognition performance of traditional convolutional networks when processing low-frequency and out-of-distribution classes; second, traffic signs in real-world scenarios are predominantly small targets with significant scale variations, making it difficult to extract multi-scale features.To overcome these issues, we propose a novel two-stage framework combining open-vocabulary detection and cross-modal learning. For traffic sign detection, our NanoVerse YOLO model integrates a reparameterizable vision-language path aggregation network (RepVL-PAN) and an SPD-Conv module to specifically enhance feature extraction for small, multi-scale targets. For traffic sign classification, we designed a Traffic Sign Recognition Multimodal Contrastive Learning model (TSR-MCL). By contrasting visual features from a Vision Transformer with semantic features from a rule-based BERT, TSR-MCL learns robust, frequency-independent representations, effectively mitigating class confusion caused by data imbalance. On the TT100K dataset, our method achieves a state-of-the-art 78.4% mAP in the long-tail detection task for all-class recognition. The model also obtains 91.8% accuracy and 88.9% recall, significantly outperforming mainstream algorithms and demonstrating superior accuracy and generalization in complex, open-world scenarios.", "summary_ja": "交通標識認識において、ロングテール分布と小物体・多スケールという2つの課題に対処する2段階手法を提案。検出にはRepVL-PANとSPD-Convを組み込んだNanoVerse YOLOを、分類にはViT視覚特徴とルールベースBERTの意味特徴を対照学習させるTSR-MCLを用い、頻度に依存しない頑健な表現を学習する。TT100Kデータセットでロングテール全クラス検出において高い性能を達成した。", "novelty_ja": "オープン語彙検出と視覚-言語のマルチモーダル対照学習を組み合わせ、従来のCNNベース手法が苦手とする低頻度・分布外クラスの認識精度を、クラス不均衡に頑健な表現学習で改善している点が新しい。", "why_read_ja": "小物体検出とロングテール分布への対処は自動運転の知覚全般（標識に限らず稀少物体検出）に共通する課題であり、open-vocabulary検出と対照学習の組み合わせ方が参考になる。", "paper_url": "https://arxiv.org/abs/2507.23331", "code_url": "", "published": "2025-07-31T08:23:30Z", "relevance": 18.5}, {"key": "arxiv:2507.21567", "title": "RelMap: Enhancing Online Map Construction with Class-Aware Spatial Relation and Semantic Priors", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "Online high-definition (HD) map construction is crucial for scaling autonomous driving systems. While Transformer-based methods have become prevalent in online HD map construction, most existing approaches overlook the inherent spatial dependencies and semantic relationships among map elements, which constrains their accuracy and generalization capabilities. To address this, we propose RelMap, an end-to-end framework that explicitly models both spatial relations and semantic priors to enhance online HD map construction. Specifically, we introduce a Class-aware Spatial Relation Prior, which explicitly encodes relative positional dependencies between map elements using a learnable class-aware relation encoder. Additionally, we design a Mixture-of-Experts-based Semantic Prior, which routes features to class-specific experts based on predicted class probabilities, refining instance feature decoding. RelMap is compatible with both single-frame and temporal perception backbones, achieving state-of-the-art performance on both the nuScenes and Argoverse 2 datasets.", "summary_ja": "オンラインHDマップ構築において、既存のTransformer手法がマップ要素間の空間的依存関係や意味的関係を無視している点を課題とし、RelMapという手法でこれを明示的にモデル化する。クラス認識型の空間関係とMixture-of-Expertsによる意味的事前知識をエンコーダ・デコーダに組み込み、要素間の相対位置関係とクラス固有の特徴表現を強化する。", "novelty_ja": "従来手法が見落としていたマップ要素間の空間的関係とクラスごとの意味的特性を、学習可能な関係エンコーダとMoEベースの専門家ルーティングで明示的に扱う点が新しい。", "why_read_ja": "マップ要素間の構造的関係をどう表現に組み込むかは、Transformerベースのオンラインマップ構築の精度向上における重要な設計軸であり、nuScenes・Argoverse 2両方でSOTAを達成している点で参照価値が高い。", "paper_url": "https://arxiv.org/abs/2507.21567", "code_url": "", "published": "2025-07-29T07:58:52Z", "relevance": 15.0}, {"key": "arxiv:2507.21423", "title": "MapDiffusion: Generative Diffusion for Vectorized Online HD Map Construction and Uncertainty Estimation in Autonomous Driving", "venue": "IROS 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection", "World Model"], "abstract": "Autonomous driving requires an understanding of the static environment from sensor data. Learned Bird's-Eye View (BEV) encoders are commonly used to fuse multiple inputs, and a vector decoder predicts a vectorized map representation from the latent BEV grid. However, traditional map construction models provide deterministic point estimates, failing to capture uncertainty and the inherent ambiguities of real-world environments, such as occlusions and missing lane markings. We propose MapDiffusion, a novel generative approach that leverages the diffusion paradigm to learn the full distribution of possible vectorized maps. Instead of predicting a single deterministic output from learned queries, MapDiffusion iteratively refines randomly initialized queries, conditioned on a BEV latent grid, to generate multiple plausible map samples. This allows aggregating samples to improve prediction accuracy and deriving uncertainty estimates that directly correlate with scene ambiguity. Extensive experiments on the nuScenes dataset demonstrate that MapDiffusion achieves state-of-the-art performance in online map construction, surpassing the baseline by 5% in single-sample performance. We further show that aggregating multiple samples consistently improves performance along the ROC curve, validating the benefit of distribution modeling. Additionally, our uncertainty estimates are significantly higher in occluded areas, reinforcing their value in identifying regions with ambiguous sensor input. By modeling the full map distribution, MapDiffusion enhances the robustness and reliability of online vectorized HD map construction, enabling uncertainty-aware decision-making for autonomous vehicles in complex environments.", "summary_ja": "オンラインHDマップ構築において、従来のクエリベース手法が単一の決定論的なベクトルマップしか出力できず、occlusionや車線標示欠損による曖昧さを表現できない点を課題とする。MapDiffusionはdiffusionモデルによりBEV潜在特徴量を条件としてクエリを反復的に精緻化し、複数の妥当なマップサンプルを生成することでマップ分布全体を学習する。nuScenesでの実験により、単一サンプルでもベースラインを上回る性能を示し、複数サンプルの集約でさらに精度が向上することを確認している。", "novelty_ja": "決定論的な点推定ではなく、diffusionによりベクトルマップの分布そのものをモデル化し、サンプル集約による精度向上とocclusion領域に対応する不確実性推定を同時に実現する点が従来手法との違い。", "why_read_ja": "オンラインHDマップ構築の性能向上に加え、センサー入力が曖昧な領域を不確実性として定量化できる点は、自動運転の意思決定の安全性・信頼性を扱ううえで重要な知見となる。", "paper_url": "https://arxiv.org/abs/2507.21423", "code_url": "", "published": "2025-07-29T01:16:40Z", "relevance": 21.5}, {"key": "arxiv:2507.21358", "title": "Collaborative Perceiver: Elevating Vision-based 3D Object Detection via Local Density-Aware Spatial Occupancy", "venue": "arXiv 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "Occupancy", "HD Map", "AD Perception"], "abstract": "Vision-based bird's-eye-view (BEV) 3D object detection has advanced significantly in autonomous driving by offering cost-effectiveness and rich contextual information. However, existing methods often construct BEV representations by collapsing extracted object features, neglecting intrinsic environmental contexts, such as roads and pavements. This hinders detectors from comprehensively perceiving the characteristics of the physical world. To alleviate this, we introduce a multi-task learning framework, Collaborative Perceiver (CoP), that leverages spatial occupancy as auxiliary information to mine consistent structural and conceptual similarities shared between 3D object detection and occupancy prediction tasks, bridging gaps in spatial representations and feature refinement. To this end, we first propose a pipeline to generate dense occupancy ground truths incorporating local density information (LDO) for reconstructing detailed environmental information. Next, we employ a voxel-height-guided sampling (VHS) strategy to distill fine-grained local features according to distinct object properties. Furthermore, we develop a global-local collaborative feature fusion (CFF) module that seamlessly integrates complementary knowledge between both tasks, thus composing more robust BEV representations. Extensive experiments on the nuScenes benchmark demonstrate that CoP outperforms existing vision-based frameworks, achieving 49.5\\% mAP and 59.2\\% NDS on the test set. Code and supplementary materials are available at this link https://github.com/jichengyuan/Collaborative-Perceiver.", "summary_ja": "vision-based BEV 3D物体検出において、既存手法が道路や路面などの環境コンテキストを捨象している問題に着目し、occupancy予測を補助タスクとして併用するマルチタスク学習フレームワークCollaborative Perceiverを提案している。局所密度情報を含む密なoccupancy正解データを生成するパイプライン、voxel高さに基づくサンプリング戦略、検出とoccupancyの特徴を統合するグローバル・ローカル協調融合モジュールから構成される。", "novelty_ja": "BEV特徴を単純に潰して物体特徴のみで構成する従来手法と異なり、occupancy予測との構造的・概念的な類似性を利用して空間表現とfeature refinementのギャップを埋める点が新しい。", "why_read_ja": "3D検出とoccupancy予測というテーマの垣根を越えたマルチタスク統合の設計例として、両者の特徴融合手法の参考になる。", "paper_url": "https://arxiv.org/abs/2507.21358", "code_url": "https://github.com/jichengyuan/Collaborative-Perceiver", "published": "2025-07-28T21:56:43Z", "relevance": 20.0}, {"key": "arxiv:2507.20963", "title": "GTAD: Global Temporal Aggregation Denoising Learning for 3D Semantic Occupancy Prediction", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "AD Perception", "3D Detection"], "abstract": "Accurately perceiving dynamic environments is a fundamental task for autonomous driving and robotic systems. Existing methods inadequately utilize temporal information, relying mainly on local temporal interactions between adjacent frames and failing to leverage global sequence information effectively. To address this limitation, we investigate how to effectively aggregate global temporal features from temporal sequences, aiming to achieve occupancy representations that efficiently utilize global temporal information from historical observations. For this purpose, we propose a global temporal aggregation denoising network named GTAD, introducing a global temporal information aggregation framework as a new paradigm for holistic 3D scene understanding. Our method employs an in-model latent denoising network to aggregate local temporal features from the current moment and global temporal features from historical sequences. This approach enables the effective perception of both fine-grained temporal information from adjacent frames and global temporal patterns from historical observations. As a result, it provides a more coherent and comprehensive understanding of the environment. Extensive experiments on the nuScenes and Occ3D-nuScenes benchmark and ablation studies demonstrate the superiority of our method.", "summary_ja": "自動運転やロボットの動的環境認識において、既存の occupancy 手法は隣接フレーム間の局所的な時系列相互作用に依存しており、系列全体の情報を十分に活かせていないという課題を扱う。本論文は、過去の観測を含むグローバルな時系列特徴をどのように集約すれば有効な occupancy 表現が得られるかを検討する。提案手法 GTAD は、モデル内部の latent denoising network によって、現在時刻の局所的な時系列特徴と履歴系列からのグローバルな時系列特徴を統合する。nuScenes および Occ3D-nuScenes ベンチマークと ablation study で有効性を示している。", "novelty_ja": "隣接フレーム中心の局所的な temporal fusion にとどまらず、履歴系列全体を対象としたグローバル時系列集約を3Dシーン理解の枠組みとして導入した点が従来手法と異なる。さらに、その集約を in-model の latent denoising network として実現している点も特徴である。", "why_read_ja": "occupancy prediction における時系列情報の使い方は精度と一貫性を左右する主要な設計軸であり、局所から大域へと拡張する本手法の方向性は環境認識モデルの temporal 設計を追ううえで参考になる。denoising を特徴集約機構として使うアプローチも、他の BEV/occupancy 系タスクへの転用可能性がある。", "paper_url": "https://arxiv.org/abs/2507.20963", "code_url": "", "published": "2025-07-28T16:18:29Z", "relevance": 28.0}, {"key": "arxiv:2507.20224", "title": "MambaMap: Online Vectorized HD Map Construction using State Space Model", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "High-definition (HD) maps are essential for autonomous driving, as they provide precise road information for downstream tasks. Recent advances highlight the potential of temporal modeling in addressing challenges like occlusions and extended perception range. However, existing methods either fail to fully exploit temporal information or incur substantial computational overhead in handling extended sequences. To tackle these challenges, we propose MambaMap, a novel framework that efficiently fuses long-range temporal features in the state space to construct online vectorized HD maps. Specifically, MambaMap incorporates a memory bank to store and utilize information from historical frames, dynamically updating BEV features and instance queries to improve robustness against noise and occlusions. Moreover, we introduce a gating mechanism in the state space, selectively integrating dependencies of map elements in high computational efficiency. In addition, we design innovative multi-directional and spatial-temporal scanning strategies to enhance feature extraction at both BEV and instance levels. These strategies significantly boost the prediction accuracy of our approach while ensuring robust temporal consistency. Extensive experiments on the nuScenes and Argoverse2 datasets demonstrate that our proposed MambaMap approach outperforms state-of-the-art methods across various splits and perception ranges. Source code will be available at https://github.com/ZiziAmy/MambaMap.", "summary_ja": "オンラインでのベクトル化HDマップ構築において、時系列情報を十分に活用できない問題や長時間シーケンス処理時の計算コスト増大という課題に対し、状態空間モデル(SSM)ベースのMambaMapを提案している。メモリバンクに過去フレームの情報を蓄積し、BEV特徴とインスタンスクエリを動的に更新することでオクルージョンやノイズへの頑健性を高める。", "novelty_ja": "状態空間モデルにゲーティング機構を導入して地図要素間の依存関係を低計算コストで選択的に統合し、さらにBEVレベル・インスタンスレベル双方で多方向・時空間スキャン戦略を組み合わせる点が既存の時系列融合手法との違いである。", "why_read_ja": "長時間の時系列情報融合を計算効率良く扱う手法として、オンラインHDマップ構築における時間モデリングの新しい設計選択肢を示している。", "paper_url": "https://arxiv.org/abs/2507.20224", "code_url": "https://github.com/ZiziAmy/MambaMap", "published": "2025-07-27T11:09:27Z", "relevance": 17.5}, {"key": "arxiv:2507.18522", "title": "GaussianFusionOcc: A Seamless Sensor Fusion Approach for 3D Occupancy Prediction Using 3D Gaussians", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Gaussian Splatting", "Scene Understanding", "AD Perception"], "abstract": "3D semantic occupancy prediction is one of the crucial tasks of autonomous driving. It enables precise and safe interpretation and navigation in complex environments. Reliable predictions rely on effective sensor fusion, as different modalities can contain complementary information. Unlike conventional methods that depend on dense grid representations, our approach, GaussianFusionOcc, uses semantic 3D Gaussians alongside an innovative sensor fusion mechanism. Seamless integration of data from camera, LiDAR, and radar sensors enables more precise and scalable occupancy prediction, while 3D Gaussian representation significantly improves memory efficiency and inference speed. GaussianFusionOcc employs modality-agnostic deformable attention to extract essential features from each sensor type, which are then used to refine Gaussian properties, resulting in a more accurate representation of the environment. Extensive testing with various sensor combinations demonstrates the versatility of our approach. By leveraging the robustness of multi-modal fusion and the efficiency of Gaussian representation, GaussianFusionOcc outperforms current state-of-the-art models.", "summary_ja": "3D semantic occupancy predictionにおいて、従来の密なグリッド表現ではなくsemanticな3D Gaussiansを用い、カメラ・LiDAR・レーダーを統合するマルチモーダルセンサフュージョン手法GaussianFusionOccを提案している。modality-agnosticなdeformable attentionで各センサから特徴を抽出しGaussianの属性を洗練することで、精度とスケーラビリティを両立している。", "novelty_ja": "密なvoxelグリッドではなくGaussian表現を採用することでメモリ効率と推論速度を改善しつつ、複数センサの組み合わせに柔軟に対応できるmodality-agnosticな融合機構を導入している点が従来手法との違い。", "why_read_ja": "occupancy predictionにおけるGaussian表現とマルチモーダルセンサフュージョンの統合設計は、効率的な3D環境認識手法の動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2507.18522", "code_url": "", "published": "2025-07-24T15:46:38Z", "relevance": 21.5}, {"key": "arxiv:2507.13387", "title": "From Binary to Semantic: Utilizing Large-Scale Binary Occupancy Data for 3D Semantic Occupancy Prediction", "venue": "ICCV 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "Accurate perception of the surrounding environment is essential for safe autonomous driving. 3D occupancy prediction, which estimates detailed 3D structures of roads, buildings, and other objects, is particularly important for vision-centric autonomous driving systems that do not rely on LiDAR sensors. However, in 3D semantic occupancy prediction -- where each voxel is assigned a semantic label -- annotated LiDAR point clouds are required, making data acquisition costly. In contrast, large-scale binary occupancy data, which only indicate occupied or free space without semantic labels, can be collected at a lower cost. Despite their availability, the potential of leveraging such data remains unexplored. In this study, we investigate the utilization of large-scale binary occupancy data from two perspectives: (1) pre-training and (2) learning-based auto-labeling. We propose a novel binary occupancy-based framework that decomposes the prediction process into binary and semantic occupancy modules, enabling effective use of binary occupancy data. Our experimental results demonstrate that the proposed framework outperforms existing methods in both pre-training and auto-labeling tasks, highlighting its effectiveness in enhancing 3D semantic occupancy prediction. The code will be available at https://github.com/ToyotaInfoTech/b2s-occupancy", "summary_ja": "vision-centricな自動運転における3D semantic occupancy予測は、ボクセルごとの意味ラベル付けにLiDAR点群アノテーションが必要でコストが高い一方、占有/空きのみを示すbinary occupancyデータは安価に大量取得できる。本研究はこのbinary occupancyデータをpre-training用途と学習ベースauto-labeling用途の両面から活用する方法を検討し、予測プロセスをbinaryモジュールとsemanticモジュールに分解する新フレームワークを提案する。", "novelty_ja": "semantic labelを持たない大規模binary occupancyデータの活用余地に着目し、予測をbinary/semanticの2段階に分解することで既存手法にはなかった安価なデータソースの有効利用を実現した点が新しい。", "why_read_ja": "semantic occupancy予測のアノテーションコスト問題に対し、安価なbinaryデータの転用という現実的な解決策を示しており、occupancy系タスクのデータ効率化を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2507.13387", "code_url": "https://github.com/ToyotaInfoTech/b2s-occupancy", "published": "2025-07-16T01:57:16Z", "relevance": 22.0}, {"key": "arxiv:2507.02250", "title": "FMOcc: TPV-Driven Flow Matching for 3D Occupancy Prediction with Selective State Space Model", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "AD Perception", "3D Detection"], "abstract": "3D semantic occupancy prediction plays a pivotal role in autonomous driving. However, inherent limitations of fewframe images and redundancy in 3D space compromise prediction accuracy for occluded and distant scenes. Existing methods enhance performance by fusing historical frame data, which need additional data and significant computational resources. To address these issues, this paper propose FMOcc, a Tri-perspective View (TPV) refinement occupancy network with flow matching selective state space model for few-frame 3D occupancy prediction. Firstly, to generate missing features, we designed a feature refinement module based on a flow matching model, which is called Flow Matching SSM module (FMSSM). Furthermore, by designing the TPV SSM layer and Plane Selective SSM (PS3M), we selectively filter TPV features to reduce the impact of air voxels on non-air voxels, thereby enhancing the overall efficiency of the model and prediction capability for distant scenes. Finally, we design the Mask Training (MT) method to enhance the robustness of FMOcc and address the issue of sensor data loss. Experimental results on the Occ3D-nuScenes and OpenOcc datasets show that our FMOcc outperforms existing state-of-theart methods. Our FMOcc with two frame input achieves notable scores of 43.1% RayIoU and 39.8% mIoU on Occ3D-nuScenes validation, 42.6% RayIoU on OpenOcc with 5.4 G inference memory and 330ms inference time.", "summary_ja": "少数フレーム入力での3D semantic occupancy predictionにおいて、遮蔽領域や遠方シーンの推定精度が落ちる問題と3D空間の冗長性に取り組んだ研究。TPV(Tri-perspective View)表現をベースに、flow matchingで欠損した特徴を生成するFMSSMモジュールと、選択的state space model(SSM)によるTPV特徴のフィルタリングを組み合わせている。さらにセンサデータ欠損に対する頑健性を高めるMask Training手法を導入した。Occ3D-nuScenesとOpenOccで、2フレーム入力でRayIoU 43.1%/mIoU 39.8%(Occ3D-nuScenes val)を報告している。", "novelty_ja": "履歴フレームを多数積み上げて精度を稼ぐ従来手法と異なり、flow matchingによる特徴補完で少数フレームのまま欠損情報を補う点が特徴。加えてPlane Selective SSM(PS3M)により空気voxelが非空気voxelに与える影響を抑え、計算効率と遠方予測の両立を狙っている。", "why_read_ja": "occupancy predictionに生成モデル(flow matching)とstate space modelを持ち込む流れを示す事例であり、多フレーム依存を減らしつつ遮蔽・遠方を扱う設計指針として参考になる。推論メモリ5.4G・330msといった実用性寄りの数値も報告されている。", "paper_url": "https://arxiv.org/abs/2507.02250", "code_url": "", "published": "2025-07-03T02:58:39Z", "relevance": 25.0}, {"key": "arxiv:2506.21185", "title": "Out-of-Distribution Semantic Occupancy Prediction", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Open-world", "Scene Understanding", "3D Detection", "HD Map", "AD Perception"], "abstract": "3D semantic occupancy prediction is crucial for autonomous driving, providing a dense, semantically rich environmental representation. However, existing methods focus on in-distribution scenes, making them susceptible to Out-of-Distribution (OoD) objects and long-tail distributions, which increases the risk of undetected anomalies and misinterpretations, posing safety hazards. To address these challenges, we introduce Out-of-Distribution Semantic Occupancy Prediction, targeting OoD detection in 3D voxel space. To fill dataset gaps, we propose a Realistic Anomaly Augmentation that injects synthetic anomalies while preserving realistic spatial and occlusion patterns, enabling the creation of two datasets: VAA-KITTI and VAA-KITTI-360. Then, a novel framework that integrates OoD detection into 3D semantic occupancy prediction, OccOoD, is proposed, which uses Cross-Space Semantic Refinement (CSSR) to refine semantic predictions from complementary voxel and BEV representations, improving OoD detection. Experimental results demonstrate that OccOoD achieves state-of-the-art OoD detection with an AuROC of 65.50% and an AuPRCr of 31.83 within a 1.2m region, while maintaining competitive semantic occupancy prediction performance and generalization in real-world urban driving scenes. The established datasets and source code will be made publicly available at https://github.com/7uHeng/OccOoD.", "summary_ja": "3D semantic occupancy predictionは自動運転向けの密な意味表現として有用だが、既存手法は学習分布内のシーンを前提としており、未知物体やlong-tailな対象を見落とすリスクがあるという課題を扱っている。本論文はvoxel空間でのOoD検出を行う新しいタスク設定「Out-of-Distribution Semantic Occupancy Prediction」を提案する。データ不足を補うため、現実的な空間配置とocclusionのパターンを保ったまま合成異常物体を挿入するRealistic Anomaly Augmentationを設計し、VAA-KITTIとVAA-KITTI-360という2つのデータセットを構築した。さらに、occupancy予測にOoD検出を統合したフレームワークOccOoDを提案している。", "novelty_ja": "従来のoccupancy予測が既知クラスの意味推定に閉じていたのに対し、voxel空間でのOoD検出をタスクとして定式化した点が新しい。手法面では、voxel表現とBEV表現という相補的な2つの空間から意味予測を補正するCross-Space Semantic Refinement (CSSR) を導入している。", "why_read_ja": "occupancyベースの環境認識を実運用に近づけるうえで避けられない未知物体への対応を正面から扱っており、open-world perceptionとoccupancy予測を接続する事例として参考になる。異常物体を含むベンチマークとコードが公開予定である点も、評価基盤として追う価値がある。", "paper_url": "https://arxiv.org/abs/2506.21185", "code_url": "https://github.com/7uHeng/OccOoD", "published": "2025-06-26T12:44:29Z", "relevance": 29.5}, {"key": "arxiv:2506.18798", "title": "OC-SOP: Enhancing Vision-Based 3D Semantic Occupancy Prediction by Object-Centric Awareness", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "AD Perception"], "abstract": "Autonomous driving perception faces significant challenges due to occlusions and incomplete scene data in the environment. To overcome these issues, the task of semantic occupancy prediction (SOP) is proposed, which aims to jointly infer both the geometry and semantic labels of a scene from images. However, conventional camera-based methods typically treat all categories equally and primarily rely on local features, leading to suboptimal predictions, especially for dynamic foreground objects. To address this, we propose Object-Centric SOP (OC-SOP), a framework that integrates high-level object-centric cues extracted via a detection branch into the semantic occupancy prediction pipeline. This object-centric integration significantly enhances the prediction accuracy for foreground objects and achieves state-of-the-art performance among all categories on SemanticKITTI.", "summary_ja": "カメラ画像からシーンの幾何形状と意味ラベルを同時に推定するsemantic occupancy predictionにおいて、従来手法が全カテゴリを均等に扱い局所特徴に依存するため動的な前景物体の予測精度が低いという課題を扱っている。提案手法OC-SOPは検出ブランチから得たobject-centricな高次特徴をoccupancy予測パイプラインに統合することでこれを解決する。", "novelty_ja": "物体検出由来のobject-centric情報を明示的に注入することで、局所特徴中心の従来手法に比べ前景の動的物体の予測を強化している点が新規性である。", "why_read_ja": "occupancy予測における前景/動的物体への対処は自動運転の実用上重要な課題であり、検出情報との統合アプローチは今後の手法設計の参考になる。", "paper_url": "https://arxiv.org/abs/2506.18798", "code_url": "", "published": "2025-06-23T16:03:53Z", "relevance": 23.0}, {"key": "arxiv:2506.17004", "title": "A Synthetic Benchmark for Collaborative 3D Semantic Occupancy Prediction in V2X-Enabled Autonomous Driving", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "3D semantic occupancy prediction is an emerging perception paradigm in autonomous driving, providing a voxel-level representation of both geometric details and semantic categories. However, its effectiveness is inherently constrained in single-vehicle setups by occlusions, restricted sensor range, and narrow viewpoints. To address these limitations, collaborative perception enables the exchange of complementary informati
