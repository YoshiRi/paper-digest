detection while maintaining accuracy on planning-critical agents.", "summary_ja": "マルチビュー3D物体検出向けViTは高精度だが、複数視点・広範な3D領域のトークンとクエリを密に処理するため推論遅延が大きい。既存の2D向けスパース化手法は画像トークンの削減にとどまり、3Dオブジェクトクエリやモデル全体のスパース化には対応できていない。本論文はSToRe3Dという、2D画像トークンと3Dオブジェクトクエリを関連度に基づいて同時選択し、除外した特徴を後で再活性化できる形で保持するフレームワークを提案する。", "novelty_ja": "2D-3D相互関連度ヘッドにより走行判断上重要な領域へ計算資源を配分しつつ、他の特徴は破棄せず保存・再利用可能にする点が、画像トークンのみを扱う既存の2Dスパース化手法との違い。", "why_read_ja": "nuScenesで3倍の推論高速化と精度維持を両立させており、リアルタイム性が求められる車載3D検出の効率化トレンドを追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2605.14110", "code_url": "", "published": "", "relevance": 19.5}, {"key": "openaccess.thecvf.com/content/cvpr2026/html/fu_scene_reconstruction_as_mapping_priors_for_3d_detection_cvpr_2026_paper.html", "title": "Scene Reconstruction as Mapping Priors for 3D Detection", "venue": "CVPR 2026", "year": 2026, "topic": "3D Detection", "topics": ["3D Detection", "Reconstruction", "AD Perception"], "abstract": "In autonomous driving, mapping is critical for motion planning but remains an under-utilized resource for perception tasks like 3D object detection. Maps can provide robust structural priors of the static environment, suited to resolving ambiguities and correcting for sensor data sparsity or noise -- issues especially prevalent for distant objects or during adverse weather conditions. However, conventional High-Definition (HD) maps are resource-intensive to obtain and maintain, which presents a challenge for achieving efficient, large-scale deployment. In this paper, we propose a scalable solution to systemically leverage mapping to improve 3D detection by overcoming two primary challenges. First, we introduce a pipeline to automatically build dense mapping priors from aggregated sensor data, eliminating the need for human labeling. Second, we design a novel Mapping Prior Augmented 3D detection (MPA3D) framework to effectively integrate the mapping priors with the distinct modalities of sensor data. Our extensive experiments on the Waymo Open Dataset demonstrate that our approach achieves new state-of-the-art results, and proving the effectiveness of using scalable, reconstructed scene priors to enhance 3D detection.", "summary_ja": "自動運転の3D物体検出において、地図情報が持つ静的環境の構造的事前知識が十分に活用されていない点に着目し、センサデータを人手ラベルなしで集約・再構成して密な地図事前情報(mapping priors)を自動生成するパイプラインを提案している。さらにこの事前情報を異なるセンサモダリティの検出器と統合するMPA3Dというフレームワークを設計し、遠方物体や悪天候など点群が疎・ノイジーになる状況での検出精度低下を補う。", "novelty_ja": "従来のHDマップは人手による作成・維持コストが高く大規模展開が難しいのに対し、本手法は集約センサデータから自動的に密な地図事前情報を再構成する点、およびそれを3D検出器にモダリティを跨いで統合する点が新しい。", "why_read_ja": "HDマップ生成コストの問題を、地図生成そのものではなく認識タスク(3D検出)への再構成事前情報という形で回避しつつ精度向上を狙うアプローチであり、Map ReconstructionとPerceptionの接点を考える上で参考になる。", "paper_url": "https://openaccess.thecvf.com/content/CVPR2026/html/Fu_Scene_Reconstruction_as_Mapping_Priors_for_3D_Detection_CVPR_2026_paper.html", "code_url": "", "published": "", "relevance": 19.5}, {"key": "arxiv:2603.08254", "title": "DynamicVGGT: Learning Dynamic Point Maps for 4D Scene Reconstruction in Autonomous Driving", "venue": "CVPR 2026", "year": 2026, "topic": "Reconstruction", "topics": ["Reconstruction", "Gaussian Splatting", "AD Perception"], "abstract": "Dynamic scene reconstruction in autonomous driving remains a fundamental challenge due to significant temporal variations, moving objects, and complex scene dynamics. Existing feed-forward 3D models have demonstrated strong performance in static reconstruction but still struggle to capture dynamic motion. To address these limitations, we propose DynamicVGGT, a unified feed-forward framework that extends VGGT from static 3D perception to dynamic 4D reconstruction. Our goal is to model point motion within feed-forward 3D models in a dynamic and temporally coherent manner. To this end, we jointly predict the current and future point maps within a shared reference coordinate system, allowing the model to implicitly learn dynamic point representations through temporal correspondence. To efficiently capture temporal dependencies, we introduce a Motion-aware Temporal Attention (MTA) module that learns motion continuity. Furthermore, we design a Dynamic 3D Gaussian Splatting Head (DGSH) that explicitly models point motion by predicting Gaussian velocities using learnable motion tokens under scene flow supervision. It refines dynamic geometry through continuous 3D Gaussian optimization. Extensive experiments on autonomous driving datasets demonstrate that DynamicVGGT significantly outperforms existing methods in reconstruction accuracy and temporal consistency, achieving robust feed-forward 4D dynamic scene reconstruction under complex driving scenarios.", "summary_ja": "自動運転における動的シーン再構成では移動物体や時間変化の扱いが課題となる。本研究はVGGTを静的3D復元から動的4D復元へ拡張したDynamicVGGTを提案し、現在と将来の点群マップを共通の参照座標系で同時予測することで時間的対応を通じた動的点表現の学習を行う。Motion-aware Temporal Attentionで時間依存性を捉え、Dynamic 3D Gaussian Splatting Headでシーンフロー教師あり学習によりGaussian速度を予測し幾何を精緻化する。", "novelty_ja": "静的復元に強い既存のfeed-forward 3Dモデル(VGGT)を、明示的なGaussian速度予測と時間的注意機構により動的4D復元へ拡張した点が新規性。", "why_read_ja": "feed-forwardな4D動的シーン復元は地図生成・環境認識における動的物体表現の基盤技術であり、Gaussian Splattingベースの手法動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2603.08254", "code_url": "", "published": "", "relevance": 19.0}, {"key": "arxiv:2604.17135", "title": "OptiMVMap: Offline Vectorized Map Construction via Optimal Multi-vehicle Perspectives", "venue": "CVPR 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "Offline vectorized maps constitute critical infrastructure for high-precision autonomous driving and mapping services. Existing approaches rely predominantly on single ego-vehicle trajectories, which fundamentally suffer from viewpoint insufficiency: while memory-based methods extend observation time by aggregating ego-trajectory frames, they lack the spatial diversity needed to reveal occluded regions. Incorporating views from surrounding vehicles offers complementary perspectives, yet naive fusion introduces three key challenges: computational cost from large candidate pools, redundancy from near-collinear viewpoints, and noise from pose errors and occlusion artifacts. We present OptiMVMap, which reformulates multi-vehicle mapping as a select-then-fuse problem to address these challenges systematically. An Optimal Vehicle Selection (OVS) module strategically identifies a compact subset of helpers that maximally reduce ego-centric uncertainty in occluded regions, addressing computation and redundancy challenges. Cross-Vehicle Attention (CVA) and Semantic-aware Noise Filter (SNF) then perform pose-tolerant alignment and artifact suppression before BEV-level fusion, addressing the noise challenge. This targeted pipeline yields more complete and topologically faithful maps with substantially fewer views than indiscriminate aggregation. On nuScenes and Argoverse2, OptiMVMap improves MapTRv2 by +10.5 mAP and +9.3 mAP, respectively, and surpasses memory-augmented baselines MVMap and HRMapNet by +6.2 mAP and +3.8 mAP on nuScenes. These results demonstrate that uncertainty-guided selection of helper vehicles is essential for efficient and accurate multi-vehicle vectorized mapping. The code is released at https://github.com/DanZeDong/OptiMVMap.", "summary_ja": "単一車両軌跡のみに依存する従来のオフラインベクトルマップ構築では死角領域の観測が不十分になる課題に対し、周辺車両の視点を活用するOptiMVMapを提案。Optimal Vehicle Selection (OVS)で不確実性低減に寄与する少数の補助車両を選び、Cross-Vehicle Attention (CVA)とSemantic-aware Noise Filter (SNF)でポーズ誤差や遮蔽由来のノイズを抑えつつBEV上で融合する。", "novelty_ja": "全視点を無差別に集約する既存のメモリベース手法と異なり、不確実性を指標に少数の補助車両を選択してから融合する select-then-fuse アプローチを取ることで、計算コストと視点冗長性を抑えつつ精度を高めている。", "why_read_ja": "マルチエージェント視点統合によるHDマップ精度向上の方向性を示し、単一車両ベースの地図生成の限界を補う具体的な設計(選択・融合の分離)を提示している点で、地図生成研究の動向として参照価値が高い。", "paper_url": "https://arxiv.org/abs/2604.17135", "code_url": "https://github.com/DanZeDong/OptiMVMap", "published": "", "relevance": 17.5}, {"key": "openaccess.thecvf.com/content/cvpr2026/html/bai_topohr_hierarchical_centerline_representation_for_cyclic_topology_reasoning_in_driving_cvpr_2026_paper.html", "title": "TopoHR: Hierarchical Centerline Representation for Cyclic Topology Reasoning in Driving Scenes with Point-to-Instance Relations", "venue": "CVPR 2026", "year": 2026, "topic": "Topology", "topics": ["Topology", "AD Perception"], "abstract": "Topology reasoning is crucial for autonomous driving. Current methods primarily focus on instance-level learning for centerline detection, followed by a sequential module for topology reasoning that relies on simplified MLP layers. Moreover, these approaches often neglect the importance of point-to-instance (P2I) relationships in topology reasoning. To address these limitations, we present TopoHR (Topological Hierarchical Representation), a novel end-to-end framework that establishes cyclic interaction between centerline detection and topology reasoning, allowing them to iteratively enhance each other. Specifically, we introduce a hierarchical centerline representation including point queries, instance queries, and semantic representations. These multi-level features are seamlessly integrated and fused within a hierarchical centerline decoder. Furthermore, we design a hierarchical topology reasoning module that captures both fine-grained P2I relationships and global instance-to-instance (I2I) connections within a unified architecture. With these novel components, TopoHR ensures accurate and robust topology reasoning. On the OpenLane-V2 benchmark, TopoHR refreshes state-of-the-art performance with significant improvements. Notably, compared with previous best results, TopoHR achieves +3.8 in \\mathrm DET _ \\text l , +5.4 in \\mathrm TOP _ \\text ll on subset_A and +11.0 in \\mathrm DET _ \\text l , +7.9 in \\mathrm TOP _ \\text ll on subset_B, validating the effectiveness of the proposed components. The code will be shared publicly upon paper acceptance.", "summary_ja": "自動運転シーンにおけるcenterline検出とtopology推論を統合的に扱う論文。従来手法はcenterlineをインスタンス単位で検出した後、簡易なMLPでtopologyを推論しており、点とインスタンス間(P2I)の関係性を軽視していた。TopoHRはpoint query・instance query・semantic representationからなる階層的centerline表現を導入し、検出とtopology推論が相互に反復強化し合うend-to-endフレームワークを提案する。", "novelty_ja": "point-to-instance関係とinstance-to-instance関係を単一アーキテクチャ内で同時に捉える階層的topology推論モジュールを導入し、検出とtopology推論を循環的(cyclic)に相互作用させる点が従来の逐次パイプラインと異なる。", "why_read_ja": "OpenLane-V2ベンチマークでDET_lとTOP_llを大幅に更新しており、lane topology推論の最新SOTA動向を把握する上で参照価値が高い。", "paper_url": "https://openaccess.thecvf.com/content/CVPR2026/html/Bai_TopoHR_Hierarchical_Centerline_Representation_for_Cyclic_Topology_Reasoning_in_Driving_CVPR_2026_paper.html", "code_url": "", "published": "", "relevance": 16.0}, {"key": "arxiv:2507.19856", "title": "RaGS: Unleashing 3D Gaussian Splatting from 4D Radar and Monocular Cue for 3D Object Detection", "venue": "CVPR 2026", "year": 2026, "topic": "3D Detection", "topics": ["3D Detection", "Gaussian Splatting", "HD Map", "AD Perception"], "abstract": "4D millimeter-wave radar is a promising sensing modality for autonomous driving, yet effective 3D object detection from 4D radar and monocular images remains challenging. Existing fusion approaches either rely on instance proposals lacking global context or dense BEV grids constrained by rigid structures, lacking a flexible and adaptive representation for diverse scenes. To address this, we propose RaGS, the first framework that models the scene as a continuous field of Gaussians, enabling dynamic resource allocation to foreground objects detection while maintaining flexibility and efficiency. Specifically, RaGS adopts a cascaded pipeline to construct and progressively refine the Gaussian field. It begins with Frustum-based Localization Initiation (FLI), which unprojects foreground pixels to initialize coarse Gaussian centers. Then, Iterative Multimodal Aggregation (IMA) explicitly exploits image semantics and implicitly integrates 4D radar velocity geometry to refine the Gaussians within regions of interest. Finally, Multi-level Gaussian Fusion (MGF) renders the Gaussian field into hierarchical BEV features for 3D object detection. By dynamically focusing on sparse and informative regions, RaGS achieves object-centric precision and comprehensive scene perception. Extensive experiments on View-of-Delft, TJ4DRadSet, and OmniHD-Scenes demonstrate its robustness and SOTA performance. Source code is available at https://github.com/shawnnnkb/RaGS.", "summary_ja": "4D millimeter-wave radarと単眼画像を用いた3D物体検出において、既存のinstance proposalベースやBEVグリッドベースの融合手法が持つ表現の硬直性を解消するため、シーンをGaussianの連続場としてモデル化するRaGSを提案する。Frustum-based Localization Initiationで画素をunprojectしてGaussian中心を初期化し、Iterative Multimodal AggregationでRoI内のGaussianを画像意味情報とradarの速度・幾何情報で refinementし、Multi-level Gaussian Fusionで階層的BEV特徴に変換して検出する。View-of-Delft、TJ4DRadSet、OmniHD-Scenesで検証している。", "novelty_ja": "固定的なinstance proposalや剛直なBEVグリッド構造に依存せず、前景領域に動的にリソースを割り当てられるGaussian場としてシーンを表現する点が従来手法との違い。", "why_read_ja": "Gaussian SplattingをBEV特徴生成・3D検出のバックボーンとして応用する設計は、occupancyやシーン表現の柔軟化を狙う地図生成・環境認識研究の潮流と直結しており参考になる。", "paper_url": "https://arxiv.org/abs/2507.19856", "code_url": "https://github.com/shawnnnkb/RaGS", "published": "", "relevance": 15.5}, {"key": "arxiv:2604.05780", "title": "Sparsity-Aware Voxel Attention and Foreground Modulation for 3D Semantic Scene Completion", "venue": "CVPR 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "3D Detection", "Scene Understanding", "AD Perception"], "abstract": "Monocular Semantic Scene Completion (SSC) aims to reconstruct complete 3D semantic scenes from a single RGB image, offering a cost-effective solution for autonomous driving and robotics. However, the inherently imbalanced nature of voxel distributions--where over 93% of voxels are empty and foreground classes are rare--poses significant challenges. Existing methods often suffer from redundant emphasis on uninformative voxels and poor generalization to long-tailed categories. To address these issues, we propose VoxSAMNet (Voxel Sparsity-Aware Modulation Network), a unified framework that explicitly models voxel sparsity and semantic imbalance. Our approach introduces: (1) a Dummy Shortcut for Feature Refinement (DSFR) module that bypasses empty voxels via a shared dummy node while refining occupied ones with deformable attention; (2) a Foreground Modulation Strategy combining Foreground Dropout (FD) and Text-Guided Image Filter (TGIF) to alleviate overfitting and enhance class-relevant features. Extensive experiments on the public benchmarks SemanticKITTI and SSCBench-KITTI-360 demonstrate that VoxSAMNet achieves state-of-the-art performance, surpassing prior monocular and stereo baselines with mIoU scores of 18.2% and 20.2%, respectively. Our results highlight the importance of sparsity-aware and semantics-guided design for efficient and accurate 3D scene completion, offering a promising direction for future research.", "summary_ja": "単眼RGB画像から3D意味シーンを完成させるSSCタスクにおいて、ボクセルの93%以上が空でクラスも長尾分布という不均衡問題に着目。空ボクセルをダミーノード経由でスキップしつつ占有ボクセルをdeformable attentionで精緻化するDSFRモジュールと、前景クラスの過学習を抑えつつ関連特徴を強調するForeground Dropout・Text-Guided Image Filterから成るVoxSAMNetを提案している。", "novelty_ja": "空ボクセルへの冗長な計算を避ける疎性認識設計と、テキスト誘導によるクラス関連特徴の強調を組み合わせた点が従来の均一的なボクセル処理手法と異なる。", "why_read_ja": "単眼カメラのみでOccupancy/SSCを高精度化する試みであり、コスト効率の良い環境認識手法としてOccupancy Prediction分野の最新動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2604.05780", "code_url": "", "published": "", "relevance": 14.0}, {"key": "arxiv:2604.19379", "title": "PanDA: Unsupervised Domain Adaptation for Multimodal 3D Panoptic Segmentation in Autonomous Driving", "venue": "CVPR 2026", "year": 2026, "topic": "Scene Understanding", "topics": ["Scene Understanding", "AD Perception"], "abstract": "This paper presents the first study on Unsupervised Domain Adaptation (UDA) for multimodal 3D panoptic segmentation (mm-3DPS), aiming to improve generalization under domain shifts commonly encountered in real-world autonomous driving. A straightforward solution is to employ a pseudo-labeling strategy, which is widely used in UDA to generate supervision for unlabeled target data, combined with an mm-3DPS backbone. However, existing supervised mm-3DPS methods rely heavily on strong cross-modal complementarity between LiDAR and RGB inputs, making them fragile under domain shifts where one modality degrades (e.g., poor lighting or adverse weather). Moreover, conventional pseudo-labeling typically retains only high-confidence regions, leading to fragmented masks and incomplete object supervision, which are issues particularly detrimental to panoptic segmentation. To address these challenges, we propose PanDA, the first UDA framework specifically designed for multimodal 3D panoptic segmentation. To improve robustness against single-sensor degradation, we introduce an asymmetric multimodal augmentation that selectively drops regions to simulate domain shifts and improve robust representation learning. To enhance pseudo-label completeness and reliability, we further develop a dual-expert pseudo-label refinement module that extracts domain-invariant priors from both 2D and 3D modalities. Extensive experiments across diverse domain shifts, spanning time, weather, location, and sensor variations, significantly surpass state-of-the-art UDA baselines for 3D semantic segmentation.", "summary_ja": "本論文は、天候・時間帯・場所・センサ構成などのドメインシフト下で性能が劣化する、自動運転向けマルチモーダル3Dパノプティックセグメンテーション(mm-3DPS)の教師なしドメイン適応(UDA)を扱う。既存の疑似ラベル手法は高信頼領域のみを残すため、パノプティック分割に不可欠なマスクの完全性が損なわれる問題を指摘し、PanDAという専用UDAフレームワークを提案する。", "novelty_ja": "片方のモダリティが劣化する状況を模した非対称マルチモーダル拡張と、2D/3D両モダリティからドメイン不変な事前情報を抽出するdual-expert疑似ラベル精緻化モジュールにより、単一モダリティ劣化への頑健性と疑似ラベルの完全性を同時に高めている点が従来の3Dセマンティックセグメンテーション向けUDA手法との違い。", "why_read_ja": "実運用で避けられないドメインシフト(天候・照明・センサ差異)への頑健性は、環境認識モデルを実車展開する際の重要課題であり、マルチモーダル融合とパノプティック分割の両面を扱う本研究は最新動向を把握する上で参考になる。", "paper_url": "https://arxiv.org/abs/2604.19379", "code_url": "", "published": "", "relevance": 13.0}, {"key": "arxiv:2603.27238", "title": "An Instance-Centric Panoptic Occupancy Prediction Benchmark for Autonomous Driving", "venue": "CVPR 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "3D Detection", "AD Perception"], "abstract": "Panoptic occupancy prediction aims to jointly infer voxel-wise semantics and instance identities within a unified 3D scene representation. Nevertheless, progress in this field remains constrained by the absence of high-quality 3D mesh resources, instance-level annotations, and physically consistent occupancy datasets. Existing benchmarks typically provide incomplete and low-resolution geometry without instance-level annotations, limiting the development of models capable of achieving precise geometric reconstruction, reliable occlusion reasoning, and holistic 3D understanding. To address these challenges, this paper presents an instance-centric benchmark for the 3D panoptic occupancy prediction task. Specifically, we introduce ADMesh, the first unified 3D mesh library tailored for autonomous driving, which integrates over 15K high-quality 3D models with diverse textures and rich semantic annotations. Building upon ADMesh, we further construct CarlaOcc, a large-scale, physically consistent panoptic occupancy dataset generated using the CARLA simulator. This dataset contains over 100K frames with fine-grained, instance-level occupancy ground truth at voxel resolutions as fine as 0.05 m. Furthermore, standardized evaluation metrics are introduced to quantify the quality of existing occupancy datasets. Finally, a systematic benchmark of representative models is established on the proposed dataset, which provides a unified platform for fair comparison and reproducible research in the field of 3D panoptic perception. Code and dataset are available at https://mias.group/CarlaOcc.", "summary_ja": "自動運転向けpanoptic occupancy予測は、高品質な3Dメッシュ資源とインスタンス単位の物理的整合性のあるデータセットが不足しており進展が阻害されているとして、著者らはADMeshという15K以上の高品質3DモデルからなるCG資産ライブラリと、CARLAシミュレータで生成したインスタンス単位のoccupancy正解を持つ大規模データセットCarlaOccを構築した。あわせて既存occupancyデータセットの品質を測る標準評価指標も提案し、代表的手法のベンチマークを行っている。", "novelty_ja": "既存ベンチマークが低解像度・インスタンス注釈欠如の不完全な幾何情報しか提供しない点に対し、0.05m解像度のインスタンス単位occupancy正解と専用3Dメッシュライブラリを組み合わせて提供する点が新しい。", "why_read_ja": "occupancy予測研究の評価基盤として、インスタンスレベルの精緻な正解データと標準化指標を提供しており、今後の手法比較・再現性確保の動向を追ううえで参照価値が高い。", "paper_url": "https://arxiv.org/abs/2603.27238", "code_url": "", "published": "", "relevance": 13.0}, {"key": "arxiv:2507.22052", "title": "Ov3R: Open-Vocabulary Semantic 3D Reconstruction from RGB Videos", "venue": "CVPR 2026", "year": 2026, "topic": "Reconstruction", "topics": ["Open-world", "Reconstruction"], "abstract": "We present Ov3R, a novel framework for open-vocabulary semantic 3D reconstruction from RGB video streams, designed to advance Spatial AI. The system features two key components: CLIP3R, a CLIP-informed 3D reconstruction module that predicts dense point maps from overlapping clips alongside object-level semantics; and 2D-3D OVS, a 2D-3D open-vocabulary semantic module that lifts 2D features into 3D by learning fused descriptors integrating spatial, geometric, and semantic cues. Unlike prior methods, Ov3R incorporates CLIP semantics directly into the reconstruction process, enabling globally consistent geometry and fine-grained semantic alignment. Our framework achieves state-of-the-art performance in both dense 3D reconstruction and open-vocabulary 3D segmentation.", "summary_ja": "Ov3Rは、RGB動画ストリームからオープン語彙の意味的3D再構成を行うフレームワークである。重なり合うクリップから密な点群マップと物体レベルの意味情報を同時に予測するCLIP3Rと、2D特徴を空間・幾何・意味情報を統合した記述子として3Dへ持ち上げる2D-3D OVSモジュールから構成される。", "novelty_ja": "従来手法とは異なり、CLIPによる意味情報を再構成プロセス自体に組み込むことで、大域的に一貫した幾何形状と細粒度の意味的整合を同時に達成している点が新しい。", "why_read_ja": "RGB動画のみからの密な3D再構成とオープン語彙セグメンテーションを統合するアプローチは、地図生成やシーン理解におけるオープンボキャブラリ対応の潮流を把握するうえで参考になる。", "paper_url": "https://arxiv.org/abs/2507.22052", "code_url": "", "published": "", "relevance": 11.5}, {"key": "arxiv:2604.23604", "title": "Learning to Identify Out-of-Distribution Objects for 3D LiDAR Anomaly Segmentation", "venue": "CVPR 2026", "year": 2026, "topic": "Open-world", "topics": ["Open-world", "AD Perception"], "abstract": "Understanding the surrounding environment is fundamental in autonomous driving and robotic perception. Distinguishing between known classes and previously unseen objects is crucial in real-world environments, as done in Anomaly Segmentation. However, research in the 3D field remains limited, with most existing approaches applying post-processing techniques from 2D vision. To cover this lack, we propose a new efficient approach that directly operates in the feature space, modeling the feature distribution of inlier classes to constrain anomalous samples. Moreover, the only publicly available 3D LiDAR anomaly segmentation dataset contains simple scenarios, with few anomaly instances, and exhibits a severe domain gap due to its sensor resolution. To bridge this gap, we introduce a set of mixed real-synthetic datasets for 3D LiDAR anomaly segmentation, built upon established semantic segmentation benchmarks, with multiple out-of-distribution objects and diverse, complex environments. Extensive experiments demonstrate that our approach achieves state-of-the-art and competitive results on the existing real-world dataset and the newly introduced mixed datasets, respectively, validating the effectiveness of our method and the utility of the proposed datasets. Code and datasets are available at https://simom0.github.io/lido-page/.", "summary_ja": "自動運転向けのLiDARベース3D意味セグメンテーションにおいて、既知クラスに含まれない未知物体(anomaly)を検出する課題を扱う論文。既存手法の多くが2D画像処理の後処理手法を3Dに流用しているのに対し、特徴空間で直接inlierクラスの分布をモデル化し異常サンプルを制約する新手法を提案する。あわせて、既存の3D LiDAR anomaly segmentationデータセットが単純すぎる点を補うため、既存の意味セグメンテーションベンチマークを基にした実データと合成データを混合した新データセット群も提示する。", "novelty_ja": "2D由来の後処理的アプローチではなく、特徴空間でinlierクラス分布を直接モデル化して異常を検出する点、および複雑・多様な環境と多数の異常物体を含む新規データセットを提供する点が従来との違い。", "why_read_ja": "自動運転の3D認識において未知物体検出はOpen-world Perceptionの中核課題であり、LiDARベースの手法とデータセット整備の動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2604.23604", "code_url": "", "published": "", "relevance": 11.0}, {"key": "arxiv:2603.18510", "title": "OnlinePG: Online Open-Vocabulary Panoptic Mapping with 3D Gaussian Splatting", "venue": "CVPR 2026", "year": 2026, "topic": "Gaussian Splatting", "topics": ["Gaussian Splatting", "Open-world"], "abstract": "Open-vocabulary scene understanding with online panoptic mapping is essential for embodied applications to perceive and interact with environments. However, existing methods are predominantly offline or lack instance-level understanding, limiting their applicability to real-world robotic tasks. In this paper, we propose OnlinePG, a novel and effective system that integrates geometric reconstruction and open-vocabulary perception using 3D Gaussian Splatting in an online setting. Technically, to achieve online panoptic mapping, we employ an efficient local-to-global paradigm with a sliding window. To build local consistency map, we construct a 3D segment clustering graph that jointly leverages geometric and semantic cues, fusing inconsistent segments within sliding window into complete instances. Subsequently, to update the global map, we construct explicit spatial attribute grids for the local 3D Gaussian map and fuse them into the global map via robust bidirectional bipartite 3D Gaussian instance matching. Finally, we utilize the fused VLM features inside the 3D spatial attribute grids to achieve open-vocabulary scene understanding. Extensive experiments on widely used datasets demonstrate that our method achieves better performance among online approaches, while maintaining real-time efficiency.", "summary_ja": "オンラインでの3D Gaussian Splattingによるopen-vocabulary panoptic mappingを提案する論文。従来手法がオフライン処理かインスタンスレベル理解を欠く点を課題とし、スライディングウィンドウでローカルに3Dセグメントをクラスタリングして一貫したインスタンスを構築し、それをbidirectionalなGaussianインスタンスマッチングでグローバルマップに逐次統合する仕組みを提示している。最終的にVLM特徴を空間グリッドに埋め込み、open-vocabularyなシーン理解を実現する。", "novelty_ja": "オフライン処理が主流だったopen-vocabulary panoptic mappingを、local-to-globalのスライディングウィンドウ方式と3D Gaussianインスタンスの明示的な空間属性グリッドによるマッチング・融合でオンライン化した点が従来との違い。", "why_read_ja": "3D Gaussian Splattingをリアルタイム制約のあるオンライン設定でシーン理解に応用する事例であり、自動運転向けのOccupancy/Scene Understanding手法の設計に転用できる知見を含む。", "paper_url": "https://arxiv.org/abs/2603.18510", "code_url": "", "published": "", "relevance": 10.5}, {"key": "openaccess.thecvf.com/content/cvpr2026/html/wu_recedit-drive_3d_reconstruction-guided_spatiotemporal_video_editing_for_autonomous_driving_scenes_cvpr_2026_paper.html", "title": "RecEdit-Drive: 3D Reconstruction-Guided Spatiotemporal Video Editing for Autonomous Driving Scenes", "venue": "CVPR 2026", "year": 2026, "topic": "AD Perception", "topics": ["Reconstruction", "AD Perception"], "abstract": "High-quality video editing and processing are crucial in domains such as filmmaking and autonomous driving, where accurate visual refinement and data preparation are essential. However, it is challenging to achieve precise control over dynamic objects while maintaining spatiotemporal consistency. Current approaches typically utilize text prompts or 2D structural priors for video editing to ensure consistency, yet they struggle to effectively constrain the spatial variations of dynamic 3D objects. In this paper, we introduce RecEdit-Drive, a framework that integrates Spatial Feature Warping and Spatiotemporal Collaborative Modeling to effectively control 3D object variations and enhance video consistency. The spatial feature warping enhances precise control over the edited foreground 3D objects, enhancing spatial consistency in the generated videos; and the spatiotemporal collaborative modeling seamlessly integrates edited foreground objects into the background, yielding realistic and consistent edited videos. Besides, we design an inference strategy to reconstruct an accurate background structure through noise manipulation, providing a reliable reference for foreground instance editing at early denoising stages. We perform extensive qualitative and quantitative comparisons regarding general video editing and downstream tasks on the public datasets, demonstrating the state-of-the-art performance of our proposed method.", "summary_ja": "自動運転シーンの動画において、動的3Dオブジェクトを精密に制御しつつ時空間的な一貫性を保つ編集手法を提案している。Spatial Feature Warpingで前景3Dオブジェクトの空間変化を制御し、Spatiotemporal Collaborative Modelingで編集後の前景を背景に自然に統合する。加えて、denoising初期段階で背景構造をノイズ操作により再構成し、前景編集の参照として利用する推論戦略を設計している。", "novelty_ja": "テキストプロンプトや2D構造的事前情報に依存する既存の動画編集手法と異なり、3D再構成に基づく空間特徴のワーピングで動的3Dオブジェクトの変化を直接制御する点が特徴。", "why_read_ja": "自動運転向けデータ生成・拡張の観点で、3D再構成を活用した動画編集は知覚モデルの学習データ整備やシミュレーションに応用できるため、地図生成・環境認識研究の周辺動向として押さえておく価値がある。", "paper_url": "https://openaccess.thecvf.com/content/CVPR2026/html/Wu_RecEdit-Drive_3D_Reconstruction-Guided_Spatiotemporal_Video_Editing_for_Autonomous_Driving_Scenes_CVPR_2026_paper.html", "code_url": "", "published": "", "relevance": 10.0}, {"key": "openaccess.thecvf.com/content/iccv2025/html/fan_riocc_efficient_cross-modal_fusion_transformer_with_collaborative_feature_refinement_for_iccv_2025_paper.html", "title": "RIOcc: Efficient Cross-Modal Fusion Transformer with Collaborative Feature Refinement for 3D Semantic Occupancy Prediction", "venue": "ICCV 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "AD Perception", "HD Map", "3D Detection"], "abstract": "The multi-modal 3D semantic occupancy task provides a comprehensive understanding of the scene and has received considerable attention in the field of autonomous driving. However, existing methods mainly focus on processing large-scale voxels, which bring high computational costs and degrade details. Additionally, they struggle to accurately capture occluded targets and distant information. In this paper, we propose a novel LiDAR-Camera 3D semantic occupancy prediction framework called RIOcc, with collaborative feature refinement and multi-scale cross-modal fusion transformer. Specifically, RIOcc encodes multi-modal data into a unified Bird's Eye View (BEV) space, which reduces computational complexity and enhances the efficiency of feature alignment. Then, multi-scale feature processing substantially expands the receptive fields. Meanwhile, in the LiDAR branch, we design the Dual-branch Pooling (DBP) to adaptively enhance geometric features across both the Channel and Grid dimensions. In the camera branch, the Wavelet and Semantic Encoders are developed to extract high-level semantic features with abundant edge and structural information. Finally, to facilitate effective cross-modal complementarity, we develop the Deformable Dual-Attention (DDA) module. Extensive experiments demonstrate that RIOcc achieves state-of-the-art performance, with 54.2 mIoU and 25.9 mIoU on the Occ3D-nuScenes and nuScenes-Occupancy datasets, respectively.", "summary_ja": "LiDARとカメラを融合した3D semantic occupancy predictionの効率化を狙った研究。既存手法が大規模なvoxel空間で処理するために計算コストが高く細部が失われる点、さらに遮蔽物体や遠方の情報を捉えにくい点を課題として挙げている。RIOccはマルチモーダル入力を統一されたBEV空間にエンコードして計算量を抑えつつ特徴のアライメントを行い、multi-scale処理で受容野を広げる。Occ3D-nuScenesで54.2 mIoU、nuScenes-Occupancyで25.9 mIoUを報告している。", "novelty_ja": "voxelベースの重い処理ではなくBEV空間での統一表現に落とし込んだうえで、LiDAR側にChannelとGrid両方向のDual-branch Pooling、カメラ側にWavelet/Semantic Encoder、融合にDeformable Dual-Attentionを導入し、モダリティごとに適した特徴精緻化を設計している点が異なる。", "why_read_ja": "occupancy predictionにおけるBEV表現の使い方と、LiDAR-カメラ融合モジュールの設計指針を押さえられる。計算コストと精度のトレードオフを扱う実装寄りの参考として、環境認識の設計検討時に有用。", "paper_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Fan_RIOcc_Efficient_Cross-Modal_Fusion_Transformer_with_Collaborative_Feature_Refinement_for_ICCV_2025_paper.html", "code_url": "", "published": "", "relevance": 26.0}, {"key": "arxiv:2411.15482", "title": "SplatFlow: Self-Supervised Dynamic Gaussian Splatting in Neural Motion Flow Field for Autonomous Driving", "venue": "CVPR 2025", "year": 2025, "topic": "Gaussian Splatting", "topics": ["Reconstruction", "Gaussian Splatting", "3D Detection", "AD Perception"], "abstract": "Most existing Dynamic Gaussian Splatting methods for complex dynamic urban scenarios rely on accurate object-level supervision from expensive manual labeling, limiting their scalability in real-world applications. In this paper, we introduce SplatFlow, a Self-Supervised Dynamic Gaussian Splatting within Neural Motion Flow Fields (NMFF) to learn 4D space-time representations without requiring tracked 3D bounding boxes, enabling accurate dynamic scene reconstruction and novel view RGB/depth/flow synthesis. SplatFlow designs a unified framework to seamlessly integrate time-dependent 4D Gaussian representation within NMFF, where NMFF is a set of implicit functions to model temporal motions of both LiDAR points and Gaussians as continuous motion flow fields. Leveraging NMFF, SplatFlow effectively decomposes static background and dynamic objects, representing them with 3D and 4D Gaussian primitives, respectively. NMFF also models the correspondences of each 4D Gaussian across time, which aggregates temporal features to enhance cross-view consistency of dynamic components. SplatFlow further improves dynamic object identification by distilling features from 2D foundation models into 4D space-time representation. Comprehensive evaluations conducted on the Waymo and KITTI Datasets validate SplatFlow's state-of-the-art (SOTA) performance for both image reconstruction and novel view synthesis in dynamic urban scenarios.", "summary_ja": "動的な市街地シーンをDynamic Gaussian Splattingで再構成する際、従来は追跡済み3Dバウンディングボックスなど高コストな物体レベルの教師情報が必要で、スケールしないという課題があった。SplatFlowは、LiDAR点群とGaussianの時間的な動きを連続的なmotion flow fieldとして陰関数で表すNeural Motion Flow Field (NMFF)を導入し、これを4D Gaussian表現と統合することで、3Dボックスの教師なし(自己教師的)に4D時空間表現を学習する。静的背景を3D Gaussian、動的物体を4D Gaussianとして分離表現し、NMFFが各4D Gaussianの時間対応を与えることで時系列特徴を集約し、動的部分のcross-view一貫性を高める。さらに2D foundation modelの特徴を4D表現へ蒸留して動的物体の識別を改善し、RGB/depth/flowのnovel view synthesisを行う。", "novelty_ja": "追跡済み3Dバウンディングボックスによる物体レベル教師を前提とせず、motion flow fieldを陰関数でモデル化するNMFFの中に4D Gaussianを組み込むことで静的/動的分解と時間対応付けを同時に扱う点が従来手法との違いである。また2D foundation modelの特徴蒸留を4D時空間表現に組み合わせ、動的物体の識別を教師ラベルに頼らず補強している。", "why_read_ja": "アノテーションコストを避けつつ動的な走行シーンの4D再構成を行う方向性は、大規模な走行ログからの地図・シーン表現構築やデータ生成に直結する。Waymo/KITTIでの再構成・novel view synthesisにおける最新手法として、Gaussian Splattingベースの自動運転向けシーン表現の動向を押さえるうえで参考になる。", "paper_url": "https://arxiv.org/abs/2411.15482", "code_url": "", "published": "", "relevance": 25.0}, {"key": "arxiv:2506.22799", "title": "VoteSplat: Hough Voting Gaussian Splatting for 3D Scene Understanding", "venue": "ICCV 2025", "year": 2025, "topic": "Gaussian Splatting", "topics": ["Gaussian Splatting", "Scene Understanding", "Open-world", "Reconstruction", "3D Detection"], "abstract": "3D Gaussian Splatting (3DGS) has become horsepower in high-quality, real-time rendering for novel view synthesis of 3D scenes. However, existing methods focus primarily on geometric and appearance modeling, lacking deeper scene understanding while also incurring high training costs that complicate the originally streamlined differentiable rendering pipeline. To this end, we propose VoteSplat, a novel 3D scene understanding framework that integrates Hough voting with 3DGS. Specifically, Segment Anything Model (SAM) is utilized for instance segmentation, extracting objects, and generating 2D vote maps. We then embed spatial offset vectors into Gaussian primitives. These offsets construct 3D spatial votes by associating them with 2D image votes, while depth distortion constraints refine localization along the depth axis. For open-vocabulary object localization, VoteSplat maps 2D image semantics to 3D point clouds via voting points, reducing training costs associated with high-dimensional CLIP features while preserving semantic unambiguity. Extensive experiments demonstrate VoteSplat's effectiveness in open-vocabulary 3D instance localization, 3D point cloud understanding, click-based 3D object localization, hierarchical segmentation, and ablation studies.", "summary_ja": "3DGSは高品質・リアルタイムなnovel view synthesisを実現している一方で、幾何と外観のモデリングに偏っており、シーンの意味的な理解が弱いという課題がある。本論文は、Hough votingの考え方を3DGSに統合したVoteSplatを提案する。SAMでinstance segmentationを行って2Dのvote mapを作り、Gaussian primitiveに空間オフセットベクトルを埋め込むことで、2Dの投票を3D空間の投票へ結び付けて物体中心を推定する。さらにdepth distortion制約で奥行き方向の定位を精緻化し、2Dの意味情報をvoting pointsを介して3D点群へ写す構成とする。", "novelty_ja": "高次元CLIP特徴を各Gaussianに直接埋め込む従来のsemantic 3DGSとは異なり、Hough votingによる物体中心への投票を介して2D意味を3Dへ橋渡しし、学習コストを抑えつつ意味の曖昧さを回避している点が新しい。open-vocabulary localizationやclickベースの物体定位、hierarchical segmentationを同一枠組みで扱える。", "why_read_ja": "Gaussian Splattingを単なる再構成表現から「物体単位で問い合わせ可能な表現」へ拡張する流れを示す一例であり、地図・環境認識側で3DGS表現に意味やinstance情報を持たせる設計の参考になる。voting経由で2D基盤モデルの意味を3Dへ持ち上げる手法は、コスト制約のある車載側の意味付き再構成にも波及しうる。", "paper_url": "https://arxiv.org/abs/2506.22799", "code_url": "", "published": "", "relevance": 25.0}, {"key": "arxiv:2412.10373", "title": "GaussianWorld: Gaussian World Model for Streaming 3D Occupancy Prediction", "venue": "CVPR 2025", "year": 2025, "topic": "World Model", "topics": ["Occupancy Forecasting", "Occupancy", "World Model", "AD Perception", "3D Detection"], "abstract": "3D occupancy prediction is important for autonomous driving due to its comprehensive perception of the surroundings. To incorporate sequential inputs, most existing methods fuse representations from previous frames to infer the current 3D occupancy. However, they fail to consider the continuity of driving scenarios and ignore the strong prior provided by the evolution of 3D scenes (e.g., only dynamic objects move). In this paper, we propose a world-modelbased framework to exploit the scene evolution for perception. We reformulate 3D occupancy prediction as a 4D occupancy forecasting problem conditioned on the current sensor input. We decompose the scene evolution into three factors: 1) ego motion alignment of static scenes; 2) local movements of dynamic objects; and 3) completion of newly-observed scenes. We then employ a Gaussian world model (GaussianWorld) to explicitly exploit these priors and infer the scene evolution in the 3D Gaussian space considering the current RGB observation. We evaluate the effectiveness of our framework on the widely used nuScenes dataset. Our GaussianWorld improves the performance of the single-frame counterpart by over 2% in mIoU without introducing additional computations.", "summary_ja": "カメラ入力からの3D occupancy prediction において、既存手法は過去フレームの特徴を単純に融合するだけで、走行シーンが連続的に変化するという事前知識を活かせていない点を問題視している。本論文はこのタスクを「現在のセンサ入力を条件とした4D occupancy forecasting」として捉え直し、シーンの時間変化を(1) 自車運動による静的シーンの整合、(2) 動的物体の局所的な移動、(3) 新たに観測された領域の補完、の3要素に分解する。これらの事前知識を3D Gaussian 表現の空間上で明示的に扱う Gaussian world model を構築し、現在のRGB観測を条件に次時刻のシーン状態を推論する。nuScenes で評価し、単一フレーム版に対して追加計算なしで mIoU を2%以上改善したと報告している。", "novelty_ja": "過去フレーム特徴の融合ではなく、シーンの進化そのものを予測対象とする world model として occupancy prediction を定式化した点が従来と異なる。さらに、その進化を自車運動・動的物体の移動・新規観測領域の補完という解釈可能な3要素に分解し、3D Gaussian という疎な物体中心表現の空間上で扱っている。", "why_read_ja": "occupancy prediction と world model、そして 3D Gaussian 表現という近年の主要な流れが一本に統合された代表例であり、ストリーミング入力を前提とした環境認識の設計思想を把握するのに適している。静的・動的の分離という考え方は地図生成や逐次的な地図更新の枠組みにも通じる。", "paper_url": "https://arxiv.org/abs/2412.10373", "code_url": "", "published": "", "relevance": 24.5}, {"key": "arxiv:2504.01957", "title": "Toward Real-world BEV Perception: Depth Uncertainty Estimation via Gaussian Splatting", "venue": "CVPR 2025", "year": 2025, "topic": "AD Perception", "topics": ["Gaussian Splatting", "AD Perception", "HD Map", "3D Detection", "Occupancy Forecasting", "Reconstruction"], "abstract": "Bird's-eye view (BEV) perception has gained significant attention because it provides a unified representation to fuse multiple view images and enables a wide range of downstream autonomous driving tasks, such as forecasting and planning. Recent state-of-the-art models utilize projection-based methods which formulate BEV perception as query learning to bypass explicit depth estimation. While we observe promising advancements in this paradigm, they still fall short of real-world applications because of the lack of uncertainty modeling and expensive computational requirement. In this work, we introduce GaussianLSS, an uncertainty-aware BEV perception framework that revisits the unprojection-based method, specifically the Lift-Splat-Shoot (LSS) paradigm, and enhances it with depth uncertainty modeling. Our GaussianLSS represents spatial dispersion by learning a soft depth mean and computing the variance of the depth distribution, which implicitly captures object extents. We then transform the depth distribution into 3D Gaussians and rasterize them to construct uncertainty-aware BEV features. We evaluate GaussianLSS on the nuScenes dataset, achieving state-of-the-art performance compared to unprojection-based methods. In particular, it provides significant advantages in speed, running 2x faster, and in memory efficiency, using 0.3x less memory compared to projection-based methods, while achieving competitive performance with only a 0.7% IoU difference.", "summary_ja": "マルチカメラ画像から BEV 表現を作る際、近年主流の projection ベース(クエリ学習で明示的な depth 推定を回避する方式)は不確実性のモデル化がなく計算コストも高い、という問題を扱っている。本論文は Lift-Splat-Shoot 系の unprojection ベースを再検討し、depth 分布の soft mean と分散を学習することで空間的な広がり(=物体のスケール)を暗黙的に捉える GaussianLSS を提案する。得られた depth 分布を 3D Gaussian に変換し、rasterize することで不確実性を織り込んだ BEV feature を構成する。nuScenes で評価し、unprojection 系の中で最高性能を報告している。", "novelty_ja": "LSS の離散的な depth bin ではなく depth 分布の平均と分散を明示的に扱い、それを 3D Gaussian の rasterization として BEV に落とし込む点が従来と異なる。結果として projection ベース手法に対し 2 倍の速度と 0.3 倍のメモリで、IoU 差 0.7% の同等性能を達成している。", "why_read_ja": "BEV 知覚の主流が projection ベースに寄るなかで、depth の不確実性を明示的に持たせた unprojection 系の再評価という逆張りの方向性を示しており、実車適用を意識した速度・メモリ面の議論も含む。Gaussian Splatting の rasterization を生成ではなく知覚の特徴構成に使う応用例としても参考になる。", "paper_url": "https://arxiv.org/abs/2504.01957", "code_url": "", "published": "", "relevance": 23.5}, {"key": "arxiv:2506.23565", "title": "OcRFDet: Object-Centric Radiance Fields for Multi-View 3D Object Detection in Autonomous Driving", "venue": "ICCV 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "Reconstruction", "AD Perception", "HD Map", "Occupancy"], "abstract": "Current multi-view 3D object detection methods typically transfer 2D features into 3D space using depth estimation or 3D position encoder, but in a fully data-driven and implicit manner, which limits the detection performance. Inspired by the success of radiance fields on 3D reconstruction, we assume they can be used to enhance the detector's ability of 3D geometry estimation. However, we observe a decline in detection performance, when we directly use them for 3D rendering as an auxiliary task. From our analysis, we find the performance drop is caused by the strong responses on the background when rendering the whole scene. To address this problem, we propose object-centric radiance fields, focusing on modeling foreground objects while discarding background noises. Specifically, we employ object-centric radiance fields (OcRF) to enhance 3D voxel features via an auxiliary task of rendering foreground objects. We further use opacity - the side-product of rendering- to enhance the 2D foreground BEV features via height-aware opacity-based attention (HOA), where attention maps at different height levels are generated separately via multiple networks in parallel. Extensive experiments on the nuScenes validation and test datasets demonstrate that our OcRFDet achieves superior performance, outperforming previous state-of-the-art methods with 57.2% mAP and 64.8% NDS on the nuScenes test benchmark.", "summary_ja": "マルチビュー3D物体検出において、2D特徴を3D空間へ変換する際の暗黙的な学習に限界があるとし、放射輝度場(radiance field)を補助タスクとして導入することで幾何推定能力を強化する手法を提案している。単純にシーン全体をレンダリングすると背景の強い応答が検出性能を低下させることを分析で示し、前景物体のみをモデル化するobject-centric radiance fields(OcRF)を導入して問題を解決している。", "novelty_ja": "背景ノイズを除外し前景物体に限定したradiance fieldsで3D voxel特徴を強化する点、およびレンダリングの副産物であるopacityを用いた高さ方向認識のattention機構(HOA)で2D BEV特徴を強化する点が従来手法と異なる。", "why_read_ja": "radiance field/NeRF的表現を検出器の補助タスクとして統合するアプローチであり、3D検出とreconstruction技術の融合という観点で地図生成・環境認識研究の技術トレンドを把握するのに有用。", "paper_url": "https://arxiv.org/abs/2506.23565", "code_url": "", "published": "", "relevance": 23.5}, {"key": "arxiv:2501.14729", "title": "HERMES: A Unified Self-Driving World Model for Simultaneous 3D Scene Understanding and Generation", "venue": "ICCV 2025", "year": 2025, "topic": "World Model", "topics": ["World Model", "Scene Understanding", "AD Perception", "HD Map", "3D Detection"], "abstract": "Driving World Models (DWMs) have become essential for autonomous driving by enabling future scene prediction. However, existing DWMs are limited to scene generation and fail to incorporate scene understanding, which involves interpreting and reasoning about the driving environment. In this paper, we present a unified Driving World Model named HERMES. We seamlessly integrate 3D scene understanding and future scene evolution (generation) through a unified framework in driving scenarios. Specifically, HERMES leverages a Bird's-Eye View (BEV) representation to consolidate multi-view spatial information while preserving geometric relationships and interactions. We also introduce world queries, which incorporate world knowledge into BEV features via causal attention in the Large Language Model, enabling contextual enrichment for understanding and generation tasks. We conduct comprehensive studies on nuScenes and OmniDrive-nuScenes datasets to validate the effectiveness of our method. HERMES achieves state-of-the-art performance, reducing generation error by 32.4% and improving understanding metrics such as CIDEr by 8.0%. The model and code will be publicly released at https://github.com/LMD0311/HERMES.", "summary_ja": "従来のDriving World Modelがシーン生成に特化し環境理解を欠いていた課題に対し、HERMESはBEV表現とLLMのcausal attentionを用いたworld queryを導入し、3Dシーン理解と未来シーン生成を単一フレームワークで同時に扱う手法を提案している。nuScenesおよびOmniDrive-nuScenesで有効性を検証している。", "novelty_ja": "生成のみを対象としてきた既存DWMに対し、world queryによってBEV特徴にLLMの世界知識を注入し、理解タスクと生成タスクを一つのモデルで統一的に扱う点が従来との違いである。", "why_read_ja": "BEVベースの環境認識とWorld Modelの統合という潮流を示す代表例であり、シーン理解と予測生成を両立させる設計思想は今後のAD Perception研究の方向性を掴む上で参考になる。", "paper_url": "https://arxiv.org/abs/2501.14729", "code_url": "https://github.com/LMD0311/HERMES", "published": "", "relevance": 23.0}, {"key": "arxiv:2411.16180", "title": "Event-boosted Deformable 3D Gaussians for Dynamic Scene Reconstruction", "venue": "ICCV 2025", "year": 2025, "topic": "Gaussian Splatting", "topics": ["Reconstruction", "Gaussian Splatting"], "abstract": "Deformable 3D Gaussian Splatting (3D-GS) is limited by missing intermediate motion information due to the low temporal resolution of RGB cameras. To address this, we introduce the first approach combining event cameras, which capture high-temporal-resolution, continuous motion data, with deformable 3D-GS for dynamic scene reconstruction. We observe that threshold modeling for events plays a crucial role in achieving high-quality reconstruction. Therefore, we propose a GS-Threshold Joint Modeling strategy, creating a mutually reinforcing process that greatly improves both 3D reconstruction and threshold modeling. Moreover, we introduce a Dynamic-Static Decomposition strategy that first identifies dynamic areas by exploiting the inability of static Gaussians to represent motions, then applies a buffer-based soft decomposition to separate dynamic and static areas. This strategy accelerates rendering by avoiding unnecessary deformation in static areas, and focuses on dynamic areas to enhance fidelity. Additionally, we contribute the first event-inclusive 4D benchmark with synthetic and real-world dynamic scenes, on which our method achieves state-of-the-art performance.", "summary_ja": "RGBカメラの時間分解能不足によりdeformable 3D-GSが動きの中間情報を取得できない問題に対し、高時間分解能なイベントカメラの情報を組み合わせて動的シーン再構成を改善する手法を提案している。イベントの閾値モデリングと3D再構成を相互に強化するGS-Threshold Joint Modelingと、動的・静的領域を分離するDynamic-Static Decomposition戦略を導入している。", "novelty_ja": "イベントカメラをdeformable 3D-GSに組み込んだ初めての手法であり、閾値モデリングと再構成を同時最適化する点、静的領域の不要な変形を避けて動的領域に計算を集中させる分解戦略が従来手法と異なる。", "why_read_ja": "動的シーンの高精度・高効率な3D-GS再構成手法であり、車載カメラ映像における動体を含む4D再構成やシーン理解の高度化に応用できる可能性がある。", "paper_url": "https://arxiv.org/abs/2411.16180", "code_url": "", "published": "", "relevance": 21.0}, {"key": "openaccess.thecvf.com/content/iccv2025/html/song_coda-4dgs_dynamic_gaussian_splatting_with_context_and_deformation_awareness_for_iccv_2025_paper.html", "title": "CoDa-4DGS: Dynamic Gaussian Splatting with Context and Deformation Awareness for Autonomous Driving", "venue": "ICCV 2025", "year": 2025, "topic": "Gaussian Splatting", "topics": ["Gaussian Splatting", "Reconstruction", "Open-world", "AD Perception"], "abstract": "Dynamic scene rendering opens new avenues in autonomous driving by enabling closed-loop simulations with photorealistic data, which is crucial for validating end-to-end algorithms. However, the complex and highly dynamic nature of traffic environments presents significant challenges in accurately rendering these scenes. In this paper, we introduce a novel 4D Gaussian Splatting (4DGS) approach, which incorporates context and temporal deformation awareness to improve dynamic scene rendering. Specifically, we employ a 2D semantic segmentation foundation model to self-supervise the 4D semantic features of Gaussians, ensuring meaningful contextual embedding. Simultaneously, we track the temporal deformation of each Gaussian across adjacent frames. By aggregating and encoding both semantic and temporal deformation features, each Gaussian is equipped with cues for potential deformation compensation within 3D space, facilitating a more precise representation of dynamic scenes. Experimental results show that our method improves 4DGS's ability to capture fine details in dynamic scene rendering for autonomous driving and outperforms other self-supervised methods in 4D reconstruction and novel view synthesis. Furthermore, CoDa-4DGS deforms semantic features with each Gaussian, enabling broader applications.", "summary_ja": "自動運転のクローズドループシミュレーション用にフォトリアルな動的シーンを再現することを目指した論文。交通環境の複雑な動きを正確にレンダリングする難しさに対し、4D Gaussian Splatting (4DGS) にコンテキスト情報と時間的変形の認識を組み込む手法CoDa-4DGSを提案している。2D意味分割の基盤モデルで各Gaussianの4D意味特徴を自己教師的に学習させ、さらに隣接フレーム間でのGaussianの時間的変形を追跡する。", "novelty_ja": "既存の4DGSが幾何や色の再構成に留まるのに対し、意味的特徴と時間変形特徴を集約・符号化してGaussianに変形補正の手がかりを与える点が新規性。", "why_read_ja": "動的シーンのGaussian Splatting表現に意味情報を組み込む設計は、occupancyやシーン理解タスクへの応用可能性があり、自動運転向け3D/4D再構成の技術動向として参考になる。", "paper_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Song_CoDa-4DGS_Dynamic_Gaussian_Splatting_with_Context_and_Deformation_Awareness_for_ICCV_2025_paper.html", "code_url": "", "published": "", "relevance": 21.0}, {"key": "arxiv:2411.18894", "title": "T2SG: Traffic Topology Scene Graph for Topology Reasoning in Autonomous Driving", "venue": "CVPR 2025", "year": 2025, "topic": "Topology", "topics": ["Topology", "Scene Understanding", "AD Perception"], "abstract": "Understanding the traffic scenes and then generating high-definition (HD) maps present significant challenges in autonomous driving. In this paper, we defined a novel \\underline T raffic \\underline T opology \\underline S cene \\underline G raph (\\text T ^2\\text SG ), a unified scene graph explicitly modeling the lane, controlled and guided by different road signals ( e.g. , right turn), and topology relationships among them, which is always ignored by previous high-definition (HD) mapping methods. For the generation of \\text T ^2\\text SG , we propose TopoFormer, a novel one-stage \\underline Topo logy Scene Graph Trans\\underline Former with two newly-designed layers. Specifically, TopoFormer incorporates a Lane Aggregation Layer (LAL) that leverages the geometric distance among the centerline of lanes to guide the aggregation of global information. Furthermore, we proposed a Counterfactual Intervention Layer (CIL) to model the reasonable road structure ( e.g. , intersection, straight) among lanes under counterfactual intervention. Then the generated \\text T ^2\\text SG can provide a more accurate and explainable description of the topological structure in traffic scenes. Experimental results demonstrate that TopoFormer outperforms existing methods on the \\text T ^2\\text SG generation task, and the generated \\text T ^2\\text SG significantly enhances traffic topology reasoning in downstream tasks, achieving a state-of-the-art performance of 46.3 OLS on the OpenLane-V2 benchmark. Our source code is available at https://github.com/MICLAB-BUPT/T2SG.", "summary_ja": "自動運転のHDマップ生成において、レーン同士やレーンと交通標識(右折等)の関係性を明示的にモデル化したTraffic Topology Scene Graph(T2SG)を新たに定義し、それを生成する一段階のTransformerであるTopoFormerを提案している。TopoFormerはレーン中心線間の幾何距離を利用して大域情報を集約するLane Aggregation Layerと、交差点や直進などの妥当な道路構造を反実仮想的介入でモデル化するCounterfactual Intervention Layerから構成される。", "novelty_ja": "従来のHDマップ手法が見落としていた、道路標識に制御・誘導されるレーン間トポロジー関係を明示的なシーングラフとして定式化し、反実仮想介入層により道路構造の妥当性を学習させる点が新しい。", "why_read_ja": "OpenLane-V2ベンチマークでSOTA(46.3 OLS)を達成しており、topology reasoningを介したオンラインHDマップ生成研究の最新動向を把握する上で参照価値が高い。", "paper_url": "https://arxiv.org/abs/2411.18894", "code_url": "https://github.com/MICLAB-BUPT/T2SG", "published": "", "relevance": 20.5}, {"key": "openaccess.thecvf.com/content/cvpr2025/html/hess_splatad_real-time_lidar_and_camera_rendering_with_3d_gaussian_splatting_cvpr_2025_paper.html", "title": "SplatAD: Real-Time Lidar and Camera Rendering with 3D Gaussian Splatting for Autonomous Driving", "venue": "CVPR 2025", "year": 2025, "topic": "Gaussian Splatting", "topics": ["Gaussian Splatting", "Reconstruction", "AD Perception"], "abstract": "Ensuring the safety of autonomous robots, such as self-driving vehicles, requires extensive testing across diverse driving scenarios. Simulation is a key ingredient for conducting such testing in a cost-effective and scalable way. Neural rendering methods have gained popularity, as they can build simulation environments from collected logs in a data-driven manner. However, existing neural radiance field (NeRF) methods for sensor-realistic rendering of camera and lidar data suffer from low rendering speeds, limiting their applicability for large-scale testing. While 3D Gaussian Splatting (3DGS) enables real-time rendering, current methods are limited to camera data and are unable to render lidar data essential for autonomous driving. To address these limitations, we propose SplatAD, the first 3DGS-based method for realistic, real-time rendering of dynamic scenes for both camera and lidar data. SplatAD accurately models key sensor-specific phenomena such as rolling shutter effects, lidar intensity, and lidar ray dropouts, using purpose-built algorithms to optimize rendering efficiency. Evaluation across three autonomous driving datasets demonstrates that SplatAD achieves state-of-the-art rendering quality with up to +2 PSNR for NVS and +3 PSNR for reconstruction while increasing rendering speed over NeRF-based methods by an order of magnitude. Code to be released upon publication.", "summary_ja": "自動運転車のテストには多様な走行シナリオでの検証が必要だが、既存のNeRFベースのセンサーレンダリング手法はレンダリング速度が遅く大規模テストへの適用が難しい。SplatADは3D Gaussian Splattingを用いてカメラとlidarの両方を動的シーンでリアルタイムかつセンサーリアルにレンダリングする初の手法として、この速度の課題を解決する。ローリングシャッター効果、lidar強度、lidarのドロップアウトといったセンサー固有の現象を専用アルゴリズムでモデル化している。", "novelty_ja": "従来の3DGS手法がカメラ画像のみに限定されていたのに対し、lidarデータも同時にレンダリングできる点が新規性であり、NeRFベース手法に比べて1桁高速なレンダリングを達成する。", "why_read_ja": "ログデータからのシミュレーション環境構築という文脈でGaussian Splattingを動的な走行シーン・マルチセンサーに拡張した事例であり、World Modelやシミュレーションベースのテスト・データ拡張の動向を追ううえで参考になる。", "paper_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Hess_SplatAD_Real-Time_Lidar_and_Camera_Rendering_with_3D_Gaussian_Splatting_CVPR_2025_paper.html", "code_url": "", "published": "", "relevance": 20.0}, {"key": "arxiv:2503.24381", "title": "UniOcc: A Unified Benchmark for Occupancy Forecasting and Prediction in Autonomous Driving", "venue": "ICCV 2025", "year": 2025, "topic": "Occupancy Forecasting", "topics": ["Occupancy Forecasting", "Occupancy", "3D Detection", "AD Perception"], "abstract": "We introduce UniOcc, a comprehensive, unified benchmark and toolkit for occupancy forecasting (i.e., predicting future occupancies based on historical information) and occupancy prediction (i.e., predicting current-frame occupancy from camera images. UniOcc unifies the data from multiple real-world datasets (i.e., nuScenes, Waymo) and high-fidelity driving simulators (i.e., CARLA, OpenCOOD), providing 2D/3D occupancy labels and annotating innovative per-voxel flows. Unlike existing studies that rely on suboptimal pseudo labels for evaluation, UniOcc incorporates novel evaluation metrics that do not depend on ground-truth labels, enabling robust assessment on additional aspects of occupancy quality. Through extensive experiments on state-of-the-art models, we demonstrate that large-scale, diverse training data and explicit flow information significantly enhance occupancy prediction and forecasting performance. Our data and code are available at https://uniocc.github.io/.", "summary_ja": "自動運転向けのoccupancy predictionとoccupancy forecastingを統一的に評価するベンチマークUniOccを提案。nuScenes・Waymoの実データとCARLA・OpenCOODのシミュレータデータを統合し、2D/3D occupancyラベルとper-voxel flowを付与している。既存研究がground truthに依存した疑似ラベル評価に頼っていた問題に対し、ラベル非依存の新規評価指標を導入し、頑健な評価を可能にしている。", "novelty_ja": "複数の実データ・シミュレータデータセットを統合した点と、ground truthを必要としない新しい評価指標を導入した点が従来のoccupancyベンチマークとの違い。", "why_read_ja": "occupancy prediction/forecasting分野で標準的な評価基盤となりうるベンチマークであり、今後の手法比較や評価指標選定の参考になる。", "paper_url": "https://arxiv.org/abs/2503.24381", "code_url": "", "published": "", "relevance": 20.0}, {"key": "openaccess.thecvf.com/content/cvpr2025/html/huang_gaussianformer-2_probabilistic_gaussian_superposition_for_efficient_3d_occupancy_prediction_cvpr_2025_paper.html", "title": "GaussianFormer-2: Probabilistic Gaussian Superposition for Efficient 3D Occupancy Prediction", "venue": "CVPR 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "3D semantic occupancy prediction has garnered attention as an important task for the robustness of vision-centric autonomous driving, which predicts fine-grained geometry and semantics of the surrounding scene. Most existing methods leverage dense grid-based scene representations, overlooking the spatial sparsity of the driving scenes, which leads to computational redundancy. Although 3D semantic Gaussian serves as an object-centric sparse alternative, most of the Gaussians still describe the empty region with low efficiency. To address this, we propose a probabilistic Gaussian superposition model which interprets each Gaussian as a probability distribution of its neighborhood being occupied and conforms to probabilistic multiplication to derive the overall geometry. Furthermore, we adopt the exact Gaussian mixture model for semantics calculation to avoid unnecessary overlapping of Gaussians. To effectively initialize Gaussians in non-empty region, we design a distribution-based initialization module which learns the pixel-aligned occupancy distribution instead of the depth of surfaces. We conduct extensive experiments on nuScenes and KITTI-360 datasets and our GaussianFormer-2 achieves state-of-the-art performance with high efficiency.", "summary_ja": "vision-centricな自動運転向けの3D semantic occupancy predictionにおいて、既存のdense grid表現が持つ計算冗長性と、object-centricな3D Gaussian表現でも空領域を非効率に記述してしまう問題を解く論文。各Gaussianを近傍が占有される確率分布として解釈し、確率的な重ね合わせ(multiplication)で全体形状を導出するprobabilistic Gaussian superpositionモデルを提案する。semantics計算にはexact Gaussian mixture modelを用い、Gaussian同士の不要な重複を避けている。", "novelty_ja": "従来のGaussianベース手法が占有・非占有を決定的に扱っていたのに対し、Gaussianを確率分布として扱い確率演算で統合する点、および深度ではなくpixel-alignedなoccupancy分布を学習する初期化モジュールを導入した点が新規性。", "why_read_ja": "dense gridでもobject-centric Gaussianでもない、確率的Gaussian表現によるoccupancy predictionの効率化アプローチであり、GaussianFormer系列の発展として3D occupancy分野の効率化トレンドを追ううえで参考になる。", "paper_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Huang_GaussianFormer-2_Probabilistic_Gaussian_Superposition_for_Efficient_3D_Occupancy_Prediction_CVPR_2025_paper.html", "code_url": "", "published": "", "relevance": 20.0}, {"key": "arxiv:2506.22099", "title": "BezierGS: Dynamic Urban Scene Reconstruction with Bezier Curve Gaussian Splatting", "venue": "ICCV 2025", "year": 2025, "topic": "Gaussian Splatting", "topics": ["Reconstruction", "Gaussian Splatting", "3D Detection", "AD Perception"], "abstract": "The realistic reconstruction of street scenes is critical for developing real-world simulators in autonomous driving. Most existing methods rely on object pose annotations, using these poses to reconstruct dynamic objects and move them during the rendering process. This dependence on high-precision object annotations limits large-scale and extensive scene reconstruction. To address this challenge, we propose Bezier curve Gaussian splatting (BezierGS), which represents the motion trajectories of dynamic objects using learnable Bezier curves. This approach fully leverages the temporal information of dynamic objects and, through learnable curve modeling, automatically corrects pose errors. By introducing additional supervision on dynamic object rendering and inter-curve consistency constraints, we achieve reasonable and accurate separation and reconstruction of scene elements. Extensive experiments on the Waymo Open Dataset and the nuPlan benchmark demonstrate that BezierGS outperforms state-of-the-art alternatives in both dynamic and static scene components reconstruction and novel view synthesis.", "summary_ja": "自動運転シミュレータ向けに、街路シーンの静的・動的要素を分離して再構成する手法BezierGSを提案。従来手法は物体の姿勢アノテーションに依存していたが、動的物体の移動軌跡を学習可能なBezier曲線で表現することで大規模シーンへの適用を可能にした。Waymo Open DatasetとnuPlanベンチマークで、動的・静的シーン再構成と新規視点合成の両方で最先端手法を上回る性能を示した。", "novelty_ja": "物体姿勢の高精度アノテーションに頼らず、学習可能なBezier曲線で動的物体の軌跡をモデル化し、姿勢誤差を自動補正する点が従来手法との違い。", "why_read_ja": "動的物体を含む大規模都市シーンのGaussian Splatting再構成は自動運転シミュレータや4D再構成研究の中核テーマであり、姿勢アノテーション依存を減らす設計は実応用へのスケーラビリティに直結する。", "paper_url": "https://arxiv.org/abs/2506.22099", "code_url": "", "published": "", "relevance": 19.5}, {"key": "openaccess.thecvf.com/content/iccv2025/html/su_freqpde_rethinking_positional_depth_embedding_for_multi-view_3d_object_detection_iccv_2025_paper.html", "title": "FreqPDE: Rethinking Positional Depth Embedding for Multi-View 3D Object Detection Transformers", "venue": "ICCV 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception"], "abstract": "Detecting 3D objects accurately from multi-view 2D images is a challenging yet essential task in the field of autonomous driving. Current methods resort to integrating depth prediction to recover the spatial information for object query decoding, which necessitates explicit supervision from LiDAR points during the training phase. However, the predicted depth quality is still unsatisfactory such as depth discontinuity of object boundaries and indistinction of small objects, which are mainly caused by the sparse supervision of projected points and the use of high-level image features for depth prediction. Besides, cross-view consistency and scale invariance are also overlooked in previous methods. In this paper, we introduce Frequency-aware Positional Depth Embedding (FreqPDE) to equip 2D image features with spatial information for 3D detection transformer decoder, which can be obtained through three main modules. Specifically, the Frequency-aware Spatial Pyramid Encoder (FSPE) constructs a feature pyramid by combining high-frequency edge clues and low-frequency semantics from different levels respectively. Then the Cross-view Scale-invariant Depth Predictor (CSDP) estimates the pixel-level depth distribution with cross-view and efficient channel attention mechanism. Finally, the Positional Depth Encoder (PDE) combines the 2D image features and 3D position embeddings to generate the 3D depth-aware features for query decoding. Additionally, hybrid depth supervision is adopted for complementary depth learning from both metric and distribution aspects. Extensive experiments conducted on the nuScenes dataset demonstrate the effectiveness and superiority of our proposed method.", "summary_ja": "マルチビュー2D画像からの3D物体検出において、深度予測の質が物体境界での不連続や小物体の見落としを招く問題に取り組む。高周波エッジ情報と低周波意味情報を組み合わせた特徴ピラミッド、クロスビューでスケール不変な深度推定、位置埋め込みと深度特徴を融合するモジュールから成るFreqPDEを提案する。metricとdistributionの両面から深度を教師するhybrid supervisionも導入している。", "novelty_ja": "既存手法が高レベル特徴のみで疎な点群教師に頼っていたのに対し、周波数帯域を分離した特徴抽出とクロスビュー一貫性・スケール不変性を明示的に扱う点が異なる。", "why_read_ja": "カメラのみのBEV/3D検出におけるdepth-aware query decodingの改良方向性を把握するうえで参考になる。", "paper_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Su_FreqPDE_Rethinking_Positional_Depth_Embedding_for_Multi-View_3D_Object_Detection_ICCV_2025_paper.html", "code_url": "", "published": "", "relevance": 19.5}, {"key": "arxiv:2503.13176", "title": "DeGauss: Dynamic-Static Decomposition with Gaussian Splatting for Distractor-free 3D Reconstruction", "venue": "ICCV 2025", "year": 2025, "topic": "Gaussian Splatting", "topics": ["Reconstruction", "Gaussian Splatting"], "abstract": "Reconstructing clean, distractor-free 3D scenes from real-world captures remains a significant challenge, particularly in highly dynamic and cluttered settings such as egocentric videos. To tackle this problem, we introduce DeGauss, a simple and robust self-supervised framework for dynamic scene reconstruction based on a decoupled dynamic-static Gaussian Splatting design. DeGauss models dynamic elements with foreground Gaussians and static content with background Gaussians, using a probabilistic mask to coordinate their composition and enable independent yet complementary optimization. DeGauss generalizes robustly across a wide range of real-world scenarios, from casual image collections to long, dynamic egocentric videos, without relying on complex heuristics or extensive supervision. Experiments on benchmarks including NeRF-on-the-go, ADT, AEA, Hot3D, and EPIC-Fields demonstrate that DeGauss consistently outperforms existing methods, establishing a strong baseline for generalizable, distractor-free 3D reconstruction in highly dynamic, interaction-rich environments.", "summary_ja": "実世界のegocentric動画など動きの多い雑然としたシーンから、歩行者や手など動的な要素(distractor)を含まないクリーンな3Dシーンを復元することが難しいという課題に取り組んだ論文。DeGaussは3D Gaussian Splattingを前景(動的)用と背景(静的)用に分離し、確率的マスクで両者の合成を制御しながら独立に最適化する自己教師あり手法を提案する。NeRF-on-the-go、ADT、AEA、Hot3D、EPIC-Fieldsなど複数のベンチマークで既存手法を上回る性能を示している。", "novelty_ja": "複雑なヒューリスティックや大量の教師信号に頼らず、前景・背景のGaussianを確率的マスクで疎結合に協調最適化する点が既存のdistractor除去手法との違い。", "why_read_ja": "動的物体と静的地図要素の分離は自動運転のシーン再構成・地図更新でも共通課題であり、Gaussian Splattingベースの動的静的分解技術の動向として参考になる。", "paper_url": "https://arxiv.org/abs/2503.13176", "code_url": "", "published": "", "relevance": 18.5}, {"key": "openaccess.thecvf.com/content/iccv2025/html/chow_ov-scan_semantically_consistent_alignment_for_novel_object_discovery_in_open-vocabulary_iccv_2025_paper.html", "title": "OV-SCAN: Semantically Consistent Alignment for Novel Object Discovery in Open-Vocabulary 3D Object Detection", "venue": "ICCV 2025", "year": 2025, "topic": "Open-world", "topics": ["3D Detection", "Open-world", "AD Perception"], "abstract": "Open-vocabulary 3D object detection for autonomous driving aims to detect novel objects beyond the predefined training label sets in point cloud scenes. Existing approaches achieve this by connecting traditional 3D object detectors with vision-language models (VLMs) to regress 3D bounding boxes for novel objects and perform open-vocabulary classification through cross-modal alignment between 3D and 2D features. However, achieving robust cross-modal alignment remains a challenge due to semantic inconsistencies when generating corresponding 3D and 2D feature pairs. To overcome this challenge, we present OV-SCAN, an Open-Vocabulary 3D framework that enforces Semantically Consistent Alignment for Novel object discovery. OV-SCAN employs two core strategies: discovering precise 3D annotations and filtering out low-quality or corrupted alignment pairs (arising from 3D annotation, occlusion-induced, or resolution-induced noise). Extensive experiments on the nuScenes dataset demonstrate that OV-SCAN achieves state-of-the-art performance.", "summary_ja": "自動運転向けのopen-vocabulary 3D物体検出において、3D検出器とVLMを組み合わせる際に3D特徴と2D特徴の対応付けが意味的に食い違い、未知クラスの認識精度が落ちるという課題を扱う。OV-SCANは、正確な3Dアノテーションの発見と、遮蔽・解像度・アノテーション由来のノイズで質の低い3D-2D対応ペアを除去する2つの戦略で、意味的に一貫したクロスモーダル整合を実現する。", "novelty_ja": "既存手法が3D-2D特徴ペアの生成品質を問わずに整合を取っていたのに対し、ノイズを含む対応ペアを明示的にフィルタリングして整合の意味的一貫性を担保する点が異なる。", "why_read_ja": "open-vocabulary 3D検出はクローズドセットの物体検出を超えて未知物体を扱うopen-world知覚の中核課題であり、クロスモーダル整合の質を上げる工夫は今後の類似手法設計の参考になる。", "paper_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Chow_OV-SCAN_Semantically_Consistent_Alignment_for_Novel_Object_Discovery_in_Open-Vocabulary_ICCV_2025_paper.html", "code_url": "", "published": "", "relevance": 18.5}, {"key": "arxiv:2502.11663", "title": "MaskGWM: A Generalizable Driving World Model with Video Mask Reconstruction", "venue": "CVPR 2025", "year": 2025, "topic": "World Model", "topics": ["World Model", "3D Detection", "AD Perception"], "abstract": "World models that forecast environmental changes from actions are vital for autonomous driving models with strong generalization. The prevailing driving world model mainly build on pixel-level video prediction model. Although these models can produce high-fidelity video sequences with advanced diffusion-based generator, they are constrained by their predictive duration and overall generalization capabilities. In this paper, we explore to solve this problem by combining pixel-level generation loss with MAE-style feature-level context learning. In particular, we instantiate this target with three key design: (1) A more scalable Diffusion Transformer (DiT) structure trained with extra mask construction task. (2) we devise diffusion-related mask tokens to deal with the fuzzy relations between mask reconstruction and generative diffusion process. (3) we extend mask construction task to spatial-temporal domain by utilizing row-wise mask for shifted self-attention rather than masked self-attention in MAE. Then, we adopt a row-wise cross-view module to align with this mask design. Based on above improvement, we propose MaskGWM: a Generalizable driving World Model embodied with Video Mask reconstruction. Our model contains two variants: MaskGWM-long, focusing on long-horizon prediction, and MaskGWM-mview, dedicated to multi-view generation.Comprehensive experiments on standard benchmarks validate the effectiveness of the proposed method, which contain normal validation of Nuscene dataset, long-horizon rollout of OpenDV-2K dataset and zero-shot validation of Waymo dataset. Quantitative metrics on these datasets show our method notably improving state-of-the-art driving world model.", "summary_ja": "行動から環境変化を予測するdriving world modelにおいて、既存のpixel-level拡散生成モデルは予測時間や汎化性に限界があるという課題を扱う。本研究はDiTベースの拡散生成にMAE的なマスク再構成によるfeature-level学習を組み合わせ、拡散用マスクトークンと時空間方向へ拡張した行毎マスク・行毎cross-view moduleを設計してMaskGWMを提案する。長期予測用のMaskGWM-longとマルチビュー生成用のMaskGWM-mviewの2種を用意し、nuScenes・OpenDV-2K・Waymo(zero-shot)で評価している。", "novelty_ja": "単純なpixel-level生成損失のみに頼らず、MAEスタイルのマスク再構成タスクを拡散過程・時空間・マルチビューに合わせて再設計し、DiT構造に統合した点が従来のdriving world modelと異なる。", "why_read_ja": "world modelは環境認識・シーン理解と連続する将来予測の要であり、長期予測・マルチビュー生成・zero-shot汎化への対応方針は他のAD perception手法の設計にも参考になる。", "paper_url": "https://arxiv.org/abs/2502.11663", "code_url": "", "published": "", "relevance": 17.5}, {"key": "arxiv:2506.01379", "title": "RadarSplat: Radar Gaussian Splatting for High-Fidelity Data Synthesis and 3D Reconstruction of Autonomous Driving Scenes", "venue": "ICCV 2025", "year": 2025, "topic": "Gaussian Splatting", "topics": ["Reconstruction", "Gaussian Splatting", "AD Perception"], "abstract": "High-fidelity 3D scene reconstruction plays a crucial role in autonomous driving by enabling novel data generation from existing datasets. This allows simulating safety-critical scenarios and augmenting training datasets without incurring further data collection costs. While recent advances in radiance fields have demonstrated promising results in 3D reconstruction and sensor data synthesis using cameras and LiDAR, their potential for radar remains largely unexplored. Radar is crucial for autonomous driving due to its robustness in adverse weather conditions like rain, fog, and snow, where optical sensors often struggle. Although the state-of-the-art radar-based neural representation shows promise for 3D driving scene reconstruction, it performs poorly in scenarios with significant radar noise, including receiver saturation and multipath reflection. Moreover, it is limited to synthesizing preprocessed, noise-excluded radar images, failing to address realistic radar data synthesis. To address these limitations, this paper proposes RadarSplat, which integrates Gaussian Splatting with novel radar noise modeling to enable realistic radar data synthesis and enhanced 3D reconstruction. Compared to the state-of-the-art, RadarSplat achieves superior radar image synthesis (+3.4 PSNR / 2.6x SSIM) and improved geometric reconstruction (-40% RMSE / 1.5x Accuracy), demonstrating its effectiveness in generating high-fidelity radar data and scene reconstruction.", "summary_ja": "自動運転向けレーダーセンサーのデータ合成と3D再構成を課題とし、受信機飽和やマルチパス反射といったレーダー特有のノイズをモデル化した上でGaussian Splattingと統合する手法RadarSplatを提案している。既存のレーダー向けニューラル表現がノイズ環境で性能劣化し、前処理済みのノイズ除去画像しか合成できない点を解決する。", "novelty_ja": "レーダーノイズを明示的にモデル化してGaussian Splattingに組み込むことで、ノイズ込みの実写的なレーダー画像合成と幾何再構成の両立を実現している点が従来手法との違い。", "why_read_ja": "カメラ・LiDAR中心だったGaussian Splattingベースのシーン再構成を悪天候に強いレーダーへ拡張する事例であり、マルチモーダルなAD向け3D/4D再構成の動向を追う上で参考になる。", "paper_url": "https://arxiv.org/abs/2506.01379", "code_url": "", "published": "", "relevance": 17.5}, {"key": "arxiv:2504.01941", "title": "End-to-End Driving with Online Trajectory Evaluation via BEV World Model", "venue": "ICCV 2025", "year": 2025, "topic": "World Model", "topics": ["AD Perception", "World Model", "HD Map", "Occupancy Forecasting"], "abstract": "End-to-end autonomous driving has achieved remarkable progress by integrating perception, prediction, and planning into a fully differentiable framework. Yet, to fully realize its potential, an effective online trajectory evaluation is indispensable to ensure safety. By forecasting the future outcomes of a given trajectory, trajectory evaluation becomes much more effective. This goal can be achieved by employing a world model to capture environmental dynamics and predict future states. Therefore, we propose an end-to-end driving framework **WoTE**, which leverages a BEV **Wo**rld model to predict future BEV states for **T**rajectory **E**valuation. The proposed BEV world model is latency-efficient compared to image-level world models and can be seamlessly supervised using off-the-shelf BEV-space traffic simulators. We validate our framework on both the NAVSIM benchmark and the closed-loop Bench2Drive benchmark based on the CARLA simulator, achieving state-of-the-art performance. Code is released at https://github.com/liyingyanUCAS/WoTE.", "summary_ja": "end-to-end自動運転において生成された走行軌道の安全性をどう評価するかが課題。本研究はBEV空間の world model(WoTE)で将来のBEV状態を予測し、その予測結果を用いて複数の候補軌道を評価・選択するフレームワークを提案する。NAVSIMおよびCARLAベースのBench2Driveで検証している。", "novelty_ja": "画像レベルのworld modelに比べ計算コストの低いBEV空間でのworld modelを採用し、既存のBEV空間交通シミュレータの出力をそのまま教師信号として使える点が従来との違い。", "why_read_ja": "軌道評価にworld modelを組み込む設計は、occupancy forecastingとplanningを繋ぐ実装例として地図・環境認識研究の応用先を考える上で参考になる。", "paper_url": "https://arxiv.org/abs/2504.01941", "code_url": "https://github.com/liyingyanUCAS/WoTE", "published": "", "relevance": 17.5}, {"key": "openaccess.thecvf.com/content/cvpr2025/html/park_leveraging_temporal_cues_for_semi-supervised_multi-view_3d_object_detection_cvpr_2025_paper.html", "title": "Leveraging Temporal Cues for Semi-Supervised Multi-View 3D Object Detection", "venue": "CVPR 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception"], "abstract": "While recent advancements in camera-based 3D object detection demonstrate remarkable performance, they require thousands or even millions of human-annotated frames. This requirement significantly inhibits their deployment in various locations and sensor configurations. To address this gap, we propose a performant semi-supervised framework that leverages unlabeled RGB-only driving sequences - data easily collected with cost-effective RGB cameras - to significantly improve temporal, camera-only 3D detectors. We observe that the standard semi-supervised pseudo-labeling paradigm underperforms in this temporal, camera-only setting due to poor 3D localization of pseudo-labels. To address this, we train a single 3D detector to handle RGB sequences both forward and backward in time, then ensemble both its forwards and backwards pseudo-labels for semi-supervised learning. We further improve the pseudo-label quality by leveraging 3D object tracking to infill missing detections and by eschewing simple confidence thresholding in favor of using the auxiliary 2D detection head to filter 3D predictions. Finally, to enable the backbone to learn directly from the unlabeled data itself, we introduce an object-query conditioned masked reconstruction objective. Our framework demonstrates remarkable performance improvement on large-scale autonomous driving datasets nuScenes and nuPlan.", "summary_ja": "カメラのみのマルチビュー3D物体検出において大量の人手アノテーションが必要な問題に対し、ラベルなしRGB走行シーケンスを活用する半教師あり学習フレームワークを提案。前向き・後向き両方向の時系列を扱う単一検出器を訓練し、両方向の疑似ラベルをアンサンブルすることで3D位置精度の低さを解消する。さらに3Dトラッキングによる検出漏れの補完、2D検出ヘッドを用いたフィルタリング、物体クエリ条件付きマスク再構成という自己教師あり目的も導入している。", "novelty_ja": "従来の単純な信頼度閾値による疑似ラベリングが時系列カメラ設定では3D位置推定精度不足で機能しない点を指摘し、双方向時系列アンサンブルとトラッキング補完・2D補助ヘッドによる疑似ラベル品質向上を組み合わせた点が新しい。", "why_read_ja": "アノテーションコストを抑えつつ時系列カメラ3D検出を改善する半教師あり手法として、大規模実運用データセットでの検出性能向上手法の動向を把握するうえで参考になる。", "paper_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Park_Leveraging_Temporal_Cues_for_Semi-Supervised_Multi-View_3D_Object_Detection_CVPR_2025_paper.html", "code_url": "", "published": "", "relevance": 16.5}, {"key": "arxiv:2503.12009", "title": "UniMamba: Unified Spatial-Channel Representation Learning with Group-Efficient Mamba for LiDAR-based 3D Object Detection", "venue": "CVPR 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception"], "abstract": "Recent advances in LiDAR 3D detection have demonstrated the effectiveness of Transformer-based frameworks in capturing the global dependencies from point cloud spaces, which serialize the 3D voxels into the flattened 1D sequence for iterative self-attention. However, the spatial structure of 3D voxels will be inevitably destroyed during the serialization process. Besides, due to the considerable number of 3D voxels and quadratic complexity of Transformers, multiple sequences are grouped before feeding to Transformers, leading to a limited receptive field. Inspired by the impressive performance of State Space Models (SSM), in this paper, we propose a novel Unified Mamba (UniMamba), which seamlessly integrates the merits of 3D convolution and SSM in a concise multi-head manner, aiming to perform \"local and global\" spatial context aggregation efficiently and simultaneously. Specifically, a UniMamba block is designed which mainly consists of spatial locality modeling, complementary Z-order serialization and local-global sequential aggregator. The spatial locality modeling module integrates 3D submanifold convolution to capture the dynamic spatial position embedding before serialization. Then the efficient Z-order curve is adopted for serialization both horizontally and vertically. Furthermore, the local-global sequential aggregator adopts the channel grouping strategy to efficiently encode both \"local and global\" spatial inter-dependencies using multi-head SSM. Additionally, an encoder-decoder architecture with stacked UniMamba blocks is formed to facilitate multi-scale spatial learning hierarchically. Extensive experiments are conducted on three popular datasets: nuScenes, Waymo and Argoverse 2. Particularly, our UniMamba achieves 70.2 mAP on the nuScenes dataset.", "summary_ja": "点群のTransformer系手法はシリアライズで空間構造が壊れ、グループ化により受容野も制限される問題を指摘。UniMambaは3D submanifold convolutionによる局所空間モデリングとZ-orderシリアライズ、チャネルグループ化したmulti-head SSM(Mamba)による大域
