<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>論文ダイジェスト</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9; --card: #ffffff; --fg: #14171a; --muted: #5b6570;
  --line: #dfe3e8; --accent: #1f6feb; --chip: #eef2f7;
  --good: #1a7f37; --warn: #9a6700; --danger: #cf222e;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#12151a; --card:#1a1f27; --fg:#e6e9ef; --muted:#9aa4b2;
          --line:#2a313c; --accent:#6ea8fe; --chip:#232a34;
          --good:#56d364; --warn:#d29922; --danger:#ff7b72; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP",
               "Yu Gothic UI", Meiryo, sans-serif; line-height:1.7; }
header { position:sticky; top:0; z-index:10; background:var(--bg);
  border-bottom:1px solid var(--line); padding:14px 20px 12px; }
h1 { margin:0 0 2px; font-size:19px; }
.meta { color:var(--muted); font-size:12px; margin-bottom:10px; }
.controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
input[type=search], input[type=number], input[type=text], select, textarea {
  font:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--line);
  border-radius:8px; background:var(--card); color:var(--fg); }
input[type=search] { flex:1 1 260px; min-width:200px; }
textarea { width:100%; min-height:68px; resize:vertical; display:block; }
button, .file-btn {
  font:inherit; font-size:12px; line-height:1; padding:8px 10px; border:1px solid var(--line);
  border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; }
button:hover, .file-btn:hover { border-color:var(--accent); color:var(--accent); }
button.active { border-color:var(--accent); color:var(--accent); background:var(--chip); }
button.good.active { border-color:var(--good); color:var(--good); }
button.warn.active { border-color:var(--warn); color:var(--warn); }
button.danger.active { border-color:var(--danger); color:var(--danger); }
#count, #savedCount { color:var(--muted); font-size:12px; white-space:nowrap; }
#count { margin-left:auto; }
main { max-width:1240px; margin:0 auto; padding:18px 20px 60px;
  display:grid; grid-template-columns:minmax(260px, 330px) minmax(0, 1fr); gap:16px; align-items:start; }
.workspace { position:sticky; top:105px; display:flex; flex-direction:column; gap:12px; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
.panel h2 { margin:0 0 10px; font-size:14px; }
.panel-row { display:flex; gap:8px; align-items:center; margin-top:8px; }
.panel-row > * { flex:1 1 auto; min-width:0; }
.panel-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.panel small { color:var(--muted); display:block; line-height:1.5; margin-top:8px; }
.survey-list { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.survey-item { border-top:1px solid var(--line); padding-top:8px; font-size:12px; }
.survey-item b { display:block; font-size:12px; line-height:1.4; }
.survey-item span { color:var(--muted); }
.feed { min-width:0; }
article { background:var(--card); border:1px solid var(--line); border-radius:8px;
  padding:16px 18px; margin-bottom:14px; }
article h2 { margin:0 0 8px; font-size:16px; line-height:1.5; }
article h2 a { color:var(--fg); text-decoration:none; }
article h2 a:hover { color:var(--accent); text-decoration:underline; }
.quick { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.chip { font-size:11px; padding:2px 9px; border-radius:999px;
  background:var(--chip); color:var(--muted); border:1px solid var(--line); }
.chip.venue { color:var(--accent); border-color:var(--accent); }
.chip.state { color:var(--good); border-color:var(--good); }
.sec { margin:8px 0; }
.sec b { display:block; font-size:12px; color:var(--muted); font-weight:600;
  letter-spacing:.04em; margin-bottom:1px; }
.links { margin-top:10px; font-size:13px; display:flex; gap:14px; flex-wrap:wrap; }
.links a { color:var(--accent); }
details.abs { margin-top:8px; font-size:13px; color:var(--muted); }
details.abs summary { cursor:pointer; font-size:12px; }
.reader-notes { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.reader-notes label { display:block; font-size:11px; color:var(--muted); }
.reader-notes textarea { margin-top:4px; min-height:58px; }
.empty { text-align:center; color:var(--muted); padding:60px 0; }
@media (max-width: 880px) {
  header { position:static; }
  .controls { align-items:stretch; }
  .controls input[type=search], .controls select {
    flex:1 1 100%; min-width:0; width:100%;
  }
  .controls button, .controls .file-btn { flex:0 0 auto; }
  #count, #savedCount { flex:1 1 100%; }
  main { display:block; padding:12px 12px 48px; }
  .workspace { position:static; margin-bottom:14px; }
  .reader-notes { grid-template-columns:1fr; }
  #count { margin-left:0; }
}
</style>
</head>
<body>
<header>
  <h1>論文ダイジェスト</h1>
  <div class="meta">生成日時: 2026-09-26 13:51 / 収録 184 件</div>
  <div class="controls">
    <input type="search" id="q" placeholder="キーワード検索 (タイトル・要約・abstract)">
    <select id="venue"></select>
    <select id="topic"></select>
    <select id="state">
      <option value="">状態 (すべて)</option>
      <option value="favorite">お気に入り</option>
      <option value="later">あとで読む</option>
      <option value="reading">読んでる</option>
      <option value="read">読んだ</option>
      <option value="skip">見送り</option>
    </select>
    <select id="sort">
      <option value="new">新しい順</option>
      <option value="old">古い順</option>
      <option value="rel">関連度順</option>
      <option value="marked">マーク優先</option>
      <option value="title">タイトル順</option>
    </select>
    <button id="exportState" title="読書状態をJSONで保存">Export</button>
    <label class="file-btn" title="読書状態JSONを読み込む">Import<input type="file" id="importState" accept="application/json" hidden></label>
    <span id="count"></span>
    <span id="savedCount"></span>
  </div>
</header>
<main>
  <section class="workspace">
    <div class="panel">
      <h2>Ask</h2>
      <textarea id="askInput" placeholder="質問"></textarea>
      <div class="panel-row">
        <select id="askLimit">
          <option value="8">上位8件</option>
          <option value="15">上位15件</option>
          <option value="30">上位30件</option>
        </select>
      </div>
      <div class="panel-actions">
        <button id="buildAsk">Prompt</button>
        <button id="copyAsk">Copy</button>
      </div>
      <textarea id="askOutput" readonly placeholder="LLMに渡す文脈"></textarea>
    </div>
    <div class="panel">
      <h2>Survey</h2>
      <textarea id="surveyQuery" placeholder="query"></textarea>
      <div class="panel-row">
        <input type="number" id="surveySince" min="2010" max="2100" value="2025" title="since">
        <input type="number" id="surveyLimit" min="1" max="500" value="150" title="limit">
      </div>
      <div class="panel-row">
        <select id="surveySources">
          <option value="arxiv,cvf">arxiv,cvf</option>
          <option value="arxiv">arxiv</option>
          <option value="cvf">cvf</option>
          <option value="arxiv,cvf,semanticscholar">arxiv,cvf,semanticscholar</option>
        </select>
      </div>
      <div class="panel-row">
        <input type="text" id="surveyVenues" value="CVPR,ICCV,ECCV" title="venues">
      </div>
      <div class="panel-actions">
        <button id="saveSurvey">Queue</button>
        <button id="exportSurveys">Export</button>
      </div>
      <div class="survey-list" id="surveyList"></div>
    </div>
  </section>
  <section class="feed" id="list"></section>
</main>
<script type="application/json" id="data">[{"key": "arxiv:2609.18542", "title": "Accuracy- and Real-Time-Aware 4D Radar Preprocessing for Autonomous Driving Perception Systems", "venue": "arXiv 2026", "year": 2026, "topic": "3D Detection", "topics": ["AD Perception", "3D Detection"], "abstract": "4D radar has emerged as a promising next-generation sensor for improving the robustness of autonomous driving perception systems because of its stable sensing capability under adverse weather conditions. However, deploying 4D radar in embedded environments with limited hardware resources requires radar-representation preprocessing that jointly considers perception accuracy, real-time performance, and computational complexity. This paper proposes a preprocessing framework for 4D-radar-based 3D object detection. First, Percentile-based 3D Shape Preservation (P3DP) extracts point clouds from radar tensors while preserving object-shape information and suppressing noise and false alarms. Second, Multi-frame-based Noise Point Discrimination using Kernel Density Estimation (MF-KDE) improves the density and reliability of sparse radar point clouds. Finally, Embedded \\& NetScore (ENS) evaluates suitability for embedded deployment by jointly considering accuracy, real-time performance, adverse-weather robustness, and model complexity.", "summary_ja": "4Dレーダーを組み込み環境で自動運転の3D物体検出に用いる際、精度・リアルタイム性・計算量をどう両立させるかという課題に対し、レーダー点群の前処理フレームワークを提案している。パーセンタイルに基づく形状保持手法でノイズや誤検出を抑えつつ物体形状情報を残し、複数フレームのカーネル密度推定でスパースな点群の密度と信頼性を改善し、埋め込み向け適合度を評価する指標も導入している。", "novelty_ja": "単一の精度指標だけでなく、悪天候ロバスト性・実時間性・モデル複雑度を統合したEmbedded & NetScoreで埋め込み適合性を評価する点、および複数フレーム情報を用いたKDEベースのノイズ点判別を組み合わせている点が従来手法との違い。", "why_read_ja": "4Dレーダーは悪天候下でも安定動作するセンサとして注目されており、組み込み実装を見据えた前処理設計は自動運転認識システムの実用化に直結する知見となる。", "paper_url": "https://arxiv.org/abs/2609.18542", "code_url": "", "published": "2026-09-16T12:06:22Z", "relevance": 13.0}, {"key": "arxiv:2609.18511", "title": "Learning from Distributed Eyes: Leveraging Collaborative Perception for Automated Model Adaptation", "venue": "arXiv 2026", "year": 2026, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception"], "abstract": "In autonomous driving, perception models often struggle to generalize to new environments due to domain shifts. While unsupervised model adaptation offers a feasible solution without labor-intensive manual labeling, existing methods that rely solely on the ego-vehicle's data often lead to inferior pseudo-labeling performance. To address this critical issue, we propose LDE, Learning from Distributed ``Eyes\", a novel framework that transforms collaborative perception (CP) into a source of high-quality supervision for model adaptation. This pseudo-labeling approach is hyperparameter-insensitive and relatively reliable, assuming CP often outperforms single-agent's perception. However, naively implementing this approach encounters (1) the communication bottleneck of sharing rich features under time and bandwidth constraints, (2) the view discrepancy between the CP view and the learner's Field of View (FoV), and (3) the unreliability even in CP-generated labels. To address these issues, we design an adaptation-oriented feature sharing mechanism that selectively transmits the most critical information for adaptation, an FoV filtering method that meticulously eliminates mismatched labels, and a curriculum learning strategy to progressively exploit pseudo labels. Extensive experiments on 3D object detection tasks demonstrate that LDE consistently outperforms both the pre-trained models and state-of-the-art unsupervised adaptation methods.", "summary_ja": "自動運転の3D物体検出モデルは新環境へのドメインシフトに弱く、単一車両のデータのみに頼る教師なし適応は疑似ラベルの質が低いという課題がある。本論文はLDEという手法を提案し、複数エージェントの協調認識(CP)結果を高品質な教師信号として使うことでモデル適応を行う。通信帯域制約、CP視点と学習対象車両の視野(FoV)のずれ、CP由来ラベル自体の不確実性という3つの課題に対し、適応志向の特徴共有、FoVフィルタリング、カリキュラム学習を組み合わせて対処する。", "novelty_ja": "自車のみのデータに依存する従来の教師なし適応と異なり、協調認識由来の疑似ラベルを教師信号として積極的に活用し、通信・視野不一致・ラベル不確実性を専用機構で解決している点が新しい。", "why_read_ja": "協調認識(V2X的なマルチエージェント認識)をラベル取得コスト削減や環境認識モデルの継続適応に応用する事例として、3D検出の汎化性能向上の研究動向を把握するうえで参考になる。", "paper_url": "https://arxiv.org/abs/2609.18511", "code_url": "", "published": "2026-09-16T11:44:26Z", "relevance": 8.5}, {"key": "arxiv:2609.14185", "title": "Bi-Level Routing and Sparse Spatial Attention based Multi-View BEV 3D Object Detection for Autonomous Driving", "venue": "arXiv 2026", "year": 2026, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception", "HD Map"], "abstract": "Bird's Eye View (BEV)-based multi-view 3D object detection suffers from challenges of computational complexity, multi-scale feature extraction, and efficiency of dense 2D-to-BEV view transformation. To address these problems, this paper proposes an improved BEV 3D object detection algorithm Sparse-BEVNet. Firstly, a Bi-Level Routing Attention (BRA) mechanism is introduced into the image feature extraction network to reduce the computational burden of the backbone. Second, Cascaded Group Attention (CGA) is employed in the feature fusion module, which enhances deep interaction across features of different hierarchical levels without introducing additional computational overhead. Furthermore, a Sparse Spatial Cross-Attention mechanism is adopted to replace the conventional dense view projection pipeline. Experimental results on the public nuScenes dataset demonstrate that the proposed method achieves a mean Average Precision (mAP) of 45.2% and a nuScenes Detection Score (NDS) of 54.5%, corresponding to 3.6% and 2.8% improvements relative to the baseline model, respectively.", "summary_ja": "マルチビュー画像からBEV空間で3D物体検出を行う際の計算コスト・マルチスケール特徴抽出・密な2D-to-BEV変換の効率の課題を解決するため、Sparse-BEVNetを提案する論文。バックボーンにBi-Level Routing Attention、特徴融合にCascaded Group Attentionを導入し、view transformationには密な射影の代わりにSparse Spatial Cross-Attentionを用いる。", "novelty_ja": "従来の密なBEV view transformationパイプラインを疎な(Sparse)Spatial Cross-Attentionに置き換え、バックボーンと特徴融合部にも軽量な注意機構を組み合わせて計算負荷を抑えている点が特徴。", "why_read_ja": "BEVベース3D検出における計算効率化のアプローチとして、view transformationの疎化手法の実装・性能トレードオフを把握するのに参考になる。", "paper_url": "https://arxiv.org/abs/2609.14185", "code_url": "", "published": "2026-09-12T23:35:28Z", "relevance": 16.0}, {"key": "arxiv:2608.19556", "title": "Stream4D: 4D-Consistency for Streaming Autoregressive Diffusion Video Models", "venue": "arXiv 2026", "year": 2026, "topic": "World Model", "topics": ["Reconstruction", "World Model"], "abstract": "Streaming autoregressive diffusion models enable real-time, long-horizon video generation, but their training objectives optimize local frame prediction rather than the geometry and dynamics of a coherent world: long rollouts accumulate geometric drift and degrade into static or unnatural motion. Recent bidirectional approaches address this problem using rewards signals built upon 3D Gaussian-Splatting reconstruction. However, a single rigid 3d reconstruction cannot model a dynamic scene, so this critic penalizes genuine object motion as reconstruction error and is maximized by freezing the video. This shortcut is especially detrimental in the AR setting, where each chunk can propagate an already-static configuration. In this work, we propose Stream4D, which replaces the static critic with a feed-forward 4D reconstruction reward that explicitly models scene dynamics, allowing coherent motion to receive high consistency rewards. To further guide motion magnitude and quality, we add a motion prior that rewards natural scene-flow magnitude while penalizing jitter and non-rigid artifacts. Our final recipe combines these two terms with a lightweight perceptual anchor. Across various autoregressive video backbones and various generation horizons, Stream4D improves 4D reconstruction quality, preserves motion more effectively, and achieves higher human-aligned preference. Project page: https://banyuanhao.github.io/Stream4D/", "summary_ja": "ストリーミング型の自己回帰ビデオ拡散モデルは局所フレーム予測しか最適化しないため、長時間ロールアウトで幾何的なドリフトが蓄積し、静止または不自然な動きに劣化する問題がある。既存の3D Gaussian Splatting再構成に基づく報酬は静的シーンしか扱えず、実際の物体運動を再構成誤差とみなして罰してしまい、映像を静止させる方向にモデルを誘導してしまう。本研究Stream4Dは、この静的critic をシーンダイナミクスを明示的にモデル化するfeed-forwardな4D再構成報酬に置き換え、さらに自然なscene-flow量を促しジッターや非剛体アーティファクトを抑えるmotion priorを追加することで、この問題を解決する。", "novelty_ja": "単一の剛体3D再構成に基づく静的一貫性報酬を、動的シーンを扱える4D再構成報酬とmotion priorの組み合わせに置き換えた点が従来との違い。", "why_read_ja": "自己回帰的な長時間ビデオ生成における4D一貫性の確保手法は、動的環境を扱うworld modelや将来のシーン予測(occupancy forecasting等)の設計にも応用しうるため。", "paper_url": "https://arxiv.org/abs/2608.19556", "code_url": "", "published": "2026-08-20T01:54:26Z", "relevance": 9.5}, {"key": "arxiv:2608.13147", "title": "Geometry-Grounded Unified 3D Perception for Autonomous Driving", "venue": "BMVC 2026", "year": 2026, "topic": "AD Perception", "topics": ["Occupancy", "3D Detection", "AD Perception", "Scene Understanding", "Reconstruction"], "abstract": "Camera-based autonomous driving perception requires a shared representation that preserves metric 3D structure across synchronized multi-camera streams. However, existing image-based frameworks often rely on backbones pretrained for semantic recognition, and introduce 3D geometry through downstream task-specific modules. As a result, their shared representations may fail to preserve explicit metric geometry and consistent 3D scene structure. In this paper, we present a Geometry-grounded Unified 3D Perception (GeoUP) framework that adapts the reconstruction-oriented latent of VGGT to calibrated, streaming multi-camera driving scenes. GeoUP factorizes cross-image interaction into self, temporal, and view attention to capture structurally distinct temporal and cross-view correspondences. It further injects calibration-aware raymap encodings to provide metric scale and camera geometry. The resulting geometry-grounded latent is decoded for metric depth estimation, 3D object detection, and semantic occupancy prediction, corresponding to surface-, instance-, and volume-level readouts of the same 3D scene. Through joint multi-task and multi-dataset training, GeoUP effectively leverages heterogeneous annotations and generalizes across diverse sensor configurations and perception ranges. Extensive experiments on nuScenes, Argoverse 2, Waymo, KITTI, and DDAD demonstrate that GeoUP achieves SOTA performance across detection, occupancy, and depth estimation. These results validate the effectiveness of geometry-grounded representations for unified 3D driving perception.", "summary_ja": "カメラのみの自動運転認識では、複数カメラ・時系列にまたがってmetricな3D構造を保った共有表現が必要だが、既存手法はセマンティック認識向けに事前学習されたバックボーンを使い、3D幾何をタスク固有の下流モジュールで後付けしているため、共有表現が明示的な幾何やシーン構造を保持できないという問題がある。本論文は、再構成向けに学習されたVGGTのlatentを、キャリブレーション済みのストリーミングマルチカメラ運転シーンに適応させるGeoUPを提案する。得られたgeometry-groundedなlatentから、metric depth推定、3D object detection、semantic occupancy predictionという表面・インスタンス・体積レベルの出力をデコードする。マルチタスク・マルチデータセットの同時学習により、異種アノテーションを活用しセンサ構成や認識レンジの違いに対応する。", "novelty_ja": "3D幾何をタスクヘッド側で導入するのではなく、再構成モデル(VGGT)のlatentを起点に据え、self/temporal/view attentionへの分解とcalibration-awareなraymap encodingでmetric scaleとカメラ幾何を表現自体に埋め込んでいる点が従来と異なる。単一の幾何表現からdetection・occupancy・depthを同時に読み出す統一設計になっている。", "why_read_ja": "3D reconstruction基盤モデルのlatentを自動運転の共有表現として転用する流れを示す例であり、occupancyやdetectionを個別タスクとして扱ってきた従来の設計思想に対する対案として参考になる。nuScenes/Argoverse 2/Waymo/KITTI/DDADと複数データセットで評価しており、汎化性の観点でも追う価値がある。", "paper_url": "https://arxiv.org/abs/2608.13147", "code_url": "", "published": "2026-08-13T12:17:50Z", "relevance": 26.5}, {"key": "arxiv:2608.12600", "title": "PseudoMapLabeler: Confidence-Aware Pseudo-Label Generation for Semi-Supervised Online Mapping", "venue": "ECCV 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "3D Detection", "AD Perception"], "abstract": "A critical challenge in deploying online HD map construction systems to real-world scenarios is the scarcity of labeled training data, which limits model generalization in diverse environments. To address this limitation, we propose a teacher-student semi-supervised learning (SSL) framework that generates high-quality pseudo-labels from unlabeled data through confidence-aware map refinement. Our approach first trains a teacher model on limited labeled data, then leverages Beta-distribution-based confidence maps to assess the reliability of predicted map elements across temporal observations. Unlike conventional filtering methods that discard entire elements, we introduce a spatial clipping technique that selectively preserves high-confidence regions while removing unreliable segments. The refined map elements serve as map priors that improve the teacher model's prediction accuracy on unlabeled data in a second pass. These enhanced predictions become pseudo-labels for training a student model from scratch, followed by fine-tuning on the original labeled data. Experimental results on the nuScenes dataset demonstrate that our teacher-student framework with refined pseudo-labels improves performance by +6.1 mAP under a low-label regime compared to training on labeled data alone, offering a practical solution to the labeled data scarcity problem in online HD map construction.", "summary_ja": "オンラインHDマップ構築ではラベル付きデータの不足が汎化性能を制限する課題があり、本論文はteacher-student型の半教師あり学習で解決を図る。教師モデルをラベルデータで学習した後、時間方向の観測に対してBeta分布に基づく信頼度マップで地図要素ごとの信頼性を評価する。信頼度の低い領域だけを空間的に切り取って除去し、要素全体を捨てる従来手法より情報を多く残す。精緻化された地図をpriorとして教師モデルの予測を改善し、それを擬似ラベルとして生徒モデルを学習後、元のラベルデータでfine-tuningする。", "novelty_ja": "要素単位で予測を採否する従来のフィルタリングと異なり、信頼度マップに基づく空間クリッピングで部分的に低信頼な領域だけを除去する点、および精緻化した予測を地図priorとして再利用する2段階構成が特徴。", "why_read_ja": "ラベル不足という実運用上のボトルネックに対する半教師あり学習アプローチであり、オンラインHDマップ構築の実用化に直結する知見を提供する。", "paper_url": "https://arxiv.org/abs/2608.12600", "code_url": "", "published": "2026-08-12T21:18:09Z", "relevance": 14.0}, {"key": "arxiv:2608.08696", "title": "OccAnyScene: Towards Unified Indoor-Outdoor 3D Occupancy Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "Open-world", "AD Perception"], "abstract": "3D occupancy prediction is fundamental to scene understanding, yet existing 3D semantic occupancy methods are typically specialized to fixed scene types and occupancy protocols. We introduce Cross-Scene 3D Semantic Occupancy Prediction, a new task setting which requires a single model to handle heterogeneous indoor and outdoor scenes with varying cameras, spatial ranges, voxel specifications, and semantic taxonomies. This setting poses a fundamental challenge: achieving metric-consistent yet scene-adaptive image-to-3D lifting across varying camera configurations and scene scales. To address this challenge, we propose OccAnyScene, a pixel-frustum-centered Gaussian framework built upon a pretrained depth foundation model. Specifically, the framework employs Pixel-Aligned Frustum Feature Aggregation to construct a camera-aware frustum query for each feature pixel, and Frustum-Parameterized Gaussian Construction to decode each query into multiple Gaussians whose positions and sizes are constrained by the predicted pixel depth and corresponding frustum geometry. OccAnyScene sets new state-of-the-art results, achieving 59.92% mIoU on the indoor Occ-ScanNet and 23.06% mIoU on the outdoor SurroundOcc-nuScenes.", "summary_ja": "既存の3D semantic occupancy手法が屋内/屋外など固定シーンタイプ・固定プロトコルに特化している問題に対し、単一モデルでカメラ構成・空間範囲・voxel仕様・セマンティック分類が異なる屋内外シーンを横断的に扱うCross-Scene 3D Semantic Occupancy Predictionという新タスクを提案する。課題は、カメラ設定やシーン規模が変わっても計量的に一貫しつつシーンに適応できるimage-to-3D liftingを実現することである。", "novelty_ja": "事前学習済みdepth foundation modelを基盤に、pixel-frustum中心のGaussian表現を用い、画素ごとのカメラ姿勢を考慮したfrustum queryを構築し、予測深度とfrustum幾何で位置・サイズを制約したGaussianへデコードすることで、シーンごとの再学習なしにスケール適応を実現する点が従来のシーン固有occupancy手法と異なる。", "why_read_ja": "屋内外を統一的に扱うoccupancy表現の設計思想は、複数センサ構成やドメインをまたぐ自動運転向けoccupancy予測の汎化性・再利用性を考える上で参考になる。", "paper_url": "https://arxiv.org/abs/2608.08696", "code_url": "", "published": "2026-08-09T13:19:53Z", "relevance": 22.5}, {"key": "arxiv:2608.05209", "title": "MapTCL: Temporal Consistency Learning via Bidirectional Alignment for Vectorized HD Map Construction", "venue": "IROS 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "3D Detection", "AD Perception"], "abstract": "Constructing reliable online HD maps remains challenging in dynamic urban environments due to moving objects and occlusions. While recent works employ feature-level temporal fusion to address this, they rely solely on per-frame ground truth supervision. Consequently, they lack an explicit objective to directly penalize the geometric noise and temporal jitter between consecutive online HD maps. To address this, we propose MapTCL, an auxiliary training strategy that formulates temporal consistency loss between current and past frames via bidirectional alignment. Specifically, Bidirectional Vector Consistency Learning (BVCL) models the geometric and semantic discrepancies between associated past and current vector instances as an auxiliary loss. We also employ Raster map Consistency Learning (RCL) as an additional loss to stabilize dense BEV features. By jointly training with these dual losses, MapTCL improves the temporal stability of generated HD maps. Extensive experiments on two standard benchmarks demonstrate the effectiveness of our approach. As a versatile plug-and-play module, MapTCL consistently enhances existing baseline models, achieving gains of +3.7 mAP & +2.8 C-mAP on nuScenes and +3.1 mAP & +2.5 C-mAP on Argoverse 2 without additional inference overhead.", "summary_ja": "オンラインHD Map構築において、動く物体やオクルージョンにより連続フレーム間で地図形状が幾何学的にぶれる問題を扱う。既存手法はフレームごとのGTのみで教師しており、時間的な一貫性を直接罰する損失がない点に着目し、過去フレームと現在フレームのベクトルインスタンスを双方向に対応付けて幾何・意味的な差異を補助損失として与えるMapTCLを提案する。BEV特徴を安定化するラスターマップ一貫性損失も併用し、追加の推論コストなしに既存ベースラインの精度を向上させる。", "novelty_ja": "フレーム単位のGT教師のみに頼る従来手法と異なり、過去・現在のベクトルインスタンス間の双方向整合性(BVCL)とラスター表現での一貫性(RCL)を明示的な補助損失として導入した点が新規性。", "why_read_ja": "時間的ジッタの抑制はオンラインHD Map生成の実用化に直結する課題であり、プラグアンドプレイで既存手法に適用できる点で地図生成研究の動向を追ううえで有用。", "paper_url": "https://arxiv.org/abs/2608.05209", "code_url": "", "published": "2026-08-05T08:53:26Z", "relevance": 16.5}, {"key": "arxiv:2608.04453", "title": "TwinIR: Coordinated Invisible Dual-Point Attacks on Online HD Map Construction", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "Online HD map construction is critical to prediction and planning in autonomous driving. We find that existing physical attacks against online map construction are limited by a cross-boundary compensation effect: after the target boundary is perturbed, another visible boundary may retain sufficient geometric cues for the model to recover the original road geometry. Based on this observation, we propose TwinIR, a new mechanism-guided physical attack methodology for online map construction. TwinIR jointly optimizes attack effectiveness and point sparsity, seeking the minimum number of attack points needed to suppress compensating geometric cues from surrounding boundaries. To reduce the perceptibility of multi-point attacks, TwinIR models camera responses to near-infrared illumination and maps optimized attack points to feasible physical placements, producing camera-visible interference with minimal visible-spectrum changes. Experiments on nuScenes across state-of-the-art online map construction models show that TwinIR reduces mAP by 8.18-8.96 percentage points under RSA and 2.84-5.62 points under ETA, while increasing the unreachable-goal rate by 25-28 points and the unsafe-planned-trajectory rate by 19-20 points over clean inputs. These attacks are also validated on a real-world testbed AV, where TwinIR successfully induces both road straightening and early-turn deformations while remaining inconspicuous in full-color views.", "summary_ja": "オンラインHDマップ構築モデルに対する物理的敵対攻撃を研究する論文。既存の単一境界への攻撃は反対側の視認可能な境界線が幾何的手がかりを補ってしまい効果が限定される「クロスバウンダリ補償効果」を発見し、これを打ち消すTwinIRという攻撃手法を提案している。攻撃点数を最小化しつつ周囲の補償的な幾何情報も抑制するよう最適化し、近赤外照明に対するカメラ応答をモデル化して可視光では目立たない物理的な攻撃点配置を生成する。", "novelty_ja": "単一境界のみを狙う従来攻撃と異なり、複数境界間の幾何的補償を考慮して攻撃点配置を最適化する点、および近赤外光を利用してカメラには写るが人間の目には見えにくい攻撃を実現する点が新しい。", "why_read_ja": "オンラインHDマップ構築モデルの脆弱性と、実車実験も含めた計画への影響(到達不能率・危険軌道率の増加)を定量的に示しており、地図生成モデルの頑健性評価という観点で重要。", "paper_url": "https://arxiv.org/abs/2608.04453", "code_url": "", "published": "2026-08-05T05:08:28Z", "relevance": 17.5}, {"key": "arxiv:2608.03895", "title": "NCGR: Noise-Conditional Gated Rectification for Camera Extrinsic Perturbations in BEV 3D Object Detection", "venue": "arXiv 2026", "year": 2026, "topic": "3D Detection", "topics": ["3D Detection", "HD Map", "AD Perception"], "abstract": "Camera-based bird's-eye-view (BEV) 3D detection typically assumes accurate and fixed camera extrinsics. In detectors using spatial cross-attention (SCA), extrinsic perturbations displace the image-plane projections of BEV reference points, causing queries to sample features from incorrect regions and degrading detection performance. To address this failure mode, Noise-Conditional Gated Rectification (NCGR) is proposed to compensate for projection errors without explicitly estimating a full six-degree-of-freedom extrinsic correction. For each query-camera pair, a 2D rectification offset is predicted and modulated by a camera-level gate to rectify the base projection before native deformable sampling. During training, the perturbation-derived quantities used to construct the condition and gate are gradually replaced through scheduled interpolation by counterparts generated from an auxiliary scalar predicted from camera features. This transition enables blind inference without perturbation metadata. During training, a weight-shared clean-teacher/perturbed-student pair is used, and the rectification module is supervised by a BEV-consistency objective between the two branches. NCGR is evaluated on nuScenes with simulated dynamic and static extrinsic perturbations. In a five-camera dynamic stress test, NCGR achieves 39.69% NDS, compared with 28.00% for BEVFormer and 33.23% for CAPE. Under clean extrinsics, NCGR maintains performance comparable to that of BEVFormer.", "summary_ja": "カメラのextrinsic(外部パラメータ)が実際にはずれることでBEV 3D検出のspatial cross-attentionにおける画像平面への投影がずれ、性能が劣化する問題を扱う。NCGRは6DoFの補正を陽に推定せず、query-camera対ごとに2Dの補正オフセットを予測しカメラ単位のゲートで調整することで、deformable samplingの前に投影を補正する。学習時はノイズ由来の条件量を、カメラ特徴から予測した補助スカラーに段階的に置き換えることで、推論時にはノイズのメタ情報なしで動作できるようにしている。", "novelty_ja": "外部パラメータの完全な6DoF補正を明示的に推定するのではなく、query単位の軽量な2D補正+ゲート機構とclean-teacher/perturbed-studentのBEV一致損失で暗黙的に誤差を吸収する点が従来と異なる。", "why_read_ja": "実運用ではカメラの取り付け誤差やキャリブレーションずれが常に存在するため、BEV検出のロバスト性を上げる手法は地図生成・環境認識パイプライン全体の信頼性向上に直結する。", "paper_url": "https://arxiv.org/abs/2608.03895", "code_url": "", "published": "2026-08-04T16:26:57Z", "relevance": 16.0}, {"key": "arxiv:2608.01338", "title": "Driver2Map: Imitating Human Driving for Online High-Definition Map Construction", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "AD Perception"], "abstract": "High-definition (HD) maps are essential for autonomous driving systems. In constructing such maps, onboard multi-view camera images, standard-definition maps and satellite images provide crucial information. However, due to the modality and perspective differences among these data sources, existing methods often struggle to effectively align and fuse them, making online HD map construction still challenging. To address these issues, we propose Driver2Map, an online HD map construction model inspired by human drivers. Unlike existing HD map construction models that utilize only two modalities, our Driver2Map can simultaneously exploit three modalities. Specifically, we propose a \"two-stage alignment\" strategy to reduce spatial misalignment across different modalities. Additionally, we introduce \"Pose-Guided BEV Fusion\", a BEV (bird's-eye-view) generation module that leverages camera pose information to adaptively weight multi-view features, thereby effectively suppressing cross-view feature overlap during BEV generation. Also, we design a \"Pretrained Prior for Map Refinement\" module to refine the initial prediction by learning map structure priors, thus improving the HD map prediction under dynamic occlusions. Extensive experiments demonstrate that Driver2Map outperforms existing methods on both IoU and AP metrics.", "summary_ja": "カメラ画像・標準地図・衛星画像の3モダリティを統合してオンラインでHDマップを構築する手法。モダリティ間の視点・空間ずれにより既存手法が2種の情報源しか使えず整合や融合に苦労している課題に対応する。2段階アライメントでずれを補正し、カメラ姿勢を使ってBEV特徴の重み付けを行うPose-Guided BEV Fusionと、地図構造の事前知識で予測を精緻化するモジュールを組み合わせる。", "novelty_ja": "従来の2モダリティ手法に対し3モダリティ(カメラ・SDマップ・衛星画像)を同時活用し、姿勢情報によるBEV融合とマップ構造の事前学習による精緻化を導入した点が異なる。", "why_read_ja": "動的遮蔽下でのHDマップ精度向上とマルチモーダル融合の設計事例として、オンラインHDマップ構築の最新動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2608.01338", "code_url": "", "published": "2026-08-02T16:01:42Z", "relevance": 19.5}, {"key": "arxiv:2607.27058", "title": "Object Detection for Autonomous Driving in Chinese Rural Scenes: An Experimental Study on Real-Synthetic Data Mixing and Model Evaluation", "venue": "arXiv 2026", "year": 2026, "topic": "AD Perception", "topics": ["AD Perception"], "abstract": "Currently, autonomous driving object detection models face significant data scarcity and generalization challenges when navigating complex Chinese rural traffic scenarios. To address these limitations, we propose a novel real-synthetic mixed object detection dataset tailored specifically for Chinese rural roads and systematically evaluate the performance of 13 mainstream detectors under different real-to-synthetic data ratios, thereby providing empirical evidence for model selection and data strategy design in rural autonomous driving scenarios. Our dataset combines real-world images captured in Weishi County, Henan Province, with parameterized virtual scenes generated via Unreal Engine. To accurately reflect the unique realities of rural traffic, we define a comprehensive 14-category object system encompassing region-specific elements such as electric tricycles, low-speed vehicles (LSVs), and roadside stalls. Under a unified training protocol, we systematically evaluate 13 mainstream detectors -- spanning the YOLOv5, YOLOv8, YOLO11, and YOLO26 series, as well as RT-DETR-L -- across three data configurations: an all-real baseline, a 1:0.5 real-to-virtual mix, and a 1:1 mix. Experimental results demonstrate that a moderate injection of synthetic data (1:0.5 ratio) effectively enhances detection performance, with YOLO11m achieving the highest mAP@0.5 of 0.758. However, a higher proportion of synthetic data (1:1) introduces domain shifts that offset the benefits of data scaling. While most models reliably identify distinct local vehicles, significant perceptual bottlenecks remain for long-tail, non-standard objects like stalls and railings. This research provides crucial empirical evidence and novel insights for model selection and synthetic data strategies, facilitating the practical deployment of autonomous driving perception systems in rural areas.", "summary_ja": "中国農村部の複雑な交通環境ではデータ不足と汎化性の課題があるとして、Unreal Engineで生成した合成画像と河南省尉氏県で撮影した実画像を組み合わせた14クラスの物体検出データセットを構築した論文。電動三輪車や低速車両、露店など地域特有の物体クラスを定義し、YOLOv5/v8/11/26シリーズとRT-DETR-Lの計13モデルを、実データのみ・実:合成=1:0.5・1:1の3条件で比較評価している。", "novelty_ja": "既存研究が都市部・欧米中心のデータセットに偏る中、農村特有の物体カテゴリと実画像・合成画像の混合比率を体系的に変えて検出性能への影響を定量評価した点が新しい。", "why_read_ja": "合成データ混合比率が検出性能に与える影響とlong-tail物体での限界を実証しており、データ戦略設計の知見として環境認識研究の参考になる。", "paper_url": "https://arxiv.org/abs/2607.27058", "code_url": "", "published": "2026-07-29T15:49:02Z", "relevance": 8.5}, {"key": "arxiv:2607.23758", "title": "RoadVGGT: Road-Structure-Aware Feed-Forward Road Surface Reconstruction", "venue": "arXiv 2026", "year": 2026, "topic": "Reconstruction", "topics": ["Reconstruction", "HD Map", "Gaussian Splatting", "Open-world"], "abstract": "Large-scale road surface reconstruction supports high-definition mapping, autonomous-driving perception, annotation, and simulation. Existing road-specialized optimization methods can produce high-quality road representations, but they typically require per-scene training and scene-dependent coverage design around the driving trajectory, limiting scalable reconstruction over newly collected roads. To address these limitations, we introduce RoadVGGT, a road-structure-aware feed-forward framework that reconstructs compact Gaussian road surfaces without test-time per-scene optimization. RoadVGGT uses a geometric foundation model to exploit multi-view images together with provided pose and depth observations, and predicts dense pixel-aligned Gaussian attributes through a learned Gaussian head. To make these dense predictions usable for large road surfaces, we align them into a consistent metric world coordinate system and fuse redundant Gaussians on the road-aligned XY plane through confidence-weighted grid fusion. Category-aware grouping and road--sidewalk junction protection further control fusion around vulnerable road structures. The resulting representation supports RGB and semantic bird's-eye-view maps, elevation estimation, and novel view synthesis. RoadVGGT eliminates the need for per-scene optimization in prior methods, reconstructs complete road surfaces with a compact Gaussian representation, and improves image quality, semantic mapping, and elevation accuracy. Extensive experiments demonstrate the potential of geometric foundation models for scalable feed-forward road surface reconstruction.", "summary_ja": "大規模道路サーフェス再構成を、シーンごとの最適化なしにfeed-forwardで行う手法RoadVGGTを提案。幾何学的foundation modelでマルチビュー画像・pose・depthからGaussian属性を予測し、metric座標系に整合させたうえでroad平面上でconfidence-weightedなgrid fusionにより冗長Gaussianを統合する。歩道との境界などの脆弱な道路構造はcategory-aware groupingとjunction保護で扱う。", "novelty_ja": "従来の道路特化最適化手法がシーンごとの学習と軌道依存のカバレッジ設計を必要とするのに対し、test-time最適化なしのfeed-forward推論でコンパクトなGaussian道路表現を生成する点が異なる。", "why_read_ja": "HD Map生成やGaussian Splattingを用いた大規模屋外シーン再構成のスケーラビリティ向上という観点で、地図生成研究の動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2607.23758", "code_url": "", "published": "2026-07-26T17:09:12Z", "relevance": 10.5}, {"key": "arxiv:2607.21896", "title": "Learning Adaptive Semantic Gaussian Allocation for 3D Occupancy", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "3D Detection", "Scene Understanding", "Gaussian Splatting", "AD Perception"], "abstract": "Semantic 3D Gaussians provide a compact representation for 3D semantic occupancy prediction by rendering semantic primitives into a voxel volume under voxel-wise supervision. Recent methods have improved the modeling ability and efficiency of this representation through more flexible primitive shapes, geometry-guided initialization, and progressive densification. However, these advances mainly determine how primitives are represented, initialized, or added, and do not explicitly address how to select the most useful Gaussians when their total number must be limited to control memory and computation. This imbalance creates an allocation bottleneck: redundant Gaussians remain in simple regions, while difficult regions receive insufficient semantic support. We propose the Semantic Gaussian Allocation Transformer (SAGFormer), which uses Gaussian attributes and local geometric-semantic features to score candidates and select a fixed final Gaussian set. Experiments on nuScenes-SurroundOcc and SSCBench-KITTI-360 show that SAGFormer improves occupancy prediction under the evaluated protocols and yields more semantically consistent and better-utilized Gaussian representations. Under similar final counts and raw coverage, it reduces semantic mixing, strengthens class-consistent voxel support, and produces fewer unused Gaussians. The results indicate that explicit capacity allocation is a useful complement to Gaussian refinement for semantic occupancy prediction.", "summary_ja": "Semantic 3D Gaussians を用いた 3D semantic occupancy prediction では、Gaussian の総数をメモリ・計算量の都合で制限する必要があるが、従来研究は primitive の形状表現・初期化・densification といった「どう表現し、どう増やすか」に注力してきた。本論文は、限られた本数の中で「どの Gaussian を残すか」という配分の問題が未解決であり、単純な領域に冗長な Gaussian が残る一方で難しい領域が不足する偏りが生じると指摘する。そこで、Gaussian の属性と局所的な幾何・意味特徴からスコアを付け、固定サイズの最終 Gaussian 集合を選択する Semantic Gaussian Allocation Transformer (SAGFormer) を提案する。nuScenes-SurroundOcc と SSCBench-KITTI-360 で評価している。", "novelty_ja": "primitive の表現力向上や追加戦略ではなく、限られた容量をどの領域に割り当てるかという選択問題を明示的に扱い、Transformer によるスコアリングで最終的な Gaussian 集合を決める点が従来と異なる。同程度の最終本数・カバレッジ条件下で semantic mixing の低減や未使用 Gaussian の削減を示している。", "why_read_ja": "Gaussian ベースの occupancy 表現において、精度を左右するのが表現力だけでなく容量配分であることを示しており、コンパクトな 3D 表現を車載環境で実用化する際の設計指針として参考になる。", "paper_url": "https://arxiv.org/abs/2607.21896", "code_url": "", "published": "2026-07-24T01:52:49Z", "relevance": 25.5}, {"key": "arxiv:2607.21281", "title": "HGeo-TopoMap: Boosting Topological Mapping with Hierarchical Geometric Priors", "venue": "arXiv 2026", "year": 2026, "topic": "Topology", "topics": ["Topology", "AD Perception"], "abstract": "Topological maps are key outputs of autonomous driving perception systems, delivering essential road information for path planning. They identify instances such as centerlines and traffic signs, along with their connectivity relationships. Due to the lack of explicit markings for centerlines in real-world environments, the detection of centerline instances remains a significant challenge. To tackle this problem, we propose HGeo-TopoMap, which leverages an explicit prior map and implicit spatial relations to hierarchically boost topological mapping. First, a geometric adaptive learning module is designed for the road structure map obtained via inverse perspective mapping. This module discretely encodes semantic and spatial features from the map, followed by a prior-mask attention mechanism that selectively focuses on informative regions. Then, a geometric consistency learning module is devised, which leverages the geometric properties and spatial relationships of centerlines. Built on the geometry-aware decoder, it enforces spatial consistency by aligning features of centerline instances with identical geometric orientations. The proposed method is evaluated on the OpenLane-V2 dataset across the centerline, lane segment, and robustness benchmarks. Beyond substantial improvements in topological mapping accuracy, the proposed method offers the benefit of enhanced robustness, consistently outperforming baselines under both standard and challenging conditions. The source code and model weights will be made publicly available at https://github.com/lynn-yu/HGeo-TopoMap.", "summary_ja": "実世界に明示的な標示がないセンターラインの検出が困難であるという課題に対し、HGeo-TopoMapは事前地図(IPMで得た道路構造マップ)から抽出した幾何・意味特徴への注意機構と、センターライン間の幾何的な向きの一致を利用した特徴整合の2段階で、トポロジカルマッピングの精度を高める。OpenLane-V2のcenterline・lane segment・robustnessベンチマークで評価している。", "novelty_ja": "明示的な事前地図由来の特徴に対するprior-mask attentionと、センターライン instance 間の幾何的整合性を強制するgeometry-aware decoderを組み合わせ、階層的に事前知識を活用する点が従来手法との違い。", "why_read_ja": "センターライン検出はオンラインHDマップ・トポロジー推定の中心的な難所であり、事前地図の活用と幾何的整合性による頑健性向上のアプローチは同分野の手法設計の参考になる。", "paper_url": "https://arxiv.org/abs/2607.21281", "code_url": "https://github.com/lynn-yu/HGeo-TopoMap", "published": "2026-07-23T13:02:18Z", "relevance": 16.5}, {"key": "arxiv:2607.17660", "title": "RayOcc: Occlusion-Aware Ray Occupancy Estimation via Gaussian Mixture Intensity", "venue": "IROS 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "Reconstruction", "AD Perception"], "abstract": "Camera-only 3D semantic occupancy prediction aims to infer voxel-wise scene semantics from multi-view images, yet remains fundamentally challenging due to depth ambiguity and occlusion. Along a single camera ray, multiple spatially separated surfaces may coexist, making occupancy inherently a multi-label existence problem rather than a single-depth estimation task. However, most existing approaches favor a single dominant depth hypothesis per ray, limiting their ability to model volumetric scenes under complex occlusion. To address this limitation, we introduce RayOcc, an occlusion-aware ray occupancy framework that reformulates ray modeling as multi-label existence prediction. Instead of predicting a categorical depth distribution, RayOcc estimates a non-normalized Gaussian mixture intensity along each ray and converts it into interval-wise occupancy probabilities via a Poisson event formulation, allowing multiple occupied hypotheses to coexist without enforcing mutual competition across depth. The predicted mixture components are interpreted as occupancy hypotheses to initialize sparse 3D Gaussian primitives, which are refined and rasterized for semantic occupancy prediction. Experiments on the nuScenes benchmark show that RayOcc achieves state-of-the-art overall IoU and mIoU among the compared Gaussian-based occupancy methods.", "summary_ja": "マルチビュー画像からのカメラのみ3D semantic occupancy predictionにおいて、レイ上に複数の占有面が存在する遮蔽状況をどう表現するかを課題としている。従来の単一深度仮説に基づくレイモデリングでは複雑な遮蔽下での体積的なシーンを表現しづらいとし、レイを多ラベル存在問題として再定式化するRayOccを提案する。レイ上の非正規化Gaussian混合強度を推定し、Poissonイベント形式で区間ごとの占有確率に変換することで、深度方向に競合させずに複数の占有仮説を共存させる。推定した混合成分をsparse 3D Gaussianの初期化に用い、ラスタライズしてsemantic occupancyを出力する。", "novelty_ja": "単一の支配的深度仮説を選ぶ従来手法と異なり、レイ上の占有をGaussian混合強度とPoissonイベント形式で表現し複数深度の同時占有を許容する点、およびその混合成分をGaussian Splattingの初期化に直結させている点が新規性。", "why_read_ja": "occupancy predictionにおける遮蔽・深度多義性の扱いはBEV/occupancy系AD認識の中心課題であり、Gaussian Splattingベースoccupancy手法のSOTAとしてレイ表現設計の参考になる。", "paper_url": "https://arxiv.org/abs/2607.17660", "code_url": "", "published": "2026-07-20T08:10:58Z", "relevance": 18.0}, {"key": "arxiv:2607.14481", "title": "Immediate 3D Gaussian Splat Reconstruction of Unordered Input with Global Consistency", "venue": "arXiv 2026", "year": 2026, "topic": "Gaussian Splatting", "topics": ["Gaussian Splatting"], "abstract": "3D Gaussian Splatting (3DGS) has become the method of choice for reconstructing and real-time rendering of captured scenes. To capture a scene with good visual quality, continuous image sequences are usually combined with out-of-order shots for better scene coverage. Structure from motion can reconstruct such captures, but only after they are all available and often with high computational cost. Incremental reconstruction methods -- often derived from SLAM solutions -- provide immediate feedback, but cannot handle the out-of-order capture we require. We provide the first immediate feedback solution for such radiance field capture that provides global consistency. We first introduce a method for fast matching in out-of-order sequences, by repurposing visual place recognition models and a covisibility graph, and provide an efficient way to find highly connected keyframes, improving quality even for ordered sequences. We show how these steps -- together with GPU optimization and careful Gaussian primitive placement -- provide fast local reconstruction, in our challenging radiance field reconstruction case. We then introduce a novel cluster-based method, again using the covisibility graph, to provide efficient loop closure that does not require sequential input. Finally, to handle large scenes in our context, we introduce a progressive hierarchy that allows our method to scale to large environments, without compromising efficiency. Our results show we provide immediate feedback 3DGS reconstruction with good visual quality in several datasets, with up to thousands of input images.", "summary_ja": "無順序かつ大量の入力画像から3D Gaussian Splattingシーンを即時かつグローバルに一貫した形で再構成する手法を提案している。従来のStructure from Motionは全画像取得後でないと動作せず計算コストも高く、SLAM系の逐次再構成手法は順序通りの撮影しか扱えないという課題に対応する。視覚的場所認識モデルとcovisibilityグラフを用いた高速マッチング、クラスタベースのループクロージャ、大規模シーン対応の階層構造を組み合わせ、数千枚規模の画像でも即時フィードバック可能な再構成を実現している。", "novelty_ja": "順序に依存しないout-of-order撮影に対しても即時フィードバックとグローバル整合性を両立させる点が新規であり、covisibilityグラフベースのマッチングとクラスタ型ループクロージャ、進行的階層構造によりスケーラビリティも確保している。", "why_read_ja": "大規模かつ動的・非順序な取得データからの高速3DGS再構成技術は、自動運転向けの地図・シーン再構成やオンラインHDマップ生成技術の基盤要素として応用可能であり、Gaussian Splattingの実運用化に向けた重要な進展として参照価値が高い。", "paper_url": "https://arxiv.org/abs/2607.14481", "code_url": "", "published": "2026-07-16T01:53:13Z", "relevance": 8.5}, {"key": "arxiv:2607.12419", "title": "DeGuNet: Depth-Guided Ultra-Compact Backbones for Efficient LiDAR-Camera 3D Detection", "venue": "ECCV 2026", "year": 2026, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception", "HD Map"], "abstract": "In autonomous driving perception, the fusion of LiDAR and camera modalities has become the dominant paradigm for 3D object detection. However, current multi-modal frameworks heavily rely on massive visual backbones pretrained on 2D semantic tasks. This reliance introduces substantial parameter redundancy and a structural misalignment, as 2D priors are ill-equipped to handle the extreme sparsity of LiDAR projections required for Bird's-Eye-View geometry. To address this, we present DeGuNet, an ultra-compact and plug-and-play image backbone explicitly designed for depth-guided representation learning. By incorporating sparsity-aware feature extraction mechanisms, DeGuNet effectively aligns multi-view images with unstructured LiDAR depth while strictly preventing invalid-region contamination. Extensive experiments on the nuScenes dataset demonstrate DeGuNet's broad plug-and-play applicability and superior efficiency. When integrated into established baselines, it fundamentally eliminates architectural redundancy, reducing GPU memory consumption by up to 66.5% and achieving a 1.16x inference speedup. Concurrently, DeGuNet delivers up to a 6.20 absolute mAP gain, establishing a new paradigm for parameter-efficient multi-modal 3D perception.", "summary_ja": "LiDARとカメラを融合する3D物体検出において、2D事前学習済みの巨大な画像バックボーンがLiDAR投影の疎な構造と整合しない問題を指摘し、深度情報を活用した超小型バックボーンDeGuNetを提案する。スパース性を考慮した特徴抽出により、マルチビュー画像を非構造的なLiDAR深度に整合させつつ無効領域の混入を防ぐ。nuScenesでの実験により、既存手法へのplug-and-play導入でメモリ削減と高速化、精度向上を確認している。", "novelty_ja": "既存の汎用2D事前学習バックボーンをそのまま流用するのではなく、LiDAR深度に特化した超軽量・スパース性考慮型のバックボーンを設計し、パラメータ冗長性と構造的ミスアライメントを直接解消する点が従来と異なる。", "why_read_ja": "マルチモーダル3D検出における画像バックボーン設計の効率化アプローチとして、BEV型認識パイプラインの計算コスト削減の動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2607.12419", "code_url": "", "published": "2026-07-14T06:46:30Z", "relevance": 19.0}, {"key": "arxiv:2607.04812", "title": "TGRIP: A Text-Guided Approach to Vehicle Instance Prediction in Autonomous Driving", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy Forecasting", "topics": ["AD Perception", "HD Map", "3D Detection", "Occupancy", "Occupancy Forecasting", "Open-world"], "abstract": "Bird's-Eye View (BEV) end-to-end instance prediction has emerged as a robust paradigm for autonomous driving perception, effectively mitigating the error propagation inherent in traditional modular pipelines. However, current state-of-the-art approaches rely predominantly on geometric supervision, such as occupancy regression and optical flow, effectively treating scene agents as generic moving obstacles. This absence of explicit semantic awareness imposes limitations on the capacity of the model to solve ambiguities in complex scenarios, particularly those where object-specific behavior is essential for accurate forecasting (e.g. overtaking, intersections). In this paper, we introduce Text-Guided Representation for Instance Prediction (TGRIP), a novel framework that bridges this gap by injecting rich semantic priors into the instance prediction loop. The proposed teacher-student pipeline employs Vision-Language Foundation Models to generate dense, semantic-enhanced BEV maps from multi-camera images. These maps serve as auxiliary supervision during training, guiding the network to learn spatio-temporal representations that are not only geometrically consistent but also semantically discriminative. To the best of our knowledge, this represents the first attempt to unify semantic guidance with the temporal task of future instance prediction. The experimental results demonstrate that TGRIP surpasses existing state-of-the-art models in nuScenes, validating the hypothesis that semantic enrichment is a fundamental element for robust, end-to-end motion prediction. Code is available on https://github.com/miguelag99/TGRIP.", "summary_ja": "BEV上でのend-to-endな将来インスタンス予測(周辺車両の位置・挙動予測)を扱う研究。既存手法がoccupancy回帰やoptical flowなど幾何的教師信号のみに頼り、物体固有の意味的挙動(追い越しや交差点での振る舞いなど)を捉えられない点を課題とする。Vision-Language Foundation Modelsを用いてマルチカメラ画像から意味情報を付加したBEVマップを生成し、teacher-student構成でこれを補助教師信号として学習に組み込むTGRIPを提案している。", "novelty_ja": "幾何的教師信号のみだった従来のBEV instance predictionに対し、VLMベースの意味的BEVマップを補助教師として初めて統合し、意味理解と時系列予測タスクを結びつけた点が新規性。", "why_read_ja": "occupancy/BEVベースの将来予測に意味的priorを組み込むアプローチであり、幾何情報偏重の従来手法からの発展方向として地図生成・動的シーン理解の研究動向を追う上で参考になる。", "paper_url": "https://arxiv.org/abs/2607.04812", "code_url": "https://github.com/miguelag99/TGRIP", "published": "2026-07-06T08:47:56Z", "relevance": 14.5}, {"key": "arxiv:2607.04732", "title": "SparseOcc++: Geometry-Aware Sparse Latent Representation for Semantic Occupancy Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception", "HD Map"], "abstract": "Vision-based 3D semantic occupancy prediction is essential for autonomous driving, yet dense voxel representations waste computation on largely empty space, while BEV and TPV projections compromise fine-grained 3D structure. Fully sparse representations offer an attractive alternative, but existing methods, including SparseOcc, entangle scene completion with semantic prediction by indiscriminately propagating high-dimensional features into empty regions and applying voxel-wise classification. This creates excessive activations, computational overhead, and geometric ambiguity. We present SparseOcc++, a geometry-aware sparse framework that explicitly decouples scene completion from semantic segmentation. SparseOcc++ reformulates completion as signed-distance regression on sparse anchor voxels through a scene completion field (SCF). To model complex outdoor geometry robustly, it combines orthogonal decomposition with discretized distance learning. A geometry-guided propagation module then converts the SCF into a complete volumetric scene and restricts semantic segmentation to geometrically verified regions. Experiments establish new state of the art: SparseOcc++ improves IoU by 2.3 points and is 3.9x faster than SparseOcc on nuScenes, while achieving a 5.9x speedup over OccFormer on SemanticKITTI.", "summary_ja": "カメラ画像から3D semantic occupancyを予測する際、dense voxel表現は空領域に計算を浪費し、BEVやTPVへの投影は細かい3D構造を失うという課題に取り組んだ研究。従来のfully sparseな手法(SparseOccなど)は、空領域へ高次元特徴を無差別に伝播させたうえでvoxel単位の分類を行うため、scene completionとsemantic predictionが絡み合い、余計な活性化と計算負荷、幾何的な曖昧さを生んでいた。SparseOcc++はこの2つを明示的に分離し、completionをsparse anchor voxel上のsigned distance回帰(scene completion field, SCF)として定式化する。SCFから完全な体積シーンを構成するgeometry-guided propagationを介し、幾何的に検証された領域に限定してsemantic segmentationを適用する。", "novelty_ja": "scene completionをsemantic segmentationから切り離し、voxel分類ではなくsparse anchor voxel上のsigned distance回帰として扱う点が従来のfully sparse occupancy手法と異なる。屋外の複雑な幾何に対応するため、orthogonal decompositionとdiscretized distance learningを組み合わせている点も特徴。", "why_read_ja": "occupancy predictionにおけるsparse表現の効率と精度の両立という主要な論点に対し、幾何と意味の役割分担という設計指針を示している。nuScenesでSparseOcc比IoU +2.3、3.9倍高速、SemanticKITTIでOccFormer比5.9倍高速と報告されており、実用的な計算コストの観点でも参照価値がある。", "paper_url": "https://arxiv.org/abs/2607.04732", "code_url": "", "published": "2026-07-06T07:10:00Z", "relevance": 29.0}, {"key": "arxiv:2607.01928", "title": "Sparse-Aware Vector Quantization for Bandwidth-Efficient Collaborative 3D Semantic Occupancy Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding"], "abstract": "Collaborative perception extends single-agent perception by enabling multiple vehicles to exchange complementary perceptual information. However, it introduces an inherent trade-off between perception gain and communication overhead, which is particularly severe for 3D semantic occupancy prediction that relies on fine-grained spatial structures. Existing methods typically compress 3D features into 2D, causing severe spatial information loss, or transmit dense 3D representations, hindering real-world deployment. To overcome these limitations, we propose a bandwidth-efficient collaborative Vector Quantization Semantic Occupancy Prediction (VQSOP) framework. VQSOP employs a Sparse-Aware Vector Quantization (SAVQ) mechanism that exploits 3D scene sparsity to compactly encode informative regions, drastically reducing communication overhead while preserving complete geometric context. Furthermore, to enhance structural consistency and feature continuity, we design a Dual-Branch Adaptive Spatial Refinement (ASR) module that dynamically fuses local high-frequency details with broad contextual semantics. Extensive experiments demonstrate that our approach achieves state-of-the-art performance while reducing communication volume by up to 82x.", "summary_ja": "複数車両が3D semantic occupancyの認識結果を共有する協調認識において、通信量と認識性能のトレードオフを解決する手法を提案している。既存手法は3D特徴を2Dに圧縮して空間情報を失うか、密な3D表現をそのまま送って通信負荷が大きいという課題があった。本研究ではシーンのスパース性を利用したベクトル量子化により情報量の多い領域だけを圧縮して伝送するVQSOPフレームワークを構築している。", "novelty_ja": "3D特有のスパース性を活用したSparse-Aware Vector Quantizationで空間情報を保持したまま圧縮し、局所的な高周波情報と広域的な文脈情報を融合するDual-Branch Adaptive Spatial Refinementモジュールを組み合わせている点が従来の2D圧縮・密3D伝送手法と異なる。", "why_read_ja": "協調認識におけるoccupancy表現の伝送効率化は、複数車両・インフラ間でのマップ更新や環境認識の実運用化に直結する課題であり、通信量82倍削減という具体的な効果が動向把握に有用である。", "paper_url": "https://arxiv.org/abs/2607.01928", "code_url": "", "published": "2026-07-02T09:23:23Z", "relevance": 16.0}, {"key": "arxiv:2606.31688", "title": "Semantic Occupancy Prediction with Dual Range-Voxel Representation", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "LiDAR-based 3D semantic occupancy prediction, which aims to provide accurate and comprehensive scene representation, is crucial for autonomous driving systems. As point clouds suffer from sparsity and incompleteness, leading to insufficient semantic learning and difficult occupancy perception, existing methods often stack multi-sweep point clouds to obtain dense spatial information. However, such a naive strategy also results in efficiency (e.g., additional computational burden) and robustness (e.g., pose transformation noise) concerns, which hinder their practical applications. In this work, we propose a Dual Range-Voxel Representation (DRVR) that leverages the range-view context and voxel-view geometry of single-sweep point clouds for 3D semantic occupancy prediction, eliminating the concerns associated with the multi-sweeps. Specifically, we use the range-view encoder to extract the compact context of the scene. To fully exploit the spatial information, we design a geometry-aware voxel-view encoder that extracts multi-scale voxel-view features separately and combines them for better geometric occupancy prediction. Moreover, we propose a range-voxel fusion module to cooperate range- and voxel-view features via voxel-to-range and range-to-voxel fusions. Extensive experiments on nuScenes-Occupancy, SemanticKITTI and SemanticPOSS show the superiority of our method. Especially on nuScenes-Occupancy, our single-sweep DRVR achieves 5.4% improvement in mIoU and 2.1x acceleration compared to the multi-sweep method.", "summary_ja": "LiDARベースの3D semantic occupancy predictionでは、点群のスパース性・不完全性を補うために複数スイープを重ねる手法が一般的だが、計算コストの増加や自己位置推定誤差によるノイズが実用上の課題となる。本論文は単一スイープの点群だけを使い、range viewから得られる文脈情報とvoxel viewの幾何情報を組み合わせるDual Range-Voxel Representation (DRVR)を提案している。range-view encoderでコンパクトな文脈特徴を、幾何を考慮したvoxel-view encoderでマルチスケールの空間特徴を抽出し、両者をvoxel-to-range / range-to-voxelの双方向融合で統合する。nuScenes-Occupancy、SemanticKITTI、SemanticPOSSで評価し、nuScenes-Occupancyでは多スイープ手法に対しmIoU +5.4%、2.1倍の高速化を報告している。", "novelty_ja": "multi-sweepの積み上げに頼らず、単一スイープのrange viewとvoxel viewという2つの表現を双方向に融合することで密な空間情報を補う点が従来手法との違いである。これにより多スイープ由来の計算負荷とpose変換ノイズの問題を回避している。", "why_read_ja": "occupancy予測における入力表現の設計（range view と voxel view の使い分けと融合）という観点で参考になり、単一スイープでの精度と効率の両立は車載でのリアルタイム環境認識を考えるうえで示唆がある。", "paper_url": "https://arxiv.org/abs/2606.31688", "code_url": "", "published": "2026-06-30T14:01:52Z", "relevance": 24.0}, {"key": "arxiv:2606.31177", "title": "GaussianMap: Learning Gaussian Representation for Multi-Sensor Online HD Map Construction", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "Autonomous driving systems benefit from high-definition (HD) maps that provide critical information about road infrastructure. The online construction of HD maps offers a scalable approach to generate local vectorized maps from onboard sensor observations. Existing methods commonly adopt bird's-eye-view (BEV) features as the intermediate scene representation, encoding the surrounding space with fixed-resolution dense grids. However, map elements are spatially sparse yet require fine-grained geometric localization, making uniformly allocated BEV representations redundant and less effective for vectorized map prediction. In this work, we propose GaussianMap, an online HD map construction framework that learns an adaptive Gaussian representation of the surrounding scene. This representation consists of a set of Gaussian primitives on the BEV plane, each encoding a flexible local region with geometric properties and a feature vector, allowing the model to allocate representational capacity to map-relevant regions. To generate such a representation from sensor observations, we introduce a feed-forward Gaussian encoder that progressively refines these primitives through Gaussian interaction modeling and multi-sensor feature aggregation. The refined Gaussian representation is then splatted into a BEV feature map and decoded into vectorized map predictions. Extensive experiments on nuScenes and Argoverse 2 datasets demonstrate that GaussianMap achieves state-of-the-art performance in both camera-only and camera-LiDAR fusion settings. Our code will be made publicly available.", "summary_ja": "オンラインHDマップ構築では中間表現として固定解像度の密なBEVグリッドが使われるのが一般的だが、地図要素は空間的に疎で一方で細かい幾何精度が要求されるため、一様なBEV表現は冗長で非効率という問題がある。本論文はBEV平面上のGaussian primitiveの集合でシーンを表現するGaussianMapを提案する。各primitiveは幾何的属性と特徴ベクトルを持ち柔軟な局所領域を担うため、地図に関係する領域へ表現能力を集中的に配分できる。feed-forwardなGaussian encoderがGaussian同士の相互作用モデリングとマルチセンサ特徴集約を通じてprimitiveを段階的に精緻化し、それをsplattingしてBEV特徴マップに変換した後、ベクタマップとしてデコードする。", "novelty_ja": "密な一様BEVグリッドの代わりに、適応的に配置されるBEV上のGaussian primitive集合を中間表現として学習し、splattingを介してベクタマップ予測につなぐ点が従来手法と異なる。カメラ単独とカメラ+LiDAR融合の双方に対応する点も特徴である。", "why_read_ja": "Gaussian表現をオンラインHDマップ構築の中間表現として使う流れを示す例で、BEVグリッド中心だった地図生成の設計が疎・適応的な表現へ移行しうることを確認できる。nuScenesとArgoverse 2でcamera-onlyおよびcamera-LiDAR fusion設定のstate-of-the-artを報告しており、ベンチマーク動向の把握にも有用である。", "paper_url": "https://arxiv.org/abs/2606.31177", "code_url": "", "published": "2026-06-30T06:08:42Z", "relevance": 24.5}, {"key": "arxiv:2606.29286", "title": "ASTAD: Asymmetric Style Transfer for Synthetic-to-Real Adaptation in Autonomous Driving", "venue": "ECCV 2026", "year": 2026, "topic": "AD Perception", "topics": ["World Model", "AD Perception"], "abstract": "Synthetic data mitigates the data scarcity problem in autonomous driving perception. However, the synthetic-to-real gap leads to performance degradation, hindering real-world model generalization. Although current methods leverage diffusion models for photorealistic style transfer to bridge this gap, they critically ignore a practical asymmetry: while synthetic data possesses perfect pixel-level annotations, real-world style reference images generally lack corresponding labels. Consequently, existing methods relying on symmetric semantic guidance suffer from either prohibitive annotation costs or severe semantic misalignment. To address this dilemma, we formally propose a novel task: Asymmetric Style Transfer for Autonomous Driving (ASTAD), which requires semantically consistent transfer using only labeled synthetic content and unlabeled real-world references. We further introduce the ASTModel, a training-free two-stage framework designed to bridge this domain gap under asymmetric constraints. ASTModel first extracts a coarse semantic prior from the unlabeled target, followed by dynamic prior refinement and class-consistent style injection during the denoising process. Extensive experiments demonstrate that ASTModel significantly outperforms existing methods in downstream perception utility and structural fidelity, while offering a 3.2$\\times$ inference speedup. This work aligns synthetic-to-real adaptation with practical constraints, holding the potential to accelerate the scalable deployment of robust autonomous driving systems. Code: https://github.com/Dingyi-Yao/ASTAD.", "summary_ja": "自動運転向け合成データと実データ間のドメインギャップを埋めるスタイル変換タスクASTADを提案。合成データには完全なピクセルレベル注釈があるが実世界の参照画像には注釈がないという非対称性に着目し、この制約下で意味的整合性を保ったスタイル変換を実現する手法ASTModelを開発している。", "novelty_ja": "従来の対称的な意味的guidanceに依存する手法と異なり、ラベルなし実データからの粗い意味的priorを動的に精緻化し、拡散モデルのdenoising過程でクラス整合的なスタイル注入を行う学習不要の2段階フレームワークを採用している。", "why_read_ja": "合成データ活用によるアノテーションコスト削減は知覚モデル開発の重要課題であり、非対称な注釈制約下でのdomain adaptation手法は実運用データパイプライン設計に直接応用できる。", "paper_url": "https://arxiv.org/abs/2606.29286", "code_url": "https://github.com/Dingyi-Yao/ASTAD", "published": "2026-06-28T09:15:15Z", "relevance": 11.0}, {"key": "arxiv:2606.24784", "title": "AerialFusionMapNet: Online HD Map Construction with Aerial-Onboard BEV Fusion", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "3D Detection", "AD Perception"], "abstract": "High-resolution aerial imagery has recently emerged as a complementary modality for automated driving perception and has shown potential to improve birds-eye-view (BEV) scene understanding when fused with onboard sensors. Prior work demonstrated performance gains for online high-definition (HD) map construction through aerial-onboard fusion; however, conventional end-to-end fusion does not fully exploit the structural information contained in aerial representations. In this work, we introduce AerialFusionMapNet, a fusion-based mapping framework with a structured two-stage training strategy that explicitly enhances the contribution of aerial features within a unified pipeline. The proposed training scheme enables more effective integration of structural aerial priors. On the nuScenes geographic split, AerialFusionMapNet achieves up to 54.7 mAP, improving over prior aerial-onboard fusion baselines from 48.8 mAP by +5.9 absolute and +12.1% relative. The results suggest that structured training design, rather than increased architectural complexity, plays a more decisive role in unlocking the full potential of aerial imagery for online HD map construction. Code and trained models are available at https://github.com/DriverlessMobility/AerialFusionMapNet.", "summary_ja": "航空画像とオンボードセンサのBEV特徴を融合してオンラインHDマップを構築する手法。従来の航空-オンボード融合は航空特徴の構造情報を十分に活かせていない点を課題とし、2段階の学習戦略で航空特徴の寄与を明示的に強化するAerialFusionMapNetを提案する。nuScenesのgeographic splitで最大54.7 mAPを達成し、既存の航空-オンボード融合ベースライン(48.8 mAP)を上回った。", "novelty_ja": "アーキテクチャを複雑化するのではなく、構造化された2段階学習スキームによって航空画像の構造的事前情報をより効果的に統合する点が従来手法との違い。", "why_read_ja": "航空画像という補助モダリティをオンラインHDマップ構築にどう組み込むかという設計判断(モデル構造 vs 学習戦略)に示唆があり、マルチモーダル地図生成の研究動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2606.24784", "code_url": "https://github.com/DriverlessMobility/AerialFusionMapNet", "published": "2026-06-23T16:44:43Z", "relevance": 17.5}, {"key": "arxiv:2606.20725", "title": "D2HDMap: Non-visible Driveline Map Prior for Online Vectorized HD Map Prediction", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "3D Detection", "AD Perception"], "abstract": "Accurate, up-to-date representations of road structures are critical for the safe operation of autonomous vehicles. Existing systems rely either on costly, maintenance-heavy high-definition (HD) maps which compromise safety when outdated, or purely sensor-based online mapping which struggles with long-range reliability and occlusion. Systems incorporating map prior information into online mapping seek to overcome drawbacks of both approaches by combining them in some way. We propose 'Driveline To HD Map' (D2HDMap), an online mapping system that injects a lightweight, non-visible driveline prior to guide the estimation of visible road structures such as lane dividers, road boundaries and crosswalks. This prior incurs less effort to create and update compared to full HD map priors used in other approaches. We also show that training with such a prior can improve generalization at inference time when no prior is available. Ablation studies conducted on the nuScenes and Argoverse 2 dataset demonstrate that models trained using a driveline prior largely retain performance even when priors are not available. On a geographically disjoint split, D2HDMap achieves 44.8 mAP, surpassing recent state-of-the-art. Additionally, noise-aware training substantially increases robustness to realistic localization error.", "summary_ja": "自動運転車が使う道路構造(車線境界・道路境界・横断歩道)のオンライン推定に、車両が実際に走行した経路(driveline)という軽量な非可視priorを注入する手法D2HDMapを提案。フルHDマップpriorに比べ作成・更新コストが低い点を利点とし、nuScenesとArgoverse 2で評価している。地理的に分離した(未知の地域を想定した)split上で、priorがある場合とない場合の双方で性能を検証している。", "novelty_ja": "従来の地図prior手法は完成済みのHDマップそのものを入力とするのに対し、本手法は視認できない走行経路情報のみを軽量priorとして与え、さらにprior無し推論時にも性能が落ちにくいよう学習する点、および位置推定誤差を模したnoise-aware trainingでロバスト性を高める点が異なる。", "why_read_ja": "HDマップ維持コストとオンラインマッピングの限界という地図生成研究の中心的課題に対し、低コストなprior設計と汎化性の両立を示す事例であり、map priorアプローチの設計選択を比較検討する上で参考になる。", "paper_url": "https://arxiv.org/abs/2606.20725", "code_url": "", "published": "2026-06-17T00:05:43Z", "relevance": 14.0}, {"key": "arxiv:2606.17080", "title": "HRDX: A Large-Scale Vector HD-Map Dataset", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "AD Perception"], "abstract": "Reliable autonomous driving requires vectorized HD maps that are geometrically accurate, semantically rich, and scalable to long-horizon driving. However, existing public HD map datasets are limited in scale, provide sparse semantic attributes, and lack modalities such as aerial imagery that could enable new research directions. We present HRDX, a large-scale dataset for vector HD-map construction, spanning about 40 hours (1,400 km) of minimally overlapping drives, which is several times larger than prior public HD map datasets. Data is captured using six synchronized surround cameras, a 128-beam LiDAR, and centimeter-level RTK GNSS/IMU, and is further complemented by precisely aligned aerial orthoimagery. Annotations cover 10 vector map classes, complemented with over 20 semantic and topological attributes. To evaluate this richer ontology, we introduce the Composite Score (CS) to jointly assess geometric fidelity and attribute correctness. Benchmark experiments show that HRDX's scale improves online vector-map construction, and that aligned aerial imagery provides a useful structural prior: using aerial imagery at training and/or inference improves geometric map quality, while aerial-augmented teachers can transfer part of this benefit to camera-only students without increasing inference-time sensor requirements. HRDX is intended to support reproducible research on large-scale HD-map learning, multimodal BEV fusion, and training-time privileged information. HRDX dataset and benchmarks are available at https://github.com/honda-research-institute/HRDX", "summary_ja": "既存の公開HD地図データセットが規模・属性の豊富さ・モダリティの点で不十分であることを課題とし、6台のサラウンドカメラ・128chLiDAR・RTK GNSS/IMUに加え高精度航空写真を組み合わせた約1,400km・40時間規模のvector HD-mapデータセットHRDXを提案している。10クラスの地図要素と20以上の意味的・トポロジカルな属性を付与し、幾何精度と属性正解性を統合評価するComposite Score (CS)も導入している。", "novelty_ja": "従来データセットにない航空オルソ画像を精密に位置合わせして提供し、学習時・推論時の補助情報として活用できる点、および属性を含めた評価指標CSを新たに定義した点が特徴。", "why_read_ja": "オンラインHD地図構築のスケール依存性や、航空写真を特権情報として使うteacher-student転移など、地図生成研究の今後のベンチマーク設計に直結する知見を含む。", "paper_url": "https://arxiv.org/abs/2606.17080", "code_url": "https://github.com/honda-research-institute/HRDX", "published": "2026-06-11T15:08:37Z", "relevance": 15.5}, {"key": "arxiv:2606.08680", "title": "Distortion-Aware PETR for BEV Object Detection with Mixed Pinhole-Fisheye Cameras", "venue": "ICRA 2026", "year": 2026, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception", "HD Map"], "abstract": "Fisheye cameras are widely deployed in autonomous driving perception suites for their low cost and full-coverage field of view (FOV), yet their potential remains underleveraged in 3D object detection. Severe radial distortion challenges most BEV detectors by violating the fundamental assumption of uniform sampling. To bridge this gap, we propose Distortion-Aware PETR (DAPETR), a projection-free detector tailored for mixed pinhole-fisheye camera setups. DAPETR incorporates two key learned-adaptive modules: a unified distortion-aware positional embedding that harmonizes positional encodings for image representations with fisheye geometry, and a bidirectional feature-geometry co-modulation module that mutually adapts image features and 3D positional embeddings. In our experiments on a converted KITTI-360 benchmark, we systematically compare our learned adaptive approach against PETR in polar coordinates (PolarPETR). We find that while both methods improve over the baseline, our learned modules achieve superior performance. Crucially, we uncover a negative interaction when combining both strategies, revealing that learned adaptation and explicit geometric reparameterization can conflict. Our final DAPETR model significantly advances the research and benchmark for fisheye BEV detection, providing critical insights into effective distortion-aware 3D perception design other than image rectification.", "summary_ja": "魚眼カメラの強い放射歪みがBEV検出器の一様サンプリング前提を崩す問題に対し、pinhole/fisheye混在カメラ向けの投影フリー検出器DAPETRを提案。歪みを考慮した位置エンコーディングと、画像特徴と3D位置埋め込みを相互適応させるco-modulationモジュールを導入し、KITTI-360を魚眼用に変換したベンチマークで検証している。", "novelty_ja": "画像の歪み補正(rectification)に頼らず、学習ベースの歪み適応(位置埋め込み・特徴の相互変調)とPolarPETRのような明示的な幾何学的再パラメータ化を比較し、両者を組み合わせると性能が悪化するという相互作用を明らかにした点が新規。", "why_read_ja": "低コスト・広視野のfisheyeカメラをBEV検出に活かす設計指針を示しており、マルチカメラ構成でのAD知覚・地図生成の入力品質向上を検討する上で参考になる。", "paper_url": "https://arxiv.org/abs/2606.08680", "code_url": "", "published": "2026-06-07T15:32:10Z", "relevance": 16.5}, {"key": "arxiv:2606.03581", "title": "UnsOcc: 3D Semantic Occupancy Prediction in Unstructured Scene via Rendering Fusion", "venue": "arXiv 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "Gaussian Splatting", "AD Perception"], "abstract": "Unstructured scenes present unique challenges for autonomous driving, as irregular obstacles and sparse scene layouts undermine the effectiveness of traditional perception methods such as 3D object detection. 3D semantic occupancy prediction has emerged as a prominent focus due to its ability to provide dense spatial representations by assigning semantic labels to individual voxels in 3D space. However, directly applying 3D semantic occupancy prediction to unstructured scenes remains challenging because scene sparsity hinders effective cross-modal fusion and the more severe long-tail distribution in these scenarios further degrades prediction performance. To validate the effectiveness of our approach, we construct a dedicated dataset of unstructured scenes collected from open-pit mines. Based on this, we propose UnsOcc, a multi-modal 3D semantic occupancy prediction framework that improves robustness in unstructured environments. At its core, we introduce a rendering-based fusion module, RenderFusion, which enhances cross-modal feature alignment through bidirectional rendering supervision. Furthermore, we propose GSRefinement, a detail-aware auxiliary supervision method based on Gaussian Splatting that projects sparse 3D occupancy predictions into dense 2D semantic segmentation maps, enabling effective supervision for long-tail categories. Extensive experiments on both the open-pit mine dataset and the nuScenes dataset demonstrate that our method significantly outperforms existing state-of-the-art approaches.", "summary_ja": "整備された道路とは異なる非構造化シーン(露天掘り鉱山など)では、不規則な障害物や疎なシーン構造のため従来の3D物体検出ベースの認識が機能しにくい。本論文はそうした環境向けの多モーダル3D semantic occupancy predictionフレームワークUnsOccを提案する。シーンの疎性によるcross-modal fusionの難しさと、より深刻なlong-tail分布という2つの課題に取り組み、検証のために露天掘り鉱山で収集した専用データセットも構築している。鉱山データセットとnuScenesの双方で既存手法を上回る性能を報告している。", "novelty_ja": "双方向のrendering supervisionでcamera-LiDAR特徴を整合させるRenderFusionと、疎な3D occupancy予測をGaussian Splattingで密な2D semantic segmentationへ射影して補助監督とするGSRefinementを組み合わせた点が従来と異なる。特に非構造化シーンとlong-tailカテゴリを明示的な設計目標に据えている。", "why_read_ja": "occupancy predictionをGaussian Splattingベースのrendering supervisionで補強する流れの具体例であり、監督信号の設計として参考になる。また、都市道路以外の非構造化屋外環境向けデータセットを提示している点で、環境認識の適用範囲拡大の動向を追ううえで有用。", "paper_url": "https://arxiv.org/abs/2606.03581", "code_url": "", "published": "2026-06-02T12:50:14Z", "relevance": 28.0}, {"key": "arxiv:2606.02979", "title": "Towards Compact Autonomous Driving Perception with Balanced Learning and Multi-sensor Fusion", "venue": "arXiv 2026", "year": 2026, "topic": "AD Perception", "topics": ["AD Perception", "3D Detection", "Reconstruction"], "abstract": "We present a novel compact deep multi-task learning model to handle various autonomous driving perception tasks in one forward pass. The model performs multiple views of semantic segmentation, depth estimation, light detection and ranging (LiDAR) segmentation, and bird's eye view projection simultaneously without being supported by other models. We also provide an adaptive loss weighting algorithm to tackle the imbalanced learning issue that occurred due to plenty of given tasks. Through data pre-processing and intermediate sensor fusion techniques, the model can process and combine multiple input modalities retrieved from RGB cameras, dynamic vision sensors (DVS), and LiDAR placed at several positions on the ego vehicle. Therefore, a better understanding of a dynamically changing environment can be achieved. Based on the ablation study, the model variant trained with our proposed method achieves a better performance. Furthermore, a comparative study is also conducted to clarify its performance and effectiveness against the combination of some recent models. As a result, our model maintains better performance even with much fewer parameters. Hence, the model can inference faster with less GPU memory utilization. Moreover, the result tends to be consistent in 3 different CARLA simulation datasets and 1 real-world nuScenes-lidarseg dataset. To support future research, we share codes and other files publicly at https://github.com/oskarnatan/compact-perception.", "summary_ja": "自動運転向けに、セマンティックセグメンテーション・深度推定・LiDARセグメンテーション・BEV投影を1回の推論で同時に行うコンパクトなマルチタスクモデルを提案。タスク間の学習不均衡を解消する適応的な損失重み付け手法を導入し、RGBカメラ・DVS・LiDARを車両複数箇所に配置して中間段階で融合する。", "novelty_ja": "多数タスクの同時学習で生じる不均衡を適応的損失重み付けで解消しつつ、少パラメータ・低GPUメモリで高速推論を実現している点が従来の大型マルチタスクモデルとの違い。", "why_read_ja": "複数センサ融合とマルチタスク学習を軽量に両立させる設計は、実車搭載を想定した知覚パイプラインの効率化を検討する際の参考になる。", "paper_url": "https://arxiv.org/abs/2606.02979", "code_url": "https://github.com/oskarnatan/compact-perception", "published": "2026-06-02T00:35:42Z", "relevance": 14.0}, {"key": "arxiv:2606.02956", "title": "The Road Ahead in Autonomous Driving: The KITScenes Multimodal Dataset", "venue": "arXiv 2026", "year": 2026, "topic": "HD Map", "topics": ["HD Map", "Reconstruction", "AD Perception", "Topology", "Gaussian Splatting"], "abstract": "Existing autonomous driving datasets have enabled major progress, but fall short in sensor fidelity, map completeness, or geographic diversity. We present KITScenes Multimodal, a European dataset built around high-fidelity sensors and maps. Our fully synchronized sensor suite combines high-resolution global-shutter cameras, long-range lidar beyond 400m, 4D imaging radar, and redundant GNSS/INS localization. Our HD maps are, to our knowledge, the most complete of any sensor dataset, validated through autonomous driving trials on open-source software. For the first time in a public dataset, all driving-relevant traffic elements, such as traffic lights, are mapped in 3D to a reprojection-accurate level with full topological connectivity. Recorded in
