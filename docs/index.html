on, thereby enhancing the completeness and accuracy of predictions. Despite its potential, research on collaborative 3D semantic occupancy prediction is hindered by the lack of dedicated datasets. To bridge this gap, we design a high-resolution semantic voxel sensor in CARLA to produce dense and comprehensive annotations. We further develop a baseline model that performs inter-agent feature fusion via spatial alignment and attention aggregation. In addition, we establish benchmarks with varying prediction ranges designed to systematically assess the impact of spatial extent on collaborative prediction. Experimental results demonstrate the superior performance of our baseline, with increasing gains observed as range expands. Our code is available at https://github.com/tlab-wide/Co3SOP}{https://github.com/tlab-wide/Co3SOP.", "summary_ja": "単一車両視点ではオクルージョンやセンサ範囲の制約により3D semantic occupancy predictionの精度が限られる問題に対し、複数エージェント間で情報を共有する協調認識で補うアプローチを提案。専用データセットが存在しないという課題に対し、CARLA上に高解像度のsemantic voxelセンサを設計してdenseな注釈を生成し、エージェント間特徴を空間整合とattentionで融合するベースラインモデルも構築した。予測範囲を変えた複数のベンチマークで、範囲拡大に伴い協調認識の効果が大きくなることを示している。", "novelty_ja": "単体車両向けoccupancy predictionの研究が中心だった中で、V2X型の協調3D semantic occupancy predictionに特化した合成ベンチマーク・データセットと、それに対応するattentionベースの特徴融合ベースラインを新たに提示した点が従来と異なる。", "why_read_ja": "occupancy predictionを単一車両からマルチエージェント協調へ拡張する際の評価基盤・ベースライン設計を把握でき、V2X前提の環境認識研究の動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2506.17004", "code_url": "https://github.com/tlab-wide/Co3SOP", "published": "2025-06-20T13:58:10Z", "relevance": 22.0}, {"key": "arxiv:2506.15313", "title": "MapFM: Foundation Model-Driven HD Mapping with Multi-Task Contextual Learning", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "Open-world"], "abstract": "In autonomous driving, high-definition (HD) maps and semantic maps in bird's-eye view (BEV) are essential for accurate localization, planning, and decision-making. This paper introduces an enhanced End-to-End model named MapFM for online vectorized HD map generation. We show significantly boost feature representation quality by incorporating powerful foundation model for encoding camera images. To further enrich the model's understanding of the environment and improve prediction quality, we integrate auxiliary prediction heads for semantic segmentation in the BEV representation. This multi-task learning approach provides richer contextual supervision, leading to a more comprehensive scene representation and ultimately resulting in higher accuracy and improved quality of the predicted vectorized HD maps. The source code is available at https://github.com/LIvanoff/MapFM.", "summary_ja": "自動運転向けにカメラ画像からベクトル化HDマップをオンライン生成するEnd-to-Endモデル「MapFM」を提案。強力な基盤モデルを画像エンコーダとして組み込み、特徴表現の質を高めている。さらにBEV表現上でのセマンティックセグメンテーションを補助タスクとして統合し、マルチタスク学習によりシーン理解を強化してマップ予測精度を向上させる。", "novelty_ja": "既存のオンラインHDマップ生成手法に対し、foundation modelによる画像エンコーディングとBEVセマンティックセグメンテーションの補助ヘッドを組み合わせたマルチタスク学習で文脈情報を強化した点が新しい。", "why_read_ja": "foundation modelを画像エンコーダに使う設計や補助タスクによる文脈学習は、オンラインHDマップ生成の精度向上手法として今後の研究動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2506.15313", "code_url": "https://github.com/LIvanoff/MapFM", "published": "2025-06-18T09:42:30Z", "relevance": 11.5}, {"key": "arxiv:2506.14825", "title": "GraphGSOcc: Semantic-Geometric Graph Transformer with Dynamic-Static Decoupling for 3D Gaussian Splatting-based Occupancy Prediction", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Gaussian Splatting", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "Addressing the task of 3D semantic occupancy prediction for autonomous driving, we tackle two key issues in existing 3D Gaussian Splatting (3DGS) methods: (1) unified feature aggregation neglecting semantic correlations among similar categories and across regions, (2) boundary ambiguities caused by the lack of geometric constraints in MLP iterative optimization and (3) biased issues in dynamic-static object coupling optimization. We propose the GraphGSOcc model, a novel framework that combines semantic and geometric graph Transformer and decouples dynamic-static objects optimization for 3D Gaussian Splatting-based Occupancy Prediction. We propose the Dual Gaussians Graph Attenntion, which dynamically constructs dual graph structures: a geometric graph adaptively calculating KNN search radii based on Gaussian poses, enabling large-scale Gaussians to aggregate features from broader neighborhoods while compact Gaussians focus on local geometric consistency; a semantic graph retaining top-M highly correlated nodes via cosine similarity to explicitly encode semantic relationships within and across instances. Coupled with the Multi-scale Graph Attention framework, fine-grained attention at lower layers optimizes boundary details, while coarsegrained attention at higher layers models object-level topology. On the other hand, we decouple dynamic and static objects by leveraging semantic probability distributions and design a Dynamic-Static Decoupled Gaussian Attention mechanism to optimize the prediction performance for both dynamic objects and static scenes. GraphGSOcc achieves state-ofthe-art performance on the SurroundOcc-nuScenes, Occ3D-nuScenes, OpenOcc and KITTI occupancy benchmarks. Experiments on the SurroundOcc dataset achieve an mIoU of 25.20%, reducing GPU memory to 6.8 GB, demonstrating a 1.97% mIoU improvement and 13.7% memory reduction compared to GaussianWorld.", "summary_ja": "自動運転の3D semantic occupancy predictionを3D Gaussian Splattingで行う手法。既存の3DGSベース手法が、カテゴリ間・領域間の意味的な相関を無視した一様な特徴集約をしている点、MLPによる反復最適化に幾何的制約がなく境界が曖昧になる点、動的物体と静的シーンを結合したまま最適化することで偏りが生じる点を課題として挙げている。これに対し、幾何グラフと意味グラフの二重構造を動的に構築するDual Gaussians Graph Attentionと、動的・静的を分離して最適化するattention機構を組み合わせたGraphGSOccを提案する。SurroundOcc-nuScenes、Occ3D-nuScenes、OpenOcc、KITTIの各occupancyベンチマークでstate-of-the-artを主張している。", "novelty_ja": "Gaussianのポーズに応じてKNNの探索半径を適応的に変える幾何グラフと、cosine類似度で上位M個のノードを残す意味グラフを併用し、さらに階層ごとに粒度の異なるattentionで境界詳細とobject-level topologyを分けて扱う点が従来の一様な特徴集約と異なる。加えて、semantic probability distributionを用いて動的物体と静的シーンの最適化を明示的に切り離している。", "why_read_ja": "3DGS表現をoccupancy predictionに使う流れの中で、Gaussian間の関係をグラフとして構造化する設計を示しており、表現の効率と精度を両立させる方向性の参考になる。SurroundOccでmIoU 25.20%、GPUメモリ6.8GBとGaussianWorld比で精度・メモリ双方の改善を報告している点も、実装コストを見るうえで有用。", "paper_url": "https://arxiv.org/abs/2506.14825", "code_url": "", "published": "2025-06-13T06:09:57Z", "relevance": 33.5}, {"key": "arxiv:2506.10977", "title": "QuadricFormer: Scene as Superquadrics for 3D Semantic Occupancy Prediction", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "3D occupancy prediction is crucial for robust autonomous driving systems as it enables comprehensive perception of environmental structures and semantics. Most existing methods employ dense voxel-based scene representations, ignoring the sparsity of driving scenes and resulting in inefficiency. Recent works explore object-centric representations based on sparse Gaussians, but their ellipsoidal shape prior limits the modeling of diverse structures. In real-world driving scenes, objects exhibit rich geometries (e.g., cuboids, cylinders, and irregular shapes), necessitating excessive ellipsoidal Gaussians densely packed for accurate modeling, which leads to inefficient representations. To address this, we propose to use geometrically expressive superquadrics as scene primitives, enabling efficient representation of complex structures with fewer primitives through their inherent shape diversity. We develop a probabilistic superquadric mixture model, which interprets each superquadric as an occupancy probability distribution with a corresponding geometry prior, and calculates semantics through probabilistic mixture. Building on this, we present QuadricFormer, a superquadric-based model for efficient 3D occupancy prediction, and introduce a pruning-and-splitting module to further enhance modeling efficiency by concentrating superquadrics in occupied regions. Extensive experiments on the nuScenes dataset demonstrate that QuadricFormer achieves state-of-the-art performance while maintaining superior efficiency.", "summary_ja": "自動運転向けの 3D semantic occupancy prediction において、dense voxel 表現は走行シーンの疎性を無視して非効率であり、近年の sparse Gaussian による object-centric 表現も楕円体という形状事前分布のため、直方体・円柱・不規則形状といった多様な物体形状を表すには大量のプリミティブを密に敷き詰める必要があるという課題を扱う。本論文は形状表現力の高い superquadrics をシーンプリミティブとして採用し、各 superquadric を幾何事前を持つ occupancy 確率分布と解釈する probabilistic superquadric mixture model を構成して、混合により semantics を算出する。これを組み込んだ QuadricFormer に、occupied 領域へプリミティブを集約する pruning-and-splitting モジュールを導入する。nuScenes での実験で、効率を保ちながら state-of-the-art の性能を達成したと報告している。", "novelty_ja": "Gaussian(楕円体)ベースの sparse なシーン表現を superquadrics に置き換え、形状の多様性によって少数のプリミティブで複雑な構造を表現できる点が従来との違いである。さらに superquadric を occupancy の確率分布として扱う mixture model と、pruning-and-splitting による配置最適化を組み合わせている。", "why_read_ja": "occupancy prediction の表現がボクセルから Gaussian、さらに superquadric へと「プリミティブの選び方」で効率と表現力を competing させる流れを示す一例であり、環境認識のシーン表現設計を追う上で参考になる。地図生成・occupancy 系のスパース表現を検討する際の設計選択肢として押さえておく価値がある。", "paper_url": "https://arxiv.org/abs/2506.10977", "code_url": "", "published": "2025-06-12T17:59:45Z", "relevance": 24.0}, {"key": "arxiv:2506.08997", "title": "SDTagNet: Leveraging Text-Annotated Navigation Maps for Online HD Map Construction", "venue": "NEURIPS 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "Map Update", "3D Detection", "AD Perception"], "abstract": "Autonomous vehicles rely on detailed and accurate environmental information to operate safely. High definition (HD) maps offer a promising solution, but their high maintenance cost poses a significant barrier to scalable deployment. This challenge is addressed by online HD map construction methods, which generate local HD maps from live sensor data. However, these methods are inherently limited by the short perception range of onboard sensors. To overcome this limitation and improve general performance, recent approaches have explored the use of standard definition (SD) maps as prior, which are significantly easier to maintain. We propose SDTagNet, the first online HD map construction method that fully utilizes the information of widely available SD maps, like OpenStreetMap, to enhance far range detection accuracy. Our approach introduces two key innovations. First, in contrast to previous work, we incorporate not only polyline SD map data with manually selected classes, but additional semantic information in the form of textual annotations. In this way, we enrich SD vector map tokens with NLP-derived features, eliminating the dependency on predefined specifications or exhaustive class taxonomies. Second, we introduce a point-level SD map encoder together with orthogonal element identifiers to uniformly integrate all types of map elements. Experiments on Argoverse 2 and nuScenes show that this boosts map perception performance by up to +5.9 mAP (+45%) w.r.t. map construction without priors and up to +3.2 mAP (+20%) w.r.t. previous approaches that already use SD map priors. Code is available at https://github.com/immel-f/SDTagNet", "summary_ja": "オンラインHDマップ構築はセンサ搭載範囲に限られ遠方の精度が低いという課題に対し、容易に整備できるSD map(OpenStreetMapなど)を事前情報として活用するSDTagNetを提案。ポリラインだけでなく地図上のテキスト注釈もNLP由来特徴として取り込み、点単位のSDマップエンコーダと直交的な要素識別子で多様な地図要素を統一的に扱う。Argoverse 2とnuScenesで評価している。", "novelty_ja": "従来のSD map priorを使う手法が手動で選んだクラスのポリラインのみを使うのに対し、テキスト注釈まで意味情報として取り込みクラス体系への依存を排した点、および点レベルのエンコーダで全種類の地図要素を統一表現した点が新規性。", "why_read_ja": "SDマップ事前情報を用いたオンラインHDマップ構築の性能向上手法であり、地図生成・遠方検出精度の研究動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2506.08997", "code_url": "https://github.com/immel-f/SDTagNet", "published": "2025-06-10T17:16:00Z", "relevance": 19.0}, {"key": "arxiv:2506.04623", "title": "VoxDet: Rethinking 3D Semantic Occupancy Prediction as Dense Object Detection", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection"], "abstract": "3D semantic occupancy prediction aims to reconstruct the 3D geometry and semantics of the surrounding environment. With dense voxel labels, prior works typically formulate it as a dense segmentation task, independently classifying each voxel. However, this paradigm neglects critical instance-centric discriminability, leading to instance-level incompleteness and adjacent ambiguities. To address this, we highlight a free lunch of occupancy labels: the voxel-level class label implicitly provides insight at the instance level, which is overlooked by the community. Motivated by this observation, we first introduce a training-free Voxel-to-Instance (VoxNT) trick: a simple yet effective method that freely converts voxel-level class labels into instance-level offset labels. Building on this, we further propose VoxDet, an instance-centric framework that reformulates the voxel-level occupancy prediction as dense object detection by decoupling it into two sub-tasks: offset regression and semantic prediction. Specifically, based on the lifted 3D volume, VoxDet first uses (a) Spatially-decoupled Voxel Encoder to generate disentangled feature volumes for the two sub-tasks, which learn task-specific spatial deformation in the densely projected tri-perceptive space. Then, we deploy (b) Task-decoupled Dense Predictor to address this task via dense detection. Here, we first regress a 4D offset field to estimate distances (6 directions) between voxels and object borders in the voxel space. The regressed offsets are then used to guide the instance-level aggregation in the classification branch, achieving instance-aware prediction. Experiments show that VoxDet can be deployed on both camera and LiDAR input, jointly achieving state-of-the-art results on both benchmarks. VoxDet is not only highly efficient, but also achieves 63.0 IoU on the SemanticKITTI test set, ranking 1st on the online leaderboard.", "summary_ja": "3D semantic occupancy predictionを、従来のvoxelごとの独立分類(dense segmentation)ではなくインスタンス中心の物体検出タスクとして再定式化した研究。voxelクラスラベルからインスタンスレベルのオフセットラベルを無学習で生成するVoxNTを提案し、それを用いてVoxDetという枠組みでオフセット回帰とセマンティック予測を分離して解く。カメラ・LiDAR双方の入力に適用可能で、SemanticKITTIベンチマークでSOTA性能を達成している。", "novelty_ja": "voxelレベルの分類のみに頼る従来手法がインスタンスの不完全性や隣接曖昧性を生む問題に対し、voxelラベルからインスタンス境界へのオフセットを学習させて検出タスクとして扱う点が新しい。", "why_read_ja": "occupancy predictionをdense segmentationではなくdetectionとして捉え直すアプローチは、インスタンス粒度の一貫性が求められるシーン理解や下流の物体追跡・地図生成タスクへの応用可能性がある。", "paper_url": "https://arxiv.org/abs/2506.04623", "code_url": "", "published": "2025-06-05T04:31:55Z", "relevance": 19.5}, {"key": "arxiv:2505.20951", "title": "DSOcc: Leveraging Depth Awareness and Semantic Aid to Boost Camera-Based 3D Semantic Occupancy Prediction", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "Camera-based 3D semantic occupancy prediction offers an efficient and cost-effective solution for perceiving surrounding scenes in autonomous driving. However, existing works rely on explicit occupancy state inference, leading to numerous incorrect feature assignments, and insufficient samples restrict the learning of occupancy class inference. To address these challenges, we propose leveraging \\textbf{D}epth awareness and \\textbf{S}emantic aid to boost camera-based 3D semantic \\textbf{Occ}upancy prediction (\\textbf{DSOcc}). We jointly perform occupancy state and occupancy class inference, where soft occupancy confidence is calculated by non-learning method and multiplied with image features to make voxels aware of depth, enabling adaptive implicit occupancy state inference. Instead of enhancing feature learning, we directly utilize well-trained image semantic segmentation and fuse multiple frames with their occupancy probabilities to aid occupancy class inference, thereby enhancing robustness. Experimental results demonstrate that DSOcc achieves state-of-the-art performance on the SemanticKITTI dataset among camera-based methods and achieves competitive performance on the SSCBench-KITTI-360 and Occ3D-nuScenes datasets. Code will be released on github.", "summary_ja": "カメラ画像のみから3D semantic occupancyを推定する研究。従来手法はvoxelが占有されているか否か(occupancy state)を明示的に推論するため、特徴量の割り当て誤りが多く発生し、またサンプル不足によりクラス推論の学習も不十分だという課題を挙げている。DSOccでは、学習を伴わない方法で算出したsoft occupancy confidenceを画像特徴に掛け合わせることでvoxelに深度の情報を持たせ、occupancy stateを暗黙的・適応的に扱いながらクラス推論と同時に解く。さらに、学習済みの画像semantic segmentationの結果をoccupancy確率とともに複数フレーム分融合し、クラス推論を補助する。", "novelty_ja": "occupancy stateを明示的に判定せず、非学習的に求めたsoft confidenceを介して暗黙的に扱う点と、特徴学習を強化するのではなく既存の学習済みsemantic segmentationを多フレーム融合して直接活用する点が従来と異なる。", "why_read_ja": "カメラのみのoccupancy predictionにおいて、深度手がかりと既存2D認識器をどう組み合わせて精度を底上げするかの一例であり、SemanticKITTI・SSCBench-KITTI-360・Occ3D-nuScenesという主要ベンチマークでの比較も示されているため、occupancy系手法の設計動向を追ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2505.20951", "code_url": "", "published": "2025-05-27T09:45:00Z", "relevance": 26.0}, {"key": "arxiv:2505.20617", "title": "OccLE: Label-Efficient 3D Semantic Occupancy Prediction", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "AD Perception", "Scene Understanding", "3D Detection", "Open-world"], "abstract": "3D semantic occupancy prediction offers an intuitive and efficient scene understanding and has attracted significant interest in autonomous driving perception. Existing approaches either rely on full supervision, which demands costly voxel-level annotations, or on self-supervision, which provides limited guidance and yields suboptimal performance. To address these challenges, we propose OccLE, a Label-Efficient 3D Semantic Occupancy Prediction that takes images and LiDAR as inputs and maintains high performance with limited voxel annotations. Our intuition is to decouple the semantic and geometric learning tasks and then fuse the learned feature grids from both tasks for the final semantic occupancy prediction. Therefore, the semantic branch distills 2D foundation model to provide aligned pseudo labels for 2D and 3D semantic learning. The geometric branch integrates image and LiDAR inputs in cross-plane synergy based on their inherency, employing semi-supervision to enhance geometry learning. We fuse semantic-geometric feature grids through Dual Mamba and incorporate a scatter-accumulated projection to supervise unannotated prediction with aligned pseudo labels. Experiments show that OccLE achieves competitive performance with only 10\\% of voxel annotations on the SemanticKITTI and Occ3D-nuScenes datasets. The code will be publicly released on https://github.com/NerdFNY/OccLE", "summary_ja": "自動運転の3D semantic occupancy predictionでは、full supervisionはvoxel単位の高コストなアノテーションを必要とし、self-supervisionは指導信号が弱く性能が伸びないという二択の問題がある。OccLEはこの中間を狙い、少量のvoxelアノテーションだけで高い性能を保つラベル効率の良い枠組みを提案する。semanticとgeometryの学習を分離し、semantic側は2D foundation modelの蒸留で2D/3D整合の擬似ラベルを得て、geometry側は画像とLiDARをcross-planeで統合し半教師ありで学習する。両者のfeature gridをDual Mambaで融合し、scatter-accumulated projectionで未アノテーション領域も擬似ラベルにより監督する。SemanticKITTIとOcc3D-nuScenesで、voxelアノテーション10%でも競合手法に匹敵する結果を示している。", "novelty_ja": "full supervisionでもself-supervisionでもなく、semanticとgeometricのタスクを明示的に分離し、foundation model蒸留による擬似ラベルと半教師あり幾何学習を組み合わせてラベル依存を大幅に下げた点が従来と異なる。融合にDual Mambaを用い、未アノテーション予測にも整合した擬似ラベルで監督を与える設計も特徴。", "why_read_ja": "occupancy予測の実用化ではvoxelアノテーションのコストが最大のボトルネックであり、少量ラベルでどこまで到達できるかを示す本研究はデータ構築戦略を考えるうえで参考になる。2D foundation modelの蒸留とLiDAR・画像の役割分担という設計は、地図生成や環境認識の他タスクにも転用しやすい。", "paper_url": "https://arxiv.org/abs/2505.20617", "code_url": "https://github.com/NerdFNY/OccLE", "published": "2025-05-27T01:41:28Z", "relevance": 31.0}, {"key": "arxiv:2505.18631", "title": "S2R-Bench: A Sim-to-Real Evaluation Benchmark for Autonomous Driving", "venue": "arXiv 2025", "year": 2025, "topic": "AD Perception", "topics": ["AD Perception", "Open-world"], "abstract": "Safety is a long-standing and the final pursuit in the development of autonomous driving systems, with a significant portion of safety challenge arising from perception. How to effectively evaluate the safety as well as the reliability of perception algorithms is becoming an emerging issue. Despite its critical importance, existing perception methods exhibit a limitation in their robustness, primarily due to the use of benchmarks are entierly simulated, which fail to align predicted results with actual outcomes, particularly under extreme weather conditions and sensor anomalies that are prevalent in real-world scenarios. To fill this gap, in this study, we propose a Sim-to-Real Evaluation Benchmark for Autonomous Driving (S2R-Bench). We collect diverse sensor anomaly data under various road conditions to evaluate the robustness of autonomous driving perception methods in a comprehensive and realistic manner. This is the first corruption robustness benchmark based on real-world scenarios, encompassing various road conditions, weather conditions, lighting intensities, and time periods. By comparing real-world data with simulated data, we demonstrate the reliability and practical significance of the collected data for real-world applications. We hope that this dataset will advance future research and contribute to the development of more robust perception models for autonomous driving. This dataset is released on https://github.com/adept-thu/S2R-Bench.", "summary_ja": "自動運転の知覚アルゴリズムは主にシミュレーションベースのベンチマークで評価されており、悪天候やセンサ異常など実世界特有の劣化条件との乖離が課題となっている。本研究はS2R-Bench(Sim-to-Real Evaluation Benchmark)を提案し、様々な道路状況・天候・照度・時間帯における実世界のセンサ異常データを収集した。実データとシミュレーションデータを比較することで、収集データが実応用にとって信頼性・実用性を持つことを示している。", "novelty_ja": "従来の破損頑健性ベンチマークが全てシミュレーション生成のデータに依存していたのに対し、実世界で収集したセンサ異常データに基づく初のベンチマークである点が新規性。", "why_read_ja": "知覚モデルの頑健性評価がシミュレーションに偏りがちな現状に対し、実世界データとの乖離を定量的に示す試みであり、モデル評価手法の妥当性を検討する上で参考になる。", "paper_url": "https://arxiv.org/abs/2505.18631", "code_url": "https://github.com/adept-thu/S2R-Bench", "published": "2025-05-24T10:30:47Z", "relevance": 9.5}, {"key": "arxiv:2505.13856", "title": "SuperMapNet for Long-Range and High-Accuracy Vectorized HD Map Construction", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "Vectorized HD map is essential for autonomous driving. Remarkable work has been achieved in recent years, but there are still major issues: (1) in the generation of the BEV features, single modality-based methods are of limited perception capability, while direct concatenation-based multi-modal methods fail to capture synergies and disparities between different modalities, resulting in limited ranges with feature holes; (2) in the classification and localization of map elements, only point information is used without the consideration of element infor-mation and neglects the interaction between point information and element information, leading to erroneous shapes and element entanglement with low accuracy. To address above issues, we introduce SuperMapNet for long-range and high-accuracy vectorized HD map construction. It uses both camera images and LiDAR point clouds as input, and first tightly couple semantic information from camera images and geometric information from LiDAR point clouds by a cross-attention based synergy enhancement module and a flow-based disparity alignment module for long-range BEV feature generation. And then, local features from point queries and global features from element queries are tightly coupled by three-level interactions for high-accuracy classification and localization, where Point2Point interaction learns local geometric information between points of the same element and of each point, Element2Element interaction learns relation constraints between different elements and semantic information of each elements, and Point2Element interaction learns complement element information for its constituent points. Experiments on the nuScenes and Argoverse2 datasets demonstrate superior performances, surpassing SOTAs over 14.9/8.8 mAP and 18.5/3.1 mAP under hard/easy settings, respectively. The code is made publicly available1.", "summary_ja": "自動運転向けのベクトル化HDマップ構築において、単一モダリティやカメラ・LiDARの単純結合ではBEV特徴に穴や不整合が生じる問題、点情報のみで要素間関係を無視するため形状誤りや要素混同が起きる問題を扱う。SuperMapNetはカメラとLiDAR両方を入力とし、クロスアテンションによるモダリティ融合とフロー整合により長距離BEV特徴を生成し、点クエリと要素クエリの3階層の相互作用により高精度な分類・位置推定を行う。", "novelty_ja": "モダリティ間のシナジー強化と視差整合を行うモジュールでBEV特徴を生成する点、および点同士・要素同士・点と要素間の3種類の相互作用を明示的に設計して局所幾何情報と大域意味情報を統合する点が従来手法との違い。", "why_read_ja": "マルチモーダル融合とグラフ的な要素間関係モデリングを組み合わせたHDマップ構築の設計は、他のオンラインマップ生成手法の特徴融合・トポロジー推定部分にも応用可能な知見を含む。", "paper_url": "https://arxiv.org/abs/2505.13856", "code_url": "", "published": "2025-05-20T03:06:22Z", "relevance": 17.5}, {"key": "arxiv:2505.12693", "title": "TACOcc:Target-Adaptive Cross-Modal Fusion with Volume Rendering for 3D Semantic Occupancy", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "Gaussian Splatting", "3D Detection", "Reconstruction", "AD Perception"], "abstract": "The performance of multi-modal 3D occupancy prediction is limited by ineffective fusion, mainly due to geometry-semantics mismatch from fixed fusion strategies and surface detail loss caused by sparse, noisy annotations. The mismatch stems from the heterogeneous scale and distribution of point cloud and image features, leading to biased matching under fixed neighborhood fusion. To address this, we propose a target-scale adaptive, bidirectional symmetric retrieval mechanism. It expands the neighborhood for large targets to enhance context awareness and shrinks it for small ones to improve efficiency and suppress noise, enabling accurate cross-modal feature alignment. This mechanism explicitly establishes spatial correspondences and improves fusion accuracy. For surface detail loss, sparse labels provide limited supervision, resulting in poor predictions for small objects. We introduce an improved volume rendering pipeline based on 3D Gaussian Splatting, which takes fused features as input to render images, applies photometric consistency supervision, and jointly optimizes 2D-3D consistency. This enhances surface detail reconstruction while suppressing noise propagation. In summary, we propose TACOcc, an adaptive multi-modal fusion framework for 3D semantic occupancy prediction, enhanced by volume rendering supervision. Experiments on the nuScenes and SemanticKITTI benchmarks validate its effectiveness.", "summary_ja": "マルチモーダルな3D semantic occupancy prediction において、点群と画像の特徴のスケールや分布の違いから固定的な近傍融合では対応付けが偏ってしまう問題と、疎でノイズの多いラベルしか使えないために表面の細部が失われる問題を扱っている。前者に対しては、対象のスケールに応じて探索近傍を変える双方向対称の retrieval 機構を導入し、大きな物体では近傍を広げて文脈を取り込み、小さな物体では狭めてノイズを抑える。後者に対しては、融合特徴から画像をレンダリングする 3D Gaussian Splatting ベースの volume rendering を組み込み、photometric consistency による監督で2D-3Dの整合を同時に最適化する。これらをまとめた枠組みを TACOcc として nuScenes と SemanticKITTI で評価している。", "novelty_ja": "固定近傍でのcross-modal融合ではなくターゲットのスケールに適応して近傍幅を変える対称的な特徴対応付けを行う点、および 3D Gaussian Splatting による描画を occupancy 学習の追加監督として使い疎ラベルの不足を補う点が従来のマルチモーダル occupancy 手法との差分である。", "why_read_ja": "camera-LiDAR融合の occupancy 予測において、レンダリングベースの自己教師的監督をどう組み込むかという最近の流れを具体的に示す例であり、疎なアノテーション下で細部の形状精度を上げる設計指針の参考になる。", "paper_url": "https://arxiv.org/abs/2505.12693", "code_url": "", "published": "2025-05-19T04:32:36Z", "relevance": 24.5}, {"key": "arxiv:2505.10685", "title": "GaussianFormer3D: Multi-Modal Gaussian-based Semantic Occupancy Prediction with 3D Deformable Attention", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "Gaussian Splatting", "3D Detection", "AD Perception"], "abstract": "3D semantic occupancy prediction is essential for achieving safe, reliable autonomous driving and robotic navigation. Compared to camera-only perception systems, multi-modal pipelines, especially LiDAR-camera fusion methods, can produce more accurate and fine-grained predictions. Although voxel-based scene representations are widely used for semantic occupancy prediction, 3D Gaussians have emerged as a continuous and significantly more compact alternative. In this work, we propose a multi-modal Gaussian-based semantic occupancy prediction framework utilizing 3D deformable attention, namely GaussianFormer3D. We introduce a voxel-to-Gaussian initialization strategy that provides 3D Gaussians with accurate geometry priors from LiDAR data, and design a LiDAR-guided 3D deformable attention mechanism to refine these Gaussians using LiDAR-camera fusion features in a lifted 3D space. Extensive experiments on real-world on-road and off-road autonomous driving datasets demonstrate that GaussianFormer3D achieves state-of-the-art prediction performance with reduced memory consumption and improved efficiency.", "summary_ja": "自動運転や屋外ロボットの安全な走行には3D semantic occupancy predictionが重要だが、従来主流のvoxel表現はメモリ効率が悪く、カメラのみの構成では幾何精度に限界がある。本論文は3D Gaussianをシーン表現として使い、LiDARとカメラを融合するoccupancy予測フレームワークGaussianFormer3Dを提案する。LiDARから得た幾何情報でGaussianを初期化し、3D空間に持ち上げた融合特徴を用いてGaussianを反復的に更新する。on-road/off-road両方の実データセットで評価している。", "novelty_ja": "Gaussianベースのoccupancy予測をcamera-onlyからmulti-modalへ拡張し、voxel-to-Gaussian初期化でLiDAR由来の幾何priorをGaussianに与える点が新しい。さらに2D画像平面ではなくlifted 3D空間でLiDAR-guided 3D deformable attentionを行い、融合特徴でGaussianを精緻化する。", "why_read_ja": "occupancy予測の表現がvoxelからGaussianなどの疎・連続表現へ移りつつある流れと、それをLiDAR融合へ広げる具体的な設計が分かる。メモリ・効率の改善を伴う点は車載実装を意識した環境認識研究として参考になる。", "paper_url": "https://arxiv.org/abs/2505.10685", "code_url": "", "published": "2025-05-15T20:05:08Z", "relevance": 25.0}, {"key": "arxiv:2505.08808", "title": "SparseMeXT Unlocking the Potential of Sparse Representations for HD Map Construction", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "Topology", "3D Detection", "AD Perception"], "abstract": "Recent advancements in high-definition \\emph{HD} map construction have demonstrated the effectiveness of dense representations, which heavily rely on computationally intensive bird's-eye view \\emph{BEV} features. While sparse representations offer a more efficient alternative by avoiding dense BEV processing, existing methods often lag behind due to the lack of tailored designs. These limitations have hindered the competitiveness of sparse representations in online HD map construction. In this work, we systematically revisit and enhance sparse representation techniques, identifying key architectural and algorithmic improvements that bridge the gap with--and ultimately surpass--dense approaches. We introduce a dedicated network architecture optimized for sparse map feature extraction, a sparse-dense segmentation auxiliary task to better leverage geometric and semantic cues, and a denoising module guided by physical priors to refine predictions. Through these enhancements, our method achieves state-of-the-art performance on the nuScenes dataset, significantly advancing HD map construction and centerline detection. Specifically, SparseMeXt-Tiny reaches a mean average precision \\emph{mAP} of 55.5% at 32 frames per second \\emph{fps}, while SparseMeXt-Base attains 65.2% mAP. Scaling the backbone and decoder further, SparseMeXt-Large achieves an mAP of 68.9% at over 20 fps, establishing a new benchmark for sparse representations in HD map construction. These results underscore the untapped potential of sparse methods, challenging the conventional reliance on dense representations and redefining efficiency-performance trade-offs in the field.", "summary_ja": "オンラインHD地図構築において、計算コストの高い密なBEV表現に依存せずスパース表現で高精度を達成することを目指した論文。スパース特徴抽出に特化したネットワーク構造、スパース-デンスのセグメンテーション補助タスク、物理的事前知識に基づくデノイジングモジュールを導入し、地図構築とセンターライン検出の性能を底上げしている。", "novelty_ja": "従来のスパース手法は専用設計の不足からデンス手法に性能で劣っていたが、本手法はアーキテクチャとアルゴリズムの両面を作り込むことでデンス手法を上回る精度を達成した点が新しい。", "why_read_ja": "スパース表現でもデンスBEVベースの手法を凌駕できることを示し、効率と精度のトレードオフの前提を覆す結果であるため、HD地図構築のアーキテクチャ選定の観点で重要。", "paper_url": "https://arxiv.org/abs/2505.08808", "code_url": "", "published": "2025-05-12T02:26:58Z", "relevance": 18.0}, {"key": "arxiv:2505.03284", "title": "OccCylindrical: Multi-Modal Fusion with Cylindrical Representation for 3D Semantic Occupancy Prediction", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "The safe operation of autonomous vehicles (AVs) is highly dependent on their understanding of the surroundings. For this, the task of 3D semantic occupancy prediction divides the space around the sensors into voxels, and labels each voxel with both occupancy and semantic information. Recent perception models have used multisensor fusion to perform this task. However, existing multisensor fusion-based approaches focus mainly on using sensor information in the Cartesian coordinate system. This ignores the distribution of the sensor readings, leading to a loss of fine-grained details and performance degradation. In this paper, we propose OccCylindrical that merges and refines the different modality features under cylindrical coordinates. Our method preserves more fine-grained geometry detail that leads to better performance. Extensive experiments conducted on the nuScenes dataset, including challenging rainy and nighttime scenarios, confirm our approach's effectiveness and state-of-the-art performance. The code will be available at: https://github.com/DanielMing123/OccCylindrical", "summary_ja": "自動運転車の3D semantic occupancy予測において、既存のマルチセンサ融合手法がCartesian座標系を使うためセンサの点分布特性を無視し細部情報が失われる問題を扱う。本研究はcylindrical座標系上でモダリティ特徴を融合・refineするOccCylindricalを提案し、より細かい幾何形状を保持する。", "novelty_ja": "従来のCartesian座標系での融合と異なり、cylindrical座標系でマルチモーダル特徴を統合・refineすることでセンサ読み取りの分布特性を活かす点が新しい。", "why_read_ja": "nuScenesでの雨天・夜間を含む難条件でSOTA性能を報告しており、座標系選択がoccupancy予測の細部再現性に与える影響を知る上で参考になる。", "paper_url": "https://arxiv.org/abs/2505.03284", "code_url": "https://github.com/DanielMing123/OccCylindrical", "published": "2025-05-06T08:12:31Z", "relevance": 21.5}, {"key": "arxiv:2504.16368", "title": "Revisiting Radar Camera Alignment by Contrastive Learning for 3D Object Detection", "venue": "arXiv 2025", "year": 2025, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception", "HD Map"], "abstract": "Recently, 3D object detection algorithms based on radar and camera fusion have shown excellent performance, setting the stage for their application in autonomous driving perception tasks. Existing methods have focused on dealing with feature misalignment caused by the domain gap between radar and camera. However, existing methods either neglect inter-modal features interaction during alignment or fail to effectively align features at the same spatial location across modalities. To alleviate the above problems, we propose a new alignment model called Radar Camera Alignment (RCAlign). Specifically, we design a Dual-Route Alignment (DRA) module based on contrastive learning to align and fuse the features between radar and camera. Moreover, considering the sparsity of radar BEV features, a Radar Feature Enhancement (RFE) module is proposed to improve the densification of radar BEV features with the knowledge distillation loss. Experiments show RCAlign achieves a new state-of-the-art on the public nuScenes benchmark in radar camera fusion for 3D Object Detection. Furthermore, the RCAlign achieves a significant performance gain (4.3\\% NDS and 8.4\\% mAP) in real-time 3D detection compared to the latest state-of-the-art method (RCBEVDet).", "summary_ja": "レーダーとカメラの特徴をBEV空間で融合する際に生じるモダリティ間のドメインギャップ・空間的な位置ずれを解消することを課題とし、対照学習に基づくDual-Route Alignmentモジュールで両モダリティの特徴を位置整合させつつ相互作用させ、さらにレーダーBEV特徴の疎性を蒸留損失付きのRadar Feature Enhancementモジュールで補う手法RCAlignを提案している。nuScenesベンチマークでレーダー・カメラ融合3D検出のSOTAを達成した。", "novelty_ja": "従来手法がアライメント時のモダリティ間相互作用を無視するか、同一空間位置での特徴整合に失敗していたのに対し、対照学習による整合と蒸留による特徴densificationを組み合わせている点が異なる。", "why_read_ja": "レーダー・カメラ融合3D検出における特徴アライメントの課題設定と解決アプローチは、他のマルチモーダルBEV認識・地図生成タスクの特徴融合設計にも応用できる知見となる。", "paper_url": "https://arxiv.org/abs/2504.16368", "code_url": "", "published": "2025-04-23T02:41:43Z", "relevance": 19.0}, {"key": "arxiv:2504.15888", "title": "MS-Occ: Multi-Stage LiDAR-Camera Fusion for 3D Semantic Occupancy Prediction", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "Accurate 3D semantic occupancy perception is essential for autonomous driving in complex environments with diverse and irregular objects. While vision-centric methods suffer from geometric inaccuracies, LiDAR-based approaches often lack rich semantic information. To address these limitations, MS-Occ, a novel multi-stage LiDAR-camera fusion framework which includes middle-stage fusion and late-stage fusion, is proposed, integrating LiDAR's geometric fidelity with camera-based semantic richness via hierarchical cross-modal fusion. The framework introduces innovations at two critical stages: (1) In the middle-stage feature fusion, the Gaussian-Geo module leverages Gaussian kernel rendering on sparse LiDAR depth maps to enhance 2D image features with dense geometric priors, and the Semantic-Aware module enriches LiDAR voxels with semantic context via deformable cross-attention; (2) In the late-stage voxel fusion, the Adaptive Fusion (AF) module dynamically balances voxel features across modalities, while the High Classification Confidence Voxel Fusion (HCCVF) module resolves semantic inconsistencies using self-attention-based refinement. Experiments on two large-scale benchmarks demonstrate state-of-the-art performance. On nuScenes-OpenOccupancy, MS-Occ achieves an Intersection over Union (IoU) of 32.1% and a mean IoU (mIoU) of 25.3%, surpassing the state-of-the-art by +0.7% IoU and +2.4% mIoU. Furthermore, on the SemanticKITTI benchmark, our method achieves a new state-of-the-art mIoU of 24.08%, robustly validating its generalization capabilities.Ablation studies further confirm the effectiveness of each individual module, highlighting substantial improvements in the perception of small objects and reinforcing the practical value of MS-Occ for safety-critical autonomous driving scenarios.", "summary_ja": "屋外走行環境の3D semantic occupancy予測において、カメラ主体の手法は幾何精度が不足し、LiDAR主体の手法は意味情報に乏しいという相補的な弱点を扱った研究。MS-Occは、特徴レベルの中間段階とvoxelレベルの後段という2つの段階でLiDARとカメラを融合するフレームワークを提案する。中間段階では疎なLiDAR depthをGaussian kernel renderingで密な幾何priorに変換して画像特徴を補強し、逆にdeformable cross-attentionでLiDAR voxelに意味情報を与える。後段ではモダリティ間のvoxel特徴を適応的に重み付けし、分類確信度の高いvoxelを基準にself-attentionで意味的な不整合を解消する。nuScenes-OpenOccupancyとSemanticKITTIで既存手法を上回る結果を報告している。", "novelty_ja": "融合を単一段階で行う従来のマルチモーダルoccupancy手法と異なり、画像特徴とvoxel特徴の両方のレベルで双方向に補完する多段構成を採る点が特徴。特に、LiDAR depthのGaussian kernel renderingによる密な幾何prior注入と、確信度に基づくvoxel単位の意味的整合化モジュールを組み合わせている。", "why_read_ja": "occupancy予測におけるLiDAR-camera融合の設計をどの段階で行うべきかという論点に対する具体的な回答例であり、環境認識の融合アーキテクチャ動向を追ううえで参考になる。小物体の認識改善に言及している点も、実用的なocc手法の評価軸として押さえておく価値がある。", "paper_url": "https://arxiv.org/abs/2504.15888", "code_url": "", "published": "2025-04-22T13:33:26Z", "relevance": 24.0}, {"key": "arxiv:2504.13596", "title": "Collaborative Learning of Local 3D Occupancy Prediction and Versatile Global Occupancy Mapping", "venue": "ICRA 2026", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "Open-world", "AD Perception", "3D Detection"], "abstract": "Vision-based 3D semantic occupancy prediction is vital for autonomous driving, enabling unified modeling of static infrastructure and dynamic agents. Global occupancy maps serve as long-term memory priors, providing valuable historical context that enhances local perception. This is particularly important in challenging scenarios such as occlusion or poor illumination, where current and nearby observations may be unreliable or incomplete. Priors aggregated from previous traversals under better conditions help fill gaps and enhance the robustness of local 3D occupancy prediction. In this paper, we propose Long-term Memory Prior Occupancy (LMPOcc), a plug-and-play framework that incorporates global occupancy priors to boost local prediction and simultaneously updates global maps with new observations. To realize the information gain from global priors, we design an efficient and lightweight Current-Prior Fusion module that adaptively integrates prior and current features. Meanwhile, we introduce a model-agnostic prior format to enable continual updating of global occupancy and ensure compatibility across diverse prediction baselines. LMPOcc achieves state-of-the-art local occupancy prediction performance validated on the Occ3D-nuScenes benchmark, especially on static semantic categories. Furthermore, we verify LMPOcc's capability to build large-scale global occupancy maps through multi-vehicle crowdsourcing, and utilize occupancy-derived dense depth to support the construction of 3D open-vocabulary maps. Our method opens up a new paradigm for continuous global information updating and storage, paving the way towards more comprehensive and scalable scene understanding in large outdoor environments.", "summary_ja": "車載カメラからの3D semantic occupancy predictionは、遮蔽や低照度といった条件下では現在の観測だけでは不十分になる。本論文はLMPOccとして、過去の走行で蓄積したglobal occupancy mapをlong-term memory priorとして現在の推論に与え、同時に新しい観測でglobal mapを更新する枠組みを提案する。priorと現在特徴を適応的に統合する軽量なCurrent-Prior Fusionモジュールと、モデル非依存のprior形式を導入し、既存のoccupancy予測手法にplug-and-playで組み込めるようにしている。Occ3D-nuScenesでの評価に加え、複数車両のcrowdsourcingによる大規模global occupancy map構築と、occupancy由来のdense depthを用いた3D open-vocabulary map構築も示している。", "novelty_ja": "単一走行・単一車両の時系列集約に留まっていた従来のoccupancy予測に対し、過去走行由来のglobal occupancy mapをpriorとして再利用しつつ継続的に更新するループを作った点が新しい。prior形式をモデル非依存に設計したことで、特定のbaselineに縛られずplug-and-playで適用できる。", "why_read_ja": "occupancyを「その場の予測結果」ではなく継続更新される地図資産として扱う設計であり、HD mapのmap update/クラウドソーシング更新の議論とoccupancy予測を橋渡しする事例として参考になる。occupancy由来のdepthをopen-vocabulary mapに繋げている点も、地図表現の拡張方向を追ううえで見どころがある。", "paper_url": "https://arxiv.org/abs/2504.13596", "code_url": "", "published": "2025-04-18T09:58:48Z", "relevance": 25.0}, {"key": "arxiv:2504.12959", "title": "Rethinking Temporal Fusion with a Unified Gradient Descent View for 3D Semantic Occupancy Prediction", "venue": "CVPR 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "We present GDFusion, a temporal fusion method for vision-based 3D semantic occupancy prediction (VisionOcc). GDFusion opens up the underexplored aspects of temporal fusion within the VisionOcc framework, with a focus on both temporal cues and fusion strategies. It systematically examines the entire VisionOcc pipeline, identifying three fundamental yet previously overlooked temporal cues: scene-level consistencies, motion calibration, and geometric complementation. These cues capture diverse facets of temporal evolution and provide distinctive contributions across various modules in the general VisionOcc framework. To effectively fuse temporal signals across heterogeneous representations, we propose a novel fusion strategy by reinterpreting the formulation of vanilla RNNs. This reinterpretation leverages gradient descent on features to unify the integration of diverse temporal information, seamlessly embedding the proposed temporal cues into the network. Extensive experiments on nuScenes demonstrate that GDFusion significantly outperforms established baselines, achieving 2.2%--4.7% mIoU improvement while reducing memory consumption by 30%--72%. Codes are available at https://github.com/cdb342/GDFusion.", "summary_ja": "GDFusionは、視覚ベースの3D semantic occupancy prediction(VisionOcc)における時系列融合手法。scene-level consistency、motion calibration、geometric complementationという3つの時系列的手がかりを整理し、これらをVanilla RNNの定式化をgradient descentとして再解釈することで異種表現間で統一的に融合する。", "novelty_ja": "従来のVisionOcc手法が見落としていた3種類の時系列的手がかりを体系的に特定し、RNNの更新式を特徴量に対するgradient descentとして再解釈することで、多様な時系列情報を単一の枠組みに統合する点が新しい。", "why_read_ja": "occupancy predictionにおける時系列融合の設計原理を整理しており、mIoU向上とメモリ削減を両立する具体策として今後のBEV/occupancy系手法の設計に参考になる。", "paper_url": "https://arxiv.org/abs/2504.12959", "code_url": "https://github.com/cdb342/GDFusion", "published": "2025-04-17T14:05:33Z", "relevance": 22.5}, {"key": "arxiv:2504.10117", "title": "AGO: Adaptive Grounding for Open World 3D Occupancy Prediction", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Open-world", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "Open-world 3D semantic occupancy prediction aims to generate a voxelized 3D representation from sensor inputs while recognizing both known and unknown objects. Transferring open-vocabulary knowledge from vision-language models (VLMs) offers a promising direction but remains challenging. However, methods based on VLM-derived 2D pseudo-labels with traditional supervision are limited by a predefined label space and lack general prediction capabilities. Direct alignment with pretrained image embeddings, on the other hand, often fails to achieve reliable performance because of inconsistent image and text representations in VLMs. To address these challenges, we propose AGO, a novel 3D occupancy prediction framework with adaptive grounding to handle diverse open-world scenarios. AGO first encodes surrounding images and class prompts into 3D and text embeddings, respectively, leveraging similarity-based grounding training with 3D pseudo-labels. Additionally, a modality adapter maps 3D embeddings into a space aligned with VLM-derived image embeddings, reducing modality gaps. Experiments on Occ3D-nuScenes show that AGO improves unknown object prediction in zero-shot and few-shot transfer while achieving state-of-the-art closed-world self-supervised performance, surpassing prior methods by 4.09 mIoU. Code is available at: https://github.com/EdwardLeeLPZ/AGO.", "summary_ja": "Open-worldな3D semantic occupancy予測、つまり事前定義したクラス以外の未知物体も含めてvoxel表現を作る問題に取り組んでいる。VLMの知識を使うアプローチとして、2D pseudo-labelを従来の教師あり学習で使う方法はラベル空間に縛られ、逆に画像埋め込みへ直接アラインする方法はVLM内の画像・テキスト表現の不整合で性能が安定しない、という二つの弱点を指摘する。提案手法AGOは、サラウンド画像を3D埋め込み、クラスプロンプトをテキスト埋め込みに変換し、3D pseudo-labelを用いた類似度ベースのgrounding学習を行う。さらにmodality adapterで3D埋め込みをVLM画像埋め込みと整合する空間へ写し、モダリティ間のギャップを縮める。", "novelty_ja": "固定ラベル空間の疑似ラベル学習とVLM埋め込みへの直接アラインのどちらにも寄らず、類似度ベースのgrounding学習とmodality adapterを組み合わせて両者の欠点を回避している点が異なる。Occ3D-nuScenesでzero-shot/few-shotの未知物体予測を改善しつつ、closed-worldの自己教師あり設定でも従来を4.09 mIoU上回ると報告している。", "why_read_ja": "occupancy予測をclosed-setのセマンティクスからopen-vocabularyへ拡張する流れの代表例で、VLMを3D空間表現に接続する際の実践的な設計(pseudo-labelとembedding alignmentの折り合い)が参考になる。未知物体を扱えるocc表現は地図生成や走行可能領域推定の前段としても重要。", "paper_url": "https://arxiv.org/abs/2504.10117", "code_url": "https://github.com/EdwardLeeLPZ/AGO", "published": "2025-04-14T11:26:20Z", "relevance": 29.5}, {"key": "arxiv:2504.06647", "title": "Uni-PrevPredMap: Extending PrevPredMap to a Unified Framework of Prior-Informed Modeling for Online Vectorized HD Map Construction", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "Safety constitutes a foundational imperative for autonomous driving systems, necessitating maximal incorporation of accessible prior information. This study establishes that temporal perception buffers and cost-efficient high-definition (HD) maps inherently form complementary prior sources for online vectorized HD map construction. We present Uni-PrevPredMap, a pioneering unified framework systematically integrating previous predictions with corrupted HD maps. Our framework introduces a tri-mode paradigm maintaining operational consistency across non-prior, temporal-prior, and temporal-map-fusion modes. This tri-mode paradigm simultaneously decouples the framework from ideal map assumptions while ensuring robust performance in both map-present and map-absent scenarios. Additionally, we develop a tile-indexed 3D vectorized global map processor enabling efficient 3D prior data refreshment, compact storage, and real-time retrieval. Uni-PrevPredMap achieves state-of-the-art map-absent performance across established online vectorized HD map construction benchmarks. When provided with corrupted HD maps, it exhibits robust capabilities in error-resilient prior fusion, empirically confirming the synergistic complementarity between temporal predictions and imperfect map data. Code is available at https://github.com/pnnnnnnn/Uni-PrevPredMap.", "summary_ja": "自動運転の地図構築において、過去の予測結果と(欠損・誤りを含む)HDマップという2種類の事前情報を統合する統一フレームワークUni-PrevPredMapを提案。マップが使えない場合と劣化したマップしかない場合の両方に対応するtri-modeパラダイムを導入し、タイル単位で索引付けした3Dベクトルグローバルマップ処理により効率的な更新・保存・検索を実現している。", "novelty_ja": "従来手法が理想的なHDマップの存在を前提としがちなのに対し、non-prior/temporal-prior/temporal-map-fusionの3モードを単一モデルで一貫運用することでマップ有無への依存を切り離し、劣化マップと時系列予測の相補性を実証した点が新しい。", "why_read_ja": "オンラインHDマップ構築において事前地図情報の破損・欠損への頑健性は実運用上の重要課題であり、時系列情報と地図情報の融合設計は今後のオンラインマッピング研究の方向性を占ううえで参考になる。", "paper_url": "https://arxiv.org/abs/2504.06647", "code_url": "https://github.com/pnnnnnnn/Uni-PrevPredMap", "published": "2025-04-09T07:36:17Z", "relevance": 16.5}, {"key": "arxiv:2504.04732", "title": "Inverse++: Vision-Centric 3D Semantic Occupancy Prediction Assisted with 3D Object Detection", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "3D Detection", "Scene Understanding", "AD Perception"], "abstract": "3D semantic occupancy prediction aims to forecast detailed geometric and semantic information of the surrounding environment for autonomous vehicles (AVs) using onboard surround-view cameras. Existing methods primarily focus on intricate inner structure module designs to improve model performance, such as efficient feature sampling and aggregation processes or intermediate feature representation formats. In this paper, we explore multitask learning by introducing an additional 3D supervision signal by incorporating an additional 3D object detection auxiliary branch. This extra 3D supervision signal enhances the model's overall performance by strengthening the capability of the intermediate features to capture small dynamic objects in the scene, and these small dynamic objects often include vulnerable road users, i.e. bicycles, motorcycles, and pedestrians, whose detection is crucial for ensuring driving safety in autonomous vehicles. Extensive experiments conducted on the nuScenes datasets, including challenging rainy and nighttime scenarios, showcase that our approach attains state-of-the-art results, achieving an IoU score of 31.73% and a mIoU score of 20.91% and excels at detecting vulnerable road users (VRU). The code will be made available at:https://github.com/DanielMing123/Inverse++", "summary_ja": "車載サラウンドビューカメラのみを入力として、周囲環境の幾何と意味を表す3D semantic occupancyを推定する研究。従来はサンプリングや特徴表現などモデル内部の構造改良に注力してきたが、本論文は3D object detectionを補助ブランチとして加えるマルチタスク学習で追加の3D教師信号を与えるアプローチを取る。これにより中間特徴が小さな動的物体を捉える能力が強化され、自転車・バイク・歩行者といったvulnerable road user (VRU) の表現が改善される。nuScenesで雨天・夜間を含む条件で評価し、IoU 31.73%、mIoU 20.91%を報告している。", "novelty_ja": "occupancyネットワーク内部の構造設計を工夫する従来路線ではなく、3D detectionの補助タスクによる追加の3D監督で中間特徴自体を鍛える点が異なる。特に小さな動的物体・VRUの検出性能向上を狙いとして明示している。", "why_read_ja": "occupancy predictionと3D detectionをタスク統合する流れの具体例であり、安全上重要な小物体をocc表現でどう扱うかという課題設定を把握できる。雨天・夜間を含む評価設定も環境認識の頑健性を追う上で参考になる。", "paper_url": "https://arxiv.org/abs/2504.04732", "code_url": "https://github.com/DanielMing123/Inverse", "published": "2025-04-07T05:08:22Z", "relevance": 25.5}, {"key": "arxiv:2504.04158", "title": "JarvisIR: Elevating Autonomous Driving Perception with Intelligent Image Restoration", "venue": "CVPR 2025", "year": 2025, "topic": "AD Perception", "topics": ["AD Perception"], "abstract": "Vision-centric perception systems often struggle with unpredictable and coupled weather degradations in the wild. Current solutions are often limited, as they either depend on specific degradation priors or suffer from significant domain gaps. To enable robust and autonomous operation in real-world conditions, we propose JarvisIR, a VLM-powered agent that leverages the VLM (e.g., Llava-Llama3) as a controller to manage multiple expert restoration models. To further enhance system robustness, reduce hallucinations, and improve generalizability in real-world adverse weather, JarvisIR employs a novel two-stage framework consisting of supervised fine-tuning and human feedback alignment. Specifically, to address the lack of paired data in real-world scenarios, the human feedback alignment enables the VLM to be fine-tuned effectively on large-scale real-world data in an unsupervised manner. To support the training and evaluation of JarvisIR, we introduce CleanBench, a comprehensive dataset consisting of high-quality and large-scale instruction-responses pairs, including 150K synthetic entries and 80K real entries. Extensive experiments demonstrate that JarvisIR exhibits superior decision-making and restoration capabilities. Compared with existing methods, it achieves a 50% improvement in the average of all perception metrics on CleanBench-Real.", "summary_ja": "自動運転の視覚中心認識は現実世界の予測不能かつ複合的な悪天候による画質劣化に弱く、既存手法は特定の劣化事前知識に依存するかドメインギャップが大きいという課題がある。本研究はVLM(Llava-Llama3等)をコントローラとして複数の専門修復モデルを管理するエージェントJarvisIRを提案し、教師あり微調整と人間フィードバック整合の2段階学習で頑健性とハルシネーション抑制、汎化性を高める。学習・評価用に合成15万件・実世界8万件の指示応答対からなるデータセットCleanBenchも構築した。", "novelty_ja": "特定劣化に特化した単一モデルではなく、VLMが状況を判断して複数の修復エキスパートを選択・制御する点、および実世界のペアデータ不足を人間フィードバックによる教師なし微調整で補う点が従来手法と異なる。", "why_read_ja": "悪天候などの実運用条件下での認識頑健性は、地図生成や3D検出など下流タスクの入力品質を左右するため、認識パイプライン全体の信頼性向上の観点で参考になる。", "paper_url": "https://arxiv.org/abs/2504.04158", "code_url": "", "published": "2025-04-05T12:38:55Z", "relevance": 8.5}, {"key": "arxiv:2504.02270", "title": "MinkOcc: Towards real-time label-efficient semantic occupancy prediction", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "AD Perception"], "abstract": "Developing 3D semantic occupancy prediction models often relies on dense 3D annotations for supervised learning, a process that is both labor and resource-intensive, underscoring the need for label-efficient or even label-free approaches. To address this, we introduce MinkOcc, a multi-modal 3D semantic occupancy prediction framework for cameras and LiDARs that proposes a two-step semi-supervised training procedure. Here, a small dataset of explicitly 3D annotations warm-starts the training process; then, the supervision is continued by simpler-to-annotate accumulated LiDAR sweeps and images -- semantically labelled through vision foundational models. MinkOcc effectively utilizes these sensor-rich supervisory cues and reduces reliance on manual labeling by 90\\% while maintaining competitive accuracy. In addition, the proposed model incorporates information from LiDAR and camera data through early fusion and leverages sparse convolution networks for real-time prediction. With its efficiency in both supervision and computation, we aim to extend MinkOcc beyond curated datasets, enabling broader real-world deployment of 3D semantic occupancy prediction in autonomous driving.", "summary_ja": "3Dセマンティックオキュパンシー予測は密な3Dアノテーションを要し高コストであることを課題とし、少量の3Dラベルで学習を温間開始した後、蓄積LiDARスイープと画像を基盤モデルで自動意味ラベル付けした疑似supervisionで学習を継続する半教師あり手法MinkOccを提案する。カメラとLiDARを早期融合し、スパース畳み込みでリアルタイム推論を実現する。", "novelty_ja": "手動3Dアノテーションを90%削減しつつ精度を維持する点、および視覚基盤モデルによる自動ラベリングとLiDAR蓄積を組み合わせた2段階の半教師あり学習手順が従来の全教師あり手法と異なる。", "why_read_ja": "ラベルコストを大幅に削減しながら実用的な精度を保つ手法は、Occupancy予測の実運用展開における重要な障壁を扱っており動向把握に有用。", "paper_url": "https://arxiv.org/abs/2504.02270", "code_url": "", "published": "2025-04-03T04:31:56Z", "relevance": 20.0}, {"key": "arxiv:2503.19776", "title": "Resilient Sensor Fusion under Adverse Sensor Failures via Multi-Modal Expert Fusion", "venue": "CVPR 2025", "year": 2025, "topic": "3D Detection", "topics": ["AD Perception", "3D Detection"], "abstract": "Modern autonomous driving perception systems utilize complementary multi-modal sensors, such as LiDAR and cameras. Although sensor fusion architectures enhance performance in challenging environments, they still suffer significant performance drops under severe sensor failures, such as LiDAR beam reduction, LiDAR drop, limited field of view, camera drop, and occlusion. This limitation stems from inter-modality dependencies in current sensor fusion frameworks. In this study, we introduce an efficient and robust LiDAR-camera 3D object detector, referred to as MoME, which can achieve robust performance through a mixture of experts approach. Our MoME fully decouples modality dependencies using three parallel expert decoders, which use camera features, LiDAR features, or a combination of both to decode object queries, respectively. We propose Multi-Expert Decoding (MED) framework, where each query is decoded selectively using one of three expert decoders. MoME utilizes an Adaptive Query Router (AQR) to select the most appropriate expert decoder for each query based on the quality of camera and LiDAR features. This ensures that each query is processed by the best-suited expert, resulting in robust performance across diverse sensor failure scenarios. We evaluated the performance of MoME on the nuScenes-R benchmark. Our MoME achieved state-of-the-art performance in extreme weather and sensor failure conditions, significantly outperforming the existing models across various sensor failure scenarios.", "summary_ja": "LiDARビーム削減、LiDARドロップ、視野制限、カメラドロップ、遮蔽といった深刻なセンサ故障下で性能が大きく劣化する既存のマルチモーダル融合手法の課題に対し、モダリティ間の依存を排したMixture-of-Expertsベースの3D物体検出器MoMEを提案している。カメラ専用・LiDAR専用・両方併用の3つの並列エキスパートデコーダでクエリをデコードし、Adaptive Query Routerが特徴品質に応じて各クエリに最適なエキスパートを選択する構成になっている。", "novelty_ja": "既存融合アーキテクチャがモダリティ間依存により故障時に弱いのに対し、Multi-Expert Decoding枠組みでクエリごとに専用デコーダを選択的に用いることでモダリティ依存を完全に切り離している点が異なる。", "why_read_ja": "悪天候・センサ故障時の頑健性はAD Perceptionの実運用上の重要課題であり、マルチモーダル融合の設計指針として参照価値が高い。", "paper_url": "https://arxiv.org/abs/2503.19776", "code_url": "", "published": "2025-03-25T15:46:18Z", "relevance": 10.5}, {"key": "arxiv:2503.13430", "title": "AugMapNet: Improving Spatial Latent Structure via BEV Grid Augmentation for Enhanced Vectorized Online HD Map Construction", "venue": "WACV 2026", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception", "3D Detection"], "abstract": "Autonomous driving requires understanding infrastructure elements, such as lanes and crosswalks. To navigate safely, this understanding must be derived from sensor data in real-time and needs to be represented in vectorized form. Learned Bird's-Eye View (BEV) encoders are commonly used to combine a set of camera images from multiple views into one joint latent BEV grid. Traditionally, from this latent space, an intermediate raster map is predicted, providing dense spatial supervision but requiring post-processing into the desired vectorized form. More recent models directly derive infrastructure elements as polylines using vectorized map decoders, providing instance-level information. Our approach, Augmentation Map Network (AugMapNet), proposes latent BEV feature grid augmentation, a novel technique that significantly enhances the latent BEV representation. AugMapNet combines vector decoding and dense spatial supervision more effectively than existing architectures while remaining easy to integrate compared to other hybrid approaches. It additionally benefits from extra processing on its latent BEV features. Experiments on nuScenes and Argoverse2 datasets demonstrate significant improvements on vectorized map prediction of up to 13.3% over the StreamMapNet baseline on 60 m range and greater improvements on larger ranges. We confirm transferability by applying our method to another baseline, SQD-MapNet, and find similar improvements. A detailed analysis of the latent BEV grid confirms a more structured latent space of AugMapNet and shows the value of our novel concept beyond pure performance improvement. The code can be found at https://github.com/tmonnin/augmapnet", "summary_ja": "カメラ画像群をBEV潜在空間に統合し、そこからレーンや横断歩道などの地図要素をベクトル形式で推定するオンラインHDマップ構築において、BEV潜在特徴の質を高める手法AugMapNetを提案する。従来はラスタマップ予測による密な空間教示か、ベクトルデコーダによるインスタンス単位の予測のいずれかに寄っていたが、本研究はBEV grid augmentationという新機構でこの両者を組み合わせる。nuScenesとArgoverse2でStreamMapNetベースラインに対し60mレンジで最大13.3%の性能向上を確認し、より長距離ではさらに改善する。", "novelty_ja": "既存のハイブリッド手法より統合が容易な形で、密な空間教示とベクトルデコードを同時に活かすBEV grid augmentationという新技術を導入し、潜在空間自体をより構造化した点が従来との違い。", "why_read_ja": "BEV潜在表現の質がベクトルマップ精度に直結するという知見と、既存ベースラインへの転用可能性（SQD-MapNetでも効果を確認）は、HDマップ構築アーキテクチャ選定の参考になる。", "paper_url": "https://arxiv.org/abs/2503.13430", "code_url": "https://github.com/tmonnin/augmapnet", "published": "2025-03-17T17:55:32Z", "relevance": 20.5}, {"key": "arxiv:2503.12369", "title": "L2COcc: Lightweight Camera-Centric Semantic Scene Completion via Distillation of LiDAR Model", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "AD Perception", "3D Detection"], "abstract": "Semantic Scene Completion (SSC) constitutes a pivotal element in autonomous driving perception systems, tasked with inferring the 3D semantic occupancy of a scene from sensory data. To improve accuracy, prior research has implemented various computationally demanding and memory-intensive 3D operations, imposing significant computational requirements on the platform during training and testing. This paper proposes L2COcc, a lightweight camera-centric SSC framework that also accommodates LiDAR inputs. With our proposed efficient voxel transformer (EVT) and cross-modal knowledge modules, including feature similarity distillation (FSD), TPV distillation (TPVD) and prediction alignment distillation (PAD), our method substantially reduce computational burden while maintaining high accuracy. The experimental evaluations demonstrate that our proposed method surpasses the current state-of-the-art vision-based SSC methods regarding accuracy on both the SemanticKITTI and SSCBench-KITTI-360 benchmarks, respectively. Additionally, our method is more lightweight, exhibiting a reduction in both memory consumption and inference time by over 23% compared to the current state-of-the-arts method. Code is available at our project page:https://studyingfufu.github.io/L2COcc/.", "summary_ja": "自動運転の認識で重要な Semantic Scene Completion (SSC) を、カメラ中心の軽量な構成で解こうとした研究。従来手法は精度を上げるために計算量とメモリ消費の大きい 3D 演算を多用しており、学習・推論時のプラットフォーム負荷が課題だった。本論文は efficient voxel transformer (EVT) を用いた軽量なアーキテクチャに、LiDAR モデルからのクロスモーダル蒸留(feature similarity distillation、TPV distillation、prediction alignment distillation)を組み合わせ、計算負荷を抑えつつ精度を保つ枠組み L2COcc を提案している。LiDAR 入力にも対応する構成となっている。", "novelty_ja": "重い 3D 演算に頼らず EVT で occupancy を推定しつつ、feature・TPV 表現・予測結果の3レベルで LiDAR モデルの知識をカメラモデルへ蒸留する点が従来のカメラベース SSC と異なる。結果として SemanticKITTI と SSCBench-KITTI-360 で既存の vision-based SSC を上回りつつ、メモリと推論時間を 23% 以上削減したと報告している。", "why_read_ja": "occupancy 推定は BEV/HD Map と並ぶ車載環境認識の中核表現であり、精度と実車搭載可能な計算コストを同時に satisfy する方向性の実例として参考になる。LiDAR から camera への蒸留はマルチモーダル前提のデータセットを活かす一般的な手法設計として、地図生成・認識の他タスクにも転用しやすい。", "paper_url": "https://arxiv.org/abs/2503.12369", "code_url": "", "published": "2025-03-16T06:09:36Z", "relevance": 24.0}, {"key": "arxiv:2503.11265", "title": "DynRsl-VLM: Enhancing Autonomous Driving Perception with Dynamic Resolution Vision-Language Models", "venue": "arXiv 2025", "year": 2025, "topic": "AD Perception", "topics": ["AD Perception", "Open-world"], "abstract": "Visual Question Answering (VQA) models, which fall under the category of vision-language models, conventionally execute multiple downsampling processes on image inputs to strike a balance between computational efficiency and model performance. Although this approach aids in concentrating on salient features and diminishing computational burden, it incurs the loss of vital detailed information, a drawback that is particularly damaging in end-to-end autonomous driving scenarios. Downsampling can lead to an inadequate capture of distant or small objects such as pedestrians, road signs, or obstacles, all of which are crucial for safe navigation. This loss of features negatively impacts an autonomous driving system's capacity to accurately perceive the environment, potentially escalating the risk of accidents. To tackle this problem, we put forward the Dynamic Resolution Vision Language Model (DynRsl-VLM). DynRsl-VLM incorporates a dynamic resolution image input processing approach that captures all entity feature information within an image while ensuring that the image input remains computationally tractable for the Vision Transformer (ViT). Moreover, we devise a novel image-text alignment module to replace the Q-Former, enabling simple and efficient alignment with text when dealing with dynamic resolution image inputs. Our method enhances the environmental perception capabilities of autonomous driving systems without overstepping computational constraints.", "summary_ja": "VQA系のvision-language modelは画像入力を複数回ダウンサンプリングするため、遠方の歩行者・標識・障害物などの細部情報が失われ、自動運転の環境認識精度を損なう。本研究はDynRsl-VLMという動的解像度画像処理手法を提案し、ViTの計算量を抑えつつ画像内の全エンティティの特徴情報を保持する。あわせてQ-Formerに代わる新たなimage-text alignmentモジュールを導入し、動的解像度入力とテキストとのシンプルで効率的な整合を実現する。", "novelty_ja": "固定的なダウンサンプリングに依存する従来のVLMと異なり、動的解像度入力によって詳細情報の欠落を防ぎつつ、Q-Formerを置き換える新規alignmentモジュールで計算コストを抑える点が特徴。", "why_read_ja": "end-to-end自動運転におけるVLMベース知覚での解像度・情報損失問題への対処法として、Open-world/AD Perception分野の設計指針の参考になる。", "paper_url": "https://arxiv.org/abs/2503.11265", "code_url": "", "published": "2025-03-14T10:19:24Z", "relevance": 11.0}, {"key": "arxiv:2503.05492", "title": "FastMap: Fast Queries Initialization Based Vectorized HD Map Reconstruction Framework", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "Map Update", "AD Perception", "3D Detection"], "abstract": "Reconstruction of high-definition maps is a crucial task in perceiving the autonomous driving environment, as its accuracy directly impacts the reliability of prediction and planning capabilities in downstream modules. Current vectorized map reconstruction methods based on the DETR framework encounter limitations due to the redundancy in the decoder structure, necessitating the stacking of six decoder layers to maintain performance, which significantly hampers computational efficiency. To tackle this issue, we introduce FastMap, an innovative framework designed to reduce decoder redundancy in existing approaches. FastMap optimizes the decoder architecture by employing a single-layer, two-stage transformer that achieves multilevel representation capabilities. Our framework eliminates the conventional practice of randomly initializing queries and instead incorporates a heatmap-guided query generation module during the decoding phase, which effectively maps image features into structured query vectors using learnable positional encoding. Additionally, we propose a geometry-constrained point-to-line loss mechanism for FastMap, which adeptly addresses the challenge of distinguishing highly homogeneous features that often arise in traditional point-to-point loss computations. Extensive experiments demonstrate that FastMap achieves state-of-the-art performance in both nuScenes and Argoverse2 datasets, with its decoder operating 3.2 faster than the baseline. Code and more demos are available at https://github.com/hht1996ok/FastMap.", "summary_ja": "DETRベースのベクトルHDマップ再構成手法はデコーダの冗長性から6層ものデコーダ層を積む必要があり計算効率が低い。FastMapは単層・2段階のTransformerデコーダとヒートマップ誘導によるクエリ生成モジュールで、ランダム初期化に頼らず画像特徴を構造化クエリへ変換する。さらに点対点損失では区別しにくい同質的特徴に対応するため、幾何制約付きの点対線損失を導入している。", "novelty_ja": "6層デコーダを積む代わりに単層2段階構成で多段階の表現能力を実現し、ランダムクエリ初期化をヒートマップ誘導生成に置き換えた点が従来のDETR系マップ再構成手法との違い。", "why_read_ja": "オンラインHDマップ推定はデコーダ層数削減によるリアルタイム性向上が課題であり、nuScenes/Argoverse2でSOTAかつ3.2倍高速というデコーダ設計は実装コスト低減の観点で参照価値が高い。", "paper_url": "https://arxiv.org/abs/2503.05492", "code_url": "https://github.com/hht1996ok/FastMap", "published": "2025-03-07T15:01:55Z", "relevance": 20.5}, {"key": "arxiv:2503.04863", "title": "Manboformer: Learning Gaussian Representations via Spatial-temporal Attention Mechanism", "venue": "arXiv 2025", "year": 2025, "topic": "Occupancy", "topics": ["3D Detection", "AD Perception", "Occupancy"], "abstract": "Compared with voxel-based grid prediction, in the field of 3D semantic occupation prediction for autonomous driving, GaussianFormer proposed using 3D Gaussian to describe scenes with sparse 3D semantic Gaussian based on objects is another scheme with lower memory requirements. Each 3D Gaussian function represents a flexible region of interest and its semantic features, which are iteratively refined by the attention mechanism. In the experiment, it is found that the Gaussian function required by this method is larger than the query resolution of the original dense grid network, resulting in impaired performance. Therefore, we consider optimizing GaussianFormer by using unused temporal information. We learn the Spatial-Temporal Self-attention Mechanism from the previous grid-given occupation network and improve it to GaussianFormer. The experiment was conducted with the NuScenes dataset, and the experiment is currently underway.", "summary_ja": "3D semantic occupancy predictionにおいて、スパースな3D Gaussianでシーンを表現するGaussianFormerは省メモリだが、必要なGaussian数が密なgridベース手法のクエリ解像度より多くなり性能が劣化する問題がある。本研究は、従来のgridベースoccupancyネットワークで使われていた時間情報を活用していなかった点に着目し、Spatial-Temporal Self-attention機構を導入してGaussianFormerを拡張する。NuScenesデータセットで実験を実施中(進行中の研究)。", "novelty_ja": "GaussianFormerに未活用だった時間軸の情報を、grid-based手法で使われるSpatial-Temporal Self-attentionとして組み込み、Gaussian表現の効率と性能のトレードオフを改善しようとする点が新しい。", "why_read_ja": "Gaussian SplattingベースのoccupancyネットワークとBEV/gridベース手法の時系列処理を融合する試みであり、メモリ効率と時間的一貫性を両立するoccupancy予測の設計動向を把握するうえで参考になる。", "paper_url": "https://arxiv.org/abs/2503.04863", "code_url": "", "published": "2025-03-06T09:40:46Z", "relevance": 9.5}, {"key": "arxiv:2503.00862", "title": "RAVE: End-to-end Hierarchical Visual Localization with Rasterized and Vectorized HD map", "venue": "arXiv 2025", "year": 2025, "topic": "HD Map", "topics": ["HD Map", "AD Perception"], "abstract": "Accurate localization serves as an important component in autonomous driving systems. Traditional rule-based localization involves many standalone modules, which is theoretically fragile and requires costly hyperparameter tuning, therefore sacrificing the accuracy and generalization. In this paper, we propose an end-to-end visual localization system, RAVE, in which the surrounding images are associated with the HD map data to estimate pose. To ensure high-quality observations for localization, a low-rank flow-based prior fusion module (FLORA) is developed to incorporate misaligned map prior into the perceived BEV features. Pursuing a balance among efficiency, interpretability, and accuracy, a hierarchical localization module is proposed, which efficiently estimates poses through a decoupled BEV neural matching-based pose solver (DEMA) using rasterized HD map, and then refines the estimation through a Transformer-based pose regressor (POET) using vectorized HD map. The experimental results demonstrate that our method can perform robust and accurate localization under varying environmental conditions while running efficiently.", "summary_ja": "自動運転の自己位置推定を、従来のルールベースな多段パイプラインではなくEnd-to-Endで解く手法RAVEを提案。周囲画像とHD mapデータを対応付けてポーズを推定する枠組みで、地図と知覚特徴のずれを補正するFLORAモジュールにより、ズレのある地図priorをBEV特徴に統合する。さらにラスタ化HD mapを用いたBEVマッチングによる粗いポーズ推定(DEMA)と、ベクトル化HD mapを用いたTransformerベースの回帰(POET)による精緻化という階層構造で、効率・解釈性・精度のバランスを取っている。", "novelty_ja": "ラスタ化と ベクトル化という異なる表現のHD mapを、粗い推定と精緻化という役割分担で階層的に組み合わせ、地図priorのミスアラインメントを吸収する専用融合モジュール(FLORA)を導入した点が従来のルールベース・単一表現手法と異なる。", "why_read_ja": "HD mapを単なる地図生成対象ではなく知覚・自己位置推定の入力として活用する設計は、マップ生成と自動運転知覚の接点を考える上で参考になる。", "paper_url": "https://arxiv.org/abs/2503.00862", "code_url": "", "published": "2025-03-02T11:45:01Z", "relevance": 11.0}, {"key": "arxiv:2512.23180", "title": "GaussianDWM: 3D Gaussian Driving World Model for Unified Scene Understanding and Multi-Modal Generation", "venue": "CVPR 2026", "year": 2026, "topic": "World Model", "topics": ["World Model", "Scene Understanding", "Gaussian Splatting", "3D Detection", "HD Map", "Open-world", "AD Perception"], "abstract": "Driving World Models (DWMs) have been developing rapidly with the advances of generative models. However, existing DWMs lack 3D scene understanding capabilities and can only generate content conditioned on input data, without the ability to interpret or reason about the driving environment. Moreover, current approaches represent 3D spatial information with point cloud or BEV features do not accurately align textual information with the underlying 3D scene. To address these limitations, we propose a novel unified DWM framework based on 3D Gaussian scene representation, which enables both 3D scene understanding and multi-modal scene generation, while also enabling contextual enrichment for understanding and generation tasks. Our approach directly aligns textual information with the 3D scene by embedding rich linguistic features into each Gaussian primitive, thereby achieving early modality alignment. In addition, we design a novel task-aware language-guided sampling strategy that removes redundant 3D Gaussians and injects accurate and compact 3D tokens into LLM. Furthermore, we design a dual-condition multi-modal generation model, where the information captured by our vision-language model is leveraged as a high-level language condition in combination with a low-level image condition, jointly guiding the multi-modal generation process. We conduct comprehensive studies on the nuScenes, and NuInteract datasets to validate the effectiveness of our framework. Our method achieves state-of-the-art performance. We will release the code publicly on GitHub.", "summary_ja": "既存の driving world model は入力条件付きの生成に特化していて、走行環境そのものを3Dで理解・推論する能力を欠いているという課題に取り組んだ論文。point cloud や BEV 特徴では言語情報と3D空間の対応付けが不正確になる点を問題視し、3D Gaussian をシーン表現の基盤に据えた統一フレームワークを提案している。各 Gaussian primitive に言語特徴を埋め込むことで、3Dシーン理解とマルチモーダル生成の両方を1つの枠組みで扱う。nuScenes と NuInteract で評価し、state-of-the-art を達成したと報告している。", "novelty_ja": "言語特徴を Gaussian primitive の段階で埋め込む early modality alignment と、タスクに応じて冗長な Gaussian を削って LLM へコンパクトな3Dトークンを渡す language-guided sampling を導入した点が従来と異なる。さらに vision-language model が捉えた高レベルの言語条件と低レベルの画像条件を組み合わせる dual-condition 生成モデルを設計している。", "why_read_ja": "world model を単なる生成器ではなく3Dシーン理解の器として再定義する流れを示しており、Gaussian Splatting 表現が認識と生成を橋渡しする基盤になりうることを具体的に示している。地図生成・環境認識側でも、3D表現と言語・LLM の結合をどう設計するかの参考になる。", "paper_url": "https://arxiv.org/abs/2512.23180", "code_url": "", "published": "", "relevance": 24.5}, {"key": "arxiv:2512.12751", "title": "GenieDrive: Towards Physics-Aware Driving World Model with 4D Occupancy Guided Video Generation", "venue": "CVPR 2026", "year": 2026, "topic": "World Model", "topics": ["World Model", "Occupancy Forecasting", "Open-world", "Occupancy", "AD Perception"], "abstract": "Physics-aware driving world model is essential for drive planning, out-of-distribution data synthesis, and closed-loop evaluation. However, existing methods often rely on a single diffusion model to directly map driving actions to videos, which makes learning difficult and leads to physically inconsistent outputs. To overcome these challenges, we propose GenieDrive, a novel framework designed for physics-aware driving video generation. Our approach starts by generating 4D occupancy, which serves as a physics-informed foundation for subsequent video generation. 4D occupancy contains rich physical information, including high-resolution 3D structures and dynamics. To facilitate effective compression of such high-resolution occupancy, we propose a VAE that encodes occupancy into a latent tri-plane representation, reducing the latent size to only 58% of that used in previous methods. We further introduce Mutual Control Attention (MCA) to accurately model the influence of control on occupancy evolution, and we jointly train the VAE and the subsequent prediction module in an end-to-end manner to maximize forecasting accuracy. Together, these designs yield a 7.2% improvement in forecasting mIoU at an inference speed of 41 FPS, while using only 3.47 M parameters. Additionally, a Normalized Multi-View Attention is introduced in the video generation model to generate multi-view driving videos with guidance from our 4D occupancy, significantly improving video quality with a 20.7% reduction in FVD. Experiments demonstrate that GenieDrive enables highly controllable, multi-view consistent, and physics-aware driving video generation.", "summary_ja": "自動運転向けの物理整合的なdriving world modelを提案。行動から直接動画を生成する従来手法は学習が難しく物理的に不整合な出力になりやすいため、まず4D occupancyを生成し、それを物理情報の基盤として動画生成に利用する2段階構成をとる。occupancyをtri-plane潜在表現に圧縮するVAEと、制御信号のoccupancy遷移への影響を捉えるMutual Control Attention (MCA)を導入し、VAEと予測モジュールをend-to-endで共同学習する。", "novelty_ja": "単一の拡散モデルで行動から映像を直接生成する従来手法と異なり、4D occupancyを中間の物理表現として明示的に生成・活用する点、および高圧縮なtri-plane VAEとMCAによる制御信号のモデリング、Normalized Multi-View Attentionによるマルチビュー一貫性の確保が特徴。", "why_read_ja": "occupancy予測とマルチビュー動画生成を統合したworld model設計であり、closed-loop評価やOOD合成データ生成のための自動運転world model研究の最新動向を把握する上で参考になる。", "paper_url": "https://arxiv.org/abs/2512.12751", "code_url": "", "published": "", "relevance": 23.5}, {"key": "arxiv:2511.17221", "title": "QueryOcc: Query-based Self-Supervision for 3D Semantic Occupancy", "venue": "CVPR 2026", "year": 2026, "topic": "Occupancy", "topics": ["Occupancy", "Scene Understanding", "3D Detection", "AD Perception"], "abstract": "Learning 3D scene geometry and semantics from images is a core challenge in computer vision and a key capability for autonomous driving. Since large-scale 3D annotation is prohibitively expensive, recent work explores self-supervised learning directly from sensor data without manual labels. Existing approaches either rely on 2D rendering consistency, where 3D structure emerges only implicitly, or on discretized voxel grids from accumulated lidar point clouds, limiting spatial precision and scalability. We introduce QueryOcc, a query-based self-supervised framework that learns continuous 3D semantic occupancy directly through independent 4D spatio-temporal queries sampled across adjacent frames. The framework supports supervision from either pseudo-point clouds derived from vision foundation models or raw lidar data. To enable long-range supervision and reasoning under constant memory, we introduce a contractive scene representation that preserves near-field detail while smoothly compressing distant regions.QueryOcc surpasses previous camera-based methods by 26% in semantic RayIoU on the self-supervised Occ3D-nuScenes benchmark while running at 11.6 FPS, demonstrating that direct 4D query supervision enables strong self-supervised occupancy learning.", "summary_ja": "3Dアノテーションが高コストな中、画像やLiDARから3Dセマンティックoccupancyを自己教師ありで学習する手法QueryOccを提案。隣接フレームにまたがる4D時空間クエリを独立にサンプリングし、視覚基盤モデル由来の疑似点群または生LiDARデータから直接教師信号を得る。遠方領域を滑らかに圧縮しつつ近傍の詳細を保つ収縮型シーン表現により、一定メモリでの長距離supervisionと推論を可能にした。", "novelty_ja": "2Dレンダリング一貫性による暗黙的な3D構造獲得や、蓄積LiDAR点群を離散ボクセル化する従来手法と異なり、連続的な3D occupancyを4Dクエリで直接学習する点が新しい。", "why_read_ja": "自己教師あり設定でのoccupancy予測において、カメラベース手法に対し大幅な性能向上とリアルタイム動作を両立しており、ラベルコストを抑えた環境認識手法の動向として重要。", "paper_url": "https://arxiv.org/abs/2511.17221", "code_url": "", "published": "", "relevance": 22.5}, {"key": "arxiv:2605.14110", "title": "SToRe3D: Sparse Token Relevance in ViTs for Efficient Multi-View 3D Object Detection", "venue": "CVPR 2026", "year": 2026, "topic": "3D Detection", "topics": ["3D Detection", "AD Perception"], "abstract": "Vision Transformers (ViTs) enable strong multi-view 3D detection but are limited by high inference latency from dense token and query processing across multiple views and large 3D regions. Existing sparsity methods, designed mainly for 2D vision, prune or merge image tokens but do not extend to full-model sparsity or address 3D object queries. We introduce SToRe3D, a relevance-aligned sparsity framework that jointly selects 2D image tokens and 3D object queries while storing filtered features for reactivation. Mutual 2D-3D relevance heads allocate compute to driving-critical content and preserve other embeddings. Evaluated on nuScenes and our new nuScenes-Relevance benchmark, SToRe3D achieves up to 3x faster inference with marginal accuracy loss, establishing real-time large-scale ViT-based 3D
